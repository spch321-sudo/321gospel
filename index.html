<script type="application/json" id="d-enp">[["天父上帝，我奉主耶穌的名求你攻破{}心中堅固的營壘，攻破仇敵各樣的計謀，各樣攔阻他認識上帝的那些自高之事，將他所有的心意奪回，使他都順服基督。阿們！","Father God, in the name of the Lord Jesus I ask You to break down the strongholds in {}'s heart, to overthrow every scheme of the enemy and every high thing that keeps him from knowing God, and to take every thought of his captive to the obedience of Christ. Amen!"],["天父上帝，我奉主耶穌的名求你差遣人向{}傳悔改赦罪的道，並將悔改的心和赦罪的恩賜給他，使他真心的認罪悔改。阿們！","Father God, in the name of the Lord Jesus I ask You to send someone to bring {} the word of repentance and forgiveness, to give him a repentant heart and the grace of pardon, and to bring him to sincere confession and repentance. Amen!"],["{}，今天怎麼樣？我一早就想到你。你做的那個決定，是你一生最重要的一件事，我為你高興。這禮拜找一天吃飯好嗎？","{}, how are you today? You were on my mind first thing. The decision you made is the most important thing in your life, and I am glad for you. Shall we find a day this week to eat together?"],["天父上帝，我奉主耶穌的名懇求主耶穌用聖靈為{}施洗，使他被聖靈澆灌及充滿，得到從上頭來的能力。阿們！","Father God, in the name of the Lord Jesus I ask the Lord Jesus to baptise {} in the Holy Spirit, that he may be poured out upon and filled, and receive power from on high. Amen!"],["{}，不論你信或不信，我們都是朋友，這一點不會變。但我想誠實地問你一次：你願意讓耶穌作你生命的主嗎？","{}, whether you believe or not, we are friends, and that will not change. But let me ask you honestly, once: would you be willing to let Jesus be the Lord of your life?"],["天父上帝，我奉主耶穌的名求你引導{}相信主耶穌受洗歸入主名，使他有得救的確據和重生的經歷。阿們！","Father God, in the name of the Lord Jesus I ask You to lead {} to believe in the Lord Jesus and be baptised into His name, with the assurance of salvation and the experience of new birth. Amen!"],["{}，跟你說一件事。我最近遇到一個難關，本來很慌，後來心裡竟然安穩下來了。改天見面再跟你細講。","{}, let me tell you something. I hit a hard patch recently and was quite panicked at first, and then somehow my heart settled. I'll tell you properly next time we meet."],["【我的見證】 信主前的我： {} 遇見主的關鍵： {} 現在的改變： {} （願一切榮耀歸給主耶穌）","[My testimony] Before Christ: {} How I met the Lord: {} What has changed now: {} (May all the glory go to the Lord Jesus)"],["天父上帝，我奉主耶穌的名求你進入{}的心中，捆綁所有在他心中運行的邪靈，搶回他的靈魂。阿們！","Father God, in the name of the Lord Jesus I ask You to enter {}'s heart, bind every evil spirit at work there, and take back his soul. Amen!"],["天父上帝，我奉主耶穌的名求你的聖靈光照{}，叫他為罪、為義、為審判，自己責備自己。阿們！","Father God, in the name of the Lord Jesus I ask Your Holy Spirit to shine on {} and convict him concerning sin, righteousness and judgement. Amen!"],["天父上帝，我奉主耶穌的名求你祝福{}的人際關係，能與人和睦溝通良好彼此建立品德。阿們！","Father God, in the name of the Lord Jesus I ask You to bless {}'s relationships, that he may live at peace with others, understand and be understood, and build others up. Amen!"],["天父上帝，我奉主耶穌的名求你祝福{}的屬靈生命，能相信耶穌重生得救不斷更新成長。阿們！","Father God, in the name of the Lord Jesus I ask You to bless {}'s spiritual life, that he may believe in Jesus, be born again and saved, and go on being renewed and growing. Amen!"],["天父上帝，我奉主耶穌的名求你使{}遵守主的吩咐成為主的門徒，能夠帶領人信耶穌。阿們！","Father God, in the name of the Lord Jesus I ask You to make {} a disciple who keeps the Lord's commands and is able to lead others to believe in Jesus. Amen!"],["{}，你上次問我的那個問題，我認真想過，也去查了一些資料。找個時間我們好好聊，好嗎？","{}, that question you asked me — I have thought it over seriously and looked a few things up. Shall we find a time to talk it through?"],["{}，我一直在為你禱告。如果哪一天你願意，我想帶你做一個很簡單的禱告，把心門打開。","{}, I have been praying for you all along. If one day you are willing, I would like to lead you in a very simple prayer, to open the door of your heart."],["{}，我想邀你陪我做一件事——一起讀約翰福音，一天五分鐘就好。你陪我，我也陪你。","{}, I would like to ask you to do something with me — read John together, five minutes a day. You keep me company and I'll keep you company."],["現在的里程：{} {}。 這些都只是草稿，請改成你自己的話——你的語氣比句子重要。","Current milestone: {} · {}. These are only drafts. Put them in your own words — your tone matters more than the wording."],["這支手機的資料庫是空的，但我們留有一份 {} 的快照， 裡面有 {} 位同行對象。","This phone's database is empty, but we kept a snapshot from {}, holding {} people you were walking with."],["天父上帝，我奉主耶穌的名求你差遣你的聖靈來引導{}，明白一切的福音真理。阿們！","Father God, in the name of the Lord Jesus I ask You to send Your Holy Spirit to lead {} into all the truth of the gospel. Amen!"],["我奉主耶穌的名捆綁{}身上陰間的權勢，脫離一切的死亡黑暗和祖先的咒詛。阿們！","In the name of the Lord Jesus I bind the power of Hades over {}, and free him from every curse of death, darkness and ancestry. Amen!"],["我奉主耶穌的名捆綁{}身上仇敵的權勢，脫離一切的邪靈污鬼和偶像的咒詛。阿們！","In the name of the Lord Jesus I bind the power of the enemy over {}, and free him from every curse of evil spirits, unclean spirits and idols. Amen!"],["我奉主耶穌的名捆綁{}身上情慾的權勢，脫離一切的自私貪心和驕傲的咒詛。阿們！","In the name of the Lord Jesus I bind the power of lust over {}, and free him from every curse of selfishness, greed and pride. Amen!"],["我奉主耶穌的名捆綁{}身上虛謊的權勢，脫離一切的虛假謊言和邪術的咒詛。阿們！","In the name of the Lord Jesus I bind the power of lying over {}, and free him from every curse of falsehood, deceit and sorcery. Amen!"],["我奉主耶穌的名捆綁{}身上疾病的權勢，脫離一切的病痛遺傳和災害的咒詛。阿們！","In the name of the Lord Jesus I bind the power of sickness over {}, and free him from every curse of illness, inheritance and disaster. Amen!"],["天父上帝，我奉主耶穌的名求你打開{}的心眼，叫基督榮耀福音的光照著他。阿們！","Father God, in the name of the Lord Jesus I ask You to open {}'s inner eyes, that the light of the glorious gospel of Christ may shine on him. Amen!"],["求您把在基督裡的平安、在聖靈裡的喜樂，充滿{}的心，除去他一切的憂慮和恐懼。","Fill {}'s heart with the peace that is in Christ and the joy that is in the Holy Spirit, and take away all his worry and fear."],["求您賜福{}的人際關係，使他能與眾人和睦，得眾人的喜愛，也成為別人的祝福。","Bless {}'s relationships, that he may live at peace with all, be well loved, and become a blessing to others."],["{}，這禮拜聚會我想介紹幾位朋友給你認識，都是很好相處的人，不會給你壓力。","{}, at the gathering this week I would like to introduce you to a few friends. They are easy company and will not put any pressure on you."],["{}，關於受洗，你心裡有什麼想法嗎？不用急著決定，我只是想先聽聽你怎麼想。","{}, what are your thoughts about baptism? No need to decide anything — I would just like to hear how you see it."],["{}，你會這樣想，是不是曾經遇過什麼事？我很想聽你說，不會急著給你答案。","{}, did something happen that made you think this way? I would like to hear it, and I won't rush to give you an answer."],["{}，有一件我心裡覺得很重要的事想跟你講，大概二十分鐘。這禮拜哪天方便？","{}, there is something I feel is important that I would like to tell you — about twenty minutes. Which day this week suits you?"],["天父上帝，我奉主耶穌的名求你開啟{}的心竅，使他能明白福音真理。阿們！","Father God, in the name of the Lord Jesus I ask You to open {}'s understanding, that he may grasp the truth of the gospel. Amen!"],["求您讓{}經歷您奇妙的大能，在苦難中看見您把壞事變好事，生命重生剛強。","Let {} know Your wonderful power, and see You turn hardship to good in his suffering, so that his life is reborn and strong."],["天父上帝，我奉主耶穌的名求你祝福{}的身體，健康強壯充滿活力。阿們！","Father God, in the name of the Lord Jesus I ask You to bless {}'s body with health, strength and vitality. Amen!"],["天父上帝，我奉主耶穌的名求你祝福{}的工作，亨通順利興盛成功。阿們！","Father God, in the name of the Lord Jesus I ask You to bless {}'s work, that his way may prosper and succeed. Amen!"],["天父上帝，我奉主耶穌的名求你祝福{}的情緒，平安喜樂積極樂觀。阿們！","Father God, in the name of the Lord Jesus I ask You to bless {}'s heart with peace, joy and a hopeful spirit. Amen!"],["求您帶領{}的感情，賜他無私捨己的愛，也為他預備一生真心相愛的伴侶。","Guide {} in love, give him a selfless and self-giving love, and prepare for him a partner to love truly for life."],["求您賜福{}的工作事業，道路亨通、凡事順利、居上不居下、作首不作尾。","Bless {}'s work, that his way may prosper and go well, that he may be above and not beneath, the head and not the tail."],["求您開啟{}的心，使他認識耶穌、接受耶穌、相信耶穌，得著永遠的生命。","Open {}'s heart, that he may know Jesus, receive Jesus, believe in Jesus, and have life everlasting."],["{}，這幾天我剛好有空，如果有什麼我幫得上忙的，儘管跟我說，別客氣。","{}, I happen to have some free time these few days. If there is anything I can help with, just say — please don't stand on ceremony."],["{}，最近哪一件事最卡住你？我們一起把它帶到主面前，不用你一個人扛。","{}, what has you most stuck at the moment? Let us bring it to the Lord together — you do not have to carry it alone."],["{}，這禮拜我要去關心一位朋友，你要不要跟我一起去？你在旁邊聽就好。","{}, I am going to see a friend this week — would you like to come with me? You need only listen."],["{}，這句話是我信仰裡最重要的一句。送給你，你當作一份心意收下就好。","{}, this is the most important line in my faith. It is yours — take it simply as something meant kindly."],["求您赦免{}一切的過犯，洗淨他一切的不義，釋放他的心靈得著真自由。","Forgive {} every offence, cleanse him from all unrighteousness, and set his soul free indeed."],["求您藉著主耶穌所受的鞭傷，醫治{}的疾病，賜他身體康健、心靈剛強。","By the wounds the Lord Jesus bore, heal {}'s illness, and give him health of body and strength of soul."],["求您賜福{}的家庭，使他們夫妻恩愛、兒女孝順、彼此饒恕、和睦相愛。","Bless {}'s household — husband and wife in love, children who honour them, forgiveness between them, and peace in their love."],["求您賜福{}凡事富足、一無所缺，不背負債務，也能多多施捨幫助別人。","Bless {} with enough in all things and lacking nothing, free of debt, and able to give generously to help others."],["{}，今天忽然想起你，就停下來為你禱告了一分鐘。願你今天平平安安。","{}, you came to mind today, so I stopped and prayed for you for a minute. May your day be a peaceful one."],["目前：{} 位同行對象、{} 筆關心紀錄、 {} 項代禱、{} 次里程推進。","At present: {} people walked with, {} contact records, {} prayer items, {} milestones advanced."],["{}，下次換你講，我在旁邊聽就好。講得怎麼樣都沒關係，我會陪你。","{}, next time it is your turn to speak and I will just listen. However it goes does not matter — I will be right there."],["{}，你為這個家付出了很多。願有一位比你更大的，親自看顧這個家。","{}, you have given so much to this home. May One greater than you watch over it Himself."],["{}，心裡那個「總覺得少了什麼」的空，不是你有毛病，是有來歷的。","{}, that emptiness that keeps saying something is missing — it is not a fault in you. It has a history."],["{}，有些事我們自己扛太久了。有一位願意替我們扛，而且不再提起。","{}, some things we have carried far too long on our own. There is One willing to carry them for us — and He never brings them up again."],["{}，最近好嗎？沒什麼事，就是想到你，問候一聲。不用急著回我。","{}, how have you been? Nothing in particular — you came to mind and I wanted to say hello. No need to reply quickly."],["{}，看你最近很累。這句話我自己撐不住的時候常常想起，送給你。","{}, you have looked worn out lately. This is the line I turn to when I cannot hold up. It is yours."],["{}，昨天再難，今天早晨仍是新的。願你今天有一件小小的好事。","{}, however hard yesterday was, this morning is still new. May one small good thing come your way today."],["{}，現在的痛不是結局。有一天，會有一雙手親自擦去你的眼淚。","{}, this pain is not the ending. One day a hand will wipe away your tears Himself."],["{}，聽說你身體不舒服，我今天特別為你禱告了。願你早日康復。","{}, I heard you have not been well, and I prayed for you especially today. May you soon be better."],["{}，生日快樂！你被造得奇妙可畏，你的存在本身就是一份禮物。","{}, happy birthday! You were fearfully and wonderfully made, and your being here is itself a gift."],["{}，祂不會硬闖，門把在你這一邊。你什麼時候願意，都不算晚。","{}, He will not force His way in; the handle is on your side. Whenever you are willing, it is not too late."],["{}，日子忙，別忘了給自己留一點喘氣的空間。我常常記念你。","{}, life is busy — do leave yourself a little room to breathe. You are often on my heart."],["{}，難過的時候不用勉強自己堅強。眼淚在神面前是可以流的。","{}, when it hurts you need not force yourself to be strong. Tears are allowed in God's presence."],["{}，生日快樂！你心裡那個沒說出口的願望，我也一起為你求。","{}, happy birthday! That wish you have not said out loud — I am asking for it with you."],["{}，不是靠自己咬牙，是有一位加力量給你。願你今天有力氣。","{}, it is not about gritting your teeth alone — there is One who gives strength. May you have strength today."],["{}，不是你要更努力，是你有了一顆新的心。慢慢走，我陪你。","{}, it is not that you must try harder — you have been given a new heart. Take it slowly; I am with you."],["{} 資料只存在這支手機裡，換手機或系統清理都可能遺失。","{} The data lives only on this phone. Changing phones, or the system clearing space, could lose it."],["{}，這禮拜我們的時間照舊嗎？想聽你說說這幾天讀到什麼。","{}, are we keeping our usual time this week? I would like to hear what you have been reading."],["{}，這段日子辛苦你了。我不知道能說什麼，但我會一直在。","{}, this stretch has been hard on you. I do not know what to say, but I will be here."],["{}，軟弱的時候不必逞強。恩典會夠用的，一天一天地夠用。","{}, when you are weak there is no need to put on a brave face. Grace will be enough — enough for one day at a time."],["{}，這幾天我都會為你禱告。有什麼需要，隨時跟我說一聲。","{}, I will be praying for you these next few days. Whatever you need, just say the word."],["{}，帶孩子真的不容易。你已經做得很好了，別太苛責自己。","{}, raising children is genuinely hard. You are doing well — do not be so hard on yourself."],["{}，生日快樂！願你這一年的每一天，都活得踏實而有意義。","{}, happy birthday! May every day of this year be lived solidly and with meaning."],["{}，有一位一直在找你。不是要追究什麼，是想把你帶回家。","{}, Someone has been looking for you — not to call you to account, but to bring you home."],["{}，恭喜你！你昨天做的那個決定，是一生最重要的一件事。","{}, congratulations! The decision you made yesterday is the most important of your life."],["{}，恭喜你受洗！今天是你公開歸屬主的日子，我為你高興。","{}, congratulations on your baptism! Today you belong to the Lord in the open, and I am glad for you."],["{}，有一天所有的眼淚都會被擦乾。這是我為你抓住的盼望。","{}, one day every tear will be wiped away. That is the hope I am holding on to for you."],["{}，我今天為你正在陪伴的那位禱告了。有需要我隨時在。","{}, I prayed today for the person you are walking with. I am here whenever you need me."],["{}，我們一起把這件事交給主。我為你守望，你安心養病。","{}, let us hand this to the Lord together. I will keep watch in prayer; you rest and get well."],["{}，力氣用完了不是失敗，是該歇一歇了。願你重新得力。","{}, running out of strength is not failure — it is time to rest. May your strength be renewed."],["{}，煩到睡不著的時候，可以試著把它一句一句說給神聽。","{}, when worry keeps you awake, try telling it to God one sentence at a time."],["{}，日子過得快，但有些情誼不會被沖淡。謝謝你這些年。","{}, the years go quickly, but some friendships do not thin out. Thank you for these years."],["{}，厚雲看起來很沉，風一吹就散了。願你今天抬起頭來。","{}, a thick cloud looks heavy, and one gust of wind clears it. May you lift your head today."],["{}，今天想到你，就替你禱告了一分鐘。願你肩膀鬆一點。","{}, you came to mind today, so I prayed for you for a minute. May your shoulders ease a little."],["「{}」的所有紀錄、代禱與歷程都會被清除，無法復原。","Every record, prayer item and milestone for {} will be erased, and it cannot be undone."],["{}，我最近有為你禱告。不用你信什麼，就當我掛念你。","{}, I have been praying for you lately. You need not believe anything — take it as my keeping you in mind."],["{}，神不是站在遠處看你痛，祂是陪你一起痛的那一位。","{}, God does not stand at a distance watching you hurt. He is the One who hurts alongside you."],["{}，生日快樂！願你新的一歲，走在一條有指 再相見的盼望。","{}, in these days of missing someone, may you have comfort, and the hope of meeting again."],["{}，一個人先站住，全家就有指望。我陪你一起守望。","{}, when one person stands firm, the whole household has hope. I will keep watch with you."],["{}，你已經很努力了。剩下的，交給那位會建造的主。","{}, you have tried so hard. Leave the rest to the Lord who knows how to build."],["{}，你這樣照顧家人，神都看見了，一次也沒有漏掉。","{}, God has seen how you care for your family — not one instance missed."],["{}，家裡的結不會一天解開，但可以從一句軟話開始。","{}, the knots at home will not come undone in a day, but one gentle word can begin it."],["{}，錢的事我幫不上太多，但我天天為你的需要祈求。","{}, there is little I can do about money, but I ask for your needs every day."],["這七天，你主動接觸了 {} 次，名單上有 {} 位。","Over these seven days you made contact {} times. There are {} people on your list."],["第 {} 幕／共 5 幕．把螢幕轉向他，一起看。","Act {} of 5 · Turn the screen towards him and look at it together."],["{}，最近好嗎？出入平安，是我對你最實在的祝福。","{}, how have you been? Safe coming and going — that is the most solid blessing I know to wish you."],["{}，照顧長輩的日子很磨人。願你在其中也被照顧。","{}, caring for an elderly parent wears a person down. May you be cared for in the midst of it too."],["{}，路不清楚的時候，不必急著走。願你有人指路。","{}, when the road is unclear there is no need to hurry along it. May someone show you the way."],["{}，看起來走不通的地方，仍然可以開出一條路來。","{}, where there seems to be no way through, a way can still be opened."],["{}，聖誕快樂！這一天的意義，是有一位為你而來。","{}, happy Christmas! What this day means is that Someone came for you."],["{}，不必先變好才能來。願意誠實說出口，就夠了。","{}, you do not have to improve before you come. Being willing to say it honestly is enough."],["{}，你不必再替自己判刑了，有一位已經替你受了。","{}, you need not go on sentencing yourself. Someone has already served it for you."],["{}，你不是一個人在對抗這場病。我天天為你祈求。","{}, you are not fighting this illness alone. I am asking for you every day."],["{}，人是可以真的不一樣的，這件事我自己經歷過。","{}, a person really can become different. I have known it myself."],["{}，力氣用完了不是失敗，是可以重新得力的時候。","{}, running out of strength is not failure. It is the moment strength can be renewed."],["{}，這句話我放在心裡很多年了，今天想分享給你。","{}, I have kept this line in my heart for many years, and today I would like to share it with you."],["{}，有一個地方是被預備好的，那裡也有你的名字。","{}, a place has been prepared, and your name is on it too."],["目前設定：早晨 {}、睡前 {}（可在設定裡改）。","Currently set to {} in the morning and {} before sleep (changeable in Settings)."],["{}，今天這一天是被賜下的，願你在其中有喜樂。","{}, this day has been given to you. May there be gladness in it."],["{}，幽谷會走完的。願你走的時候，知道有人陪。","{}, the valley does come to an end. May you know, while you walk it, that someone is with you."],["{}，現在看不出來的，將來會看得懂。願你撐住。","{}, what makes no sense now will make sense later. May you hold on."],["{}，只要願意，就可以。這一步比你想像的簡單。","{}, willing is all it takes. This step is simpler than you think."],["{}，歡迎你回家。這個家會一直為你留一個位子。","{}, welcome home. This family will always keep a seat for you."],["{}，神赦免的時候是真的放下，不是先記著再說。","{}, when God forgives He really does let it go. He does not file it away for later."],["{}，願你今晚睡得著，明天醒來有一口氣可以喘。","{}, may you sleep tonight, and wake tomorrow with room to breathe."],["{}，緊的日子會過去的。願你今天有夠用的平安。","{}, the tight days will pass. May you have peace enough for today."],["{}，你幫過的那些人，神都記著。願你也被人幫。","{}, God remembers everyone you have helped. May you be helped in turn."],["{}，願你今晚睡得安穩，明天起來有力氣一點。","{}, may you sleep soundly tonight and wake with a little more strength tomorrow."],["{}，今天不用做到滿分。慢一點，也是可以的。","{}, today does not have to be perfect. Slower is all right too."],["{}，願你的家成為一個有平安、有笑聲的地方。","{}, may your home be a place of peace and of laughter."],["{}，生日快樂！願你今年身體健壯、心裡年輕。","{}, happy birthday! May you be strong in body and young at heart this year."],["{}，我把你算在我這一年的恩典裡面。謝謝你。","{}, I count you among this year's graces. Thank you."],["{}，這一路上有你同行，是值得感謝的一件事。","{}, having you walk this road with me is something worth giving thanks for."],["{}，夜再長，也會有早晨。願你的早晨快點來。","{}, however long the night, morning still comes. May yours come soon."],["{}，過去不能決定你的將來。你可以重新開始。","{}, your past cipleship · 12 Lessons · Lesson 12","第十二課 成為屬靈父母":"Lesson 12 · Becoming a Spiritual Parent","屬靈父母裝備六課．第一課":"Spiritual Parenting · 6 Lessons · Lesson 1","第一課 如何陪伴":"Lesson 1 · How to Walk With Someone","屬靈父母裝備六課．第二課":"Spiritual Parenting · 6 Lessons · Lesson 2","第二課 如何講福音":"Lesson 2 · How to Share the Gospel","屬靈父母裝備六課．第三課":"Spiritual Parenting · 6 Lessons · Lesson 3","第三課 如何回答疑問":"Lesson 3 · How to Answer Questions","屬靈父母裝備六課．第四課":"Spiritual Parenting · 6 Lessons · Lesson 4","第四課 如何帶門訓":"Lesson 4 · How to Lead Discipleship","屬靈父母裝備六課．第五課":"Spiritual Parenting · 6 Lessons · Lesson 5","第五課 如何處理挫折":"Lesson 5 · How to Handle Discouragement","屬靈父母裝備六課．第六課":"Spiritual Parenting · 6 Lessons · Lesson 6","第六課 如何繁殖":"Lesson 6 · How to Reproduce","第一幕":"Act One","第二幕":"Act Two","第三幕":"Act Three","第四幕":"Act Four","第五幕":"Act Five","美好的起初":"A Good Beginning","有己的墮落":"The Fall Into Self","十架的救贖":"Redemption at the Cross","復活的新生命":"New Life Through Resurrection","讓耶穌作王":"Letting Jesus Reign","你不是意外，你是被想念著造出來的。":"You are not an accident. You were made by Someone who had you in mind.","罪的根不是你做了什麼壞事，是你想自己作主。":"The root of sin is not the wrong you have done; it is wanting to be your own master.","祂不是來給你一套規矩，是來替你死。":"He did not come to hand you a set of rules. He came to die in your place.","祂死了，解決舊的；祂活了，給你新的。":"His death dealt with the old; His resurrection gives you the new.","祂在門外敲門，門把在你這一邊。":"He is knocking at the door, and the handle is on your side.","決志禱告":"The Prayer of Commitment","仁愛":"Love","喜樂":"Joy","和平":"Peace","忍耐":"Patience","恩慈":"Kindness","良善":"Goodness","信實":"Faithfulness","溫柔":"Gentleness","節制":"Self-control","神的存在":"The Existence of God","苦難的問題":"The Problem of Suffering","聖經可信度":"Is the Bible Reliable","其他宗教":"Other Religions","教會的問題":"Questions About the Church","科學與信仰":"Science and Faith","華人處境":"The Chinese context","生活與道德":"Life and Morality","疑問解答庫":"Questions & Answers","禱告文範本":"Sample Prayers","福音腳本":"Gospel Scripts","初信三十天":"The First Thirty Days","屬靈家譜樹":"Spiritual Family Tree","五幕福音敘事．圖解模式":"The Gospel in Five Acts · illustrated","三分鐘電梯版福音":"The Three-Minute Gospel","決志禱告文":"Prayer of Commitment","破冰問題二十則":"Twenty Ice-breaker Questions","護教問答四十題":"Forty Apologetics Questions","華人處境專區":"The Chinese Context","初信三十天陪伴腳本":"Thirty-Day New Believer Scripts","禱告文範本二十篇":"Twenty Sample Prayers","為病痛中的人禱告":"Praying for the Sick","為喪親的人禱告":"Praying for the Bereaved","920 每日操練":"The Daily 920 Practice","陪伴者挫折十問":"Ten Questions on Discouragement","見證三段式引導":"The Three-Part Testimony","七里程陪伴檢核表":"The Seven-Milestone Checklist","七週初信造就．學生本＋老師本．大字版。":"Seven weeks of new-believer foundations · student book + teacher's guide · large print.","腳本":"Script","禱告":"Prayer","操練":"Practice","慕道友":"Seeker","初信者":"New believer","受苦的人":"The suffering","家庭":"Family","青年":"Youth","長輩":"Seniors","國度321空中團契":"Kingdom 321 Air Fellowship","每日靈修、321理念教學與線上團契":"Daily devotions, 321 teaching, and online fellowship","321得勝者":"321 Overcomer","從有己到無己，成為得勝者的操練":"From self to selflessness — the practice of becoming an overcomer","321婚姻得勝者":"321 Marriage Overcomer","夫妻關係的建造與修復":"Building and restoring the marriage relationship","321健康新生活":"321 NEWSTART Health","N.E.W.S.T.A.R.T. 八大健康支柱":"The eight N.E.W.S.T.A.R.T. pillars of health","晨讀321":"Morning Reading 321","每日晨間讀經與複習引擎":"Daily morning Bible reading with a review engine","每日得勝":"Daily Victory","321 每日計畫與生活管理":"321 daily planning and life management","已記下":"Saved","已取消標記":"Mark removed","已刪除":"Deleted","願主記念你的忠心":"May the Lord remember your faithfulness","這個資源即將開放":"This resource is coming soon","忠心指標．我們可以負責的":"Faithfulness · what we can actually answer for","連續代禱天數":"Days of unbroken prayer","羅馬書一章20節":"Romans 1:20","創世記三章5節":"Genesis 3:5","約翰福音一章14節":"John 1:14","以弗所書二章8至9節":"Ephesians 2:8-9","馬太福音六章6節":"Matthew 6:6","詩篇一百一十九篇105節":"Psalm 119:105","哥林多前書十二章27節":"1 Corinthians 12:27","羅馬書六章4節":"Romans 6:4","自從造天地以來，神的永能和神性是明明可知的，雖是眼不能見，但藉著所造之物就可以曉得，叫人無可推諉。":"For the invisible things of him since the creation of the world are clearly seen, being perceived through the things that are made, even his everlasting power and divinity, that they may be without excuse.","你們吃的日子眼睛就明亮了，你們便如神能知道善惡。":"In the day you eat it, your eyes will be opened, and you will be like God, knowing good and evil.","道成了肉身，住在我們中間，充充滿滿的有恩典有真理。":"The Word became flesh and lived among us, full of grace and truth.","你們得救是本乎恩，也因著信；這並不是出於自己，乃是神所賜的；也不是出於行為，免得有人自誇。":"For by grace you have been saved through faith, and that not of yourselves; it is the gift of God, not of works, that no one would boast.","你禱告的時候，要進你的內屋，關上門，禱告你在暗中的父；你父在暗中察看，必然報答你。":"But you, when you pray, enter into your inner room, and having shut your door, pray to your Father who is in secret; and your Father who sees in secret will reward you.","你的話是我腳前的燈，是我路上的光。":"Your word is a lamp to my feet, and a light for my path.","你們就是基督的身子，並且各自作肢體。":"Now you are the body of Christ, and members individually.","所以，我們藉著洗禮歸入死，和他一同埋葬，原是叫我們一舉一動有新生的樣式，像基督藉著父的榮耀從死裡復活一樣。":"We were buried therefore with him through baptism into death, that just as Christ was raised from the dead through the glory of the Father, so we also might walk in newness of life.","我們從三個地方認得出神：一是萬物的秩序——四季有時、細胞精密，這不像隨手打翻的顏料；二是人心裡那把尺——沒有人教你，你就知道背叛是不對的；三是心裡那個填不滿的空——你什麼都有了，還是覺得少一塊。 聖經沒有花力氣證明神存在，它第一句就說：「起初，神創造天地。」因為神不是一個等著被證明的假設，祂是一切的前提。而祂不只是有能力，祂還有性情：祂是有位格的，會說話、會心疼、會等候。":"There are three places where we can make God out. First, the order of things — the seasons keep their times, a single cell is built with fine precision. This does not look like paint spilled by accident. Second, the ruler inside the human heart — nobody had to teach you that betrayal is wrong. Third, the emptiness that will not fill — you have everything, and something is still missing.\nThe Bible spends no effort proving that God exists. Its very first line simply says, “In the beginning, God created the heavens and the earth.” God is not a hypothesis waiting to be proved; He is the premise of everything. And He is not only powerful, He has a character: He is personal — He speaks, He aches, He waits.","安靜三分鐘，回想你人生中有沒有哪一刻，你覺得「這件事好像不只是巧合」。求聖靈提醒你。":"Be still for three minutes and look back. Was there a moment in your life when you thought, “That was more than coincidence”? Ask the Holy Spirit to bring it to mind.","如果真的有一位神，而且祂認得我的名字，這對我今天的生活會有什麼不同？":"If there really is a God, and He knows my name, what difference would that make to my life today?","第一天：走到戶外，抬頭看天空三分鐘，說一句「如果祢在，請讓我認識祢」。":"Day 1: Step outside, look up at the sky for three minutes, and say, “If You are there, let me come to know You.”","第二天：寫下三件你覺得「不可能是偶然」的事。":"Day 2: Write down three things you feel could not possibly have been accidents.","第三天：讀創世記第一章。":"Day 3: Read Genesis chapter 1.","第四天：留意今天有沒有哪件小事讓你想到神。":"Day 4: Notice whether any small thing today makes you think of God.","第五天：問一位基督徒朋友：你是怎麼開始相信有神的？":"Day 5: Ask a Christian friend, “How did you first come to believe there is a God?”","第六天：試著用自己的話禱告一分鐘。":"Day 6: Try praying for one minute in your own words.","第七天：回顧這一週，寫下一句話。":"Day 7: Look back over the week and write down one sentence.","陪伴者提示：這一課不要急著辯論。你的任務是聽他說他心裡的疑問，然後告訴他「這個問題很好，我也問過」。人比道理重要。":"For companions: do not rush into debate in this lesson. Your task is to listen to his questions and then tell him, “That is a good question. I asked it too.” People matter more than arguments.","多數人以為信仰要處理的是「行為」——少說謊、多做好事。但聖經的診斷更深：問題出在根，不在果。 人的根本問題是「有己」——凡事以自己為中心，自己要作主作王，想要代替神。這就是驕傲：離開人的本位，抓住神的權力。亞當夏娃吃那果子不是為了吃飽，是為了「如神能知道善惡」。 有己一進來，四道裂縫立刻出現：人與神隔絕、人與自己不和、人與人互相傷害、人與環境失序。你我一生的煩惱，幾乎都能在這四道裂縫裡找到出處。 所以福音真正的問題不是「你做過什麼壞事」，而是「你這一生，究竟是誰在作王」。":"Most people assume faith is about behaviour — fewer lies, more good deeds. The Bible's diagnosis goes deeper: the trouble is in the root, not the fruit.\nOur fundamental problem is self — making myself the centre of everything, insisting on being my own master and king, wanting to take God's place. That is pride: leaving the position of a man and seizing the authority of God. Adam and Eve did not eat that fruit because they were hungry; they ate it to “be like God, knowing good and evil.”\nThe moment self comes in, four cracks open at once: man is cut off from God, man is at odds with himself, people wound one another, and man's world falls out of order. Nearly every trouble you and I carry can be traced to one of those four cracks.\nSo the gospel's real question is not “what wrong have you done?” but “who has been reigning over your life?”","求聖靈讓你看見一件具體的事——最近哪一次，你其實是在爭「我要作主」？":"Ask the Holy Spirit to show you one concrete instance — when, recently, were you really fighting to be the one in charge?","承認「我一直在自己作王」對我來說難不難？難在哪裡？":"Is it hard for me to admit that I have been reigning over my own life? Where exactly is the difficulty?","第一天：寫下最近一次你生氣的事，問自己：我當時想控制什麼？":"Day 1: Write down the last thing that made you angry, and ask: what was I trying to control?","第二天：讀創世記第三章。":"Day 2: Read Genesis chapter 3.","第三天：一整天觀察自己說「我覺得」「我認為」的次數。":"Day 3: For a whole day, count how often you say “I feel” and “I think.”","第四天：對一個人讓步一次，練習不爭。":"Day 4: Give way to someone once. Practise not contending.","第五天：跟神說：我承認我一直想自己作主。":"Day 5: Tell God: I admit I have wanted to be my own master.","第六天：讀羅馬書七章15至25節。":"Day 6: Read Romans 7:15-25.","第七天：寫下一句話：我最想交出來的是什麼。":"Day 7: Write one sentence: what I most want to hand over.","陪伴者提示：這一課是整套福音的關鍵。不要用「你有罪」開場，用「你是不是也常常想自己作主」開場。多數人會安靜下來，因為那正是他一生的寫照。":"For companions: this lesson is the hinge of the whole gospel. Do not open with “you are a sinner.” Open with “do you also often want to be your own master?” Most people go quiet, because that is the story of their life.","耶穌不是一個宗教創辦人。祂是一個歷史人物，有確切的年代、地點與見證人。祂做了三件沒有人敢做的事：祂赦免人的罪，祂接受人的敬拜，祂說「我就是道路、真理、生命」。 面對這樣的宣告，只有三種可能：祂是騙子，祂是瘋子，或者祂真的是主。祂的品格與生命讓前兩種說不通——一個騙子不會為謊言被釘死，一個瘋子不會講出登山寶訓。 而祂的死與復活有堅實的歷史支撐：空墳墓、五百多位見證人、門徒從逃跑變成殉道。沒有人會為自己知道是假的事去死。":"Jesus is not the founder of a religion. He is a figure of history, with a definite date, a definite place, and eyewitnesses. He did three things nobody else would dare: He forgave sins, He accepted worship, and He said, “I am the way, the truth, and the life.”\nFaced with a claim like that, there are only three possibilities: He was a liar, He was a madman, or He really is Lord. His character and His life rule out the first two — a liar does not get crucified for his lie, and a madman does not deliver the Sermon on the Mount.\nHis death and resurrection rest on solid historical ground: an empty tomb, more than five hundred witnesses, disciples who went from running away to dying as martyrs. No one dies for something he knows to be false.","求聖靈幫助你，把耶穌當成一個真實的人來認識，而不是一個名詞。":"Ask the Holy Spirit to help you meet Jesus as a real person, not as a term.","在騙子、瘋子、主這三個選項裡，我目前傾向哪一個？為什麼？":"Of the three — liar, madman, Lord — which do I lean towards at present, and why?","第一天：讀馬可福音第一章。":"Day 1: Read Mark chapter 1.","第二天：讀馬可福音第二章，注意祂怎麼對待被排擠的人。":"Day 2: Read Mark chapter 2, watching how He treats the people others push aside.","第三天：讀約翰福音第八章1至11節。":"Day 3: Read John 8:1-11.","第四天：寫下耶穌哪一點最吸引你。":"Day 4: Write down what draws you most about Jesus.","第五天：讀路加福音二十三章。":"Day 5: Read Luke chapter 23.","第六天：讀路加福音二十四章。":"Day 6: Read Luke chapter 24.","第七天：對祂說一句話，隨便什麼都好。":"Day 7: Say one sentence to Him — anything at all.","陪伴者提示：不要急著講教義，帶他讀福音書。讓他自己遇見耶穌，比你替耶穌介紹自己有力量得多。":"For companions: do not hurry into doctrine. Take him into the Gospels. Letting him meet Jesus himself is far stronger than you introducing Jesus on His behalf.","全世界的宗教都在教人怎麼爬上去見神，只有福音說：神自己走下來找人。 救恩有兩面：耶穌的死，解決我們的罪性和罪行；耶穌的復活，賜給我們新生命。前者是赦免，後者是重生。若只有赦免，你仍然帶著老我；有了新生命，才是真正的好消息。 這一切是白白的。不是你先變好祂才收你，是祂先收了你，你才變得好。你唯一要做的，是伸手接。 所以基督徒不是比較好的人，是知道自己得了恩典的人。":"Every religion in the world teaches people how to climb up to God. Only the gospel says God came down to find people.\nSalvation has two sides. The death of Jesus deals with our sinful nature and our sinful deeds; the resurrection of Jesus gives us new life. The first is forgiveness, the second is rebirth. With forgiveness alone you would still be carrying the old self. It is the new life that makes this genuinely good news.\nAll of it is free. He does not take you in once you improve; you improve because He has already taken you in. The only thing you must do is put out your hand and receive.\nSo a Christian is not a better person. A Christian is a person who knows he has been given grace.","求聖靈讓你分辨：我心裡是不是還想「先做到什麼」才敢來？":"Ask the Holy Spirit to show you: am I still hoping to achieve something first before I dare to come?","「白白得著」這件事，我心裡最難相信的部分是什麼？":"About receiving freely — which part is hardest for my heart to believe?","第一天：讀以弗所書二章1至10節。":"Day 1: Read Ephesians 2:1-10.","第二天：寫下你覺得自己「不夠格」的那件事，然後在旁邊寫「恩典」。":"Day 2: Write down the thing that makes you feel unqualified, then write “grace” beside it.","第三天：讀路加福音十五章11至24節（浪子）。":"Day 3: Read Luke 15:11-24 (the prodigal son).","第四天：對神說：我不靠自己了。":"Day 4: Say to God: I am no longer relying on myself.","第五天：讀羅馬書五章1至11節。":"Day 5: Read Romans 5:1-11.","第六天：對一個人施予一次不求回報的善意。":"Day 6: Show one person a kindness with nothing expected in return.","第七天：寫下一句感謝。":"Day 7: Write down one sentence of thanks.","陪伴者提示：華人最難的一關就是「白白」。多數人寧可付代價也不願欠人情。允許他問「真的不用做什麼嗎」，並且一次一次地說：真的不用。":"For companions: for Chinese people the hardest word is “free.” Most would rather pay a price than owe a favour. Let him ask “is there really nothing I have to do?” and answer him, again and again: really, nothing.","禱告不是儀式，不是交易，也不是背誦。禱告就是跟父親說話。 所以不必文謅謅，不必跪很久，也不必先想好措辭。你可以在開車時、洗碗時、睡前跟祂說。 一個簡單的架構：先感謝（今天有什麼可以謝的）、再認罪（有什麼我知道不對的）、然後代求（為別人求）、最後才是自己的需要。這個次序會慢慢把你從自我中心裡帶出來。 禱告最重要的不是說什麼，是「知道有人在聽」。而神的回答有三種：好、等一等、我有更好的。沒有一種是不理你。":"Prayer is not a ritual, not a transaction, and not a recitation. Prayer is talking with your Father.\nSo there is no need for elegant phrasing, no need to kneel a long time, no need to compose your words first. You can talk with Him while driving, while washing dishes, before you fall asleep.\nA simple frame: thanks first (what is there to be grateful for today), then confession (what do I know was wrong), then intercession (asking on behalf of others), and last of all your own needs. That order will slowly draw you out of yourself.\nWhat matters most in prayer is not what you say but knowing that Someone is listening. God's answers come in three forms: yes, wait, and I have something better. Not one of them is being ignored.","求聖靈幫助你，把禱告從「功課」變成「說話」。":"Ask the Holy Spirit to turn prayer from homework into conversation.","我最想跟神說的第一句話是什麼？":"What is the first thing I most want to say to God?","第一天：用一分鐘，只講感謝。":"Day 1: Take one minute and give thanks only.","第二天：用一分鐘，說一件你做錯的事。":"Day 2: Take one minute and name one thing you got wrong.","第三天：為一個你在乎的人禱告。":"Day 3: Pray for someone you care about.","第四天：為一個你不喜歡的人禱告。":"Day 4: Pray for someone you do not like.","第五天：讀主禱文（馬太福音六章9至13節），慢慢念三遍。":"Day 5: Read the Lord's Prayer (Matthew 6:9-13) and say it slowly three times.","第六天：安靜三分鐘，什麼都不說，只是坐著。":"Day 6: Be still for three minutes. Say nothing. Just sit.","第七天：寫下這一週神有沒有回應你什麼。":"Day 7: Write down whether God answered you in anything this week.","陪伴者提示：第一次帶他禱告時，你先開口，讓他跟著。很多人不禱告只是因為不好意思開口，不是不想。":"For companions: the first time you pray together, speak first and let him follow. Many people do not pray simply because they are embarrassed to start, not because they do not want to.","聖經是我的準則。它不是一本道德教科書，是神的自我介紹。 讀經的建議：新朋友從約翰福音或路加福音開始，不要從創世記一路啃。每天一小段，讀不懂的先跳過，讀得懂的先照著做。 一個好用的方法（三個問題）：這段話講神是怎樣的一位神？講人是怎樣的？今天我要做什麼？ 讀經不求快，求「有一句話進到心裡」。一節經文被你活出來，勝過一章被你讀過去。":"Scripture is my standard. It is not a textbook of morals; it is God introducing Himself.\nSome advice on reading: a new friend should begin with John or Luke, not grind straight through from Genesis. A short passage each day. Skip what you cannot understand; start doing what you can.\nA useful method, three questions: what does this passage say God is like? What does it say man is like? What am I to do today?\nDo not read for speed. Read until one sentence gets into your heart. One verse lived out is worth more than a chapter read through.","求聖靈在你讀的時候親自開你的眼睛，不然字就只是字。":"Ask the Holy Spirit to open your eyes as you read; otherwise the words remain only words.","我打算每天什麼時間讀？讀多久？（訂一個小到你一定做得到的量）":"What time will I read each day, and for how long? (Set an amount so small that you are certain to manage it.)","第一天：讀約翰福音第一章1至18節。":"Day 1: Read John 1:1-18.","第二天：讀約翰福音第三章1至21節。":"Day 2: Read John 3:1-21.","第三天：讀約翰福音第四章1至26節。":"Day 3: Read John 4:1-26.","第四天：挑一節你最有感覺的，抄下來。":"Day 4: Choose the verse that moves you most and copy it out.","第五天：讀詩篇二十三篇。":"Day 5: Read Psalm 23.","第六天：把那節經文傳給一個朋友。":"Day 6: Send that verse to a friend.","第七天：回顧這一週哪一句最觸動你。":"Day 7: Look back and see which sentence touched you most this week.","陪伴者提示：送他一本實體聖經，並且陪他讀第一次。翻不到書卷是很多人放棄的原因，這件小事你要幫他解決。":"For companions: give him a physical Bible and read it with him the first time. Not being able to find the books is why many give up. Solve that small thing for him.","教會不是建築物，是一群被神呼召出來的人；不是一個組織，是一個家，是基督的身體。 所以「去教會」這個講法其實不準確——你不是去一個地方，你是進入一群人。也因此，教會一定有缺點，因為有人的地方就有問題。但那正是我們需要彼此的原因。 在教會裡你會找到三種關係：屬靈同伴（彼此扶持的同輩）、屬靈父母與兒女（生命的傳承）、屬靈戰友（一起服事的團隊）。這就是 235 的體系。 一根柴自己燒，很快就滅；放進火堆裡，能燒很久。":"The church is not a building; it is a people God has called out. It is not an organisation; it is a family, the body of Christ.\nSo the phrase “going to church” is not quite accurate — you are not going to a place, you are entering a people. And for that reason the church will always have faults, because wherever there are people there are problems. But that is precisely why we need one another.\nIn the church you will find three kinds of relationship: spiritual companions (peers who hold one another up), spiritual parents and children (life passed on), and spiritual comrades (a team serving together). This is the 235 system.\nA log burning by itself goes out quickly. Put it in the fire and it burns a long time.","求聖靈除去你對教會的成見，也求祂醫治你曾受過的傷。":"Ask the Holy Spirit to take away your prejudices about the church, and to heal the wounds you have received.","我對教會最大的擔心是什麼？":"What is my biggest worry about the church?","第一天：認識一位新的弟兄姊妹，記住他的名字。":"Day 1: Meet one new brother or sister and remember his name.","第二天：讀使徒行傳二章42至47節。":"Day 2: Read Acts 2:42-47.","第三天：問一個人：你為什麼留在這間教會？":"Day 3: Ask someone: why have you stayed in this church?","第四天：參加一次小組或聚會。":"Day 4: Attend one small group or gathering.","第五天：主動幫忙一件小事。":"Day 5: Volunteer to help with one small thing.","第六天：為教會的一位同工禱告。":"Day 6: Pray for one of the church's co-workers.","第七天：寫下你在這裡遇到的三個人的名字。":"Day 7: Write down the names of three people you have met here.","陪伴者提示：這一課的作業比課文重要——務必在六週內幫他認識三位弟兄姊妹。一個人若六週內沒交到三個朋友，流失的機率極高。":"For companions: in this lesson the assignment matters more than the text. Make sure he meets three brothers or sisters within six weeks. If someone makes no three friends in six weeks, the chance of losing him is very high.","受洗不是入會儀式，是一場公開的葬禮與一場公開的生日。入水，表示舊人有己的生命與基督同死；出水，表示新人無己的生命與基督同活。 受洗不能使人得救，是信心使人得救；但受洗是信心的公開表明，是主自己的吩咐。悄悄地信可以開始，公開地認才長得大。 受洗前要準備的：一份簡短的見證（信主前、關鍵時刻、現在的改變），以及跟家人的溝通。受洗後要記得：這是起點不是終點，接下來才是一對一被建造的開始。":"Baptism is not an initiation ceremony. It is a public funeral and a public birthday. Going down into the water says that the old self-centred life has died with Christ; coming up out of the water says that the new selfless life is alive with Christ.\nBaptism does not save anyone — faith saves. But baptism is the public declaration of that faith, and it is the Lord's own command. Believing quietly is a fine beginning; confessing openly is how a person grows.\nWhat to prepare beforehand: a short testimony (life before Christ, the turning point, the change now), and a conversation with your family. What to remember afterwards: this is the starting line, not the finish. Now the one-to-one building begins.","求聖靈給你勇氣，也給你合適的時機。":"Ask the Holy Spirit for courage, and for the right moment.","我準備好公開承認自己是基督徒了嗎？如果還沒，是什麼攔阻我？":"Am I ready to confess publicly that I am a Christian? If not, what is holding me back?","第一天：讀馬太福音二十八章18至20節。":"Day 1: Read Matthew 28:18-20.","第二天：寫下「信主前的我」三句話。":"Day 2: Write three sentences on “who I was before Christ.”","第三天：寫下「遇見主的關鍵」三句話。":"Day 3: Write three sentences on “how I met the Lord.”","第四天：寫下「現在的改變」三句話。":"Day 4: Write three sentences on “what has changed now.”","第五天：把這份見證念給陪伴你的人聽。":"Day 5: Read that testimony aloud to the person walking with you.","第六天：跟家人談一次（先禱告再談）。":"Day 6: Have one conversation with your family (pray before you talk).","第七天：跟牧者或陪伴者約時間，談受洗。":"Day 7: Make a time with your pastor or companion to talk about baptism.","陪伴者提示：受洗那天務必出席，並且拍照留念。多年以後，那張照片會是他信心動搖時的錨。":"For companions: be there on the day of his baptism, and take a photograph. Years later that picture will be his anchor when his faith is shaken.","・第一天：走到戶外，抬頭看天空三分鐘，說一句「如果祢在，請讓我認識祢」。":"・Day 1: Step outside, look up at the sky for three minutes, and say, “If You are there, let me come to know You.”","・第二天：寫下三件你覺得「不可能是偶然」的事。":"・Day 2: Write down three things you feel could not possibly have been accidents.","・第三天：讀創世記第一章。":"・Day 3: Read Genesis chapter 1.","・第四天：留意今天有沒有哪件小事讓你想到神。":"・Day 4: Notice whether any small thing today makes you think of God.","・第五天：問一位基督徒朋友：你是怎麼開始相信有神的？":"・Day 5: Ask a Christian friend, “How did you first come to believe there is a God?”","・第六天：試著用自己的話禱告一分鐘。":"・Day 6: Try praying for one minute in your own words.","・第七天：回顧這一週，寫下一句話。":"・Day 7: Look back over the week and write down one sentence.","・第一天：寫下最近一次你生氣的事，問自己：我當時想控制什麼？":"・Day 1: Write down the last thing that made you angry, and ask: what was I trying to control?","・第二天：讀創世記第三章。":"・Day 2: Read Genesis chapter 3.","・第三天：一整天觀察自己說「我覺得」「我認為」的次數。":"・Day 3: For a whole day, count how often you say “I feel” and “I think.”","・第四天：對一個人讓步一次，練習不爭。":"・Day 4: Give way to someone once. Practise not contending.","・第五天：跟神說：我承認我一直想自己作主。":"・Day 5: Tell God: I admit I have wanted to be my own master.","・第六天：讀羅馬書七章15至25節。":"・Day 6: Read Romans 7:15-25.","・第七天：寫下一句話：我最想交出來的是什麼。":"・Day 7: Write one sentence: what I most want to hand over.","・第一天：讀馬可福音第一章。":"・Day 1: Read Mark chapter 1.","・第二天：讀馬可福音第二章，注意祂怎麼對待被排擠的人。":"・Day 2: Read Mark chapter 2, watching how He treats the people others push aside.","・第三天：讀約翰福音第八章1至11節。":"・Day 3: Read John 8:1-11.","・第四天：寫下耶穌哪一點最吸引你。":"・Day 4: Write down what draws you most about Jesus.","・第五天：讀路加福音二十三章。":"・Day 5: Read Luke chapter 23.","・第六天：讀路加福音二十四章。":"・Day 6: Read Luke chapter 24.","・第七天：對祂說一句話，隨便什麼都好。":"・Day 7: Say one sentence to Him — anything at all.","・第一天：讀以弗所書二章1至10節。":"・Day 1: Read Ephesians 2:1-10.","・第二天：寫下你覺得自己「不夠格」的那件事，然後在旁邊寫「恩典」。":"・Day 2: Write down the thing that makes you feel unqualified, then write “grace” beside it.","・第三天：讀路加福音十五章11至24節（浪子）。":"・Day 3: Read Luke 15:11-24 (the prodigal son).","・第四天：對神說：我不靠自己了。":"・Day 4: Say to God: I am no longer relying on myself.","・第五天：讀羅馬書五章1至11節。":"・Day 5: Read Romans 5:1-11.","・第六天：對一個人施予一次不求回報的善意。":"・Day 6: Show one person a kindness with nothing expected in return.","・第七天：寫下一句感謝。":"・Day 7: Write down one sentence of thanks.","・第一天：用一分鐘，只講感謝。":"・Day 1: Take one minute and give thanks only.","・第二天：用一分鐘，說一件你做錯的事。":"・Day 2: Take one minute and name one thing you got wrong.","・第三天：為一個你在乎的人禱告。":"・Day 3: Pray for someone you care about.","・第四天：為一個你不喜歡的人禱告。":"・Day 4: Pray for someone you do not like.","・第五天：讀主禱文（馬太福音六章9至13節），慢慢念三遍。":"・Day 5: Read the Lord's Prayer (Matthew 6:9-13) and say it slowly three times.","・第六天：安靜三分鐘，什麼都不說，只是坐著。":"・Day 6: Be still for three minutes. Say nothing. Just sit.","・第七天：寫下這一週神有沒有回應你什麼。":"・Day 7: Write down whether God answered you in anything this week.","・第一天：讀約翰福音第一章1至18節。":"・Day 1: Read John 1:1-18.","・第二天：讀約翰福音第三章1至21節。":"・Day 2: Read John 3:1-21.","・第三天：讀約翰福音第四章1至26節。":"・Day 3: Read John 4:1-26.","・第四天：挑一節你最有感覺的，抄下來。":"・Day 4: Choose the verse that moves you most and copy it out.","・第五天：讀詩篇二十三篇。":"・Day 5: Read Psalm 23.","・第六天：把那節經文傳給一個朋友。":"・Day 6: Send that verse to a friend.","・第七天：回顧這一週哪一句最觸動你。":"・Day 7: Look back and see which sentence touched you most this week.","・第一天：認識一位新的弟兄姊妹，記住他的名字。":"・Day 1: Meet one new brother or sister and remember his name.","・第二天：讀使徒行傳二章42至47節。":"・Day 2: Read Acts 2:42-47.","・第三天：問一個人：你為什麼留在這間教會？":"・Day 3: Ask someone: why have you stayed in this church?","・第四天：參加一次小組或聚會。":"・Day 4: Attend one small group or gathering.","・第五天：主動幫忙一件小事。":"・Day 5: Volunteer to help with one small thing.","・第六天：為教會的一位同工禱告。":"・Day 6: Pray for one of the church's co-workers.","・第七天：寫下你在這裡遇到的三個人的名字。":"・Day 7: Write down the names of three people you have met here.","・第一天：讀馬太福音二十八章18至20節。":"・Day 1: Read Matthew 28:18-20.","・第二天：寫下「信主前的我」三句話。":"・Day 2: Write three sentences on “who I was before Christ.”","・第三天：寫下「遇見主的關鍵」三句話。":"・Day 3: Write three sentences on “how I met the Lord.”","・第四天：寫下「現在的改變」三句話。":"・Day 4: Write three sentences on “what has changed now.”","・第五天：把這份見證念給陪伴你的人聽。":"・Day 5: Read that testimony aloud to the person walking with you.","・第六天：跟家人談一次（先禱告再談）。":"・Day 6: Have one conversation with your family (pray before you talk).","・第七天：跟牧者或陪伴者約時間，談受洗。":"・Day 7: Make a time with your pastor or companion to talk about baptism.","約翰福音十五章5節":"John 15:5","我是葡萄樹，你們是枝子。常在我裡面的，我也常在他裡面，這人就多結果子；因為離了我，你們就不能做甚麼。":"I am the vine. You are the branches. He who remains in me and I in him bears much fruit, for apart from me you can do nothing.","約翰福音十六章13節":"John 16:13","只等真理的聖靈來了，他要引導你們明白一切的真理。":"When he, the Spirit of truth, has come, he will guide you into all truth.","腓立比書二章5節":"Philippians 2:5","你們當以基督耶穌的心為心。":"Have this in your mind, which was also in Christ Jesus.","以弗所書四章22至24節":"Ephesians 4:22-24","就要脫去你們從前行為上的舊人……又要將你們的心志改換一新，並且穿上新人。":"…that you put away the old man… and be renewed in the spirit of your mind, and put on the new man.","加拉太書二章20節":"Galatians 2:20","現在活著的不再是我，乃是基督在我裡面活著。":"It is no longer I that live, but Christ lives in me.","雅各書四章6節":"James 4:6","神阻擋驕傲的人，賜恩給謙卑的人。":"God resists the proud, but gives grace to the humble.","以弗所書四章32節":"Ephesians 4:32","並要以恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。":"And be kind to one another, tender hearted, forgiving each other, just as God also in Christ forgave you.","加拉太書五章22至23節":"Galatians 5:22-23","聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。":"But the fruit of the Spirit is love, joy, peace, patience, kindness, goodness, faithfulness, gentleness, and self-control.","傳道書四章12節":"Ecclesiastes 4:12","有人攻勝孤身一人，若有二人便能敵擋他；三股合成的繩子不容易折斷。":"Though a man might prevail against one who is alone, two shall withstand him; and a threefold cord is not quickly broken.","馬太福音六章33節":"Matthew 6:33","你們要先求他的國和他的義，這些東西都要加給你們了。":"But seek first God's Kingdom and his righteousness, and all these things will be given to you as well.","彼得前書四章10節":"1 Peter 4:10","各人要照所得的恩賜彼此服事，作神百般恩賜的好管家。":"As each has received a gift, employ it in serving one another, as good managers of the grace of God in its various forms.","提摩太後書二章2節":"2 Timothy 2:2","你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人。":"The things you have heard from me among many witnesses, commit the same to faithful men who will be able to teach others also.","建立每天固定的靈修節奏：讀經、禱告、記錄。生命的次序是先生命、再關係、後事工。":"Build a steady daily rhythm: read, pray, record. The order of life is life first, then relationships, then ministry.","靈修不是一份要交的功課，是一場天天的約會。功課會讓人有罪惡感，約會讓人有期待感。主耶穌說：「離了我，你們就不能做甚麼。」注意祂沒有說「你們會做得比較差」，是說「不能做甚麼」——枝子離開葡萄樹，不是結果少一點，是三天就枯了。 實際的節奏很簡單，三件事：讀、禱、記。讀，一天一小段，不貪多，讀完問一句「這裡讓我看見神是怎樣的一位神？」；禱，把讀到的直接跟祂說，不必用宗教的語言；記，一行就好，記下今天神對你說的一句話。這一行字，一年之後會變成三百多句你與神之間的私房話。 次序是先生命、再關係、後事工。許多人服事到乾涸，不是因為做太多，是因為沒有先與主同行就衝出去。水管沒接上水源，再粗也只是空的。":"Devotion is not homework to be handed in; it is a daily appointment. Homework makes a person feel guilty. An appointment makes a person look forward. The Lord Jesus said, “apart from me you can do nothing.” Notice He did not say “you will do rather worse.” He said “nothing” — a branch cut from the vine does not bear a little less fruit; it is dry within three days.\nThe practical rhythm is simple, three things: read, pray, record. Read a short passage a day, do not be greedy, and when you finish ask, “what does this show me about the kind of God He is?” Pray by speaking back to Him what you have just read, without religious language. Record one line, no more, of what God said to you today. A year later that one line a day will have become three hundred private sentences between you and God.\nThe order is life first, then relationships, then ministry. Many serve until they run dry, not because they did too much, but because they rushed out without first walking with the Lord. A pipe not joined to the source is empty however wide it is.","安靜三分鐘，問聖靈：這一週，我心裡最忙、最吵的是什麼？求祂讓你看見，你的枯乾是從哪一天離開葡萄樹開始的。":"Be still three minutes and ask the Holy Spirit: this week, what has been busiest and noisiest inside me? Ask Him to show you which day your dryness began, the day you left the vine.","我要每天與主約會，不是為了作好基督徒，是因為我離了祂就不能做甚麼。":"I will keep a daily appointment with the Lord — not to be a good Christian, but because apart from Him I can do nothing.","第一至七天：固定一個時段（建議早晨），十五分鐘，手機放在看不見的地方。":"Days 1-7: Fix one time slot (mornings are best), fifteen minutes, with your phone out of sight.","讀：約翰福音第一至七章，一天一章。讀完寫下一句「今天我看見的耶穌」。":"Read: John chapters 1 to 7, one chapter a day. Afterwards write one line: “the Jesus I saw today.”","禱：用讀到的經文向神說話，最後為你的一位「2」禱告一分鐘。":"Pray: speak to God using the passage you read, and finish with one minute of prayer for one of your 2s.","記：準備一本小本子或用 App 的靈修紀錄，一天只寫一行。":"Record: keep a small notebook or use the app's devotion log. One line a day, no more.","第七天回顧：這七天哪一天最難？是什麼攔阻了你？":"Day 7 review: which of the seven days was hardest, and what got in the way?","陪伴者提示：不要一開始就要求三十分鐘。先幫他建立「天天有」，再談「時間長」。頭兩週每隔一天問他一句「今天讀到哪裡？」比講十次道理有用。":"For companions: do not ask for thirty minutes at the start. Help him establish “every day” first, and only later “for longer.” For the first two weeks, asking every other day “where did you read today?” does more good than ten talks.","聖靈是我的引導。用心靠聖靈，不要用腦靠自己；用心就開心，用腦就煩惱。":"The Holy Spirit is my guide. Use the heart and rely on the Spirit, not the head and yourself. The heart brings gladness; the head brings worry.","主耶穌說：「只等真理的聖靈來了，他要引導你們明白一切的真理。」聖靈不是一種感覺，也不是一股力量，祂是一位有位格的神，住在我們裡面。祂會引導、會提醒、會責備、會安慰，也會擔憂。 聖靈住在心中，不住在腦中。所以我們的習慣要調整過來：用心靠聖靈，不要用腦靠自己；用心就開心，用腦就煩惱。用腦的人一直在算：這樣做划不划算、別人會怎麼看、萬一失敗怎麼辦——算到最後動彈不得。用心的人問的是：主，祢要我怎麼做？然後就去做。 怎麼分辨是聖靈的引導，還是自己的念頭？四把尺可以量：一、合不合聖經（聖靈絕不引導人違背祂自己寫的話）；二、是不是把榮耀歸給耶穌（聖靈不會高舉你）；三、心裡是平安還是催逼（神給的是催促中的平安，撒但給的是慌張中的急迫）；四、有沒有屬靈同伴的印證（重大的事，讓身邊敬虔的人一同尋求）。 一生的果效是從心發出。所以每天要作的第一件事，是把心打開，說：聖靈，今天請祢引導我。":"The Lord Jesus said, “When he, the Spirit of truth, has come, he will guide you into all truth.” The Holy Spirit is not a feeling, nor a force. He is a personal God who lives within us. He guides, He reminds, He convicts, He comforts — and He can be grieved.\nThe Spirit lives in the heart, not in the head. So our habits must be adjusted: use the heart and rely on the Spirit, not the head and yourself. The heart brings gladness; the head brings worry. A person living out of his head is forever calculating — is this worth it, what will people think, what if I fail — and calculates himself into paralysis. A person living out of his heart asks: Lord, what would You have me do? And then does it.\nHow do you tell the Spirit's leading from your own notion? Four measures. First, does it agree with Scripture (the Spirit never leads anyone against the words He Himself wrote). Second, does it give the glory to Jesus (the Spirit does not exalt you). Third, is there peace in your heart or pressure (what God gives is peace within urgency; what Satan gives is urgency within panic). Fourth, is there confirmation from spiritual companions (in weighty matters, let godly people around you seek together with you).\nThe outcomes of a whole life flow from the heart. So the first thing to do each day is open your heart and say: Holy Spirit, please lead me today.","回想最近一次你「心裡有一個聲音」但你沒有理它。安靜下來問聖靈：那是祢嗎？如果是，祢現在還要我去做嗎？":"Recall the last time there was a voice in your heart that you ignored. Be still and ask the Spirit: was that You? If it was, do You still want me to do it?","我要學習用心不用腦，凡事先問聖靈，而不是先算後果。":"I will learn to use my heart and not my head — to ask the Spirit first, rather than calculate consequences first.","第一至七天：每天早晨起床先說一句：「聖靈，今天求祢引導我。」":"Days 1-7: On waking each morning say one sentence: “Holy Spirit, lead me today.”","當天若心裡有一個感動（打一通電話、道一次歉、幫一個忙），十二小時內去做，不拖過夜。":"If a prompting comes that day (make a call, offer an apology, lend a hand), act within twelve hours. Do not let it wait overnight.","晚上記下：今天我照著感動做了什麼？結果如何？":"In the evening record: what did I act on today, and what came of it?","讀：約翰福音十四至十六章，圈出所有關於聖靈的應許。":"Read: John 14 to 16, circling every promise concerning the Holy Spirit.","用四把尺檢視一件你目前正在猶豫的事。":"Apply the four measures to one thing you are currently hesitating over.","陪伴者提示：初信者最怕「我聽不到神的聲音」。要告訴他：神的引導多半不是雷聲，是一個安靜卻不肯走開的念頭。先從小事順服，聽力就會長大。":"For companions: a new believer's greatest fear is “I cannot hear God's voice.” Tell him that God's leading is seldom thunder; it is usually a quiet thought that will not go away. Obey in small things first, and the hearing will grow.","耶穌是我的榜樣。焦點在耶穌，不在自己、不在別人、不在環境。":"Jesus is my model. The focus is on Jesus — not on myself, not on others, not on circumstances.","「你們當以基督耶穌的心為心。」保羅接著描寫的，是一條向下的路：祂本有神的形像，卻虛己、取了奴僕的形像、存心順服以至於死。這是耶穌的樣式——不是往上爬，是往下走；不是抓住權力，是放下權力。 以耶穌為榜樣，最實際的操練是「換焦點」。我們一天的情緒起伏，多半來自三個錯誤的焦點：看自己（我表現得好不好、我有沒有面子）、看別人（他為什麼那樣說我）、看環境（怎麼又出事了）。焦點在哪裡，情緒就在哪裡。焦點在耶穌，不在自己、不在別人、不在環境——耶穌是一切的焦點。 學耶穌不是模仿祂的動作，是讓祂的生命在我裡面活出來。你不必咬牙去愛那個難愛的人，你要作的是把自己讓開，讓住在你裡面的那一位去愛他。這就是為什麼下一課要談無己：沒有無己，效法基督只會變成疲倦的表演。":"“Have this in your mind, which was also in Christ Jesus.” What Paul describes next is a downward road: though He was in the form of God, He emptied Himself, took the form of a servant, and became obedient to the point of death. That is the pattern of Jesus — not climbing up but going down; not seizing power but laying it down.\nThe most practical exercise in taking Jesus as our model is changing the focus. The rise and fall of our emotions in a day comes mostly from three wrong focal points: looking at self (am I performing well, am I losing face), looking at others (why did he say that about me), and looking at circumstances (why has something gone wrong again). Wherever the focus is, the emotions are. The focus is on Jesus — not on self, not on others, not on circumstances. Jesus is the focus of everything.\nLearning Jesus is not imitating His actions; it is letting His life be lived out in me. You do not have to grit your teeth to love the person who is hard to love. What you must do is step aside and let the One who lives within you love him. This is why the next lesson is about selflessness: without it, following Christ becomes a tiring performance.","問聖靈：這一週，我的焦點最常落在哪裡？是自己的面子、別人的評價，還是難處的環境？":"Ask the Holy Spirit: where has my focus fallen most often this week — my own face, other people's opinions, or difficult circumstances?","我要把焦點從自己、別人、環境挪回耶穌身上，因為祂是一切的焦點。":"I will move my focus off myself, off others, off circumstances, and back onto Jesus, because He is the focus of everything.","讀：腓立比書二章1至11節，一天讀一次，連讀七天。":"Read: Philippians 2:1-11, once a day for seven days running.","每天挑一件讓你不舒服的事，問自己：「如果是耶穌，祂會怎麼作？」然後照著作一次。":"Each day take one thing that makes you uncomfortable and ask, “if this were Jesus, what would He do?” Then do it that way once.","操練「往下走」：這週主動作一件沒有人看見、也沒有人會謝謝你的服事。":"Practise going downward: this week do one act of service that no one sees and no one will thank you for.","當情緒上來時，停三秒，說一句：「主，我把焦點交還給祢。」":"When emotion rises, pause three seconds and say, “Lord, I give the focus back to You.”","第七天：寫下這一週你最像耶穌的一刻，把榮耀歸給祂。":"Day 7: Write down the moment this week you were most like Jesus, and give Him the glory.","陪伴者提示：不要把這課講成道德要求。重點在「換焦點」，不在「更努力」。他若開始說「我做不到」，那是好消息——他快要進入第五課了。":"For companions: do not turn this lesson into a moral demand. The point is changing the focus, not trying harder. If he begins to say “I cannot do it,” that is good news — he is nearly ready for Lesson 5.","舊人有己的生命，變成新人無己的生命。這是一次成就、一生經歷的功課。":"The old self-centred life becomes the new selfless life. This is accomplished once and experienced for a lifetime.","「就要脫去你們從前行為上的舊人……又要將你們的心志改換一新，並且穿上新人。」脫、換、穿——三個動作，說明得救不是換一套衣服的外表工程，是換一個人。 舊人的特徵只有一個字：己。以自己為中心，自己要作主作王，想要代替神。這不是某些壞人的問題，是全人類共同的病根。亞當夏娃吃分別善惡樹的果子，不是嘴饞，是想「如神能知道善惡」——想自己當那個定義對錯的人。所以罪的根源不是行為，是有己；問題的根源不是別人，是驕傲。 新人的特徵也是一個字：無。無己，讓耶穌在裡面活。這個新生命，是耶穌復活的時候就已經賜給你的，是既成的事實，不是要靠努力賺來的資格。 但這裡有一個張力：地位上，你已經是新人了；經歷上，舊人的習慣還會跳出來。所以保羅說要「天天」脫去。這不是懷疑你的得救，是描述你的成長。一次成就，一生經歷——你不是在爭取新生命，你是在學習照著已經有的新生命而活。":"“Put away the old man… be renewed in the spirit of your mind, and put on the new man.” Put away, renew, put on — three actions showing that salvation is not a change of clothes but a change of person.\nThe old man has one defining word: self. Self at the centre of everything, self insisting on being master and king, self wanting to take God's place. This is not the problem of a few bad people; it is the common root disease of the whole race. Adam and Eve did not eat from the tree of knowledge out of appetite. They wanted to “be like God, knowing good and evil” — to be the one who defines right and wrong. So the root of sin is not conduct but self; the root of the problem is not other people but pride.\nThe new man also has one defining word: without. Selflessness — letting Jesus live within. This new life was given to you the moment Jesus rose; it is an accomplished fact, not a status to be earned by effort.\nBut there is a tension here. In standing, you are already the new man; in experience, the habits of the old man still leap out. That is why Paul says to put it away “daily.” This does not question your salvation; it describes your growth. Accomplished once, experienced for a lifetime — you are not striving for a new life, you are learning to live by the new life you already have.","求聖靈指出一個你最熟悉的「舊人反應」——那個一被踩到就自動跳出來的反應。不要辯解，只要看見。":"Ask the Holy Spirit to point out the old-man reaction you know best — the one that leaps out automatically the moment someone treads on you. Do not defend it. Just see it.","我已經是新人了。我不是靠努力變好，我是學習照著已經有的新生命而活。":"I am already the new man. I am not improving by effort; I am learning to live by the new life I already have.","讀：以弗所書四章17至32節、歌羅西書三章1至17節。":"Read: Ephesians 4:17-32 and Colossians 3:1-17.","畫一張兩欄表：左欄寫「我的舊人反應」，右欄寫「新人可以怎麼反應」。":"Draw a two-column table: on the left, “my old-man reactions”; on the right, “how the new man could respond.”","每天挑右欄的一項，實際作一次。":"Each day pick one item from the right-hand column and actually do it once.","當舊人跳出來時，不要自責，只說：「這是舊人，不是我了。主，求祢活出來。」":"When the old man leaps out, do not condemn yourself. Simply say, “that is the old man; it is no longer me. Lord, live Your life out in me.”","第七天：把這張表拿給你的屬靈同伴看，請他為你禱告。":"Day 7: Show the table to your spiritual companion and ask him to pray for you.","陪伴者提示：這一課最容易變成自我控訴。要一再強調：看見舊人不是失敗的證據，是聖靈動工的證據。瞎子看不見自己髒。":"For companions: this lesson turns into self-accusation more easily than any other. Say it again and again — seeing the old man is not evidence of failure but evidence that the Spirit is at work. A blind man cannot see his own dirt.","無己不是沒有，乃是進入無限、活出無限。無己讓耶穌在裡面活。":"Selflessness is not having nothing; it is entering the infinite and living the infinite. Selflessness lets Jesus live within.","「我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著。」這節經文是整個門訓的心臟。保羅沒有說「我努力學基督」，他說「不再是我」。 很多人一聽「無己」就害怕：那我不就沒有了嗎？剛好相反。無己不是沒有，乃是進入無限、活出無限。一滴水單獨存在，太陽一曬就乾了；一滴水回到大海，它就有了大海的浩瀚。無己不是消滅你，是把那個又小又擠的「己」，換成基督無限的生命。 無己有五個果效，值得背下來：無己才能讓耶穌作王；無己才能被聖靈引導；無己才能合一；無己才能得勝；無己才能建立屬神的體系。反過來說，我們一切的卡關——關係破裂、事工爭競、禱告無力——追到底幾乎都是同一個原因：己還在王位上。 捨己是動作，無己是狀態。捨己是背起自己的十字架，為耶穌、為別人、不為自己；無己是那個十字架背久了之後，你發現裡面活著的真的不再是你。":"“I have been crucified with Christ. It is no longer I that live, but Christ lives in me.” This verse is the heart of the whole discipleship course. Paul did not say “I try hard to imitate Christ.” He said “no longer I.”\nMany people hear the word selflessness and take fright: does that mean I will be gone? Quite the opposite. Selflessness is not having nothing; it is entering the infinite and living the infinite. A drop of water standing alone dries up in the sun. A drop of water returned to the sea has all the vastness of the sea. Selflessness does not abolish you; it exchanges that small, cramped self for the boundless life of Christ.\nSelflessness has five effects, worth committing to memory. Only the selfless can let Jesus reign. Only the selfless can be led by the Spirit. Only the selfless can be one. Only the selfless can overcome. Only the selfless can build the system that belongs to God. Turn it round and you find that everything we get stuck on — broken relationships, rivalry in ministry, powerless prayer — traces back to the same cause: self is still on the throne.\nDenying self is an action; selflessness is a state. Denying self is taking up your own cross for Jesus and for others and not for yourself. Selflessness is what you discover after carrying that cross long enough: the one living inside really is no longer you.","安靜下來，問聖靈：我裡面還有哪一塊地方，是我死不肯交出去的？不必立刻交，先誠實承認。":"Be still and ask the Spirit: what area within me am I still refusing to hand over? You need not hand it over at once. Admit it honestly first.","無己不是我失去，是我進入基督的無限。我今天要把王位交還給祂。":"Selflessness is not my loss; it is my entering the boundlessness of Christ. Today I give the throne back to Him.","讀：加拉太書二章20節，背下來，一天默想一次。":"Read Galatians 2:20, memorise it, and meditate on it once a day.","每天早晨作一次交託禱告：把時間、金錢、關係、名聲、未來，一樣一樣點名交給主。":"Each morning pray a prayer of surrender, handing over time, money, relationships, reputation and future to the Lord, naming them one by one.","這週遇到一次「我明明有理」的場合，選擇不爭，把它獻上。":"This week, when you meet an occasion where you are plainly in the right, choose not to contend, and offer it up.","記下：當我不爭的時候，我心裡發生了什麼？":"Record: when I did not contend, what happened inside me?","第七天：寫下一段「我要交出去的清單」，日期簽上。":"Day 7: Write out a list of what I am handing over, and sign it with the date.","陪伴者提示：不要用「你要無己」來壓人，那反而是律法。要幫他看見無己的甘甜——被基督愛到不必再證明自己，那是何等的釋放。":"For companions: do not press people with “you must be selfless” — that only turns into law. Help him taste how sweet selflessness is: to be so loved by Christ that you no longer need to prove yourself. What a release that is.","驕傲是離開本位抓住權力；謙卑是放下權力回到本位。讓人作人，讓神作神。":"Pride leaves its place and seizes power; humility lays power down and returns to its place. Let man be man, and let God be God.","「神阻擋驕傲的人，賜恩給謙卑的人。」這節經文把屬靈爭戰的勝負講得非常直白：一邊是神親自阻擋，一邊是神主動施恩。同一位神，兩種完全相反的態度，差別只在謙卑或驕傲。 什麼是驕傲？驕傲是離開本位，抓住權力——離開人的本位，抓住神的權力，想要代替神。所以驕傲不一定是趾高氣揚，一個天天焦慮、什麼都要掌控、放不下心的人，也是驕傲的一種：他在作神。 什麼是謙卑？謙卑是放下權力，回到本位——回到人的本位，放下神的權力。一句話：讓人作人，讓神作神。 在人際之間，這條原則帶來一個驚人的果效：驕傲激起驕傲，驕傲對抗驕傲，兩敗俱傷；謙卑帶動謙卑，謙卑對謙卑，達到雙贏。所以在一場衝突裡，先謙卑的那個人不是輸家，是那個把死局解開的人。謙卑是復興的鑰匙——不論是一個家庭的復興，還是一間教會的復興，都從有人肯先低頭開始。":"“God resists the proud, but gives grace to the humble.” This verse states the outcome of spiritual warfare with startling bluntness: on one side God Himself resists, on the other God freely gives. The same God, two utterly opposite postures, and the only difference is humility or pride.\nWhat is pride? Pride leaves its place and seizes power — leaving the place of a man, seizing the authority of God, wanting to take God's place. So pride is not always a raised chin. A person who is anxious every day, who must control everything, who cannot let go, is also a kind of proud man: he is playing God.\nWhat is humility? Humility lays power down and returns to its place — back to the place of a man, laying down the authority of God. In one line: let man be man, and let God be God.\nBetween people this principle produces a striking effect. Pride provokes pride; pride opposes pride; both are wounded. Humility draws out humility; humility meets humility; both win. So in a conflict the one who humbles himself first is not the loser — he is the one who unlocks the deadlock. Humility is the key to revival. Whether it is a family or a church, revival always begins when somebody is willing to bow first.","求聖靈照出：我的驕傲通常穿著什麼衣服？是強勢、是完美主義、是自卑不肯求助，還是什麼都要管的焦慮？":"Ask the Spirit to show you what clothes your pride usually wears. Is it forcefulness, perfectionism, a low self-worth that will not ask for help, or an anxiety that must manage everything?","我要放下神的權力，回到人的本位。讓人作人，讓神作神。":"I will lay down the authority of God and return to the place of a man. Let man be man, and let God be God.","讀：雅各書四章1至10節、彼得前書五章5至7節。":"Read: James 4:1-10 and 1 Peter 5:5-7.","這週向一個人道歉——不是「如果我有錯」，是具體說出你錯在哪裡。":"Apologise to one person this week — not “if I was wrong,” but naming exactly where you were wrong.","每天作一次「放手禱告」：把一件你一直想掌控的事交給神，說：「這件事祢作神，我作人。」":"Pray a letting-go prayer each day: hand God one thing you keep trying to control, and say, “in this matter You be God and I will be man.”","操練接受幫助：主動開口請人幫你一個忙。":"Practise receiving help: ask someone outright for a favour.","記下：先謙卑之後，那段關係發生了什麼變化？":"Record: after you humbled yourself first, what changed in that relationship?","陪伴者提示：這一課要陪伴者先示範。你在他面前承認過自己的失敗嗎？你若不先低頭，他學不會低頭。":"For companions: in this lesson the companion must go first. Have you ever admitted your own failure in front of him? If you will not bow first, he will never learn to bow.","不饒恕是把自己關在牢裡，卻等別人受苦。饒恕是先放自己出來。":"Unforgiveness locks you in a cell and waits for the other person to suffer. Forgiveness lets yourself out first.","「並要以恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。」饒恕的標準不是對方值不值得，是「正如神饒恕了你們一樣」。 不饒恕最大的荒謬在於：我們把自己關在牢裡，卻等著別人受苦。你反覆咀嚼那件事，痛的是你的胃；他可能早就忘了。饒恕不是說那件事沒關係，也不是說他沒有錯，更不是要你立刻回到從前的親密。饒恕是一個決定：我不再親手向他討這筆債，我把這筆帳交給神來處理。 要分清楚兩件事：饒恕是單方面的，你自己可以決定；和好是雙方面的，需要對方的悔改與時間。你可以饒恕一個從未道歉的人，但不必勉強自己立刻與一個仍在傷害你的人恢復親密。饒恕釋放的是你，和好修復的是關係。 饒恕也常常不是一次完成的。傷害越深，你可能要在神面前把同一件事交出去很多次。每一次交出去，捆綁就鬆一分。這不是失敗，這是醫治的過程。":"“Be kind to one another, tender hearted, forgiving each other, just as God also in Christ forgave you.” The standard of forgiveness is not whether the other person deserves it, but “just as God forgave you.”\nThe great absurdity of unforgiveness is this: we lock ourselves in a cell and wait for the other person to suffer. You chew the matter over and over, and it is your own stomach that aches; he may have forgotten long ago. Forgiveness does not say the matter was nothing, nor that he was not wrong, nor that you must return at once to the old closeness. Forgiveness is a decision: I will no longer collect this debt with my own hands. I hand the account over to God.\nDistinguish two things clearly. Forgiveness is one-sided; you can decide it yourself. Reconciliation is two-sided; it needs the other person's repentance and time. You may forgive someone who has never apologised, but you need not force yourself back into intimacy with someone who is still hurting you. Forgiveness releases you; reconciliation repairs the relationship.\nForgiveness is also seldom finished in one act. The deeper the wound, the more times you may have to hand the same matter over before God. Each time you hand it over, the binding loosens a little. That is not failure; that is the process of healing.","問聖靈：我心裡還關著誰？不必勉強自己有感覺，只要誠實地把那個名字說出來。":"Ask the Spirit: whom am I still holding in my cell? Do not force a feeling. Just say the name honestly.","我選擇把討債的權利交還給神。我要先走出這座牢。":"I choose to hand the right of collection back to God. I will walk out of this cell first.","寫下那個人的名字與那件事，然後在紙上寫：「我把這筆帳交給神。」":"Write down that person's name and what happened, then write on the paper: “I hand this account over to God.”","為他禱告七天——不是禱告他遭報，是求神祝福他。第一天會很難，第七天你會發現不一樣。":"Pray for him for seven days — not that he would be repaid, but that God would bless him. Day one will be hard; by day seven you will find it different.","讀：馬太福音十八章21至35節。問自己：我欠主的那一萬他連得，還記得嗎？":"Read Matthew 18:21-35 and ask yourself: do I still remember the ten thousand talents I owed the Lord?","若有需要和好且對方安全，本週約他見一次面。若不安全，先不必勉強。":"If reconciliation is needed and the person is safe, arrange to meet him this week. If it is not safe, do not force it yet.","第七天：把那張紙撕掉或燒掉，作為一個記號。":"Day 7: Tear up or burn that paper as a sign.","陪伴者提示：不要催逼他饒恕，尤其是深度創傷。你的角色是陪他把傷口帶到主面前，不是替他決定進度。必要時建議尋求專業協助。":"For companions: do not press him to forgive, especially with deep trauma. Your role is to carry the wound to the Lord with him, not to set his pace for him. Where needed, suggest professional help.","對每一個跟我有關係的人（2），操練無己（0），結出聖靈九個果子（9）。":"Towards every person I am related to (the 2), practise selflessness (the 0), and bear the nine fruits of the Spirit (the 9).","920 是把靈修落在一個具體的人身上的操練。「9」是聖靈的九個果子：仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。「2」是每一個跟我們有關係的人——你的配偶、你的孩子、你的同事、那位讓你頭痛的鄰居，都是你的2。「0」是無己。 請注意保羅用的是「果子」不是「果實們」——原文是單數。九樣不是九種可以挑選的才藝，是同一個生命的九個面向。你不能說「我比較擅長喜樂，忍耐就算了」。它們是一整串葡萄，一起長出來。 更要緊的是：果子是結出來的，不是擰出來的。你若靠自己去擠溫柔，擠三天就翻臉，而且翻得比平常更兇。次序是先0，再9：先無己，讓耶穌在裡面活，果子就從裡面長出來。 所以每天的操練很具體：今天，對【某某某】，操練【某個果子】。不是抽象地「我要有愛心」，是「今天中午，對我媽，操練忍耐——她再問第三次，我不嘆氣。」傳福音最真實的預工就在這裡：人要先看見基督的生命，才聽得進基督的道理。":"920 is the practice that lands your devotional life on one specific person. The 9 is the ninefold fruit of the Spirit: love, joy, peace, patience, kindness, goodness, faithfulness, gentleness and self-control. The 2 is every person you are related to — your spouse, your child, your colleague, the neighbour who gives you a headache. Each of them is one of your 2s. The 0 is selflessness.\nNotice that Paul writes “fruit” and not “fruits” — the original is singular. The nine are not nine skills to choose among; they are nine faces of one life. You cannot say, “I am better at joy, so I will skip patience.” They are a single cluster of grapes, growing together.\nMore importantly: fruit is borne, not wrung out. If you squeeze gentleness out of yourself, you will last three days and then snap, and snap harder than usual. The order is 0 first, then 9: be selfless, let Jesus live within, and the fruit grows from inside.\nSo the daily practice is very concrete: today, towards [this person], practise [this fruit]. Not an abstract “I want to be loving,” but “at lunch today, towards my mother, patience — when she asks a third time, I will not sigh.” Here is the truest groundwork for evangelism: people must first see the life of Christ before they can take in the teaching of Christ.","求聖靈指定一個人和一個果子。通常祂指的那一個，正是你最不想面對的那一個。":"Ask the Spirit to name one person and one fruit. Usually the one He names is exactly the one you least want to face.","我不要擰出果子，我要無己，讓基督在我裡面結出果子。":"I will not wring out fruit. I will be selfless and let Christ bear the fruit within me.","每天早上寫一句：「今天，對【 】，操練【 】。」":"Each morning write one line: “today, towards [　　], practise [　　].”","晚上寫一行回顧：今天做到了嗎？發生了什麼？（一行就好，不寫檢討報告）":"Each evening write one line of review: did I manage it, and what happened? (One line only — this is not a report.)","讀：加拉太書五章16至26節。":"Read: Galatians 5:16-26.","其中一天，選你最難相處的那位2。":"On one of the days, choose the 2 you find hardest to get along with.","第七天：回顧七天的紀錄，看看哪一個果子對你最難，把它帶到禱告中。":"Day 7: Look back over the seven records, see which fruit was hardest for you, and bring it into prayer.","陪伴者提示：這是全課程最容易落地、也最容易放棄的一課。頭兩週每天傳一句提醒給他，幫他把習慣建立起來，之後就會自己跑了。":"For companions: this is the easiest lesson in the course to put into practice and the easiest to abandon. For the first two weeks send him a one-line reminder every day. Once the habit is built, it runs by itself.","2 是屬靈同伴，3 是屬靈父母與兒女，5 是五重職份的團隊。體系從關係長出來。":"The 2 is a spiritual companion, the 3 is spiritual parents and children, the 5 is a fivefold-ministry team. The system grows out of relationships.","「有兩人便能抵擋一人。三股合成的繩子不容易折斷。」屬靈生命不是單打獨鬥的競技，是編織成繩的工程。235 就是這條繩子的三股。 2 是屬靈同伴：同輩、平行的關係，彼此扶持、彼此問責。同伴不是來糾正你的，是來讓你不必假裝的。有一個人知道你真實的光景，你就很難假冒偽善。 3 是屬靈父母與屬靈兒女：上下傳承的關係。屬靈父母不是屬靈上司——父母的目標是有一天孩子不再需要他，上司的目標是有更多人聽他的。這是分辨的關鍵。 5 是屬靈戰友：五重職份的團隊，使徒、先知、傳福音的、牧師、教師。每個人的恩賜不同，配搭起來才能成全聖徒、各盡其職、建立基督的身體。 這三種關係都有一個共同的入場券：無己。有己的人建立不了體系，因為他總在比較誰比較重要。無己才能合一，無己才能建立屬神的體系。你今天缺哪一股？多半就是主要你去主動建立的那一股。":"“Two shall withstand him, and a threefold cord is not quickly broken.” Spiritual life is not a solo contest; it is the work of weaving a rope. 235 is the three strands of that rope.\nThe 2 is a spiritual companion: a peer, a level relationship of mutual support and mutual accountability. A companion is not there to correct you; he is there so that you need not pretend. Once one person knows your true condition, hypocrisy becomes very hard.\nThe 3 is spiritual parents and spiritual children: a relationship of handing down. A spiritual parent is not a spiritual superior. A parent's goal is that one day the child will no longer need him; a superior's goal is that more people will listen to him. That is the key distinction.\nThe 5 is spiritual comrades: a fivefold-ministry team — apostle, prophet, evangelist, pastor and teacher. Each has different gifts, and only in partnership can the saints be equipped, each doing his part, building up the body of Christ.\nAll three relationships require the same ticket of entry: selflessness. A self-centred person cannot build a system, because he is always weighing who matters more. Only the selfless can be one; only the selfless can build the system that belongs to God. Which strand are you missing today? That is most likely the strand the Lord is asking you to build.","問聖靈：我的2是誰？我的3在哪裡？我在哪一個5的團隊裡？哪一股是空的？":"Ask the Spirit: who is my 2? Where is my 3? Which 5 team am I part of? Which strand is empty?","我不再單打獨鬥。我要主動去建立那條三股的繩子。":"I will no longer fight alone. I will take the initiative to build that threefold cord.","列出：我現在的屬靈同伴（2）、屬靈父母與屬靈兒女（3）、所屬的團隊（5）。":"List them: my present spiritual companions (2), spiritual parents and children (3), and the team I belong to (5).","若缺同伴，本週主動邀請一位弟兄姊妹，約定每週互相問責一次。":"If you lack a companion, invite a brother or sister this week and agree to hold each other accountable once a week.","問責五題：這週你與主如何？你有沒有隱藏的罪？你為誰禱告了？你關心了誰？你需要什麼幫助？":"Five accountability questions: how have you been with the Lord this week? Is there hidden sin? Whom have you prayed for? Whom have you cared for? What help do you need?","為你的屬靈父母寫一段感謝的話，傳給他。":"Write a paragraph of thanks to your spiritual parent and send it to him.","讀：以弗所書四章11至16節。":"Read: Ephesians 4:11-16.","陪伴者提示：這一課要具體到名字。不要讓他停在「我知道要有同伴」，要在課堂上就打開通訊錄，當場約好第一次見面的時間。":"For companions: this lesson must get down to names. Do not let him stop at “I know I need a companion.” Open the contact list during the session and fix the first meeting time then and there.","人比事重要，關係比東西重要。不要為了事而傷害人，不要為了東西破壞關係。":"People matter more than tasks; relationships matter more than things. Do not wound a person for the sake of a task, or ruin a relationship for the sake of a thing.","「你們要先求他的國和他的義，這些東西都要加給你們了。」金錢、時間、工作，本身都不是敵人，錯位才是。次序一顛倒，好東西就變成偶像。 本課只要記住兩句話：人比事重要，關係比東西重要。因此：不要為了事而傷害人，不要為了東西破壞關係。多少家庭為了一筆遺產從此不再往來，多少同工為了一次流程爭執從此不再同工——事情辦成了，人卻散了，那是虧本的生意。 金錢：你怎麼用錢，就顯出誰在你心裡作王。奉獻的意義不是神缺錢，是我用一個具體的動作宣告：這一切本來就是祢的。 時間：時間管理的本質是價值排序。當你說「我沒有時間」，多半的真相是「這件事在我的排序裡不夠前面」。誠實一點，反而好調整。 工作：工作是服事的現場，不是服事的對手。你在職場上的誠實、勤奮與不佔便宜，就是最有力的見證——同事聽你講三十分鐘的福音，不如看你三年不作假帳。":"“Seek first God's Kingdom and his righteousness, and all these things will be given to you as well.” Money, time and work are not the enemy in themselves. Misplacement is. Reverse the order and a good thing becomes an idol.\nThis lesson asks you to remember two sentences: people matter more than tasks, relationships matter more than things. Therefore: do not wound a person for the sake of a task, and do not ruin a relationship for the sake of a thing. How many families never speak again over an inheritance; how many co-workers never serve together again over one argument about procedure. The task got done and the people scattered — that is a losing trade.\nMoney: how you use money shows who reigns in your heart. Giving does not mean God is short of funds; it means I make one concrete act of declaration — all of this was Yours to begin with.\nTime: time management is really the ordering of values. When you say “I have no time,” the truth is usually “this is not far enough up my list.” Being honest about it actually makes it easier to change.\nWork: work is the venue of service, not its rival. Your honesty in the workplace, your diligence, your refusal to take advantage — these are the most powerful witness. A colleague hearing thirty minutes of gospel from you is worth less than watching you keep three years of honest books.","求聖靈照出：我最近一次為了事而傷害人，是什麼時候？為了東西而讓關係變冷，又是哪一件？":"Ask the Spirit to show you: when did I last wound a person for the sake of a task? And over which thing did a relationship grow cold?","人比事重要，關係比東西重要。我要先求神的國，其餘的交給祂加給我。":"People matter more than tasks, relationships more than things. I will seek God's Kingdom first and leave the rest for Him to add.","檢視上個月的支出，問一句：這些錢說出我心裡誰在作王？":"Review last month's spending and ask: what do these figures say about who reigns in my heart?","這週安排一次「不為了辦事」的相處——單純陪伴家人，不談正事。":"Arrange one occasion this week that is not for getting anything done — simply be with your family, with no business talk.","排出你這一季最重要的三件事，把不在其中的事勇敢地說不。":"Set out the three most important things for this quarter, and say no with courage to whatever is not among them.","在職場作一件誠實但吃虧的選擇，記下心裡的感受。":"Make one honest but costly choice at work, and record how it felt.","讀：馬太福音六章19至34節。":"Read: Matthew 6:19-34.","陪伴者提示：談錢容易讓人防衛。先分享你自己的掙扎與失敗，再問他。不要查帳，要同行。":"For companions: talk of money puts people on the defensive. Share your own struggles and failures first, then ask him. Do not audit — accompany.","服侍之路：靈、悟、命、侍、神。讓耶穌作王，讓耶穌得著一切的榮耀。":"The path of service: Spirit, understanding, life, serving, God. Let Jesus reign, and let Jesus receive all the glory.","「各人要照所得的恩賜彼此服事，作神百般恩賜的好管家。」恩賜是託付，不是勳章。管家的意思是：東西不是我的，我只是替主人管。 服事之路有五個字，是次序也是根基：靈、悟、命、侍、神。靈——聖靈是我的引導，先尋求聖靈的引導與感動；悟——聖經是我的準則，領悟並遵行聖經的真理；命——耶穌是我的榜樣，培養並活出耶穌的生命；侍——讓耶穌作王，靠祂的權柄與能力去服事；神——讓耶穌得著一切的榮耀。 多數服事的疲乏，是從第四個字直接開始的：跳過靈、悟、命，直接下去作。那是用自己的力氣作神的工，做多久就傷多久。 還有一個試驗恩賜的簡單方法：這件事作完之後，人的目光是落在你身上，還是落在耶穌身上？若人只記得你多能幹，那不是服事的成功，是服事的危險。一切都是神在耶穌裡所作成的，都是恩典；凡事謝恩，把榮耀歸給耶穌。":"“As each has received a gift, employ it in serving one another, as good managers of the grace of God.” A gift is a trust, not a medal. Being a steward means the goods are not mine; I am only managing them for the Master.\nThe path of service has five words, which are both an order and a foundation. Spirit — the Holy Spirit is my guide, so seek His leading and prompting first. Understanding — Scripture is my standard, so grasp and obey the truth of Scripture. Life — Jesus is my model, so cultivate and live out the life of Jesus. Serving — let Jesus reign, and serve by His authority and power. God — let Jesus receive all the glory.\nMost weariness in service begins straight at the fourth word: skipping Spirit, understanding and life, and going directly to doing. That is doing God's work with your own strength, and it wounds you for as long as you keep it up.\nHere is a simple test of gifting: when the work is done, do people's eyes land on you or on Jesus? If all they remember is how capable you are, that is not success in service but danger in it. Everything is what God has accomplished in Jesus; it is all grace. Give thanks in everything, and give the glory to Jesus.","問聖靈：我目前的服事，是從靈開始的，還是從侍開始的？我在服事中偷偷享受的，是主的喜悅還是人的稱讚？":"Ask the Spirit: does my present service begin at Spirit or at serving? And what am I secretly enjoying in it — the Lord's pleasure, or people's praise?","我是管家不是主人。我要靠聖靈服事，把一切榮耀歸給耶穌。":"I am the steward, not the owner. I will serve by the Spirit and give all the glory to Jesus.","盤點恩賜：問三位認識你的弟兄姊妹「你覺得神給我什麼？」把答案寫下來。":"Take stock of your gifts: ask three brothers or sisters who know you, “what do you think God has given me?” and write down their answers.","這週的每一次服事前，先安靜兩分鐘禱告，再開始。":"Before every act of service this week, be still and pray for two minutes before you begin.","作一件無名的服事，不讓任何人知道。":"Do one act of service anonymously, letting no one know.","若正在服事中疲乏，寫下原因，帶到你的屬靈父母面前談。":"If you are weary in service, write down why, and take it to your spiritual parent to talk through.","讀：羅馬書十二章1至8節、哥林多前書十二章。":"Read: Romans 12:1-8 and 1 Corinthians 12.","陪伴者提示：留意他是不是在用服事換取價值感。要幫他分清楚：他被愛，不是因為他有用。這一分辨若不處理，服事早晚會壓垮他。":"For companions: watch whether he is trading service for a sense of worth. Help him separate the two — he is loved, not because he is useful. If that distinction is left unaddressed, service will crush him sooner or later.","結業的標準不是上完了，是教過別人了。保羅、提摩太、忠心的人、別人——四代才叫體系。":"Completion is not “I finished it” but “I have taught someone else.” Paul, Timothy, faithful men, others — four generations is what makes a system.","「你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人。」這一節經文裡有四代：保羅、提摩太、忠心的人、別人。四代之後，才叫作體系。 這是整個門訓的終點，也是新的起點。我們常常只作到第二代——帶人信主，然後就停了。結果是加法的增長，不是乘法的繁殖。一百個信徒各自帶一個人，是兩百；但若每一個被帶的人都學會帶人，四代之後就是一片森林。 所以結業的標準不是「上完了」，是「教過別人了」。這一條規則，會從根本上改變一間教會的體質——因為它把每一個坐著聽的人，換成一個站起來帶的人。 你可能會說：我還不夠好。屬靈父母不是完美的人，是走在前面一步的人。你不必是博士，只要比他早走一里路，你就有東西可以交給他。而且教別人的時候，你自己會學得最多。 現在，寫下第一個名字吧。那個一直在你心裡、你卻遲遲沒有開口的名字。":"“The things you have heard from me among many witnesses, commit the same to faithful men who will be able to teach others also.” There are four generations in this one verse: Paul, Timothy, faithful men, others. Only after four generations can you call it a system.\nThis is the end of the whole discipleship course, and also a new beginning. We often get only as far as the second generation — we lead someone to Christ and then stop. The result is growth by addition, not reproduction by multiplication. A hundred believers each leading one person makes two hundred; but if every person led also learns to lead, four generations on you have a forest.\nSo completion is not “I finished it” but “I have taught someone else.” That single rule will change a church's constitution from the ground up, because it turns every person sitting and listening into a person standing and leading.\nYou may say: I am not good enough yet. A spiritual parent is not a perfect person; he is a person one step further along the road. You need not be a scholar. If you are one mile ahead of him, you have something to hand him. And when you teach another, you yourself will learn the most.\nNow write down the first name — the one that has been on your heart all this while, the one you have kept putting off.","安靜下來，求聖靈把一個名字放在你心裡——不是你覺得最容易的那個，是祂指給你的那個。":"Be still and ask the Spirit to put one name on your heart — not the one you find easiest, but the one He points to.","我要成為屬靈父母。我不再只
