 they simply do not burn incense or make offerings.","同一個節日，有人是對著墓碑說話，有人是對著神說話，然後在墓前說給家人聽。心意一樣重，方式不一樣。":"At the same festival, one person speaks to the headstone and another speaks to God, and then speaks to the family at the graveside. The heart weighs the same; the manner differs.","你們家清明通常怎麼過？我想聽聽看有沒有哪些部分是可以照樣做的。":"How does your family usually keep the festival? I would like to hear, and to see which parts could carry on just as they are.","算命與改運可以嗎？":"Is fortune-telling or changing one's luck acceptable?","聖經明確反對，不是因為迷信，而是因為那會把你的人生交給一個不愛你的東西。神要你把未來交在祂手中，祂對你的心意是好的。":"Scripture is plainly against it — not out of superstition, but because it hands your life over to something that does not love you. God wants your future placed in His hands, and His intentions towards you are good.","地圖再準，也不如有一位認得路、而且會陪你走完全程的嚮導。算命給的是一張圖，神給的是祂自己。":"However accurate a map, it is worth less than a guide who knows the road and will walk the whole of it with you. Fortune-telling offers a map; God offers Himself.","你最想知道的是未來的哪一件事？那件事背後，你真正擔心的是什麼？":"Which thing in the future do you most want to know? And behind that thing, what are you really worried about?","婚禮習俗要怎麼處理？":"How should wedding customs be handled?","大部分習俗屬於文化而非拜偶像，可以保留；涉及祭拜與求問的部分則調整。原則是：能保留的儘量保留，該堅持的溫柔堅持，事前溝通遠勝當天堅持。":"Most customs are cultural rather than idolatrous and can be kept; the parts involving offerings or divination are adjusted. The principle: keep whatever can be kept, hold gently to whatever must be held, and settle it beforehand rather than standing firm on the day.","同一場婚宴，桌數、禮金、敬酒都照舊，只是把敬拜的那一杯留給神。多數長輩在意的是被尊重，不是那個動作本身。":"At the same wedding banquet the tables, the gifts and the toasts all carry on as before; only the cup of worship is kept for God. What most elders care about is being respected, not the gesture itself.","婚禮裡哪一項是家裡長輩最堅持的？我們可以先想想那一項怎麼處理。":"Which part of the wedding do the elders in your family insist on most? Let us think that one through first.","信了以後有哪些不能做？":"What am I not allowed to do once I believe?","神不是給你一張禁令清單，是給你一個新生命。當生命變了，很多事你會自己不想再做了——不是不能，是不想。":"God does not hand you a list of prohibitions; He gives you a new life. When the life changes, there is much you will simply stop wanting to do — not may not, but would rather not.","戀愛的人不需要規定他不准跟別人曖昧，他自己就不想。愛會做規則做不到的事。":"A man in love needs no rule forbidding him to flirt elsewhere; he has no wish to. Love does what rules cannot.","你現在生活裡，有沒有哪一件事其實你自己也想戒掉，卻戒不掉？":"Is there something in your life at present that you would like to give up yourself and cannot?","婚姻與兩性的教導":"What the Bible teaches about marriage and sex","聖經對婚姻的標準很高，因為它相信婚姻承載的東西很重。它要求的不是壓抑，是委身；不是限制愛，是保護愛。":"Scripture holds a high standard for marriage because it believes marriage carries a great weight. What it asks for is not repression but commitment; it does not restrict love, it protects it.","河水沒有堤岸就成了洪水，有了堤岸才能一路奔流到海。界線不是敵人，是讓愛走得遠的東西。":"A river without banks becomes a flood; with banks it runs all the way to the sea. Boundaries are not the enemy — they are what lets love travel far.","你自己心裡覺得，一段真正好的關係，最重要的是什麼？":"In your own view, what matters most in a genuinely good relationship?","基督徒怎麼看金錢？":"How do Christians view money?","金錢是好僕人、壞主人。聖經沒有說錢是惡的，它說的是「貪財是萬惡之根」。關鍵不在你有多少，在誰在作主。":"Money is a good servant and a bad master. Scripture does not say money is evil; it says the love of money is the root of all kinds of evil. What matters is not how much you have, but who is in charge.","船在水裡沒問題，水進到船裡就出事了。錢在你手裡沒問題，錢進到你心裡才危險。":"A boat in the water is fine; water in the boat is trouble. Money in your hand is fine; money in your heart is the danger.","如果錢完全不是問題了，你最想拿人生去做什麼？":"If money were no object at all, what would you most want to do with your life?","職場的壓力與妥協怎麼辦？":"How do I handle pressure and compromise at work?","基督徒在職場不是要當糾察隊，是要當那個可以被信任的人。有些事可以彈性，有些事不能——分辨的原則是：這件事會不會傷害人、會不會需要說謊。":"A Christian at work is not there to police anyone; he is there to be the person who can be trusted. Some things allow flexibility and some do not, and the test is this: will it harm someone, and will it require a lie?","職場像一場長跑，能跑到最後的不是跑最快的人，是姿勢對的人。誠信就是那個姿勢。":"Working life is a long-distance run. The one who finishes is not the fastest but the one with the right form. Integrity is that form.","你現在最難的是哪一種壓力？是業績、人際，還是被要求做你不安心的事？":"Which pressure is hardest for you at present — targets, people, or being asked to do something your conscience cannot rest with?","每題四層：短答、經文（和合本）、比喻、反問。結尾一律「不要爭贏，要愛贏。」":"Four layers to each question: a short answer, Scripture, an analogy, and a question back. Every one ends the same way — do not win the argument, win by love.","馬太福音二十八章19節":"Matthew 28:19","所以，你們要去，使萬民作我的門徒。":"Go and make disciples of all nations.","常在我裡面的，我也常在他裡面，這人就多結果子；因為離了我，你們就不能做甚麼。":"He who remains in me and I in him bears much fruit, for apart from me you can do nothing.","哥林多前書三章6節":"1 Corinthians 3:6","我栽種了，亞波羅澆灌了，惟有神叫他生長。":"I planted. Apollos watered. But God gave the increase.","以賽亞書四十章31節":"Isaiah 40:31","但那等候耶和華的必從新得力。":"But those who wait for Yahweh will renew their strength.","詩篇一百二十六篇6節":"Psalm 126:6","那帶種流淚出去的，必要歡歡樂樂地帶禾捆回來。":"He who goes out weeping, carrying seed for sowing, will certainly come again with joy, carrying his sheaves.","路加福音十九章10節":"Luke 19:10","人子來，為要尋找、拯救失喪的人。":"For the Son of Man came to seek and to save that which was lost.","約翰福音一章12節":"John 1:12","凡接待他的，就是信他名的人，他就賜他們權柄作神的兒女。":"But as many as received him, to those who believed in his name, he gave the right to become God's children.","馬太福音九章37節":"Matthew 9:37","要收的莊稼多，做工的人少。":"The harvest indeed is plentiful, but the labourers are few.","以弗所書六章18節":"Ephesians 6:18","靠著聖靈，隨時多方禱告祈求。":"Praying at all times in the Spirit with all prayer and requests.","歌羅西書四章5至6節":"Colossians 4:5-6","你們要愛惜光陰，用智慧與外人交往。你們的言語要常常帶著和氣。":"Walk in wisdom toward those who are outside, redeeming the time. Let your speech always be with grace.","腓立比書四章13節":"Philippians 4:13","我靠著那加給我力量的，凡事都能做。":"I can do all things through Christ who strengthens me.","箴言十一章30節":"Proverbs 11:30","有智慧的，必能得人。":"He who is wise wins souls.","使徒行傳一章8節":"Acts 1:8","但聖靈降臨在你們身上，你們就必得著能力，並要在……直到地極，作我的見證。":"But you will receive power when the Holy Spirit has come upon you, and you will be witnesses to me… to the uttermost parts of the earth.","馬可福音十六章15節":"Mark 16:15","你們往普天下去，傳福音給萬民聽。":"Go into all the world and preach the Good News to the whole creation.","約翰福音十三章35節":"John 13:35","你們若有彼此相愛的心，眾人因此就認出你們是我的門徒了。":"By this everyone will know that you are my disciples, if you have love for one another.","羅馬書十章14節":"Romans 10:14","然而，人未曾信他，怎能求他呢？未曾聽見他，怎能信他呢？":"How then will they call on him in whom they have not believed? And how will they believe in him whom they have not heard?","不但願意將神的福音給你們，連自己的性命也願意給你們。":"We were well pleased to impart to you not only the Good News of God, but also our own souls.","詩篇一百二十七篇1節":"Psalm 127:1","若不是耶和華建造房屋，建造的人就枉然勞力。":"Unless Yahweh builds the house, they who build it labour in vain.","瑪拉基書三章16節":"Malachi 3:16","且有紀念冊在他面前，記錄那敬畏耶和華、思念他名的人。":"A book of memory was written before him, for those who feared Yahweh and who honoured his name.","以西結書三十六章26節":"Ezekiel 36:26","我也要賜給你們一個新心，將新靈放在你們裡面。":"I will also give you a new heart, and I will put a new spirit within you.","彼得後書三章9節":"2 Peter 3:9","主……不願有一人沉淪，乃願人人都悔改。":"The Lord is… not wishing that any should perish, but that all should come to repentance.","他願意跟你說心裡的事":"He is willing to tell you what is on his mind","許多福音行動失敗在這裡：太快切入主題，對方覺得自己是「目標」不是「朋友」。人比事重要，關係比東西重要。這個階段唯一的任務，是讓他確定「你是真的關心我，不是要我信什麼」。":"Many evangelistic efforts fail right here: the subject is raised too soon and the other person feels like a target rather than a friend. People matter more than tasks, relationships more than things. Your only task at this stage is to convince him: you really do care about me, you are not after my conversion.","記住並主動關心他的重要日子與難處":"Remember his important dates and difficulties, and ask after them without being prompted","在他有需要時真的出現、真的幫忙":"Actually turn up and actually help when he is in need","為他每日禱告，一天不斷":"Pray for him daily, without missing a day","傳一則問候，不提任何信仰的事":"Send one message just to say hello, with nothing about faith in it","記下他最近的一個難處，這週為這件事禱告":"Note one difficulty he has at the moment, and pray for it this week","找一件小事實際幫他一次":"Find one small thing and actually help him with it","問他一個關於生活的開放問題（見破冰問題）":"Ask him one open question about his life (see the ice-breaker questions)","他主動問起信仰的事":"He asks about faith of his own accord","撒種不是講道理，是分享「發生在我身上的事」。最有力量的不是「聖經說」，是「上個月我遇到一件事」。目標是把信仰從禁忌話題變成正常話題。":"Sowing is not arguing a case; it is sharing what happened to me. The most powerful opening is not “the Bible says” but “something happened to me last month.” The aim is to move faith from a forbidden topic to an ordinary one.","分享個人的三分鐘見證（不談教義，只談改變）":"Share your personal three-minute testimony (no doctrine, only what changed)","在合適時機邀請他一起吃飯、聽詩歌、看短片":"At a suitable moment, invite him to share a meal, hear some music, or watch a short film","分享一段適合他處境的金句":"Share a verse that fits the situation he is in","邀請他參加低門檻的活動（不是主日崇拜）":"Invite him to something easy to walk into (not the Sunday service)","分享你見證裡的一小段，不用講完":"Share one small part of your testimony; you need not finish it","傳一張適合他現在處境的金句給他":"Send him a verse that fits where he is right now","邀他吃一頓飯，不談信仰也沒關係":"Invite him for a meal; it is fine if faith never comes up","跟他說一句：我最近有為你禱告":"Tell him one thing: I have been praying for you lately","他願意讀經、禱告或來聚會":"He is willing to read Scripture, to pray, or to come to a gathering","這是最多人退卻的階段，因為會被問倒。但要記得：他問問題，代表他在意。回答的原則是「先接住情緒，再處理問題」。很多疑問底下藏的不是理性難題，是一段受傷的經歷。":"This is where most people retreat, because they get stumped. But remember: his questions mean he cares. The principle for answering is catch the feeling first, then handle the question. What hides under many questions is not an intellectual difficulty but a wounded experience.","分辨這是「知識的問題」還是「心裡的傷」":"Discern whether this is a question of knowledge or a wound of the heart","誠實承認自己不懂的部分，一起去找答案":"Honestly admit what you do not know, and go looking for the answer together","邀他一起讀一卷福音書（約翰福音或路加福音）":"Invite him to read a Gospel with you (John or Luke)","處理具體攔阻：家人反對、拜祖先、時間、罪的捆綁":"Deal with the concrete obstacles: family objection, ancestral offerings, time, the grip of sin","問他：你會這樣想，是因為遇過什麼事嗎？":"Ask him: did something happen that made you think this way?","去疑問解答庫找一題，先自己讀熟":"Find the matching question in the answer library and know it well yourself first","邀他一起讀約翰福音，一天一小段":"Invite him to read John with you, a short passage a day","老實跟他說：這題我也不確定，我們一起找答案":"Tell him plainly: I am not sure about this one either; let us find the answer together","他親口承認耶穌是主":"He confesses with his own mouth that Jesus is Lord","決志不是話術的成功，是聖靈的工作。我們的責任是把福音講清楚，並且勇敢地發出邀請。很多人一輩子沒信主，只因為從來沒有人正式邀請過他。":"A commitment is not the success of a technique; it is the work of the Holy Spirit. Our responsibility is to make the gospel clear and to give the invitation courageously. Many people never come to Christ simply because nobody ever formally asked them.","用五幕結構完整講一次福音":"Tell the gospel through once in full, using the five acts","誠實說明信主的代價與福分":"Name honestly both the cost of believing and the blessing","發出明確的邀請：「你願意現在接受嗎？」":"Give a clear invitation: “would you be willing to receive Him now?”","帶領決志禱告，並立刻約好下一次見面":"Lead the prayer of commitment, and fix the next meeting immediately","先禱告，然後約一個能好好談的時間":"Pray first, then arrange a time when you can talk properly","把五幕福音先自己讀一遍":"Read the five-act gospel through once yourself first","誠實跟他說福分，也說代價":"Tell him honestly about the blessing, and about the cost","鼓起勇氣問那一句：你願意現在接受嗎？":"Take courage and ask the one question: would you be willing to receive Him now?","受洗，並融入一個群體":"Baptised, and settled into a community","決志後的三十天是黃金期也是危險期。一個人若在六週內沒有交到三個教會的朋友，流失的機率極高。所以這個階段的重點不是課程，是「關係的移植」。":"The thirty days after a commitment are both the golden window and the danger zone. If someone makes no three friends in the church within six weeks, the chance of losing him is very high. So what matters at this stage is not the curriculum but the transplanting of relationships.","決志後四十八小時內第一次跟進":"Make the first follow-up within forty-eight hours of the commitment","帶他認識至少三位弟兄姊妹":"Introduce him to at least three brothers and sisters","陪他上完慕道班八課":"Walk with him through all eight lessons of the Seeker Class","陪他預備受洗見證，出席他的受洗":"Help him prepare his baptism testimony, and be there on the day","今天就傳訊息給他，不要等":"Send him a message today; do not wait","約好這週介紹一位弟兄姊妹給他":"Arrange to introduce one brother or sister to him this week","陪他上慕道班的下一課":"Sit with him through the next Seeker Class lesson","問他：關於受洗，你心裡有什麼想法？":"Ask him: what are your thoughts about baptism?","生活有改變，能自己靈修":"His life is changing and he can keep his own devotions","受洗是起點不是終點。這個階段要把「先生命、再關係、後事工」的次序建造進去，並且完成從「舊人有己」到「新人無己」的觀念轉換。":"Baptism is the starting line, not the finish. At this stage the order — life first, then relationships, then ministry — must be built in, and the shift from the old self-centred man to the new selfless man must be completed.","每週一次一對一，持續三個月":"One-to-one once a week for three months","教他讀經、禱告、記錄":"Teach him to read, to pray, and to record","陪他處理生命中的具體難題":"Work through the concrete difficulties of his life with him","示範給他看：帶他一起去關心別人":"Show him how: take him along to care for someone else","約這週的一對一時間":"Fix this week's one-to-one time","問他這週靈修讀到什麼":"Ask him what he read in his devotions this week","帶他一起去關心另一個人":"Take him with you to care for another person","陪他處理他現在最卡住的那件事":"Work through the thing he is most stuck on right now","他開始陪伴他自己的一個 2":"He has begun walking with a 2 of his own","這是最容易被忽略、卻決定一切的一步。若不繁殖，一切努力只是加法。真正的成功，是他不再需要你，並且開始有他自己的名單。":"This is the step most easily overlooked and the one that decides everything. Without reproduction, all the effort is only addition. Real success is that he no longer needs you and has begun a list of his own.","把你會的教給他，然後讓他去做":"Teach him what you know, and then let him do it","在旁邊支持，但不代替他做":"Support from the side, but do not do it for him","為他的屬靈兒女一同禱告":"Pray together for his spiritual children","問他：你心裡有沒有想帶的人？":"Ask him: is there someone on your heart you would like to lead?","陪他寫下他的第一張名單（三個名字）":"Sit with him as he writes his first list (three names)","讓他講一次福音給你聽，你只聽不改":"Have him tell you the gospel once; only listen, do not correct","為他的第一個 2 一起禱告":"Pray together for his first 2","我記錄他，是為了更好地愛他，不是為了管理他。":"I keep a record of him in order to love him better, not to manage him.","我絕不把他的私事告訴不相干的人，包括在代禱時。":"I will never tell his private business to anyone with no part in it, not even in prayer requests.","我尊重他的自由，他有權利說不，也有權利慢慢來。":"I respect his freedom. He has the right to say no, and the right to take his time.","我不把人數當成績。一個靈魂比一百個數字寶貴。":"I will not treat numbers as results. One soul is worth more than a hundred figures.","我知道使人重生的是聖靈，不是我。我只負責忠心。":"I know it is the Holy Spirit who gives new birth, not me. My part is only to be faithful.","見面":"Met","電話":"Phoned","訊息":"Messaged","一起吃飯":"Shared a meal","來聚會":"Came to a gathering","為他禱告":"Praying for him","開放":"Open","平常":"Ordinary","抗拒":"Resistant","家人":"Family","同事":"Colleague","朋友":"Friend","鄰居":"Neighbour","同學":"Classmate","其他":"Other","職場":"Workplace","處境":"Circumstances","屬靈":"Spiritual","自己":"Yourself","為配偶得救":"For a spouse to be saved","主啊，祢知道我心裡最深的掛念。我把我的另一半交在祢手中。 求祢挪去他心裡的攔阻，軟化那些年日累積的剛硬；求祢差人到他身邊，用他聽得懂的方式對他說話。 主，也求祢先改變我。不要讓我用嘮叨代替愛，不要讓我用比較代替接納。求祢讓他從我身上先看見基督的溫柔。 我不知道還要等多久，但我願意等。奉主耶穌的名禱告，阿們。":"Lord, You know the deepest concern of my heart. I place the one I married into Your hands.\nTake away what stands in the way inside him; soften the hardness that the years have laid down. Send someone to his side who will speak to him in words he can understand.\nLord, change me first. Do not let me substitute nagging for love, or comparison for acceptance. Let him see the gentleness of Christ in me before anything else.\nI do not know how long the wait will be, but I am willing to wait. In the name of the Lord Jesus I pray. Amen.","為父母得救":"For parents to be saved","天父，謝謝祢把我放在這個家。 我為我的父母來到祢面前。他們養育我一生，我卻還沒能把最好的給他們。求祢憐憫他們，在他們年日漸長的時候，開他們的心眼。 求祢賜我智慧，知道什麼時候該說、什麼時候該安靜；求祢讓我的孝順先讓他們看見這位神是真的。 主，時間不多了，求祢加快祢的工作。奉主耶穌的名禱告，阿們。":"Father, thank You for placing me in this family.\nI come before You for my parents. They raised me all my life, and I have still not given them the best thing of all. Have mercy on them, and as their years grow long, open the eyes of their hearts.\nGive me wisdom to know when to speak and when to be quiet. Let my devotion to them show them first that this God is real.\nLord, there is not much time. Hasten Your work. In the name of the Lord Jesus I pray. Amen.","為兒女得救":"For children to be saved","主啊，這孩子本來就是祢賜的。 我把他交還給祢。求祢保守他不走偏路，在他心裡放下對祢的渴慕；在他最需要的時候，讓他想起小時候聽過的那些話。 求祢讓我作一個他願意親近的父母，不用權柄壓他，用生命吸引他。 主，求祢自己得著他。奉主耶穌的名禱告，阿們。":"Lord, this child was Your gift in the first place.\nI hand him back to You. Keep him from wandering off the road; plant a longing for You in his heart; and when his need is greatest, bring back to his mind the words he heard as a child.\nMake me a parent he is willing to come close to — not pressing him with authority, but drawing him with a life.\nLord, take hold of him Yourself. In the name of the Lord Jesus I pray. Amen.","為手足與親戚":"For brothers, sisters and relatives","天父，我為我的家人來到祢面前。 我們之間有太多陳年的心結，有些話說了會傷，不說又隔著。求祢先醫治我心裡的苦毒，讓我先跨出去。 求祢預備合適的時機，讓福音藉著一頓飯、一次探望自然地進到他們心裡。 奉主耶穌的名禱告，阿們。":"Father, I come before You for my family.\nThere are too many old knots between us. Some things wound if said and keep us apart if unsaid. Heal the bitterness in me first, and let me be the one to step across.\nPrepare the right moment, and let the gospel come into their hearts naturally, through a meal or a visit.\nIn the name of the Lord Jesus I pray. Amen.","為同事得救":"For a colleague to be saved","主啊，祢把我放在這間公司不是偶然的。 求祢讓我在工作上作一個值得信任的人，讓我的誠實與從容成為一段無聲的見證。 我特別為【某某】禱告，求祢挪去他心裡的重擔，賜我一個開口的機會，也賜我合宜的話語。 奉主耶穌的名禱告，阿們。":"Lord, it was no accident that You placed me in this company.\nMake me someone who can be trusted at work, and let my honesty and my calm be a witness that needs no words.\nI pray especially for [name]. Lift the weight from his heart, give me an opening to speak, and give me the right words.\nIn the name of the Lord Jesus I pray. Amen.","為主管與同業":"For managers and those in my trade","天父，求祢賜我一顆順服而不諂媚、正直而不驕傲的心。 我為我的主管禱告，求祢祝福他的家庭與健康。求祢讓我不論他怎麼待我，都能以善報之。 求祢使我在職場作光作鹽，不是靠口才，是靠生命。奉主耶穌的名禱告，阿們。":"Father, give me a heart that submits without flattering and is upright without pride.\nI pray for my manager. Bless his family and his health. However he treats me, let me return good for it.\nMake me salt and light in my workplace — not by eloquence, but by a life. In the name of the Lord Jesus I pray. Amen.","為多年好友":"For a long-standing friend","主啊，我們認識這麼多年，我卻一直沒能把最重要的事告訴他。 求祢赦免我的膽怯。求祢預備他的心，也預備我的口。 讓我們的友誼不因為信仰而變得尷尬，反而因為信仰更深。奉主耶穌的名禱告，阿們。":"Lord, we have known each other all these years, and I have still never told him the thing that matters most.\nForgive my cowardice. Prepare his heart, and prepare my mouth.\nLet our friendship not turn awkward because of faith, but grow deeper because of it. In the name of the Lord Jesus I pray. Amen.","為鄰舍":"For neighbours","天父，謝謝祢把這些人放在我身邊。 求祢讓我成為一個好鄰舍——記得他們的名字，在他們需要時真的出現。 求祢藉著日常的小事，讓他們看見基督的樣式。奉主耶穌的名禱告，阿們。":"Father, thank You for placing these people around me.\nMake me a good neighbour — one who remembers their names and actually turns up when they are in need.\nThrough the small things of ordinary days, let them see the likeness of Christ. In the name of the Lord Jesus I pray. Amen.","為病痛中的人":"For someone who is ill","主耶穌，祢在世上的時候醫治了許多人，祢的心腸沒有改變。 我為【某某】的身體禱告，求祢親自摸他，減輕他的疼痛，賜他安穩的睡眠，也堅固照顧他的家人。 若祢還沒有醫治，求祢讓他在病中先遇見祢。奉主耶穌的名禱告，阿們。":"Lord Jesus, when You walked on earth You healed many, and Your heart has not changed.\nI pray for [name]'s body. Touch him Yourself, ease his pain, give him settled sleep, and strengthen the family caring for him.\nAnd if You have not yet healed him, let him meet You first in the illness. In the name of the Lord Jesus I pray. Amen.","為喪親的人":"For the bereaved","天父，祢是安慰人的神。 我為正在失去至親的【某某】禱告。求祢不用道理安慰他，用祢的同在抱住他。 求祢讓他在最黑的夜裡，知道有一雙手一直沒有放開。奉主耶穌的名禱告，阿們。":"Father, You are the God who comforts.\nI pray for [name], who is losing someone dear. Do not comfort him with explanations; hold him with Your presence.\nIn the darkest of the night, let him know there is a hand that has never let go. In the name of the Lord Jesus I pray. Amen.","為失業與經濟壓力":"For unemployment and financial pressure","主啊，祢知道他現在的難處。 求祢開路，賜下合適的工作與供應；也求祢在等待的日子裡，保守他的尊嚴與盼望。 求祢讓我知道可以實際幫上什麼，而不只是說些好聽的話。奉主耶穌的名禱告，阿們。":"Lord, You know the strait he is in.\nOpen a way; provide the right work and the supply he needs. And through the days of waiting, guard his dignity and his hope.\nShow me what I can actually do to help, rather than only saying pleasant things. In the name of the Lord Jesus I pray. Amen.","為婚姻困難的人":"For a marriage in difficulty","天父，求祢憐憫這個家。 求祢先軟化兩顆剛硬的心，讓他們願意停下爭辯，開始聽對方說話。 求祢賜下饒恕的能力，那是人做不到而祢做得到的事。奉主耶穌的名禱告，阿們。":"Father, have mercy on this home.\nSoften the two hard hearts first, so that they are willing to stop arguing and begin to hear each other.\nGive them the power to forgive — the thing people cannot do and You can. In the name of the Lord Jesus I pray. Amen.","為憂鬱與失眠的人":"For those with depression and sleeplessness","主啊，他很累了。 求祢賜他今晚一夜好眠，賜他明天早上一點點力氣。求祢除去他心裡那個譴責自己的聲音。 也求祢預備合適的醫治管道與願意陪伴的人。奉主耶穌的名禱告，阿們。":"Lord, he is very tired.\nGive him one night of good sleep tonight, and a little strength for tomorrow morning. Take away the voice inside that condemns him.\nAnd prepare the right avenues of healing, and people willing to walk with him. In the name of the Lord Jesus I pray. Amen.","為捆綁與癮的人":"For those in bondage","主耶穌，祢說祢來是要釋放被擄的。 我奉祢的名為【某某】禱告，求祢斷開那些綑綁他的鎖鏈，賜他新的意志與新的渴望。 求祢賜下扶持他的群體，讓他不用一個人對抗。奉主耶穌的名禱告，阿們。":"Lord Jesus, You said You came to set the captives free.\nIn Your name I pray for [name]. Break the chains that bind him, and give him a new will and new desires.\nProvide a community to hold him up, so that he does not have to fight alone. In the name of the Lord Jesus I pray. Amen.","為剛硬的心":"For a hardened heart","主啊，我已經為他禱告很久了，看不出什麼改變。 求祢除掉他的石心，賜他肉心。求祢用祢的方法，不是我的方法。 也求祢保守我不灰心，讓我記得：使人重生的是聖靈，我只負責忠心。奉主耶穌的名禱告，阿們。":"Lord, I have prayed for him a long time and I can see no change.\nTake away his heart of stone and give him a heart of flesh. Do it Your way, not mine.\nAnd keep me from losing heart. Let me remember that it is the Holy Spirit who gives new birth, and my part is only to be faithful. In the name of the Lord Jesus I pray. Amen.","為決志前的預備":"As a commitment draws near","天父，我感覺祢正在他心裡動工。 求祢預備那個時刻，也預備我的口。不讓我急躁催逼，也不讓我因膽怯錯過。 求聖靈在那一刻親自感動他，讓他自己願意開口。奉主耶穌的名禱告，阿們。":"Father, I sense that You are at work in his heart.\nPrepare the moment, and prepare my mouth. Do not let me press him in my impatience, nor miss it through cowardice.\nAt that moment let the Holy Spirit move him Himself, so that he is willing to speak. In the name of the Lord Jesus I pray. Amen.","為初信者站立得穩":"For a new believer to stand firm","主啊，謝謝祢，他信了。 求祢保守他這株剛發芽的苗，抵擋隨之而來的攪擾與試探。 求祢在六週之內，賜給他三位真心的屬靈朋友。奉主耶穌的名禱告，阿們。":"Lord, thank You — he has believed.\nGuard this newly sprouted shoot against the disturbance and testing that will follow.\nWithin six weeks, give him three genuine spiritual friends. In the name of the Lord Jesus I pray. Amen.","為受洗預備":"In preparation for baptism","天父，這是一個公開歸屬祢的日子。 求祢賜他勇氣面對家人的眼光，賜他清楚的見證，賜他一顆歡喜的心。 求祢使這一天成為他一生的錨。奉主耶穌的名禱告，阿們。":"Father, this is a day of belonging to You in the open.\nGive him courage under the gaze of his family, give him a clear testimony, and give him a glad heart.\nMake this day the anchor of his life. In the name of the Lord Jesus I pray. Amen.","陪伴者的每日禱告":"A companion's daily prayer","主啊，在我去愛人之前，求祢先充滿我。 我承認我常常想靠自己的口才、自己的方法。求祢除去我的有己，讓耶穌在我裡面活。 今天，求祢讓我對【某某】結出聖靈的果子；不是我努力做好人，是祢在我裡面活。 讓耶穌作王，讓耶穌得著一切的榮耀。奉主耶穌的名禱告，阿們。":"Lord, before I go out to love anyone, fill me first.\nI admit I often want to rely on my own eloquence and my own methods. Take away my self, and let Jesus live in me.\nToday, let me bear the fruit of the Spirit towards [name] — not me trying hard to be good, but You living within me.\nLet Jesus reign, and let Jesus receive all the glory. In the name of the Lord Jesus I pray. Amen.","灰心時的禱告":"A prayer for when heart fails","主啊，我有點撐不住了。 我看不見果效，也懷疑自己是不是做錯了什麼。求祢提醒我：我栽種、亞波羅澆灌，惟有祢叫他生長。 求祢把喜樂還給我，讓我單單為著祢，不為著結果。 我願意繼續忠心。奉主耶穌的名禱告，阿們。":"Lord, I am not sure I can hold up much longer.\nI see no results, and I wonder whether I have done something wrong. Remind me: I planted, Apollos watered, but You gave the increase.\nGive me back my joy, and let me do this for You alone and not for the outcome.\nI am willing to go on being faithful. In the name of the Lord Jesus I pray. Amen.","哥林多前書十三章4節":"1 Corinthians 13:4","愛是恆久忍耐，又有恩慈。":"Love is patient and is kind.","腓立比書四章4節":"Philippians 4:4","你們要靠主常常喜樂。我再說，你們要喜樂。":"Rejoice in the Lord always! Again I will say, rejoice!","雅各書五章7節":"James 5:7","弟兄們哪，你們要忍耐，直到主來。":"Be patient therefore, brothers, until the coming of the Lord.","並要以恩慈相待，存憐憫的心。":"And be kind to one another, tender hearted.","加拉太書六章10節":"Galatians 6:10","有了機會就當向眾人行善。":"As we have opportunity, let's do what is good toward all men.","路加福音十六章10節":"Luke 16:10","人在最小的事上忠心，在大事上也忠心。":"He who is faithful in a very little is faithful also in much.","馬太福音十一章29節":"Matthew 11:29","我心裡柔和謙卑，你們當負我的軛，學我的樣式。":"Take my yoke upon you and learn from me, for I am gentle and lowly in heart.","箴言二十五章28節":"Proverbs 25:28","人不制伏自己的心，好像毀壞的城邑沒有牆垣。":"Like a city that is broken down and without walls is a man whose spirit is without restraint.","仁愛不是有感覺才去愛，是決定去愛。對那個難愛的人，仁愛是主動邁出的那一步。":"Love is not loving once the feeling arrives; it is deciding to love. Towards the person who is hard to love, love is the step you take first.","今天為他做一件他不知道是你做的事。":"Today, do something for him that he will never know you did.","喜樂不靠環境，靠與主同在。環境給的是快樂，主給的是喜樂。":"Joy does not rest on circumstances but on being with the Lord. Circumstances give happiness; the Lord gives joy.","今天跟他分享一件讓你感謝的小事。":"Today, share with him one small thing you are thankful for.","和平不是沒有衝突，是在衝突裡不失去裡面的安穩。無己的人不需要贏，所以能和平。":"Peace is not the absence of conflict but keeping your inner steadiness within it. The selfless do not need to win, and so they can be at peace.","今天有一次可以爭的機會，選擇不爭。":"Today, when a chance to contend comes, choose not to.","忍耐是把時間交給神。你已經等了很久，那是因為神看見的比你長遠。":"Patience is handing the timing to God. You have waited a long while because God sees further than you do.","今天不催他任何事，只是問候他。":"Today, press him for nothing at all — simply ask how he is.","恩慈是在他不值得的時候仍然待他好。那正是神待我們的方式。":"Kindness is treating him well when he does not deserve it. That is exactly how God treats us.","今天說一句肯定他的話，具體到一件事。":"Today, say one affirming thing to him, about one specific matter.","良善是即使沒有人看見也照樣做對的事。良善是無己最安靜的樣子。":"Goodness is doing the right thing when nobody is watching. Goodness is selflessness at its quietest.","今天做一件沒有人會知道的好事。":"Today, do one good thing that nobody will ever know about.","信實是說到做到。在一個人人失信的世代，準時與守約本身就是見證。":"Faithfulness is doing what you said. In an age when everyone breaks their word, being on time and keeping an appointment is itself a witness.","今天把一件答應過他卻沒做的事完成。":"Today, finish something you promised him and never did.","溫柔不是軟弱，是有力量卻選擇不用。溫柔是把權力放下，回到本位。":"Gentleness is not weakness; it is having the strength and choosing not to use it. Gentleness is laying power down and returning to your place.","今天用最柔和的語氣跟他說話，特別是意見不同的時候。":"Today, speak to him in your gentlest tone, especially where you disagree.","節制是讓耶穌作王的具體樣子——不是我控制不住，是我把主權交出去了。":"Self-control is what letting Jesus reign actually looks like — not that I cannot control myself, but that I have handed the rule over.","今天在他面前少說一半的話，多聽一倍。":"Today, say half as much in his presence and listen twice as much.","第一天：恭喜與陪伴":"Day 1: Congratulate him, and be there","讓他知道昨天發生的事是真的，而且你在。":"Let him know that what happened yesterday was real, and that you are here.","今天怎麼樣？我一早就想到你。 昨天你做的那個決定，是你一生最重要的一件事，我為你高興。 我想告訴你一件事：接下來幾天你可能會覺得沒什麼特別，也可能會有些混亂，這都很正常。得救不是靠感覺，是靠神的應許。 （一起讀約翰福音一章12節） 這禮拜我們找一天吃個飯好嗎？":"How are you today? You were on my mind first thing this morning.\nThe decision you made yesterday is the most important thing in your life, and I am glad for you.\nThere is one thing I want to tell you: over the next few days you may feel nothing special, or you may feel rather confused. Both are completely normal. Being saved does not rest on feelings; it rests on God's promise.\n(Read John 1:12 together.)\nShall we find a day this week to have a meal?","第三天：教他禱告":"Day 3: Teach him to pray","讓禱告從第一次開始，而不是等他自己摸索。":"Start prayer from the very first time, rather than leaving him to work it out alone.","我想教你一件很簡單的事——怎麼跟神說話。 不用文謅謅，不用跪，開車、洗碗、睡前都可以。就四件事：謝謝、對不起、求祢幫某某人、我自己的需要。 我先禱告一次給你聽，然後換你，一句就好。":"I want to teach you something very simple — how to talk with God.\nNo elegant phrasing, no kneeling. You can do it driving, washing dishes, or before you sleep. Just four things: thank You, I am sorry, please help so-and-so, and my own needs.\nI will pray once for you to hear, and then it is your turn. One sentence is enough.","第七天：教他讀經":"Day 7: Teach him to read the Bible","解決「翻不到書卷」這個最現實的障礙。":"Solve the most practical obstacle of all: not being able to find the books.","我帶了一本聖經給你。 我們從約翰福音開始，一天讀一小段就好，讀不懂的先跳過。 每天問三個問題：這段講神是怎樣的？講人是怎樣的？今天我要做什麼？ （現場陪他讀完第一段）":"I have brought you a Bible.\nWe will begin with John, a short passage a day, and skip whatever you cannot understand.\nAsk three questions each day: what does this say God is like? What does it say man is like? What am I to do today?\n(Read the first passage through with him there and then.)","第十四天：介紹朋友":"Day 14: Introduce him to friends","關係的移植。六週內三個朋友，是留下來的關鍵。":"Transplanting relationships. Three friends within six weeks is what decides whether he stays.","這禮拜聚會我想介紹幾個朋友給你認識。 他們也都是普通人，有的信很久，有的跟你差不多。 （事先跟那三位講好，請他們主動來打招呼、記住他的名字）":"At the gathering this week I would like to introduce you to a few friends.\nThey are ordinary people too — some have believed a long time, some are at much the same stage as you.\n(Arrange with those three beforehand: ask them to come over, greet him, and remember his name.)","第二十一天：面對第一波攪擾":"Day 21: Facing the first wave of disturbance","預先處理家人反對、懷疑與生活不順。":"Get ahead of family objections, doubts, and things going wrong.","這三個禮拜有沒有遇到什麼卡住的事？家裡有人說什麼嗎？ （先聽完，不急著給答案） 這很正常，幾乎每個人都會遇到。我當時是這樣（分享你自己的經驗）。 我們一起為這件事禱告好嗎？":"Has anything got stuck these three weeks? Has anyone at home said something?\n(Hear him out first; do not rush to answer.)\nThat is completely normal — nearly everyone runs into it. For me it was like this. (Share your own experience.)\nShall we pray about it together?","第三十天：談受洗":"Day 30: Talking about baptism","把公開的委身放上桌面。":"Put public commitment on the table.","滿一個月了，我想跟你談一件事——受洗。 受洗不是入會，是公開表明：舊的我跟主一起埋葬了，新的我跟主一起活。 不用急著決定，但我想先讓你知道這件事。 如果你有意願，我陪你準備見證，也陪你跟家人談。":"It has been a month, and there is something I would like to talk about — baptism.\nBaptism is not joining a club. It is a public declaration: the old me was buried with the Lord, and the new me is alive with Him.\nThere is no hurry to decide, but I wanted you to know about it.\nIf you would like to, I will help you prepare your testimony and be with you when you talk to your family.","他不回我訊息，我還要繼續嗎？":"He does not reply to my messages. Should I keep going?","先確認你傳的是「關心」還是「邀請」。多數人不回，是因為感覺自己被當成一個要被完成的項目。停止傳資料，改成問一句「最近好嗎」，然後真的等他回。若還是沒回，就安靜地為他禱告，等下一個自然的時機——生日、生病、換工作，都是門重新打開的時候。":"First check whether what you are sending is care or an invitation. Most people do not reply because they feel like an item on someone's to-do list. Stop sending material; ask instead, “how have you been?” and then actually wait for him. If there is still no reply, pray for him quietly and wait for the next natural opening — a birthday, an illness, a change of job. Each of these is a moment when the door opens again.","他決志後就消失了，怎麼辦？":"He disappeared after committing. What now?","先不要自責，也不要下結論說他是假的。決志後最常見的斷點是「沒有人在四十八小時內出現」。現在能做的是重新接觸，但不要提屬靈的事，只約吃飯。關係接回來了，門才會再開。":"Do not blame yourself, and do not conclude that it was not real. The commonest break after a commitment is that nobody appeared within forty-eight hours. What you can do now is make contact again — but say nothing spiritual, just arrange a meal. Once the relationship is rejoined, the door will open again.","他家人強烈反對，我該不該退？":"His family objects strongly. Should I back off?","不要正面對抗家人，那會讓他兩面為難。你要做的是讓他家人看見你是個好人——逢年過節問候一聲，見面客氣有禮。多數反對其實是害怕失去，不是討厭信仰。":"Do not confront the family head-on; that puts him between two fires. What you should do is let his family see that you are a good person — a greeting at the festivals, courtesy when you meet. Most objection is really fear of losing him, not dislike of the faith.","我被他問倒了，覺得很丟臉。":"He stumped me and I felt humiliated.","「我不知道，我回去查，下次告訴你」是一個非常有力的回答。它比硬掰更贏得尊重。而且它給了你們下一次見面的理由。":"“I do not know. I will look into it and tell you next time” is a very strong answer. It earns more respect than bluffing, and it gives you a reason to meet again.","我為他禱告好幾年了，一點動靜也沒有。":"I have prayed for him for years with no sign of anything.","禱告不是投幣機。你這幾年的忠心，神一次都沒有漏掉。奧古斯丁的母親禱告了三十一年。你可以老實跟神說你累了——祂受得住，而且祂會扶你。":"Prayer is not a coin machine. Not one of your faithful years has escaped God's notice. Augustine's mother prayed for thirty-one years. You may tell God honestly that you are tired — He can bear it, and He will hold you up.","他信了別的宗教，還很虔誠。":"He has taken up another religion, and is devout in it.","不要攻擊他的信仰，那只會關上門。改成問他：你在那裡得著了什麼？聽他說。然後在合適的時候分享你自己得著的。比較很容易讓人防衛，見證卻不會。":"Do not attack his faith; that only closes the door. Ask instead, “what have you found there?” and listen. Then, at the right moment, share what you have found. Comparison puts people on the defensive; testimony does not.","我覺得自己不夠格傳福音，我自己都做不好。":"I do not feel qualified to share the gospel — I cannot even manage it myself.","沒有人夠格，這就是重點。你不是在推銷一個你已經完成的成品，你是在告訴人你在哪裡找到了醫生。乞丐告訴另一個乞丐哪裡有麵包，不需要先變成麵包店老闆。":"Nobody is qualified — that is the whole point. You are not selling a finished product; you are telling someone where you found the doctor. One beggar telling another where the bread is does not first have to own the bakery.","他一直說「我再想想」，已經好幾年了。":"He keeps saying he will think about it — and has for years.","有時候「再想想」不是理性的猶豫，是情感上還沒準備好放下控制權。不要一直催，改成問：如果你有一天真的要信，你覺得最難放下的是什麼？那個答案才是真正的攔阻。":"Sometimes “I will think about it” is not intellectual hesitation but an unreadiness to let go of control. Stop pressing, and ask instead: if one day you really did believe, what do you think would be hardest to give up? That answer is the real obstacle.","我陪的人比別人少，覺得很挫折。":"I walk with fewer people than others do, and it discourages me.","這正是我們刻意不做排行榜的原因。神量的是忠心，不是數量。一個靈魂比一百個數字寶貴，而你不會知道，你手上這一位將來會帶出多少人。":"This is exactly why we deliberately keep no leaderboard. God measures faithfulness, not quantity. One soul is worth more than a hundred figures, and you have no way of knowing how many the one in your hands will one day lead.","我發現我在心裡把他當成一個「案子」。":"I have realised I think of him as a case.","願意察覺這一點，本身就是聖靈的工作。停下來禱告，把他的名字重新交給神，並且問自己一句話：這個月，我更愛他了嗎？必要時，先放下記錄，只是去見他一面。":"Being willing to notice that is itself the work of the Holy Spirit. Stop and pray, hand his name back to God, and ask yourself one question: this month, do I love him more? If need be, put the records aside and simply go and see him.","可與對方同看螢幕，一頁一個重點，大字大圖。":"Share the screen together — one point per page, large type, large images.","等車、排隊、飯後閒聊都能講完的口語稿。":"A spoken script short enough for a bus stop, a queue, or a chat after a meal.","可朗讀，可讓對方跟著念。":"Can be read aloud, and read along with.","從生活話題自然轉入信仰的提問。":"Questions that move naturally from everyday life into faith.","四層結構：短答、經文、比喻、反問。":"Four layers: a short answer, Scripture, an analogy, and a question back.","拜祖先、家人反對、清明、喪禮、婚俗。":"Ancestral offerings, family objections, tomb-sweeping, funerals, wedding customs.","從認識神到受洗，八課建造。":"From knowing God to baptism — eight lessons of building.","第1、3、7、14、21、30 天，六次接觸的對話指引。":"Conversation guides for six contacts, on days 1, 3, 7, 14, 21 and 30.","依對象與處境分類，可朗讀。":"Sorted by person and situation, and readable aloud.","陪他一起念，或替他念。":"Read it with him, or read it for him.","不用道理安慰，用同在抱住他。":"Do not comfort with explanations; hold him with your presence.","對一個具體的人，操練一個聖靈的果子。":"Towards one specific person, practise one fruit of the Spirit.","他不回訊息、他決志後消失了、我被問倒了……":"He does not reply, he vanished after committing, I was stumped…","信主前的我／遇見主的關鍵／現在的改變。":"Who I was before Christ / how I met the Lord / what has changed now.","可印出來作紙本輔助的自我檢核。":"Can be printed as a paper aid for self-review.","・我記錄他，是為了更好地愛他，不是為了管理他。":"・I keep a record of him in order to love him better, not to manage him.","・我絕不把他的私事告訴不相干的人，包括在代禱時。":"・I will never tell his private matters to anyone with no part in them, not even in prayer requests.","・我尊重他的自由，他有權利說不，也有權利慢慢來。":"・I respect his freedom. He has the right to say no, and the right to take his time.","・我不把人數當成績。一個靈魂比一百個數字寶貴。":"・I will not treat numbers as results. One soul is worth more than a hundred figures.","・我知道使人重生的是聖靈，不是我。我只負責忠心。":"・I know it is the Holy Spirit who gives new birth, not me. My part is only to be faithful.","・記住並主動關心他的重要日子與難處":"・Remember his important dates and difficulties, and ask after them without being prompted","・在他有需要時真的出現、真的幫忙":"・Actually turn up and actually help when he is in need","・為他每日禱告，一天不斷":"・Pray for him daily, without missing a day","・傳一則問候，不提任何信仰的事":"・Send one message just to say hello, with nothing about faith in it","・記下他最近的一個難處，這週為這件事禱告":"・Note one difficulty he has at the moment, and pray for it this week","・找一件小事實際幫他一次":"・Find one small thing and actually help him with it","・問他一個關於生活的開放問題（見破冰問題）":"・Ask him one open question about his life (see the ice-breaker questions)","・分享個人的三分鐘見證（不談教義，只談改變）":"・Share your personal three-minute testimony (no doctrine, only what changed)","・在合適時機邀請他一起吃飯、聽詩歌、看短片":"・At a suitable moment, invite him to share a meal, hear some music, or watch a short film","・分享一段適合他處境的金句":"・Share a verse that fits the situation he is t three brothers and sisters","・陪他上完慕道班八課":"・Walk with him through all eight lessons of the Seeker Class","・陪他預備受洗見證，出席他的受洗":"・Help him prepare his baptism testimony, and be there on the day","・今天就傳訊息給他，不要等":"・Send him a message today; do not wait","・約好這週介紹一位弟兄姊妹給他":"・Arrange to introduce one brother or sister to him this week","・陪他上慕道班的下一課":"・Sit with him through the next Seeker Class lesson","・問他：關於受洗，你心裡有什麼想法？":"・Ask him: what are your thoughts about baptism?","・每週一次一對一，持續三個月":"・One-to-one once a week for three months","・教他讀經、禱告、記錄":"・Teach him to read, to pray, and to record","・陪他處理生命中的具體難題":"・Work through the concrete difficulties of his life with him","・示範給他看：帶他一起去關心別人":"・Show him how: take him along to care for someone else","・約這週的一對一時間":"・Fix this week's one-to-one time","・問他這週靈修讀到什麼":"・Ask him what he read in his devotions this week","・帶他一起去關心另一個人":"・Take him with you to care for another person","・陪他處理他現在最卡住的那件事":"・Work through the thing he is most stuck on right now","・把你會的教給他，然後讓他去做":"・Teach him what you know, and then let him do it","・在旁邊支持，但不代替他做":"・Support from the side, but do not do it for him","・為他的屬靈兒女一同禱告":"・Pray together for his spiritual children","・問他：你心裡有沒有想帶的人？":"・Ask him: is there someone on your heart you would like to lead?","・陪他寫下他的第一張名單（三個名字）":"・Sit with him as he writes his first list (three names)","・讓他講一次福音給你聽，你只聽不改":"・Have him tell you the gospel once; only listen, do not correct","・為他的第一個 2 一起禱告":"・Pray together for his first 2","・今天為他做一件他不知道是你做的事。":"・Today, do something for him that he will never know you did.","・今天跟他分享一件讓你感謝的小事。":"・Today, share with him one small thing you are thankful for.","・今天有一次可以爭的機會，選擇不爭。":"・Today, when a chance to contend comes, choose not to.","・今天不催他任何事，只是問候他。":"・Today, press him for nothing at all — simply ask how he is.","・今天說一句肯定他的話，具體到一件事。":"・Today, say one affirming thing to him, about one specific matter.","・今天做一件沒有人會知道的好事。":"・Today, do one good thing that nobody will ever know about.","・今天把一件答應過他卻沒 ng up is your responsibility — please do it every thirty days.","匯出":"Export","會產生一個 JSON 檔。建議存到雲端硬碟或傳給自己。":"This produces a JSON file. Save it to cloud storage, or send it to yourself.","匯出備份檔":"Export a backup file","匯入":"Import","選擇之前匯出的 JSON 檔。匯入會「合併」資料，不會刪除現有內容。":"Choose a JSON file you exported earlier. Importing merges the data; nothing existing is deleted.","從檔案還原":"Restore from a file","清除這個裝置上的所有資料":"Erase all data on this device","iOS Safari 長期未使用可能會清除本機資料庫，":"If iOS Safari goes unused for a long time it may clear the local database,","這就是備份重要的原因。":"which is why backing up matters.","讓禱告有一個固定的時刻":"Give prayer a fixed hour","這個 App 沒有伺服器，所以不靠推播。我們用一個更可靠的方式： 把提醒放進你手機原本的行事曆，它一定會響。":"This app has no server, so it does not rely on push notifications. We use something more dependable: put the reminder into your phone's own calendar, and it will certainly sound.","每日提醒":"Daily reminder","加入每日代禱提醒":"Add the daily prayer reminder","按下後會下載一個行事曆檔，點開它、選「加入行事曆」即可。 之後每天到時間，手機就會提醒你。":"Tapping this downloads a calendar file. Open it and choose Add to Calendar. From then on your phone will remind you at that time each day.","他們的日子":"Their special days","生日、屬靈生日（決志日）都會變成每年重複的提醒。 記得一個人的日子，就是在愛他。":"Birthdays and spiritual birthdays (the day of commitment) become reminders that repeat each year. Remembering a person's day is a way of loving him.","加入生日與屬靈生日":"Add birthdays and spiritual birthdays","iPhone 進階作法":"For iPhone, going further","若你希望每天固定時間「自動打開這個 App」，可以用 iPhone 內建的「捷徑」。":"If you want the app to open by itself at the same time each day, you can use the Shortcuts app built into the iPhone.","看步驟":"See the steps","提醒響起的時候，先禱告，再看名單。":"When the reminder sounds, pray first, then look at the list.","五條使用者倫理守則":"Five rules for those who use this","321 理念":"The 321 vision","三個基礎":"Three foundations","：耶穌是我的榜樣．聖經是我的準則．聖靈是我的引導":": Jesus is my model · Scripture is my standard · the Holy Spirit is my guide","：讓耶穌作王．讓耶穌得著一切的榮耀":": let Jesus reign · let Jesus receive all the glory","：建立屬神的體系":": building the system that belongs to God","先生命，再關係，後事工。":"Life first, then relationships, then ministry.","舊人有己的生命，變成新人無己的生命。":"The old self-centred life becomes the new selfless life.","謙卑戰勝驕傲，無己戰勝撒但。":"Humility overcomes pride; selflessness overcomes Satan.","焦點在耶穌，不在自己、不在別人、不在環境。":"The focus is on Jesus — not on ourselves, not on others, not on circumstances.","隱私":"Privacy","本 App 不設伺服器、不上傳任何個人資料、不需要註冊帳號、不放置任何追蹤程式碼。 所有慕道友的資料只存在你自己的手機中。":"This app has no server, uploads no personal data, requires no account, and carries no tracking code of any kind. Everything about the people you are walking with stays on your own phone.","異象":"The vision","我們要興起一萬個屬靈父母，讓每一個信主的人都被人陪伴，也去陪伴一個人； 直到福音從一個人流向一個家、一個群體、一個城市、一個國家， 在地上建立屬神的體系，迎接主耶穌再來。":"We long to raise up ten thousand spiritual parents, so that everyone who comes to faith is walked with, and in turn walks with someone else — until the gospel flows from one person to a household, to a community, to a city, to a nation, building on earth the system that belongs to God, and welcoming the return of the Lord Jesus.","國度321空中團契 敬上":"From Kingdom 321 Air Fellowship","一":"1","二":"2","三":"3","四":"4","五":"5","一般版":"Standard","寫出你的三分鐘見證":"Write your three-minute testimony","最有能力的福音，是你自己的故事。":"The most powerful gospel is your own story.","不談教義，只談改變。":"No doctrine — only what changed.","一、信主前的我":"1. Who I was before Christ","那時候我最在意什麼？最苦的是什麼？":"What mattered most to me then? What was hardest?","例：那幾年我拼命想證明自己，累到不敢停下來……":"e.g. for years I drove myself to prove something, too tired to dare stop…","二、遇見主的關鍵":"2. How I met the Lord","哪一句話、哪一件事、哪一個人？":"Which sentence, which event, which person?","例：有人跟我說，你不必再自己撐了……":"e.g. someone told me I did not have to hold it all up alone any more…","三、現在的改變":"3. What has changed now","具體一點。不用說「我變好了」，說「我現在會怎麼做」。":"Be concrete. Not “I am better now,” but “here is what I do now.”","例：現在我還是會焦慮，但我知道可以停下來禱告……":"e.g. I still get anxious, but now I know I can stop and pray…","整理成稿":"Turn it i ing list","從自己的人際關係網絡，包括家人、親戚、朋友、鄰居和認識的人中間，禱告尋求上帝的帶領，寫下心中浮現的人名。從這些名單中去邀請願意接受我們祝福的人，將他的名字圈起來。":"From your own circle — family, relatives, friends, neighbours, acquaintances — pray and seek God's leading, and write down the names that come to mind. Then invite those willing to receive your blessing, and circle their names.","祝福清單":"The blessing checklist","詢問願意接受祝福的人，勾選他所需要的福氣。並且問他關於這項福氣，他目前的需要及所遇到的問題，將重點寫在表格裡。在祝福天使後面簽寫自己的名字，在蒙福的人後面簽寫他的名字，並寫下彼此委身祝福的日期。":"Ask the person who is willing to be blessed, and tick the blessings he needs. Ask what he currently needs concerning each one and what he is facing, and note the key points in the table. Sign your own name after “blessing angel,” write his after “the one blessed,” and record the date you commit to this together.","使用天國的鑰匙關閉陰間的門，捆綁從罪惡及撒但來的一切不好的事情；打開天國的門，":"Use the keys of the kingdom to shut the gates of hades, binding everything harmful that comes from sin and from Satan; and open the gates of heaven,","釋放從福音及上帝來的一切美好的事情。倚靠聖靈的引導，用心靈的眼睛看見他蒙福的光景，":"releasing everything good that comes from the gospel and from God. Relying on the Spirit's leading, see with the eyes of the heart what he looks like blessed,","這是地圖，不是流水線。人不是產品，聖靈的工作有祂的時間。 里程可以停留、可以後退，App 只提供方向，絕不催逼。":"This is a map, not a production line. People are not products, and the Spirit's work keeps its own time. A milestone may hold still or move back. The app offers direction; it never presses.","先禱告，求聖靈引導；":"Pray first and ask the Spirit to lead;","不是你在說服他，是聖靈在感動他。":"you are not the one persuading him — the Spirit is the one moving him.","正在陪伴":"Currently walking with","四個關鍵行動":"Four key actions","日期":"Date","這次是怎麼接觸的":"How you made contact","他今天的狀態":"How he seemed today","發生了什麼":"What happened","（選填，一行就好）":"(Optional — one line is enough)","例：聊到他爸爸住院，他很累":"e.g. talked about his father being in hospital; he is worn out","記下來":"Save it","只按「記下來」也算完成。記錄的成本要低，你才走得久。":"Just tapping Save counts as done. Keep the cost of recording low and you will last.","用「捷徑」每天自動打開":
