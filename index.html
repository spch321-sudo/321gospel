是被餵養的人，我要開始餵養一個人。":"I will become a spiritual parent. I am no longer only one who is fed; I will begin to feed someone.","寫下你的第一張名單：三個名字。":"Write your first list: three names.","每天為這三個人禱告一分鐘，連續七天。":"Pray one minute a day for these three people, seven days running.","從這十二課裡挑一課，本週把它教給其中一個人。":"Choose one of these twelve lessons and teach it to one of them this week.","約定一個固定的見面時間，寫進行事曆。":"Agree on a regular meeting time and put it in your calendar.","讀：提摩太後書二章1至7節、馬太福音二十八章18至20節。":"Read: 2 Timothy 2:1-7 and Matthew 28:18-20.","陪伴者提示：這一課上完，要立刻進入實作。陪他打開 App 的「我的2」，當場建立第一張卡片。不要等他準備好——他永遠不會覺得自己準備好。":"For companions: the moment this lesson ends, move straight into doing it. Open “My 2s” in the app with him and create the first card on the spot. Do not wait until he is ready — he will never feel ready.","・第一至七天：固定一個時段（建議早晨），十五分鐘，手機放在看不見的地方。":"・Days 1-7: Fix one time slot (mornings are best), fifteen minutes, with your phone out of sight.","・讀：約翰福音第一至七章，一天一章。讀完寫下一句「今天我看見的耶穌」。":"・Read: John chapters 1 to 7, one chapter a day. Afterwards write one line: “the Jesus I saw today.”","・禱：用讀到的經文向神說話，最後為你的一位「2」禱告一分鐘。":"・Pray: speak to God using the passage you read, and finish with one minute of prayer for one of your 2s.","・記：準備一本小本子或用 App 的靈修紀錄，一天只寫一行。":"・Record: keep a small notebook or use the app's devotion log. One line a day, no more.","・第七天回顧：這七天哪一天最難？是什麼攔阻了你？":"・Day 7 review: which of the seven days was hardest, and what got in the way?","・第一至七天：每天早晨起床先說一句：「聖靈，今天求祢引導我。」":"・Days 1-7: On waking each morning say one sentence: “Holy Spirit, lead me today.”","・當天若心裡有一個感動（打一通電話、道一次歉、幫一個忙），十二小時內去做，不拖過夜。":"・If a prompting comes that day (make a call, offer an apology, lend a hand), act within twelve hours. Do not let it wait overnight.","・晚上記下：今天我照著感動做了什麼？結果如何？":"・In the evening record: what did I act on today, and what came of it?","・讀：約翰福音十四至十六章，圈出所有關於聖靈的應許。":"・Read: John 14 to 16, circling every promise concerning the Holy Spirit.","・用四把尺檢視一件你目前正在猶豫的事。":"・Apply the four measures to one thing you are currently hesitating over.","・讀：腓立比書二章1至11節，一天讀一次，連讀七天。":"・Read: Philippians 2:1-11, once a day for seven days running.","・每天挑一件讓你不舒服的事，問自己：「如果是耶穌，祂會怎麼作？」然後照著作一次。":"・Each day take one thing that makes you uncomfortable and ask, “if this were Jesus, what would He do?” Then do it that way once.","・操練「往下走」：這週主動作一件沒有人看見、也沒有人會謝謝你的服事。":"・Practise going downward: this week do one act of service that no one sees and no one will thank you for.","・當情緒上來時，停三秒，說一句：「主，我把焦點交還給祢。」":"・When emotion rises, pause three seconds and say, “Lord, I give the focus back to You.”","・第七天：寫下這一週你最像耶穌的一刻，把榮耀歸給祂。":"・Day 7: Write down the moment this week you were most like Jesus, and give Him the glory.","・讀：以弗所書四章17至32節、歌羅西書三章1至17節。":"・Read: Ephesians 4:17-32 and Colossians 3:1-17.","・畫一張兩欄表：左欄寫「我的舊人反應」，右欄寫「新人可以怎麼反應」。":"・Draw a two-column table: on the left, “my old-man reactions”; on the right, “how the new man could respond.”","・每天挑右欄的一項，實際作一次。":"・Each day pick one item from the right-hand column and actually do it once.","・當舊人跳出來時，不要自責，只說：「這是舊人，不是我了。主，求祢活出來。」":"・When the old man leaps out, do not condemn yourself. Simply say, “that is the old man; it is no longer me. Lord, live Your life out in me.”","・第七天：把這張表拿給你的屬靈同伴看，請他為你禱告。":"・Day 7: Show the table to your spiritual companion and ask him to pray for you.","・讀：加拉太書二章20節，背下來，一天默想一次。":"・Read Galatians 2:20, memorise it, and meditate on it once a day.","・每天早晨作一次交託禱告：把時間、金錢、關係、名聲、未來，一樣一樣點名交給主。":"・Each morning pray a prayer of surrender, handing over time, money, relationships, reputation and future to the Lord, naming them one by one.","・這週遇到一次「我明明有理」的場合，選擇不爭，把它獻上。":"・This week, when you meet an occasion where you are plainly in the right, choose not to contend, and offer it up.","・記下：當我不爭的時候，我心裡發生了什麼？":"・Record: when I did not contend, what happened inside me?","・第七天：寫下一段「我要交出去的清單」，日期簽上。":"・Day 7: Write out a list of what I am handing over, and sign it with the date.","・讀：雅各書四章1至10節、彼得前書五章5至7節。":"・Read: James 4:1-10 and 1 Peter 5:5-7.","・這週向一個人道歉——不是「如果我有錯」，是具體說出你錯在哪裡。":"・Apologise to one person this week — not “if I was wrong,” but naming exactly where you were wrong.","・每天作一次「放手禱告」：把一件你一直想掌控的事交給神，說：「這件事祢作神，我作人。」":"・Pray a letting-go prayer each day: hand God one thing you keep trying to control, and say, “in this matter You be God and I will be man.”","・操練接受幫助：主動開口請人幫你一個忙。":"・Practise receiving help: ask someone outright for a favour.","・記下：先謙卑之後，那段關係發生了什麼變化？":"・Record: after you humbled yourself first, what changed in that relationship?","・寫下那個人的名字與那件事，然後在紙上寫：「我把這筆帳交給神。」":"・Write down that person's name and what happened, then write on the paper: “I hand this account over to God.”","・為他禱告七天——不是禱告他遭報，是求神祝福他。第一天會很難，第七天你會發現不一樣。":"・Pray for him for seven days — not that he would be repaid, but that God would bless him. Day one will be hard; by day seven you will find it different.","・讀：馬太福音十八章21至35節。問自己：我欠主的那一萬他連得，還記得嗎？":"・Read Matthew 18:21-35 and ask yourself: do I still remember the ten thousand talents I owed the Lord?","・若有需要和好且對方安全，本週約他見一次面。若不安全，先不必勉強。":"・If reconciliation is needed and the person is safe, arrange to meet him this week. If it is not safe, do not force it yet.","・第七天：把那張紙撕掉或燒掉，作為一個記號。":"・Day 7: Tear up or burn that paper as a sign.","・每天早上寫一句：「今天，對【 】，操練【 】。」":"・Each morning write one line: “today, towards [　　], practise [　　].”","・晚上寫一行回顧：今天做到了嗎？發生了什麼？（一行就好，不寫檢討報告）":"・Each evening write one line of review: did I manage it, and what happened? (One line only — this is not a report.)","・讀：加拉太書五章16至26節。":"・Read: Galatians 5:16-26.","・其中一天，選你最難相處的那位2。":"・On one of the days, choose the 2 you find hardest to get along with.","・第七天：回顧七天的紀錄，看看哪一個果子對你最難，把它帶到禱告中。":"・Day 7: Look back over the seven records, see which fruit was hardest for you, and bring it into prayer.","・列出：我現在的屬靈同伴（2）、屬靈父母與屬靈兒女（3）、所屬的團隊（5）。":"・List them: my present spiritual companions (2), spiritual parents and children (3), and the team I belong to (5).","・若缺同伴，本週主動邀請一位弟兄姊妹，約定每週互相問責一次。":"・If you lack a companion, invite a brother or sister this week and agree to hold each other accountable once a week.","・問責五題：這週你與主如何？你有沒有隱藏的罪？你為誰禱告了？你關心了誰？你需要什麼幫助？":"・Five accountability questions: how have you been with the Lord this week? Is there hidden sin? Whom have you prayed for? Whom have you cared for? What help do you need?","・為你的屬靈父母寫一段感謝的話，傳給他。":"・Write a paragraph of thanks to your spiritual parent and send it to him.","・讀：以弗所書四章11至16節。":"・Read: Ephesians 4:11-16.","・檢視上個月的支出，問一句：這些錢說出我心裡誰在作王？":"・Review last month's spending and ask: what do these figures say about who reigns in my heart?","・這週安排一次「不為了辦事」的相處——單純陪伴家人，不談正事。":"・Arrange one occasion this week that is not for getting anything done — simply be with your family, with no business talk.","・排出你這一季最重要的三件事，把不在其中的事勇敢地說不。":"・Set out the three most important things for this quarter, and say no with courage to whatever is not among them.","・在職場作一件誠實但吃虧的選擇，記下心裡的感受。":"・Make one honest but costly choice at work, and record how it felt.","・讀：馬太福音六章19至34節。":"・Read: Matthew 6:19-34.","・盤點恩賜：問三位認識你的弟兄姊妹「你覺得神給我什麼？」把答案寫下來。":"・Take stock of your gifts: ask three brothers or sisters who know you, “what do you think God has given me?” and write down their answers.","・這週的每一次服事前，先安靜兩分鐘禱告，再開始。":"・Before every act of service this week, be still and pray for two minutes before you begin.","・作一件無名的服事，不讓任何人知道。":"・Do one act of service anonymously, letting no one know.","・若正在服事中疲乏，寫下原因，帶到你的屬靈父母面前談。":"・If you are weary in service, write down why, and take it to your spiritual parent to talk through.","・讀：羅馬書十二章1至8節、哥林多前書十二章。":"・Read: Romans 12:1-8 and 1 Corinthians 12.","・寫下你的第一張名單：三個名字。":"・Write your first list: three names.","・每天為這三個人禱告一分鐘，連續七天。":"・Pray one minute a day for these three people, seven days running.","・從這十二課裡挑一課，本週把它教給其中一個人。":"・Choose one of these twelve lessons and teach it to one of them this week.","・約定一個固定的見面時間，寫進行事曆。":"・Agree on a regular meeting time and put it in your calendar.","・讀：提摩太後書二章1至7節、馬太福音二十八章18至20節。":"・Read: 2 Timothy 2:1-7 and Matthew 28:18-20.","帖撒羅尼迦前書二章8節":"1 Thessalonians 2:8","我們既是這樣愛你們，不但願意將神的福音給你們，連自己的性命也願意給你們。":"Even so, affectionately longing for you, we were well pleased to impart to you not only the Good News of God, but also our own souls.","羅馬書一章16節":"Romans 1:16","我不以福音為恥；這福音本是神的大能，要救一切相信的。":"For I am not ashamed of the Good News of Christ, for it is the power of God for salvation for everyone who believes.","彼得前書三章15節":"1 Peter 3:15","有人問你們心中盼望的緣由，就要常作準備，以溫柔、敬畏的心回答各人。":"Always be ready to give an answer to everyone who asks you a reason concerning the hope that is in you, with humility and fear.","歌羅西書一章28節":"Colossians 1:28","我們傳揚他，是用諸般的智慧勸戒各人，教導各人，要把各人在基督裡完完全全地引到神面前。":"We proclaim him, admonishing every man and teaching every man in all wisdom, that we may present every man complete in Christ.","加拉太書六章9節":"Galatians 6:9","我們行善，不可喪志；若不灰心，到了時候就要收成。":"Let's not be weary in doing good, for we will reap in due season if we don't give up.","約翰福音十五章16節":"John 15:16","乃是我揀選了你們，並且分派你們去結果子，叫你們的果子常存。":"I chose you and appointed you, that you should go and bear fruit, and that your fruit should remain.","創世記一章27節":"Genesis 1:27","神就照著自己的形像造人，乃是照著他的形像造男造女。":"God created man in his own image. In God's image he created him; male and female he created them.","創世記二章7節":"Genesis 2:7","耶和華神用地上的塵土造人，將生氣吹在他鼻孔裡，他就成了有靈的活人。":"Yahweh God formed man from the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul.","以賽亞書五十三章6節":"Isaiah 53:6","我們都如羊走迷，各人偏行己路。":"All we like sheep have gone astray. Everyone has turned to his own way.","羅馬書三章23節":"Romans 3:23","因為世人都犯了罪，虧缺了神的榮耀。":"For all have sinned, and fall short of the glory of God.","羅馬書五章8節":"Romans 5:8","惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們顯明了。":"But God commends his own love toward us, in that while we were yet sinners, Christ died for us.","彼得前書三章18節":"1 Peter 3:18","因基督也曾一次為罪受苦，就是義的代替不義的，為要引我們到神面前。":"Because Christ also suffered for sins once, the righteous for the unrighteous, that he might bring you to God.","哥林多後書五章17節":"2 Corinthians 5:17","若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。":"Therefore if anyone is in Christ, he is a new creation. The old things have passed away. Behold, all things have become new.","我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著。":"I have been crucified with Christ, and it is no longer I that live, but Christ lives in me.","啟示錄三章20節":"Revelation 3:20","看哪，我站在門外叩門，若有聽見我聲音就開門的，我要進到他那裡去，我與他，他與我一同坐席。":"Behold, I stand at the door and knock. If anyone hears my voice and opens the door, then I will come in to him and will dine with him, and he with me.","羅馬書十章9節":"Romans 10:9","你若口裡認耶穌為主，心裡信神叫他從死裡復活，就必得救。":"If you will confess with your mouth that Jesus is Lord and believe in your heart that God raised him from the dead, you will be saved.","先作朋友，不急著傳。人比事重要。陪伴的核心不是技巧，是不離開。":"Be a friend first; do not rush to preach. People matter more than tasks. The heart of walking with someone is not technique — it is not leaving.","「我們既是這樣愛你們，不但願意將神的福音給你們，連自己的性命也願意給你們。」保羅說的是兩樣東西：福音，和自己。只給福音不給自己的，是傳單；連自己都給出去的，才是屬靈父母。 陪伴的第一條原則：先作朋友，不急著傳。許多福音行動失敗在這裡——太快切入主題，對方立刻感覺到自己是一個「目標」，不是一個朋友。人比事重要，關係比東西重要。這個階段唯一的任務，是讓他確定：你是真的關心我，不是要我信什麼。 陪伴的核心不是技巧，是不離開。你不必口才好，不必懂神學，你只要在他難處的時候真的出現。多數人一生記得的，不是誰對他講了一篇多好的道，是誰在他最狼狽的那一夜還沒有走。 陪伴也需要界線。你是父母，不是救主。你能陪他走，不能替他走；你能為他禱告，不能替他相信。分清楚這一條，你才走得遠。":"“We were well pleased to impart to you not only the Good News of God, but also our own souls.” Paul names two things: the gospel, and himself. To give the gospel without giving yourself is to hand out a leaflet. To give yourself as well is to be a spiritual parent.\nThe first principle of walking with someone: be a friend first, do not rush to preach. Many evangelistic efforts fail right here — the subject is raised too soon, and the other person instantly feels he is a target rather than a friend. People matter more than tasks; relationships matter more than things. At this stage your only task is to convince him: you really do care about me, you are not after my conversion.\nThe heart of walking with someone is not technique — it is not leaving. You need not be eloquent, you need not know theology. You need only actually turn up when things are hard for him. What most people remember all their lives is not who preached them a fine sermon, but who was still there on the night they were at their worst.\nWalking with someone also needs boundaries. You are a parent, not a saviour. You can walk beside him; you cannot walk for him. You can pray for him; you cannot believe for him. Get that clear and you will last the distance.","問聖靈：我對我的2，是在愛他，還是在推進進度？如果他一輩子不信，我還會不會愛他？":"Ask the Spirit: with my 2, am I loving him or moving him along? If he never believes as long as he lives, will I still love him?","我要把福音給他，也把自己給他。陪伴的核心不是技巧，是不離開。":"I will give him the gospel and give him myself. The heart of walking with someone is not technique — it is not leaving.","為你的2建立一張關係卡：家庭、工作、興趣、壓力、最近的難處。":"Create a relationship card for your 2: family, work, interests, pressures, and recent difficulties.","這週作一件實際幫忙的小事，並且不提信仰。":"Do one small, practical thing to help this week, without mentioning faith.","每天為他禱告一分鐘，記下天數。":"Pray for him one minute a day, and keep count of the days.","操練920：對他結出一個聖靈的果子。":"Practise 920: bear one fruit of the Spirit towards him.","記下：這週我有沒有一次，因為想推進而讓他感覺被當成目標？":"Record: was there a moment this week when my wanting to make progress made him feel like a target?","本課實作：請學員當場打開名單，為第一位2寫下三件他最近的難處。寫不出來，就是還不夠認識他——那正是這週的功課。":"In-class exercise: have each participant open his list and write down three recent difficulties of his first 2. If he cannot, he does not yet know the person well enough — and that is exactly this week's assignment.","五幕敘事的實際操作：怎麼開場、怎麼停頓、怎麼發出邀請。":"Working the five acts in practice: how to open, how to pause, how to give the invitation.","「我不以福音為恥，這福音本是神的大能，要救一切相信的。」講福音的能力不在你的口才，在福音本身。你的責任是把它講清楚，不是把人說服——說服是聖靈的工作。 五幕敘事的實際操作：第一幕美好的起初，用一句話帶過，不必久留；第二幕有己的墮落，這是全場的關鍵，慢下來；第三幕十架的救贖，說得具體；第四幕復活的新生命，強調這是現在就有的，不是死後的保險；第五幕讓耶穌作王，發出明確的邀請。 第二幕為什麼是關鍵？因為我們一講「你有罪」，對方立刻防衛：我又沒殺人放火。但你若說：「罪的意思不是壞事做多少，是我想自己作主、自己作王，不要神管我。」——多數人會安靜下來，因為那正是他一生的寫照。 三個現場技巧：一、講你自己的故事，不要只講道理；二、學會停頓，講完第二幕停下來問一句「你覺得呢？」，讓他說話；三、勇敢邀請。很多人一輩子沒有信主，只因為從來沒有人正式邀請過他。":"“I am not ashamed of the Good News, for it is the power of God for salvation for everyone who believes.” The power to share the gospel does not lie in your eloquence but in the gospel itself. Your responsibility is to make it clear, not to make anyone agree — persuading is the Holy Spirit's work.\nWorking the five acts in practice. Act One, a good beginning: cover it in a sentence, do not linger. Act Two, the fall into self: this is the hinge of the whole conversation, so slow down. Act Three, redemption at the cross: be concrete. Act Four, new life through resurrection: stress that this is available now, not an insurance policy for after death. Act Five, letting Jesus reign: give a clear invitation.\nWhy is Act Two the hinge? Because the moment we say “you are a sinner,” the other person's defences go up: I have not killed anyone. But if you say, “sin does not mean how much wrong you have done; it means I want to be my own master and king, and I do not want God running my life” — most people go quiet, because that is the story of their life.\nThree techniques for the moment itself. First, tell your own story; do not only argue a case. Second, learn to pause — at the end of Act Two, stop and ask, “what do you think?” and let him speak. Third, invite him courageously. Many people never come to Christ simply because nobody ever formally asked them.","求聖靈提醒你：上一次你有機會開口卻吞回去，是在怕什麼？是怕講不清楚，還是怕失去這段關係？":"Ask the Spirit to remind you: the last time you had an opening and swallowed your words, what were you afraid of — not explaining it well, or losing the relationship?","福音本是神的大能。我的責任是講清楚並且發出邀請，說服是聖靈的事。":"The gospel is the power of God. My responsibility is to make it clear and to give the invitation. Persuading belongs to the Spirit.","對著鏡子或錄音，完整講一次五幕福音，控制在十五分鐘內。":"Speak the whole five-act gospel once to a mirror or a recorder, keeping within fifteen minutes.","寫出你自己的三分鐘見證：信主前的我／關鍵的轉折／現在的改變。":"Write your own three-minute testimony: who I was before Christ / the turning point / what has changed now.","練習第二幕的一句話講法：把「有己」用你自己的話說出來。":"Practise the one-sentence version of Act Two: put “self” into your own words.","本週找一位已信主的弟兄姊妹，實際講一次給他聽，請他回饋。":"This week find a brother or sister who already believes, deliver it to him for real, and ask for feedback.","預備一句邀請的話，練到不尷尬：「你願意現在把生命的主權交給祂嗎？」":"Prepare one line of invitation and rehearse it until it feels natural: “would you be willing to hand the rule of your life over to Him now?”","本課實作：兩人一組互相演練，一人講、一人扮演慕道友發問。演練過的人，現場開口的機率高出數倍。":"In-class exercise: work in pairs, one speaking and one playing the seeker who asks questions. Those who have rehearsed are several times more likely to speak up when the real moment comes.","先接住情緒，再處理問題。不要爭贏，要愛贏。":"Catch the feeling first, then handle the question. Do not win the argument; win by love.","「有人問你們心中盼望的緣由，就要常作準備，以溫柔、敬畏的心回答各人。」注意經文的兩個重點：要常作準備（所以要裝備），也要溫柔敬畏（所以不是要贏）。 第一條原則：先接住情緒，再處理問題。很多疑問底下藏的不是理性難題，是一段受傷的經歷。「為什麼好人會受苦」這一題，有人問是哲學問題，有人問是因為他媽媽上個月走了。同樣的問題，不同的答案。所以每一題的第一個動作，都是反問一句：「你怎麼會想到這個問題？」 第二條原則：誠實承認你不懂的。說「這題我答不出來，我回去查，下週告訴你」——這比硬掰更有說服力，也給了你們下一次見面的理由。 第三條原則：不要爭贏，要愛贏。你把他辯倒了，他會閉嘴，但他的心會關得更緊。答案的目的不是贏辯論，是打開心門。 疑問解答庫的四十題，每題都有四層：一句話短答、相關經文、一個生活比喻、一個反問回去的問題。用的時候，先用第四層，最後才用第一層。":"“Always be ready to give an answer to everyone who asks you a reason concerning the hope that is in you, with humility and fear.” Note the two emphases: always be ready (so we must be equipped), and with humility and fear (so this is not about winning).\nFirst principle: catch the feeling first, then handle the question. What hides under many questions is not an intellectual difficulty but a wounded experience. Take “why do good people suffer?” For one person it is a philosophical question; for another it is because his mother died last month. Same question, different answer. So the first move with every question is to ask back, “what made you think of that?”\nSecond principle: honestly admit what you do not know. Saying “I cannot answer that one; I will look into it and tell you next week” is far more persuasive than bluffing, and it gives you a reason to meet again.\nThird principle: do not win the argument; win by love. Defeat him in debate and he will fall silent, but his heart will shut tighter. The purpose of an answer is not to win a debate but to open a door.\nThe forty questions in the answer library each have four layers: a one-sentence answer, a relevant passage, an everyday analogy, and a question to ask back. In practice, start with the fourth layer and use the first one last.","問自己：我上一次跟人談信仰，心裡真正想要的是什麼——是他得救，還是我對？":"Ask yourself: the last time I talked faith with someone, what did I really want — his salvation, or my being right?","熟讀疑問解答庫中「華人處境」六題，這是最常被問到的。":"Study the six questions under “the Chinese context” until you know them well; these come up most often.","練習反問：這週不論誰問你什麼，先問一句「你怎麼會想到這個？」":"Practise asking back: whoever asks you anything this week, first ask, “what made you think of that?”","挑一題你最怕被問的，把答案寫成三句話，背下來。":"Choose the question you most dread, write the answer in three sentences, and memorise it.","這週遇到一次你答不出來的，誠實說「我不知道」，並且真的去查。":"When you meet a question you cannot answer this week, say honestly “I do not know” — and then actually go and find out.","讀：彼得前書三章8至17節。":"Read: 1 Peter 3:8-17.","本課實作：現場點名發問，讓學員即席回答，然後全班一起修飾。要刻意製造「被問倒」的經驗，讓他在安全的地方先跌一次。":"In-class exercise: call on people at random to answer on the spot, then polish the answers together as a class. Deliberately create the experience of being stumped, so that he takes his first fall somewhere safe.","八大步驟的落實：資訊、啟示、信服、實踐、檢討、修正、反覆、繁殖。":"Putting the eight steps to work: information, revelation, conviction, practice, review, correction, repetition, reproduction.","「我們傳揚他，是用諸般的智慧勸戒各人，教導各人，要把各人在基督裡完完全全地引到神面前。」保羅的目標不是講完課，是把人完完全全地引到神面前。 門訓不是上課，是同行。所以八大步驟不能只走到第三步：資訊——把真理講給他；啟示——安靜禱告，求聖靈使他看見；信服——問他「這對你意味著什麼」，等他從頭腦走到心裡；實踐——給他一個七天的具體行動；檢討——下一週第一件事是回顧上週的行動；修正——他卡住的地方陪他調整方法；反覆——同一個主題三個月後再回訪；繁殖——讓他把這一課教給另一個人。 多數門訓失敗在第四步與第五步之間：講完了，卻沒有人陪他實踐與檢討。於是知識堆積，生命不動。 帶門訓的三個實務：一、固定時間，寧可短而規律，不要長而隨興；二、你講的不要超過一半，多問問題，讓他說；三、每次結束前，具體約定下一次的時間與作業。 結業的標準不是上完，是教過別人了。":"“We proclaim him, admonishing every man and teaching every man in all wisdom, that we may present every man complete in Christ.” Paul's aim was not to finish the lesson but to present a person complete before God.\nDiscipleship is not a class; it is companionship. So the eight steps must not stop at the third. Information — tell him the truth. Revelation — pray quietly and ask the Spirit to let him see. Conviction — ask him “what does this mean for you?” and wait for it to travel from head to heart. Practice — give him a concrete seven-day action. Review — make the first item of next week's meeting a look back at last week's action. Correction — where he is stuck, adjust the method with him. Repetition — return to the same theme three months later. Reproduction — have him teach this lesson to someone else.\nMost discipleship fails between step four and step five: the teaching is finished, but nobody walks with him through practice and review. So knowledge piles up and life does not move.\nThree practicalities for leading discipleship. First, a fixed time — better short and regular than long and occasional. Second, do not speak for more than half of it; ask more questions and let him talk. Third, before each session ends, agree specifically on the next time and the next assignment.\nCompletion is not “we finished it” but “he has taught someone else.”","問聖靈：我帶人的時候，是不是講得太多、問得太少？我有沒有陪他走到「實踐」與「檢討」？":"Ask the Spirit: when I lead someone, do I talk too much and ask too little? Have I walked with him as far as practice and review?","門訓不是上課，是同行。我要陪他走完八大步驟，直到他能教別人。":"Discipleship is not a class; it is companionship. I will walk him through all eight steps, until he can teach someone else.","排出未來十二週的門訓時間表，寫進行事曆並傳給對方。":"Lay out a twelve-week discipleship schedule, put it in your calendar, and send it to him.","預備第一課：自己先作一次那課的七天行動作業。":"Prepare Lesson 1 by first doing that lesson's seven-day assignment yourself.","練習提問：把一段真理改寫成三個開放式問題。":"Practise asking: turn a passage of truth into three open questions.","每次見面後記一行：他今天說的哪句話，讓我看見聖靈在動工？":"After each meeting write one line: which sentence of his showed me the Spirit at work today?","讀：歌羅西書一章24至29節。":"Read: Colossians 1:24-29.","本課實作：讓學員現場設計一次六十分鐘的門訓流程——開場十分鐘回顧、二十分鐘真理、二十分鐘討論、十分鐘作業與禱告。":"In-class exercise: have each participant design a sixty-minute discipleship session on the spot — ten minutes of review to open, twenty minutes of truth, twenty minutes of discussion, ten minutes for the assignment and prayer.","他不回訊息、他決志後消失了、他家人反對……忠心比成果重要。":"He stops replying, he disappears after committing, his family objects… Faithfulness matters more than results.","「我們行善，不可喪志；若不灰心，到了時候就要收成。」保羅沒有說不會累，他說不要喪志。累是體力的事，喪志是心的事。 最常見的幾種挫折：他不回我訊息了；他決志之後就消失了；他的家人強烈反對；他信了卻沒有改變；我陪了三年，他還是那樣。每一種都會讓人開始懷疑自己。 幾句要記住的話。第一，我栽種了，亞波羅澆灌了，惟有神叫他生長——生長不是你的責任，忠心才是。第二，沒有回應不等於沒有果效，種子在土裡的時候是看不見的。第三，你的價值不是由結果決定的；如果人數決定你的價值，那你早晚會為了數字而傷害人。 實際的作法：找你的屬靈同伴說出來，不要一個人撐；把挫折寫下來帶到禱告中，不要壓在心裡發酵；記錄「主動工的記號」——那些很小很小的改變，是你在漫長等待中的信心糧食。 還有一句要老實說：有時候不是他的問題，是我們太急。停下來問一句，往往比再推一把有用。":"“Let's not be weary in doing good, for we will reap in due season if we don't give up.” Paul did not say you will not get tired. He said do not lose heart. Tiredness is a matter of the body; losing heart is a matter of the soul.\nThe most common discouragements: he no longer replies to me; he vanished after making his commitment; his family objects fiercely; he believed but nothing changed; I have walked with him three years and he is just the same. Every one of them starts a person doubting himself.\nA few sentences to hold on to. First, I planted, Apollos watered, but God gave the growth — growth is not your responsibility, faithfulness is. Second, no response is not the same as no effect; while the seed is in the soil it cannot be seen. Third, your worth is not determined by results; if numbers determine your worth, sooner or later you will hurt people for the sake of a figure.\nWhat to do in practice: tell your spiritual companion, do not carry it alone; write the discouragement down and bring it into prayer rather than letting it ferment inside; and keep a record of the signs that the Lord is at work — those very small changes are the food of your faith through a long wait.\nOne more thing to say honestly: sometimes the problem is not his, it is that we are in too much of a hurry. Stopping to ask a question is often more use than another push.","問聖靈：我心裡有沒有一個已經放棄的名字？求祂讓你看見，那是聖靈的釋放，還是我的灰心。":"Ask the Spirit: is there a name I have already given up on? Ask Him to show you whether that was His release or my discouragement.","生長是神的事，忠心是我的事。我不喪志，因為到了時候就要收成。":"Growth is God's business; faithfulness is mine. I will not lose heart, for we will reap in due season.","寫下你目前最大的一個挫折，具體到那件事、那句話。":"Write down your greatest present discouragement, down to the incident and the sentence.","約你的屬靈同伴，把它說出來，並請他為你禱告。":"Meet your spiritual companion, say it out loud, and ask him to pray for you.","翻閱你為他禱告的紀錄，找出三個「主動工的記號」，寫下來。":"Look back through your prayer records for him, find three signs that the Lord is at work, and write them down.","這週為他禱告時，改成為他祝福，不求結果。":"When you pray for him this week, change to blessing him, asking for no result.","讀：加拉太書六章1至10節、哥林多前書三章5至9節。":"Read: Galatians 6:1-10 and 1 Corinthians 3:5-9.","本課實作：讓每位學員說出一個挫折，全班一同為他按手禱告。挫折說出口的那一刻，捆綁就鬆了一半。":"In-class exercise: have each participant name one discouragement, and let the class lay hands on him and pray. The moment a discouragement is spoken aloud, half the binding is already loosed.","放手讓他去帶人。真正的成功，是他不再需要你，並且有了他自己的名單。":"Release him to lead others. Real success is that he no longer needs you and has a list of his own.","「不是你們揀選了我，是我揀選了你們，並且分派你們去結果子，叫你們的果子常存。」注意「常存」兩個字——常存的果子，是那個會再結果子的果子。 繁殖是屬靈父母的終點測驗。真正的成功，不是他多需要你，是他不再需要你，並且開始有他自己的名單。這一點違反人的天性：我們喜歡被需要。若你發現自己捨不得放手，要誠實面對——那多半不是為了他好，是我們的己還在。 放手的四個步驟，可以背下來：我作你看、我作你幫、你作我幫、你作我看。多數人卡在第二步就不肯往前，結果帶了十年還在當保母。 要主動製造機會：帶他一起去關心別人，讓他在旁邊看；下一次讓他開口，你在旁邊補；再下一次你完全不說話。回程的路上，先問他「你覺得剛剛怎麼樣」，再給回饋——先肯定兩件，再調整一件。 最後，為他的屬靈兒女禱告。當你看見你的屬靈孫子出生的那一天，你就明白為什麼保羅說四代。體系不是組織圖，是一代一代真實的生命。":"“You didn't choose me, but I chose you and appointed you, that you should go and bear fruit, and that your fruit should remain.” Note the word remain — fruit that remains is fruit that will bear fruit again.\nReproduction is the final test of a spiritual parent. Real success is not how much he needs you but that he no longer needs you and has begun a list of his own. This runs against human nature: we like being needed. If you find you cannot bear to let go, face it honestly — that is usually not for his good; it is our own self still in place.\nFour steps of releasing, worth memorising: I do, you watch; I do, you help; you do, I help; you do, I watch. Most people stall at the second step and will not move on, and end up ten years later still playing nursemaid.\nMake opportunities on purpose. Take him along to care for someone and let him watch from the side. Next time let him speak and you fill in the gaps. The time after that, say nothing at all. On the way home, ask him first, “how do you think that went?” and then give feedback — two affirmations first, then one adjustment.\nFinally, pray for his spiritual children. On the day you see your spiritual grandchild born, you will understand why Paul spoke of four generations. A system is not an organisation chart; it is one generation of real lives after another.","問聖靈：我現在陪伴的人裡，誰已經可以往前一步了？我卡在放手的哪一個階段？":"Ask the Spirit: among those I am walking with, who is ready to take a step forward? And at which stage of letting go am I stuck?","真正的成功，是他不再需要我，並且有了他自己的名單。":"Real success is that he no longer needs me and has a list of his own.","評估你的每一位屬靈兒女，現在各在哪一步：我作你看／我作你幫／你作我幫／你作我看。":"Assess each of your spiritual children and where each one now stands: I do you watch / I do you help / you do I help / you do I watch.","挑一位，本週帶他一起去關心另一個人。":"Choose one and take him along this week to care for someone else.","下一次讓他主導，你只在旁邊。回程給他兩個肯定、一個調整。":"Next time let him lead while you stay at his side. On the way home give him two affirmations and one adjustment.","陪他寫下他自己的第一張名單。":"Sit with him as he writes his own first list.","為你的屬靈孫子禱告——即使他還沒有出現。":"Pray for your spiritual grandchild — even before he appears.","本課實作：畫出你的屬靈家譜樹，看見自己在第幾代，並寫下你希望三年後這棵樹長成什麼樣子。":"In-class exercise: draw your spiritual family tree, see which generation you stand in, and write down what you hope the tree will look like three years from now.","在一切的起頭，有一位神。祂造了光、造了海、造了會開花的樹，最後祂造了人——不是隨手一造，是照著祂自己的形像造的。祂把生氣吹進人的鼻孔裡，人就成了有靈的活人。 那時候，人與神之間沒有隔閡。神在園子裡走，人聽得見祂的腳步聲。人不需要證明什麼、不需要爭什麼，因為他知道自己是被愛的。 所以，人心裡那份「總覺得少了什麼」的空，不是你有毛病，是你本來就是為一位神造的。":"At the very beginning there was God. He made light, He made the sea, He made trees that flower — and last of all He made man, not casually, but in His own image. He breathed the breath of life into man's nostrils, and man became a living soul.\nIn those days there was nothing between man and God. God walked in the garden and man could hear His footsteps. Man had nothing to prove and nothing to fight for, because he knew he was loved.\nSo the emptiness in you that keeps saying “something is missing” is not a fault in you. You were made for a God in the first place.","問題不是從殺人放火開始的。是從一個念頭開始的：「我可以自己決定什麼是對、什麼是錯。」蛇對人說的那一句話是——「你們便如神能知道善惡」。 人吃那果子，不是因為肚子餓。是因為想坐上那個位子。這就是驕傲：離開人的本位，抓住神的權力，想要代替神。 這就是聖經說的「罪」的根，我們叫它「有己」——凡事以自己為中心，自己要作主作王。 有己一進來，四道裂縫立刻出現：人與神隔絕了，人與自己不和了，人與人開始互相推卸、互相傷害，人與所處的世界也失了序。 所以你不必先承認自己是壞人。你只要誠實地問一句：我這一生，究竟是誰在作王？":"The trouble did not begin with murder or arson. It began with a thought: “I can decide for myself what is right and what is wrong.” What the serpent said was, “you will be like God, knowing good and evil.”\nMan did not eat that fruit because he was hungry. He ate it because he wanted the seat. That is pride: leaving the place of a man, seizing the authority of God, wanting to take God's place.\nThis is the root of what the Bible calls sin, and we call it self — making myself the centre of everything, insisting on being master and king.\nThe moment self comes in, four cracks open at once: man is cut off from God, man is at odds with himself, people begin shifting blame and wounding one another, and man's world falls out of order.\nSo you need not begin by admitting you are a bad person. You need only ask one honest question: who has been reigning over my life?","神大可以放手不管，但祂沒有。祂做了一件我們無法想像的事——祂自己來了。 耶穌基督，神的兒子，成為一個真實的人，走在塵土裡，餓過、累過、被誤解過。最後祂被釘在十字架上。那一天祂承擔的，不只是我們做過的錯事（罪行），更是我們裡面那個要自己作主的本性（罪性）。 這是一場交換：祂受該我們受的，我們得該祂得的。祂沒有討價還價，祂是心甘情願的。 所以十字架不是一個宗教符號，是一張已經付清的收據。":"God could well have left us to it, but He did not. He did something beyond our imagining — He came Himself.\nJesus Christ, the Son of God, became a real man, walked in the dust, went hungry, grew tired, was misunderstood. In the end He was nailed to a cross. What He bore that day was not only the wrong we have done (our sinful deeds) but the nature inside us that insists on being its own master (our sinful nature).\nIt was an exchange: He took what we deserved, and we receive what He deserved. He did not haggle. He did it willingly.\nSo the cross is not a religious symbol. It is a receipt marked paid in full.","如果故事停在十字架，那只是一個好人的悲劇。但第三天，墳墓空了。 耶穌的復活成就了第二件事：祂不只赦免你的過去，祂還要給你一個全新的生命。舊人有己的生命被釘死了，新人無己的生命賜下來了。 這是福音最好的消息——你不是被要求「從今以後要努力做好人」，你是被賜下一個新的生命，讓基督住在你裡面活出來。 不再是我，乃是基督。這不是你更用力，是你換了主人。":"If the story stopped at the cross, it would be only the tragedy of a good man. But on the third day the tomb was empty.\nThe resurrection of Jesus accomplished a second thing: He does not merely forgive your past, He gives you a wholly new life. The old self-centred life was nailed to the cross; the new selfless life has been given.\nThis is the best news the gospel carries. You are not being told, “from now on try hard to be a good person.” You are being given a new life, so that Christ may live it out within you.\nNo longer I, but Christ. This is not you pushing harder; this is you changing masters.","現在只剩一件事：你願不願意讓祂進來，把生命的主權交給祂。 這不是簽一份合約，是打開一扇門。神不會硬闖，祂在外面敲門，等你自己開。 信主的意思是：我承認我一直自己作王，我做不好；我相信耶穌為我死、為我復活；從今天起，我請祂進來，讓祂作王。 這一步不需要你先變好，只需要你願意。願意的人，就可以白白取生命的水喝。":"One thing remains: whether you are willing to let Him in and hand Him the rule of your life.\nThis is not signing a contract; it is opening a door. God will not force His way in. He knocks from outside and waits for you to open.\nTo believe means: I admit I have been reigning over my own life and I have not done it well; I believe Jesus died for me and rose for me; from today I invite Him in and let Him reign.\nThis step does not require you to improve first. It requires only that you are willing. And whoever is willing may take the water of life freely.","不用背，也不用講得好聽。跟著念，或用自己的話說都可以。神聽的是心。":"Nothing to memorise, nothing to make sound impressive. Read it after me, or use your own words. What God listens to is the heart.","親愛的主耶穌： 我來到你面前。 我承認我這一生都是自己作主、自己作王，凡事以自己為中心，我做不好，我也累了。 我相信你為我死在十字架上，擔當了我的罪；我相信你第三天從死裡復活，為要賜給我新的生命。 現在，我打開我的心門，請你進來。 我願意讓你作我生命的主，讓你在我裡面作王。 求你赦免我，潔淨我，用你的生命住在我裡面。 從今天起，我不再一個人走了。 奉主耶穌基督的名禱告，阿們。":"Dear Lord Jesus,\nI come to You.\nI admit that all my life I have been my own master and my own king, with myself at the centre of everything. I have not done it well, and I am tired.\nI believe You died on the cross for me and bore my sin; I believe You rose from the dead on the third day to give me new life.\nNow I open the door of my heart and ask You to come in.\nI am willing for You to be the Lord of my life and to reign within me.\nForgive me, cleanse me, and live Your life in me.\nFrom today I am no longer walking alone.\nIn the name of the Lord Jesus Christ I pray. Amen.","立刻約好下一次見面的時間（越快越好，48 小時內最好）。":"Fix the next meeting time immediately — the sooner the better, ideally within 48 hours.","把今天的日期記下來，這是他的屬靈生日。":"Write down today's date. This is his spiritual birthday.","為他做一個簡短的祝福禱告，然後恭喜他。":"Pray a short blessing over him, then congratulate him.","在 App 裡按下「決志登錄」，系統會自動排好初信三十天的陪伴提醒。":"Tap “Record Commitment” in the app and it will schedule the thirty-day new-believer reminders for you.","・為你的2建立一張關係卡：家庭、工作、興趣、壓力、最近的難處。":"・Create a relationship card for your 2: family, work, interests, pressures, and recent difficulties.","・這週作一件實際幫忙的小事，並且不提信仰。":"・Do one small, practical thing to help this week, without mentioning faith.","・每天為他禱告一分鐘，記下天數。":"・Pray for him one minute a day, and keep count of the days.","・操練920：對他結出一個聖靈的果子。":"・Practise 920: bear one fruit of the Spirit towards him.","・記下：這週我有沒有一次，因為想推進而讓他感覺被當成目標？":"・Record: was there a moment this week when my wanting to make progress made him feel like a target?","・對著鏡子或錄音，完整講一次五幕福音，控制在十五分鐘內。":"・Speak the whole five-act gospel once to a mirror or a recorder, keeping within fifteen minutes.","・寫出你自己的三分鐘見證：信主前的我／關鍵的轉折／現在的改變。":"・Write your own three-minute testimony: who I was before Christ / the turning point / what has changed now.","・練習第二幕的一句話講法：把「有己」用你自己的話說出來。":"・Practise the one-sentence version of Act Two: put “self” into your own words.","・本週找一位已信主的弟兄姊妹，實際講一次給他聽，請他回饋。":"・This week find a brother or sister who already believes, deliver it to him for real, and ask for feedback.","・預備一句邀請的話，練到不尷尬：「你願意現在把生命的主權交給祂嗎？」":"・Prepare one line of invitation and rehearse it until it feels natural: “would you be willing to hand the rule of your life over to Him now?”","・熟讀疑問解答庫中「華人處境」六題，這是最常被問到的。":"・Study the six questions under “the Chinese context” until you know them well; these come up most often.","・練習反問：這週不論誰問你什麼，先問一句「你怎麼會想到這個？」":"・Practise asking back: whoever asks you anything this week, first ask, “what made you think of that?”","・挑一題你最怕被問的，把答案寫成三句話，背下來。":"・Choose the question you most dread, write the answer in three sentences, and memorise it.","・這週遇到一次你答不出來的，誠實說「我不知道」，並且真的去查。":"・When you meet a question you cannot answer this week, say honestly “I do not know” — and then actually go and find out.","・讀：彼得前書三章8至17節。":"・Read: 1 Peter 3:8-17.","・排出未來十二週的門訓時間表，寫進行事曆並傳給對方。":"・Lay out a twelve-week discipleship schedule, put it in your calendar, and send it to him.","・預備第一課：自己先作一次那課的七天行動作業。":"・Prepare Lesson 1 by first doing that lesson's seven-day assignment yourself.","・練習提問：把一段真理改寫成三個開放式問題。":"・Practise asking: turn a passage of truth into three open questions.","・每次見面後記一行：他今天說的哪句話，讓我看見聖靈在動工？":"・After each meeting write one line: which sentence of his showed me the Spirit at work today?","・讀：歌羅西書一章24至29節。":"・Read: Colossians 1:24-29.","・寫下你目前最大的一個挫折，具體到那件事、那句話。":"・Write down your greatest present discouragement, down to the incident and the sentence.","・約你的屬靈同伴，把它說出來，並請他為你禱告。":"・Meet your spiritual companion, say it out loud, and ask him to pray for you.","・翻閱你為他禱告的紀錄，找出三個「主動工的記號」，寫下來。":"・Look back through your prayer records for him, find three signs that the Lord is at work, and write them down.","・這週為他禱告時，改成為他祝福，不求結果。":"・When you pray for him this week, change to blessing him, asking for no result.","・讀：加拉太書六章1至10節、哥林多前書三章5至9節。":"・Read: Galatians 6:1-10 and 1 Corinthians 3:5-9.","・評估你的每一位屬靈兒女，現在各在哪一步：我作你看／我作你幫／你作我幫／你作我看。":"・Assess each of your spiritual children and where each one now stands: I do you watch / I do you help / you do I help / you do I watch.","・挑一位，本週帶他一起去關心另一個人。":"・Choose one and take him along this week to care for someone else.","・下一次讓他主導，你只在旁邊。回程給他兩個肯定、一個調整。":"・Next time let him lead while you stay at his side. On the way home give him two affirmations and one adjustment.","・陪他寫下他自己的第一張名單。":"・Sit with him as he writes his own first list.","・為你的屬靈孫子禱告——即使他還沒有出現。":"・Pray for your spiritual grandchild — even before he appears.","・立刻約好下一次見面的時間（越快越好，48 小時內最好）。":"・Fix the next meeting time immediately — the sooner the better, ideally within 48 hours.","・把今天的日期記下來，這是他的屬靈生日。":"・Write down today's date. This is his spiritual birthday.","・為他做一個簡短的祝福禱告，然後恭喜他。":"・Pray a short blessing over him, then congratulate him.","・在 App 裡按下「決志登錄」，系統會自動排好初信三十天的陪伴提醒。":"・Tap “Record Commitment” in the app and it will schedule the thirty-day new-believer reminders for you.","三分鐘電梯版":"The Three-Minute Version","約 3 分鐘":"About 3 minutes","適合等車、排隊、飯後閒聊的空檔。目標不是講完，是讓他想再聽。":"For waiting at a bus stop, standing in a queue, chatting after a meal. The aim is not to finish, but to leave him wanting to hear more.","十五分鐘完整版":"The Full Fifteen-Minute Version","約 15 分鐘":"About 15 minutes","適合坐下來好好談一次。每一幕講完停一下，問他：「聽到這裡，你有什麼想法？」":"For sitting down and talking it through properly. Pause after each act and ask him, “what are you thinking so far?”","一杯咖啡的深談版":"The Over-Coffee Version","約 40 分鐘":"About 40 minutes","適合已經有信任基礎、他也開始問問題的階段。原則是：他講的時間要比你多。":"For when trust is established and he has begun asking questions himself. The rule: he should talk more than you do.","我用三分鐘跟你講一件對我最重要的事，好不好？講完你當笑話聽也沒關係。":"May I take three minutes to tell you the thing that matters most to me? If it sounds like a joke to you afterwards, that is fine.","聖經說，人本來是神照著自己的形像造的，人跟神原本是很近的。所以我們心裡總覺得少一塊，其實不是我們有毛病。":"The Bible says man was made in God's own image, and that man and God were once very close. So the piece that always feels missing inside us is not actually a fault in us.","後來出問題了。問題不是從殺人放火開始，是從一個念頭開始的——「我要自己作主」。聖經把這個叫做罪的根，我們稱它「有己」：凡事以自己為中心，想要代替神。":"Then something went wrong. It did not start with murder or arson; it started with a thought — “I will be my own master.” The Bible calls this the root of sin, and we call it self: making myself the centre of everything and wanting to take God's place.","你想想看，我們一生的煩惱，是不是大半都出在這裡？想控制、想贏、想被看見。":"Think about it — is that not where most of our troubles come from? Wanting control, wanting to win, wanting to be noticed.","神的解決辦法不是給我們一本規矩。祂自己來了。耶穌被釘在十字架上，替我們承擔了這一切；第三天祂復活了，為的是把一個全新的生命賜給我們。":"God's answer was not to hand us a rule book. He came Himself. Jesus was nailed to a cross and bore all of it in our place, and on the third day He rose, in order to give us a wholly new life.","所以信耶穌不是變得更會守規矩，是換一個生命，讓祂在我裡面作王。":"So believing in Jesus is not getting better at keeping rules. It is exchanging one life for another, and letting Him reign within me.","祂現在就站在你心門外敲門，門把在你這邊。哪一天你願意開，隨時可以告訴我，我陪你。":"He is standing at the door of your heart knocking right now, and the handle is on your side. Whenever you are willing to open it, tell me, and I will be with you.","【開場】我想跟你分享一個故事，這個故事有五幕。你隨時可以打斷我、隨時可以問。":"[Opening] I would like to share a story with you. It has five acts. Stop me at any time, ask at any time.","【第一幕 美好的起初】聖經第一句話是「起初，神創造天地」。祂造了萬物，最後照著自己的形像造了人。那時候人跟神之間沒有隔閡，人不需要證明什麼，因為他知道自己是被愛的。所以我們心裡那個「總覺得少了什麼」的空，不是缺陷，是原廠設定——我們本來就是為一位神造的。":"[Act One: A Good Beginning] The Bible's first line is “in the beginning, God created the heavens and the earth.” He made all things, and last of all He made man in His own image. In those days there was nothing between man and God; man had nothing to prove, because he knew he was loved. So the emptiness in us that says “something is missing” is not a defect. It is the factory setting — we were made for a God in the first place.","【停一下】你有沒有過那種感覺？什麼都有了，還是覺得空？":"[Pause] Have you ever felt that? You have everything, and still feel empty?","【第二幕 有己的墮落】問題怎麼開始的？蛇對人說：「你們便如神能知道善惡。」人吃那果子不是因為餓，是因為想坐上神的位子。這就是驕傲——離開人的本位，抓住神的權力。聖經稱它為罪，我們叫它「有己」：凡事以自己為中心，自己要作主作王。有己一進來，四道裂縫就出現了：人與神隔絕、人與自己不和、人與人互相傷害、人與世界失序。":"[Act Two: The Fall Into Self] How did the trouble begin? The serpent said to man, “you will be like God, knowing good and evil.” Man did not eat that fruit because he was hungry, but because he wanted God's seat. That is pride — leaving the place of a man and seizing the authority of God. The Bible calls it sin; we call it self: making myself the centre of everything, insisting on being master and king. The moment self comes in, four cracks appear: man cut off from God, man at odds with himself, people wounding one another, and man's world out of order.","【停一下】你覺得，人最大的問題是行為不好，還是裡面那個「我要自己作主」？":"[Pause] Which do you think is man's biggest problem — bad behaviour, or that thing inside that says “I will be my own master”?","【第三幕 十架的救贖】神沒有放手不管。祂自己來了。耶穌成為一個真實的人，最後被釘在十字架上。祂承擔的不只是我們做過的錯事，更是我們裡面那個要作主的本性。這是一場交換：祂受該我們受的，我們得該祂得的。":"[Act Three: Redemption at the Cross] God did not leave us to it. He came Himself. Jesus became a real man, and in the end was nailed to a cross. What He bore was not only the wrong we have done, but the nature inside us that insists on being master. It was an exchange: He took what we deserved, and we receive what He deserved.","【第四幕 復活的新生命】如果故事停在這裡，只是一個好人的悲劇。但第三天，墳墓空了。復活成就了第二件事——祂不只赦免你的過去，祂要給你一個全新的生命。舊人有己的生命被釘死了，新人無己的生命賜下來。保羅說：現在活著的不再是我，乃是基督在我裡面活著。":"[Act Four: New Life Through Resurrection] If the story stopped here it would be only the tragedy of a good man. But on the third day the tomb was empty. The resurrection accomplished a second thing — He does not merely forgive your past, He gives you a wholly new life. The old self-centred life was nailed to the cross; the new selfless life was given. Paul said: it is no longer I that live, but Christ lives in me.","【停一下】如果不是靠你更努力，而是有一個新生命被賜下來，這對你有沒有吸引力？":"[Pause] If this is not about you trying harder but about a new life being given to you, does that appeal to you at all?","【第五幕 讓耶穌作王】現在只剩一件事：你願不願意讓祂進來作王。祂不會硬闖，祂在門外敲門。信主不是先變好才能來，是願意就可以來。":"[Act Five: Letting Jesus Reign] One thing remains: whether you are willing to let Him in to reign. He will not force His way; He knocks at the door. Believing is not improving first and then coming. If you are willing, you may come.","【誠實說明】我也要老實告訴你：信主不保證從此順利，有時候家人還會反對。但你會多一位永不離開的同伴，而且你的生命會真的開始不一樣。":"[An honest word] I should tell you plainly: believing does not guarantee smooth sailing, and sometimes family will object. But you will gain a companion who never leaves, and your life really will begin to be different.","【邀請】所以我想問你一句話——你願意現在就接受祂嗎？":"[Invitation] So let me ask you one question — would you be willing to receive Him now?","【先聽，不先講】今天我不急著講什麼，我想先聽你說。可以跟我說說，你這一路走來，最辛苦的是哪一段嗎？":"[Listen first, speak later] I am in no hurry to say anything today; I would rather listen to you first. Would you tell me which stretch of the road has been hardest for you?","【接住他】（他說的時候不要急著給答案，也不要急著轉入信仰。真的聽完，並且回應他的感受。）":"[Catch him] (While he speaks, do not rush to answer and do not rush to turn the conversation to faith. Really hear him out, and respond to what he is feeling.)","【切入】謝謝你願意跟我說這些。其實我以前也有一段很類似的日子，我想跟你說說那時候發生在我身上的事。":"[Moving in] Thank you for telling me this. I once went through a stretch very like it, and I would like to tell you what happened to me then.","【個人見證】（在這裡插入你自己的三分鐘見證：信主前的我／遇見主的關鍵／現在的改變。）":"[Personal testimony] (Insert your own three-minute testimony here: who I was before Christ / how I met the Lord / what has changed now.)","【第一幕】我後來才明白，人心裡那個填不滿的空，是有來歷的。聖經說人是照著神的形像造的，我們本來就是為一位神造的。":"[Act One] Only later did I understand that the emptiness inside us has a history. The Bible says man was made in God's image — we were made for a God in the first place.","【第二幕】而我們的問題也有一個很準確的診斷。不是「你做了什麼壞事」，是「我要自己作主」。聖經稱它為罪，這個「有己」把人跟神隔開，也把人跟人隔開。我自己就是最好的例子——（舉一個你自己想控制、想贏的真實例子）。":"[Act Two] And our problem has a very precise diagnosis. It is not “what wrong have you done” but “I will be my own master.” The Bible calls it sin, and this self cuts man off from God and from other people. I am the best example of it myself — (give a real instance of your own wanting control or wanting to win).","【第三幕】神的辦法不是要我改進，是祂親自來替我死。十字架上，祂處理的不只是我做過的錯事，是我這個人的老我。":"[Act Three] God's answer was not to make me improve. He came in person to die in my place. At the cross He dealt not only with the wrong I had done, but with the old self that I am.","【第四幕】而祂復活了。這一點對我最關鍵——因為我試過靠自己變好，我做不到。祂復活是要把祂的生命給我，讓基督在我裡面活。":"[Act Four] And He rose. That is the crucial point for me, because I had tried to get better on my own and I could not. He rose in order to give me His life, so that Christ might live in me.","【第五幕】所以現在祂站在你的門外敲門。祂不會闖進來，祂等你開。":"[Act Five] So now He stands knocking at your door. He will not break in. He waits for you to open.","【誠實說明代價】我不想騙你說信了就一路順風。可能有人不理解你，有些習慣要慢慢改。但我可以跟你保證兩件事：你不再是一個人，而且你會親眼看見自己變得不一樣。":"[Naming the cost honestly] I do not want to tell you it will all be plain sailing once you believe. Some people may not understand you, and some habits will take time to change. But I can promise you two things: you will no longer be alone, and you will see with your own eyes that you are becoming different.","【明確邀請】我想正式地問你一次：你願意現在把生命的主權交給耶穌嗎？如果願意，我可以帶你做一個很簡單的禱告。":"[A clear invitation] Let me ask you formally, once: would you be willing to hand the rule of your life over to Jesus now? If you are, I can lead you in a very simple prayer.","【若他說還沒準備好】完全沒關係，我等你。我會繼續為你禱告，我們照樣是朋友。":"[If he says he is not ready] That is completely all right. I will wait for you. I will keep praying for you, and we are friends just the same.","信主之後會怎樣：福分與代價都要說":"What Follows Believing: Name Both the Blessings and the Cost","罪得赦免，與神和好，不再需要靠表現換取被愛。":"Sins forgiven, peace with God, and no more earning love by performance.","有一位永不離開的同在，最難的時候也不再一個人。":"A presence that never leaves, so that even in the hardest hour you are not alone.","得著新的生命，那些你戒不掉的，開始鬆動。":"A new life given, and the things you could never quit begin to loosen.","進入一個屬靈的家，有一群人真心記念你。":"Entry into a spiritual family, with people who genuinely hold you in mind.","有永恆的盼望，死亡不再是句點。":"An eternal hope, so that death is no longer the full stop.","可能有家人不理解，甚至反對，需要時間與智慧。":"Family may not understand and may even object; this will take time and wisdom.","有些習慣、有些場合，你會漸漸不想再去。":"Certain habits and certain gatherings you will gradually stop wanting.","苦難不會消失，只是你不再獨自面對。":"Suffering does not disappear; you simply no longer face it alone.","需要委身：讀經、禱告、聚會，都要花時間。":"It calls for commitment: Scripture, prayer and gathering all take time.","會被要求誠實面對自己，那有時候很不舒服。":"You will be asked to face yourself honestly, and that is sometimes uncomfortable.","生活":"Everyday life","意義":"Meaning","情緒":"Emotions","信仰":"Faith","邀請":"Invitation","破冰問題":"Ice-breaker questions","你最近有沒有一件事，是想起來就覺得撐得很累的？":"Is there something on your mind lately that feels exhausting just to think about?","如果可以放下所有責任一個月，你最想做什麼？":"If you could set down every responsibility for a month, what would you most want to do?","你這幾年最大的改變是什麼？":"What is the biggest change in you over these last few years?","你跟家裡的關係，這幾年是變近了還是變遠了？":"Has your relationship with your family grown closer or more distant these last few years?","你小時候家裡最重視什麼？":"What did your family value most when you were small?","你最希望孩子將來成為怎樣的人？":"What sort of person do you most hope your child will become?","你覺得什麼樣的人生算是「值得」？":"What kind of life would you count as worthwhile?","如果只剩一年，你會怎麼過？":"If you had one year left, how would you spend it?","有沒有什麼事，是你一直想做卻沒去做的？":"Is there something you have always wanted to do and never done?","你覺得人死了以後會怎樣？":"What do you think happens to a person after death?","最近有沒有什麼事讓你睡不好？":"Has anything been keeping you from sleeping well lately?","難過的時候，你通常會找誰？":"When you are upset, who do you usually turn to?","你什麼時候會覺得自己最平靜？":"When do you feel most at peace with yourself?","你們家有拜拜的習慣嗎？通常是誰在張羅？":"Does your family keep the traditional observances? Who usually takes care of them?","你對宗教的印象是什麼？好的壞的都可以說。":"What impression do you have of religion? Good or bad, say either.","有沒有哪一次，你覺得好像有什麼在保守你？":"Was there ever a time when you felt something was watching over you?","你有沒有被哪個宗教的人傷過？":"Have you ever been hurt by someone from a religion?","如果真的有神，你最想問祂什麼？":"If there really is a God, what would you most want to ask Him?","我最近在讀一本書，裡面有一段我很想聽聽你的看法，可以嗎？":"I have been reading a book, and there is a passage I would really like your view on. May I?","我可以為你這件事禱告嗎？不用你信，就當我掛念你。":"May I pray about this for you? You need not believe anything — take it as my keeping you in mind.","・罪得赦免，與神和好，不再需要靠表現換取被愛。":"・Sins forgiven, peace with God, and no more earning love by performance.","・有一位永不離開的同在，最難的時候也不再一個人。":"・A presence that never leaves, so that even in the hardest hour you are not alone.","・得著新的生命，那些你戒不掉的，開始鬆動。":"・A new life given, and the things you could never quit begin to loosen.","・進入一個屬靈的家，有一群人真心記念你。":"・Entry into a spiritual family, with people who genuinely hold you in mind.","・有永恆的盼望，死亡不再是句點。":"・An eternal hope, so that death is no longer the full stop.","・可能有家人不理解，甚至反對，需要時間與智慧。":"・Family may not understand and may even object; this will take time and wisdom.","・有些習慣、有些場合，你會漸漸不想再去。":"・Certain habits and certain gatherings you will gradually stop wanting.","・苦難不會消失，只是你不再獨自面對。":"・Suffering does not disappear; you simply no longer face it alone.","・需要委身：讀經、禱告、聚會，都要花時間。":"・It calls for commitment: Scripture, prayer and gathering all take time.","・會被要求誠實面對自己，那有時候很不舒服。":"・You will be asked to face yourself honestly, and that is sometimes uncomfortable.","希伯來書十一章3節":"Hebrews 11:3","我們因著信，就知道諸世界是藉神話造成的；這樣，所看見的，並不是從顯然之物造出來的。":"By faith we understand that the universe has been framed by the word of God, so that what is seen has not been made out of things which are visible.","創世記一章1節":"Genesis 1:1","起初，神創造天地。":"In the beginning, God created the heavens and the earth.","耶利米書二十九章13節":"Jeremiah 29:13","你們尋求我，若專心尋求我，就必尋見。":"You shall seek me and find me, when you search for me with all your heart.","約翰福音十六章33節":"John 16:33","在世上，你們有苦難；但你們可以放心，我已經勝了世界。":"In the world you have trouble; but cheer up! I have overcome the world.","啟示錄二十一章4節":"Revelation 21:4","神要擦去他們一切的眼淚；不再有死亡，也不再有悲哀、哭號、疼痛，因為以前的事都過去了。":"He will wipe away every tear from their eyes. Death will be no more; neither will there be mourning, nor crying, nor pain any more, for the first things have passed away.","約翰福音十一章35節":"John 11:35","耶穌哭了。":"Jesus wept.","羅馬書八章28節":"Romans 8:28","我們曉得萬事都互相效力，叫愛神的人得益處。":"We know that all things work together for good for those who love God.","哥林多後書十二章9節":"2 Corinthians 12:9","我的恩典夠你用的，因為我的能力是在人的軟弱上顯得完全。":"My grace is sufficient for you, for my power is made perfect in weakness.","馬太福音二十四章35節":"Matthew 24:35","天地要廢去，我的話卻不能廢去。":"Heaven and earth will pass away, but my words will not pass away.","提摩太後書三章16節":"2 Timothy 3:16","聖經都是神所默示的，於教訓、督責、使人歸正、教導人學義都是有益的。":"Every Scripture is God-breathed and profitable for teaching, for reproof, for correction, and for instruction in righteousness.","路加福音一章3節":"Luke 1:3","這些事我既從起頭都詳細考察了，就定意要按著次序寫給你。":"It seemed good to me also, having traced the course of all things accurately from the first, to write to you in order.","以賽亞書四十章8節":"Isaiah 40:8","草必枯乾，花必凋殘，惟有我們神的話必永遠立定。":"The grass withers, the flower fades; but the word of our God stands forever.","出埃及記三十四章6節":"Exodus 34:6","耶和華，耶和華，是有憐憫有恩典的神，不輕易發怒，並有豐盛的慈愛和誠實。":"Yahweh, Yahweh, a merciful and gracious God, slow to anger, and abundant in loving kindness and truth.","約翰福音十四章6節":"John 14:6","耶穌說：我就是道路、真理、生命；若不藉著我，沒有人能到父那裡去。":"Jesus said to him, “I am the way, the truth, and the life. No one comes to the Father, except through me.”","創世記十八章25節":"Genesis 18:25","審判全地的主豈不行公義嗎？":"Shall not the Judge of all the earth do right?","啟示錄二十二章17節":"Revelation 22:17","口渴的人也當來；願意的，都可以白白取生命的水喝。":"He who is thirsty, let him come. He who desires, let him take the water of life freely.","羅馬書七章18節":"Romans 7:18","立志為善由得我，只是行出來由不得我。":"For desire is present with me, but I don't find it doing that which is good.","約翰福音十章11節":"John 10:11","我是好牧人，好牧人為羊捨命。":"I am the good shepherd. The good shepherd lays down his life for the sheep.","你怎麼證明有神？":"How can you prove there is a God?","神不是實驗室裡的一個物件，祂是萬有的源頭。我們證明祂，不是把祂放上天平，而是看見祂留下的痕跡：宇宙的秩序、生命的奧妙、人心裡那把是非的尺。":"God is not an object in a laboratory; He is the source of all things. We do not prove Him by putting Him on a scale, but by seeing the traces He has left: the order of the universe, the wonder of life, and the ruler of right and wrong inside the human heart.","你走進一間屋子，桌上茶還溫著，燈亮著，門是關上的。你不會說「這屋子從來沒有人」，你會說「剛剛有人在」。宇宙就是那間屋子。":"You walk into a house. The tea on the table is still warm, the lamp is on, the door is shut. You do not say “nobody has ever been here.” You say “someone was here a moment ago.” The universe is that house.","如果真的有一位神，你希望祂是怎樣的一位神？":"If there really is a God, what kind of God would you hope He is?","科學能不能證明神？":"Can science prove God?","科學回答「怎麼運作」，信仰回答「為什麼存在」。科學不能證明神，正如顯微鏡不能證明母愛——不是母愛不存在，是工具用錯了。":"Science answers how things work; faith answers why they exist. Science cannot prove God, just as a microscope cannot prove a mother's love. It is not that the love is absent; it is that the wrong instrument was used.","把一鍋湯拿去化驗，可以驗出鹽分、脂肪、蛋白質，卻驗不出「這是媽媽煮的」。驗不出來，不代表沒有媽媽。":"Send a pot of soup to the laboratory and you can measure the salt, the fat and the protein, but you cannot measure “my mother made this.” Failing to measure it does not mean there is no mother.","你生命裡最重要的那些事——愛、意義、值不值得——有哪一件是靠科學證明才相信的？":"Of the things that matter most in your life — love, meaning, whether something is worth it — which one did you believe only after science proved it?","宇宙是怎麼來的？":"Where did the universe come from?","科學告訴我們宇宙有一個開始，那就表示它不是自有的。凡有開始的，必有使它開始的。基督信仰說：那位使它開始的，就是神。":"Science tells us the universe had a beginning, which means it is not self-existent. Whatever has a beginning must have something that began it. The Christian faith says the One who began it is God.","一列火車，第一節車廂被第二節推動，第二節被第三節推動……推到最後你總得問：最前面那一節，是誰發動的？總要有一個不需要被推的推動者。":"On a train, the first carriage is pushed by the second, the second by the third, and so on. Eventually you must ask: what set the front one moving? There has to be a mover that needs no pushing.","你覺得「一切都是偶然」和「一切都有心意」，哪一個比較需要信心？":"Which do you think takes more faith — that everything is accidental, or that everything is intended?","我為什麼感覺不到神？":"Why can't I feel God?","感覺不到，不代表不存在，很多時候是因為我們忙到聽不見，或者心裡有一堵牆。神從來沒有離開，只是我們把祂關在門外。":"Not feeling something does not mean it is not there. Often we are simply too busy to hear, or there is a wall inside. God has never left; we have shut Him outside the door.","收音機一直有訊號，是我們沒有調到那個頻道。頻道不對，不是電台沒播音。":"The radio signal is always there; we have simply not tuned to the station. The wrong dial does not mean the station stopped broadcasting.","如果有一天你真的感覺到了，你願意怎麼回應祂？":"If one day you really did sense Him, how would you want to respond?","如果有神，為何祂不現身？":"If there is a God, why doesn't He show Himself?","祂現身過。兩千年前，祂成為一個嬰孩降生，走在人群中間，最後為我們死在十字架上。神不是躲起來，是走進來。":"He has shown Himself. Two thousand years ago He was born a child, walked among crowds, and finally died for us on a cross. God has not hidden Himself away; He walked in.","如果太陽為了讓螞蟻看清楚它，直接靠過來，螞蟻不會看見太陽，只會被燒掉。所以太陽選擇成為一道溫暖的光。耶穌就是那道光。":"If the sun came close so that an ant could see it clearly, the ant would not see the sun — it would simply burn. So the sun chose instead to become a warm ray of light. Jesus is that light.","如果神真的來過，而且是以受苦的方式來的，這跟你原本想像的神有什麼不一樣？":"If God really did come, and came by way of suffering, how is that different from the God you had imagined?","好人為什麼受苦？":"Why do good people suffer?","苦難不是神的懲罰清單，是這個已經破碎的世界的共同處境。福音真正的答案不是解釋苦難，而是神自己親身走進苦難，與我們一同承受。":"Suffering is not God's list of punishments; it is the shared condition of a world already broken. The gospel's real answer is not an explanation of suffering, but that God walked into it Himself and bore it alongside us.","孩子半夜發燒，父母給的不是一篇「為什麼會發燒」的論文，是整夜守在床邊的那隻手。神給我們的，是那隻手。":"When a child runs a fever at midnight, what the parents give is not an essay on the causes of fever but a hand that stays by the bed all night. What God gives us is that hand.","你現在最想有人陪你走過的，是哪一段？":"Right now, which stretch of the road would you most like someone to walk with you through?","神為何不阻止災難？":"Why doesn't God stop disasters?","神給了人真實的自由，而自由必然帶著被濫用的可能。祂沒有選擇做一個把人變成木偶的神，祂選擇了在災難中與人同在，並要在末了更新一切。":"God gave man real freedom, and freedom necessarily carries the possibility of abuse. He did not choose to be a God who turns people into puppets. He chose to be present with people in disaster, and to make all things new at the last.","父母若把孩子鎖在家裡一輩子，孩子確實不會受傷，但那也不叫人生了。愛必須冒險，因為愛只能在自由裡發生。":"If parents locked a child indoors for life, the child would indeed never be hurt — but that would not be a life either. Love must take risks, because love can only happen where there is freedom.","你希望神現在就把所有惡都除掉嗎？那你我會不會也在那份名單上？":"Would you want God to remove all evil right now? And if He did, might you and I be on that list too?","我的家人早逝，神在哪裡？":"My family member died young. Where was God?","祂就在你哭的地方。聖經裡耶穌站在朋友的墳墓前，明明知道下一刻要叫他復活，仍然先哭了。神不是站在遠處看你痛，祂是陪你一起痛的那一位。":"He was in the place where you wept. In the Bible, Jesus stood before His friend's tomb knowing He was about to raise him — and He wept first anyway. God does not stand at a distance watching you hurt. He is the One who hurts alongside you.","最深的安慰從來不是一句「別難過了」，是有人坐下來，什麼也不說，陪你到天亮。":"The deepest comfort has never been “don't be sad.” It is someone sitting down, saying nothing, and staying with you until morning.","願意跟我說說他是個怎樣的人嗎？我想認識他。":"Would you tell me what he was like? I would like to know him.","神既全能又全善，為何有惡？":"If God is all-powerful and all-good, why is there evil?","惡不是神造的一樣東西，惡是「善的缺席」，是受造者離開本位、要自己作主的結果。神容許惡存在一段時間，是因為祂要的不是機器人，是願意愛祂的兒女。":"Evil is not a thing God made. Evil is the absence of good — the result of a creature leaving his proper place and insisting on being his own master. God permits evil to exist for a time because what He wants is not robots but children who are willing to love Him.","黑暗不是一種物質，是沒有光。冷不是一種能量，是沒有熱。惡也一樣——它是人離開神以後留下的那個空洞。":"Darkness is not a substance; it is the absence of light. Cold is not an energy; it is the absence of heat. Evil is the same — it is the hollow left behind when man walked away from God.","你心裡真正在意的，是「惡為什麼存在」這個問題，還是某一件具體發生在你身上的事？":"What is really weighing on you — the question of why evil exists, or one particular thing that happened to you?","我信了就不會受苦嗎？":"If I believe, will I stop suffering?","不會。信耶穌不是買保險，是換一個生命。苦難仍會來，但你不再是一個人面對，而且苦難在祂手中會成為造就你的東西。":"No. Believing in Jesus is not buying insurance; it is exchanging one life for another. Suffering will still come, but you will no longer face it alone, and in His hands suffering becomes something that builds you.","同樣一場大雨，沒傘的人是災難，有傘的人也一樣淋到風、聽到雷，但他能走完那條路。信仰不是取消雨，是給你走下去的力量。":"In the same downpour, a man without an umbrella meets disaster. A man with one still feels the wind and hears the thunder, but he can finish the road. Faith does not cancel the rain; it gives you the strength to keep walking.","如果苦難不會消失，但你有一位永遠不離開的同伴，這樣的信仰對你有意義嗎？":"If suffering will not disappear, but you had a companion who never leaves, would that kind of faith mean anything to you?","為何禱告沒有得到答應？":"Why hasn't my prayer been answered?","神對禱告的回答有三種：好、等一等、我有更好的。沒有一種是「不理你」。有時候祂不改變環境，是因為祂要先改變我們。":"God's answers to prayer come in three forms: yes, wait, and I have something better. Not one of them is being ignored. Sometimes He does not change the circumstances because He means to change us first.","孩子要一把水果刀，爸爸沒有給。不是爸爸不愛他，是爸爸看得比較遠。":"A child asks for a fruit knife and his father does not give it. It is not that the father does not love him; the father simply sees further.","你最近最想求神成就的那件事，可以跟我說嗎？我想陪你一起求。":"What is the thing you most want God to do for you at the moment? Tell me, and I would like to ask for it with you.","聖經被人改過嗎？":"Has the Bible been altered?","聖經是古代抄本數量最多、年代最早的文獻。死海古卷發現的以賽亞書抄本，比原先所有的抄本早了一千年，內容卻幾乎一模一樣。它經得起檢驗。":"The Bible has more ancient manuscripts, and earlier ones, than any other document from antiquity. The scroll of Isaiah found among the Dead Sea Scrolls is a thousand years older than any manuscript we previously had, and its contents are almost identical. It stands up to examination.","一份文件如果只有一份，改了沒人知道。但如果同一份文件散在幾千個地方、幾百種語言、幾個世紀，任何人想改，立刻就被對出來。聖經就是這種情況。":"If a document exists in one copy, it can be altered and nobody will know. But if the same document is spread over thousands of places, hundreds of languages and several centuries, any alteration is caught immediately by comparison. That is the Bible's situation.","如果聖經真的可信，你最想先看哪一卷？我可以陪你讀。":"If the Bible really is reliable, which book would you want to read first? I could read it with you.","聖經裡的矛盾怎麼解釋？":"How do you explain the contradictions in the Bible?","多數所謂的矛盾，來自角度不同或文體不同，就像四個人描述同一場車禍。真正難解的地方確實有，但沒有一處動搖福音的核心。":"Most so-called contradictions come from different vantage points or different literary forms, like four people describing the same traffic accident. Genuinely difficult passages do exist, but not one of them shakes the core of the gospel.","四個證人若說得一字不差，法官反而要懷疑他們串供。細節有差異，主軸卻一致，這才是真實的見證。":"If four witnesses gave word-for-word identical accounts, the judge would suspect collusion. Differing in detail while agreeing on the main line — that is what real testimony looks like.","你讀到哪一段覺得對不起來？我們一起查查看，我也想知道。":"Which passage did you find did not add up? Let us look into it together; I would like to know too.","聖經只是古人的神話嗎？":"Isn't the Bible just ancient mythology?","神話沒有地名、沒有年代、沒有可查證的人物。聖經卻滿是可考的君王、城市、碑文與年份，它把自己交給歷史檢驗。":"Myths have no place names, no dates, no verifiable people. The Bible is full of kings, cities, inscriptions and years that can be checked. It submits itself to historical examination.","神話開頭是「很久很久以前，在一個遙遠的國度」；路加福音開頭是「該撒亞古士督在位的時候，居里扭作敘利亞巡撫」。這是新聞的寫法，不是童話的寫法。":"A myth opens with “long, long ago, in a faraway kingdom.” Luke opens with “in the days of Caesar Augustus, when Quirinius was governor of Syria.” That is how news is written, not fairy tales.","如果它真的是歷史，而不是故事，這對你會有差別嗎？":"If it really is history rather than story, would that make a difference to you?","為什麼有那麼多版本？":"Why are there so many versions?","版本多是因為翻譯多、語言在變，不是因為內容被改。就像同一本書有不同譯者，原文卻只有一份。":"There are many versions because there are many translations and because languages change, not because the contents were altered. One book may have several translators, but there is only one original.","同一首歌，有人用鋼琴彈，有人用吉他唱，曲子沒有變。譯本是樂器，原文是曲譜。":"The same song may be played on a piano or sung with a guitar; the song itself has not changed. Translations are the instruments; the original is the score.","你想從哪一本開始讀？我推薦和合本或現代中文譯本，看你讀哪個順。":"Which edition would you like to start with? I would suggest whichever reads more easily for you.","舊約的神為何那麼嚴厲？":"Why is the God of the Old Testament so severe?","舊約的神和新約的神是同一位。祂的嚴厲從來針對的是壓迫、殘忍與獻嬰的邪惡，而祂的耐心，是等了幾百年才動手。同一位神，最後選擇讓自己的兒子承受一切審判。":"The God of the Old Testament and the God of the New are one and the same. His severity was always aimed at oppression, cruelty and the evil of child sacrifice, and His patience was such that He waited centuries before acting. And in the end that same God chose to let His own Son bear all the judgement.","一個對癌症不動刀的醫生，不叫慈愛，叫失職。神的嚴厲，是祂對邪惡認真；祂的十字架，是祂對我們認真。":"A doctor who will not operate on cancer is not kind; he is negligent. God's severity is Him taking evil seriously; God's cross is Him taking us seriously.","你比較介意一位對惡不聞不問的神，還是一位會處理惡的神？":"Which would trouble you more — a God who ignores evil, or a God who deals with it?","條條大路通羅馬，為何只有基督教？":"All roads lead to Rome — so why only Christianity?","問題不在哪條路，在於「誰走得動」。所有宗教都在教人怎麼爬上去見神，只有福音說：神自己走下來找人。這不是同一種東西的競爭，是兩個方向。":"The question is not which road, but who is able to walk it. Every religion teaches people how to climb up to God; only the gospel says God came down to find people. These are not competitors of the same kind; they run in opposite directions.","掉進深井的人，井上遞下來的繩子只有一條——不是因為繩子霸道，是因為別的都是畫在牆上的。":"For a man fallen down a deep well, only one rope is lowered — not because the rope is domineering, but because the others are painted on the wall.","你會怎麼描述你心中那位神？我很想知道你是怎麼想的。":"How would you describe the God in your own mind? I would really like to know what you think.","沒聽過福音的人怎麼辦？":"What about people who have never heard the gospel?","神是公義的，祂必按各人所領受的光審判，我們可以把這一題安心交給祂。但有一件事我很確定：你已經聽見了，所以這一題現在其實是關於你。":"God is just, and He will judge each person by the light that person received; we can leave that question with Him without anxiety. But of one thing I am certain: you have now heard. So this question has actually become a question about you.","船難時救生艇來了，你不會先問「還沒被找到的人怎麼辦」，你會先上船，然後幫忙划回去找人。":"When the lifeboat arrives at a shipwreck, you do not first ask what will happen to those not yet found. You get in, and then you help row back to look for them.","既然你已經聽見了，你打算怎麼回應？":"Now that you have heard, how do you intend to respond?","基督教是不是太排他？":"Isn't Christianity too exclusive?","真理本來就有排他性，2＋2＝4 就排斥了 5，這不叫傲慢，叫誠實。但基督信仰在「誰可以來」這件事上，是全世界最包容的——不論你是誰、做過什麼，都可以來。":"Truth is exclusive by nature. Two plus two making four excludes five, and that is not arrogance but honesty. Yet on the question of who may come, the Christian faith is the most inclusive in the world — whoever you are and whatever you have done, you may come.","醫院只用有效的藥，這叫排他；但醫院不挑病人，這叫包容。福音在真理上專一，在人的身上全開。":"A hospital uses only medicines that work — that is exclusive. A hospital turns away no patient — that is inclusive. The gospel is singular about truth and wide open about people.","你覺得一個「什麼都可以」的信仰，還救得了人嗎？":"Do you think a faith in which anything goes could still save anyone?","各宗教都教人向善不是一樣嗎？":"Don't all religions teach people to be good — isn't that the same thing?","教人向善的多，能給人新生命的只有一位。問題不在我們不知道該行善，而在我們知道卻做不到。福音處理的正是這個做不到。":"Many teach people to be good; only One can give a person new life. The problem is not that we do not know we should do good, but that we know and cannot do it. What the gospel deals with is precisely that cannot.","所有的健身教練都叫你早起運動，這不難懂。難的是明天早上六點，你起不起得來。福音不是再給一張課表，是換一顆心。":"Every fitness coach tells you to get up early and exercise; that is not hard to understand. What is hard is whether you actually get up at six tomorrow morning. The gospel does not hand you another timetable; it exchanges your heart.","有沒有哪一件事，你明明知道該做，卻怎麼樣都做不到？":"Is there something you know perfectly well you should do, and simply cannot?","我拜的神也很靈驗":"The god I worship answers me too","靈驗不等於真實，能力也不等於良善。真正要問的不是「靈不靈」，是「祂愛不愛你、祂為你付過什麼代價」。":"Getting results is not the same as being real, and power is not the same as goodness. The real question is not whether it works, but whether he loves you and what he has ever paid for you.","願意借錢給你的人很多，願意為你去死的只有一個。你會把一生託給哪一個？":"Many people are willing to lend you money; only one is willing to die for you. To which would you entrust your life?","你所拜的那一位，曾經為你付出過什麼嗎？":"The one you worship — has he ever paid anything for you?","馬可福音二章17節":"Mark 2:17","康健的人用不著醫生，有病的人才用得著。我來本不是召義人，乃是召罪人。":"Those who are healthy have no need for a physician, but those who are sick. I came not to call the righteous, but sinners to repentance.","馬太福音七章20節":"Matthew 7:20","所以，憑著他們的果子就可以認出他們來。":"Therefore by their fruits you will know them.","哥林多後書九章7節":"2 Corinthians 9:7","各人要隨本心所酌定的，不要作難，不要勉強，因為捐得樂意的人是神所喜愛的。":"Let each man give according as he has determined in his heart, not grudgingly or under compulsion, for God loves a cheerful giver.","詩篇三十四篇18節":"Psalm 34:18","耶和華靠近傷心的人，拯救靈性痛悔的人。":"Yahweh is near to those who have a broken heart, and saves those who have a crushed spirit.","希伯來書十章25節":"Hebrews 10:25","你們不可停止聚會，好像那些停止慣了的人，倒要彼此勸勉。":"Not forsaking our own assembling together, as the custom of some is, but exhorting one another.","彼得後書三章8節":"2 Peter 3:8","主看一日如千年，千年如一日。":"One day is with the Lord as a thousand years, and a thousand years as one day.","路加福音一章37節":"Luke 1:37","因為出於神的話，沒有一句不帶能力的。":"For nothing spoken by God is impossible.","詩篇八篇3至4節":"Psalm 8:3-4","我觀看你指頭所造的天，並你所陳設的月亮星宿，便說：人算甚麼，你竟顧念他？":"When I consider your heavens, the work of your fingers, the moon and the stars, which you have ordained, what is man, that you think of him?","以弗所書六章2至3節":"Ephesians 6:2-3","要孝敬父母，使你得福，在世長壽。這是第一條帶應許的誡命。":"Honour your father and mother, that it may be well with you and you may live long on the earth. This is the first commandment with a promise.","彼得前書三章1節":"1 Peter 3:1","你們作妻子的要順服自己的丈夫；這樣，若有不信從道理的丈夫，他們雖然不聽道，也可以因妻子的品行被感化過來。":"Wives, be in subjection to your own husbands, so that even if any don't obey the word, they may be won by the behaviour of their wives without a word.","帖撒羅尼迦前書四章13節":"1 Thessalonians 4:13","論到睡了的人，我們不願意弟兄們不知道，恐怕你們憂傷，像那些沒有指望的人一樣。":"But we don't want you to be ignorant, brothers, concerning those who have fallen asleep, so that you don't grieve like the rest, who have no hope.","傳道書七章2節":"Ecclesiastes 7:2","往遭喪的家去，強如往宴樂的家去，因為死是眾人的結局，活人也必將這事放在心上。":"It is better to go to the house of mourning than to go to the house of feasting; for that is the end of all men, and the living should take this to heart.","耶利米書二十九章11節":"Jeremiah 29:11","耶和華說：我知道我向你們所懷的意念是賜平安的意念，不是降災禍的意念，要叫你們末後有指望。":"For I know the thoughts that I think toward you, says Yahweh, thoughts of peace, and not of evil, to give you hope and a future.","羅馬書十二章18節":"Romans 12:18","若是能行，總要盡力與眾人和睦。":"If it is possible, as much as it is up to you, be at peace with all men.","哥林多前書六章12節":"1 Corinthians 6:12","凡事我都可行，但不都有益處；凡事我都可行，但無論哪一件，我總不受它的轄制。":"All things are lawful for me, but not all things are expedient. All things are lawful for me, but I will not be brought under the power of anything.","以弗所書五章25節":"Ephesians 5:25","你們作丈夫的，要愛你們的妻子，正如基督愛教會，為教會捨己。":"Husbands, love your wives, even as Christ also loved the assembly and gave himself up for it.","馬太福音六章24節":"Matthew 6:24","一個人不能事奉兩個主……你們不能又事奉神，又事奉瑪門。":"No one can serve two masters… You can't serve both God and Mammon.","歌羅西書三章23節":"Colossians 3:23","無論做甚麼，都要從心裡做，像是給主做的，不是給人做的。":"Whatever you do, work heartily, as for the Lord and not for men.","基督徒為什麼很虛偽？":"Why are Christians such hypocrites?","你說得對，而且我自己也是其中一個。教會不是聖人的展示櫃，是病人的醫院。我們不是宣稱自己很好，是承認自己需要醫生。":"You are right, and I am one of them myself. The church is not a display case for saints; it is a hospital for the sick. We are not claiming to be good — we are admitting we need a doctor.","健身房裡都是身材還沒練好的人，那正是他們在那裡的原因。若有人因此嘲笑健身房，那反而奇怪了。":"A gym is full of people who are not yet in shape — which is exactly why they are there. It would be odd to mock a gym for that.","有沒有哪個基督徒傷過你？如果有，我想先為那件事跟你說抱歉。":"Has a Christian ever hurt you? If so, I would like to say sorry for that before anything else.","教會歷史上的黑暗怎麼說？":"What about the dark chapters of church history?","十字軍、獵巫、包庇——這些是真的，我們不辯護，也不遮掩。但要分清楚：那些事違背了耶穌的教導，不是實踐了祂的教導。要評斷一位老師，得看他自己怎麼活。":"The crusades, the witch hunts, the cover-ups — these are real, and we neither defend nor conceal them. But be clear about one thing: those acts contradicted the teaching of Jesus; they did not carry it out. To judge a teacher, you must look at how he himself lived.","有醫生犯錯害死人，我們追究那位醫生，不會廢掉醫學。看基督信仰要看耶穌本人，不是看每一個掛著祂名字的人。":"When a doctor's error kills a patient, we hold that doctor to account; we do not abolish medicine. To assess the Christian faith, look at Jesus Himself, not at everyone who has hung His name on the door.","如果把那些人先放一邊，單單看耶穌這個人，你怎麼看祂？":"If we set those people aside and look only at Jesus Himself, what do you make of Him?","教會是不是只要奉獻？":"Is the church only after donations?","聖經裡的奉獻是甘心樂意的回應，不是入場費。你可以一輩子不奉獻一塊錢，照樣被神愛、照樣得救。任何用金錢施壓的作法，都不是福音。":"In the Bible, giving is a glad response, not an entrance fee. You could give nothing your whole life and still be loved by God and still be saved. Any use of money as pressure is not the gospel.","你不會因為要送媽媽禮物才叫她媽媽。奉獻是關係的果子，不是關係的門票。":"You do not call your mother “mother” in order to give her a present. Giving is the fruit of the relationship, not the ticket into it.","如果去教會完全不用花一毛錢，你願意來看看嗎？":"If going to church cost you nothing at all, would you be willing to come and see?","我被教會的人傷害過":"I have been hurt by people in the church","我很難過，也不會替他辯解。人會讓你失望，這是真的。但求你別讓那個人擋住耶穌——傷你的是人，不是主。":"I am sorry, and I will not make excuses for him. People will let you down; that is true. But please do not let that person stand between you and Jesus — it was a person who hurt you, not the Lord.","被燙過的人怕熱水，這很正常。但我們不會因此一輩子不洗澡，只是需要有人先幫你把水溫調好。":"Someone who has been scalded is wary of hot water, and rightly so. But we do not stop washing for life because of it; we simply need someone to get the temperature right for us first.","你願意跟我說說當時發生了什麼嗎？我只想聽，不會替誰說話。":"Would you tell me what happened? I only want to listen. I will not be speaking up for anyone.","我可以信耶穌但不去教會嗎？":"Can I believe in Jesus without going to church?","可以得救，但會長不大。信仰不是私人嗜好，是進入一個家。一根柴自己燒，很快就滅了。":"You can be saved, but you will not grow. Faith is not a private hobby; it is entering a family. A log burning by itself goes out quickly.","一個新生兒可以自己活嗎？活得下來，但沒有家人抱他、餵他、教他說話，他長不成一個完整的人。":"Can a newborn survive alone? He might stay alive, but with no family to hold him, feed him and teach him to speak, he will not grow into a whole person.","如果有一個地方，你來了不會被推銷、不會被追問，只是有人陪你吃頓飯，你願意試一次嗎？":"If there were a place where nobody sold you anything and nobody interrogated you — where someone simply shared a meal with you — would you try it once?","進化論與創造論怎麼看？":"How should we view evolution and creation?","聖經關心的是「誰造的、為什麼造」，不是「用幾種方法造」。基督徒在過程的細節上有不同看法，但都同意一件事：這一切背後有一位有心意的創造者，而人是照著祂的形像造的。":"The Bible's concern is who made it and why, not by how many methods. Christians differ over the details of the process, but all agree on one thing: behind all of it stands a Creator with intention, and man was made in His image.","一幅畫，你可以研究顏料的成分、筆觸的順序，那是科學；但「這幅畫是誰畫的、想說什麼」，顏料回答不了。":"With a painting you can study the composition of the pigments and the order of the brushstrokes — that is science. But who painted it and what it means is something the pigments cannot answer.","如果人真的是被有心意地造出來的，那對你自己的價值會有什麼影響？":"If a person really was made on purpose, what would that do to your sense of your own worth?","六日創造是真的嗎？":"Was the creation really six days?","「日」在希伯來文可指二十四小時，也可指一段時期。忠心的基督徒對此有不同理解，這不是得救的關鍵。關鍵是第一句：起初神創造。":"The Hebrew word for day can mean twenty-four hours or a period of time. Faithful Christians understand this differently, and it is not what salvation turns on. What matters is the first line: in the beginning, God created.","你問媽媽「這鍋湯燉多久」，她說「燉了一整天」。你不會拿碼表去核對她講的是不是二十四小時整。文體決定讀法。":"You ask your mother how long the soup was simmering and she says “all day.” You do not reach for a stopwatch to check whether she means a full twenty-four hours. The kind of writing decides the kind of reading.","撇開時間長短，你覺得「宇宙有一位創造者」這件事本身，合不合理？":"Setting the length of time aside, does the idea that the universe has a Creator strike you as reasonable in itself?","神蹟合乎理性嗎？":"Are miracles rational?","如果神存在，神蹟就一點也不奇怪；如果神不存在，才需要解釋。神蹟不是打破規律，是規律的訂立者在特定時刻親自介入。":"If God exists, miracles are not strange at all; it is if God does not exist that they need explaining. A miracle does not break the laws — it is the One who set the laws stepping in at a particular moment.","球在桌上滾，遵守物理定律；我伸手把球接住，也沒有違反物理，只是有一隻手介入了。神就是那隻手。":"A ball rolls across a table obeying the laws of physics. I reach out and catch it — no law is broken; a hand has simply intervened. God is that hand.","最大的神蹟其實是一個人從死裡復活。如果那件事是真的，你會怎麼想？":"The greatest miracle is really a man rising from the dead. If that actually happened, what would you make of it?","宇宙這麼大，有外星人嗎？":"The universe is so vast — are there aliens?","聖經沒有說有，也沒有說沒有，這不是它要回答的問題。但它非常清楚地說：在這顆星球上，神為了你，願意付上祂兒子的性命。":"The Bible neither affirms nor denies it; that is not the question it set out to answer. But it says with great clarity that on this planet, for you, God was willing to spend the life of His Son.","宇宙很大，不代表你很小。母親有十個孩子，不會讓她對其中一個的愛少十分之一。":"A vast universe does not make you small. A mother with ten children does not love any one of them a tenth less.","在這麼大的宇宙裡，如果真的有一位神特別記得你的名字，你會有什麼感覺？":"In a universe this size, if there really were a God who remembered your name in particular, how would that feel?","信了就不能拜祖先，算不算不孝？":"If believing means no longer making offerings to my ancestors, is that not unfilial?","基督徒非常敬重祖先，只是不用祭拜的方式。我們仍然掃墓、追思、講述長輩的故事、照顧在世的父母——聖經把孝敬父母列為十誡之一。改變的是形式，不是那份心。":"Christians hold their ancestors in deep honour; we simply do not do it by way of sacrificial offerings. We still tend the graves, hold remembrances, tell the stories of our elders and care for the parents who are still living — Scripture places honouring father and mother among the Ten Commandments. What changes is the form, not the heart behind it.","父母在世時你天天噓寒問暖，勝過過世後燒一屋子的房子。真正的孝，是活著的時候給的。":"Asking after your parents' comfort every day while they live is worth more than burning a whole paper house after they are gone. Real filial devotion is given while they are still here.","你們家最看重的是哪一項禮俗？我想先了解，再一起想怎麼做既合宜又不失敬意。":"Which of the observances does your family hold most dear? I would like to understand it first, and then think together about how to do it in a way that is both proper and respectful.","家人強烈反對怎麼辦？":"What if my family strongly objects?","先別急著辯論，先讓他們看見你變好了。當媳婦更孝順、丈夫更顧家、脾氣變柔和，反對的力道會自己軟下來。真理靠講，生命靠活。":"Do not rush into argument. Let them see first that you have changed for the better. When a daughter-in-law grows more devoted, a husband more attentive to his home, a temper more gentle, the force of the objection softens on its own. Truth is spoken; life is lived.","推一扇上鎖的門，越用力越推不開。但你把屋子裡的燈打開，屋外的人自然會靠過來。":"The harder you push a locked door, the more firmly it stays shut. But turn on the lamp inside the house and the people outside come closer of their own accord.","他們最擔心的是什麼？是怕你被騙、怕你不管家裡，還是怕別人的眼光？":"What are they most afraid of? That you are being deceived, that you will neglect the family, or what other people will say?","喪禮怎麼辦？":"What about funerals?","基督教喪禮一樣莊重、一樣盡孝，只是用追思禮拜取代祭拜的部分。多數殯葬業者都很熟悉，可以事先跟家人溝通好流程，減少誤會。":"A Christian funeral is just as solemn and just as devoted; a memorial service simply takes the place of the sacrificial rites. Most funeral directors are familiar with this. Agreeing the order of service with the family beforehand prevents a great deal of misunderstanding.","同樣是送別，有人是揮手說再見，有人是揮手說永別。基督徒的告別式裡，有淚水，也有再見面的盼望。":"Both are farewells, but one waves and says goodbye for now, the other waves and says goodbye forever. At a Christian farewell there are tears, and also the hope of meeting again.","家裡是誰在主持這些事？也許可以先跟他好好聊一次。":"Who in your family takes charge of these matters? It might be worth having a proper conversation with him first.","清明節怎麼辦？":"What about the tomb-sweeping festival?","照樣去掃墓、整理墓園、獻花、追思、講長輩的故事、全家一起禱告感恩。基督徒不缺席清明，只是不燒香不祭拜。":"Go to the graves as always — tidy the plot, lay flowers, remember, tell the stories of your elders, and give thanks together as a family in prayer. Christians do not absent themselves from the festival;
