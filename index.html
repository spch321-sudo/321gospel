n the church within six weeks, the chance of losing him is very high. What matters at this stage is not the curriculum but the transplanting of relationships.","橫式 16:9":"Landscape 16:9","方形 1:1":"Square 1:1","直式 4:5":"Portrait 4:5","儲存圖片":"Save image","分享":"Share","若沒有出現分享選單，請先儲存圖片，再從相簿傳到 LINE。":"If no share sheet appears, save the image first and send it from your photo library.","先給他一句話":"Give him one sentence first","撒種階段最自然的一步：把一句適合他現在處境的話，做成一張圖傳給他。 不講道理，只送一句祝福。":"The most natural step while sowing: take a sentence that fits where he is, make it into an image, and send it. No argument — just a blessing.","傳出去之前，先為他禱告一分鐘。 是聖靈感動人，不是圖片。":"Before sending, pray for him for one minute. It is the Spirit who moves people, not the picture.","做成圖卡":"Make a card","誠實一點就好，不必寫得好看。 寫完可以複製，傳給你的同伴，或當面一題一題談。":"Just be honest; it need not read well. When you are done you can copy it, send it to your companion, or go through it together face to face.","複製給同伴":"Copy for your companion","提醒：談到別人的事時，請只說你自己的部分。":"A reminder: when another person comes up, speak only of your own part.","（可以只寫一行）":"(One line is fine)","要不要把名單救回來？":"Shall we bring the list back?","（iOS 長期未開啟 App 時會清除資料庫，這是我們預備的第二層保險。 關心紀錄與課程進度無法從快照還原，請以備份檔為準。）":"(iOS clears the local database when an app has gone unopened for a long time; this snapshot is our second line of defence. Contact logs and lesson progress cannot be restored from it — rely on your backup file for those.)","先不要":"Not now","救回名單":"Restore the list","請備份您的資料":"Please back up your data","資料只存在這支手機裡，換手機或系統清理都可能遺失。":"The data lives only on this phone. Changing phones, or the system clearing space, could lose it.","稍後":"Later","現在備份":"Back up now","取消":"Cancel","確認":"Confirm","（選填）他說了一句什麼、你看見什麼":"(Optional) Something he said, or something you saw","感謝主。接下來三十天是黃金期，也是最危險的時期。":"Thanks be to God. The next thirty days are the golden window, and the most dangerous stretch.","最重要的一件事：四十八小時之內，主動跟他聯絡一次。":"The most important thing: make contact with him within forty-eight hours.","看初信三十天腳本":"See the thirty-day scripts","‹ 上一幕":"‹ Previous act","下一幕 ›":"Next act ›","邀請他決志":"Invite him to commit","先禱告，求聖靈引導。你的責任是把福音講清楚， 使人重生的是聖靈，不是你。":"Pray first and ask the Spirit to lead. Your responsibility is to make the gospel clear; the one who gives new birth is the Spirit, not you.","這五幕的關鍵在第二幕。當一個人聽懂「罪就是我想自己作主」， 他往往會安靜下來——因為那正是他一生的寫照。":"The hinge of the five acts is Act Two. Once a person grasps that sin means wanting to be his own master, he usually goes quiet — because that is the story of his life.","帶他做決志禱告":"Lead him in the prayer of commitment","禱告之後，立刻做這四件事":"Do these four things straight after the prayer","決志登錄":"Record the commitment","登錄後會自動把他移到 L4 歸屬，並開啟初信三十天的陪伴提醒。":"Recording it moves him to L4 Belonging and starts the thirty-day follow-up reminders.","今天決志了 → 登錄":"He committed today → record it","只說福分不說代價，是不誠實；只說代價不說福分，是不完整。":"Naming the blessing without the cost is dishonest; naming the cost without the blessing is incomplete.","福分":"The blessing","代價":"The cost","我在陪伴一位朋友，現在卡在這裡：":"I am walking with a friend and I am stuck here: ","我有點灰心，也怕自己是不是做錯了什麼。":"I have lost heart a little, and I am afraid I may have done something wrong.","可以找個時間聽我說一下嗎？謝謝你。":"Could we find a time for you to hear me out? Thank you.","阿們":"Amen","本週的日子":"This week's dates","記得一個人的日子，就是在愛他":"Remembering a person's day is a way of loving him","屬靈生日是他重生的日子。那一天告訴他你還記得， 對他是極大的堅固。":"A spiritual birthday is the day he was born again. Telling him on that day that you still remember will strengthen him greatly.","請輸入四位數密碼":"Enter your four-digit code","清除":"Clear","我忘記密碼了":"I have forgotten the code","問完之後，最重要的是安靜聽完。":"After you ask, the most important thing is to listen to the end.","他講的時間，要比你多。":"He should talk more than you do.","灰心不是失敗。":"Losing heart is not failure.","我們負責忠心，生長是神的事。":"Faithfulness is ours; growth is God's.","照著念可以，用自己的話說也可以。神聽的是心。":"Read it as it stands, or use your own words. What God listens to is the heart.","內容檔載入失敗":"Content files failed to load","請確認 data 資料夾與 index.html 放在同一層，並用網址開啟（而非直接雙擊檔案）。":"Check that the data folder sits alongside index.html, and open it by its web address rather than by double-clicking the file.","【我的見證】":"[My testimony]","信主前的我：":"Before Christ:","遇見主的關鍵：":"How I met the Lord:","現在的改變：":"What has changed now:","（願一切榮耀歸給主耶穌）":"(May all the glory go to the Lord Jesus)","— 321 福音同行":"— 321 Gospel Companion","一個目的":"One purpose","兩個核心":"Two cores","是聖靈感動人，不是圖片。":"It is the Spirit who moves people, not the picture.","， 不要寫出別人的隱私——這是我們的第二條守則。":", and do not write down anyone's private business — that is our second rule.","提醒：談到別人的事時，請只說你自己的部分。 我絕不把他的私事告訴不相干的人，包括在代禱時。":"A reminder: when another person comes up, speak only of your own part. I will never tell his private business to anyone with no part in it, not even in prayer requests.","左手":"Left hand","右手":"Right hand","捆綁咒詛":"Binding the curse","釋放祝福":"Releasing the blessing","開啟心靈":"Opening the heart","領受救恩":"Receiving salvation","關懷需要":"Meeting the need","傳講福音":"Telling the gospel","先捆綁攔阻他的，祝福才進得去。":"Bind what stands in his way first, and the blessing can get through.","從身體到靈命，一根一根地祝福他。":"From body to spirit, bless him one finger at a time.","心門開了，道理才進得去。":"Once the door of the heart opens, the truth can get in.","從自己責備自己，到作主的門徒。":"From being convicted in himself, to becoming a disciple of the Lord.","禱告之後要伸手。愛要親自去給。":"After prayer, reach out. Love has to be delivered in person.","關係到了，就勇敢地開口。":"When the relationship is ready, speak up with courage.","陰間":"Hades","死亡、黑暗、祖先":"Death, darkness, ancestry","只是上帝必救贖我的靈魂脫離陰間的權柄，因他必收納我。":"But God will redeem my soul from the power of Sheol, for he will receive me.","詩篇四十九篇15節":"Psalm 49:15","仇敵":"The Enemy","邪靈、污鬼、偶像":"Evil spirits, unclean spirits, idols","我已經給你們權柄可以踐踏蛇和蠍子，又勝過仇敵一切的能力，斷沒有甚麼能害你們。":"Behold, I give you authority to tread on serpents and scorpions, and over all the power of the enemy. Nothing will in any way hurt you.","路加福音十章19節":"Luke 10:19","情慾":"Lusts","自私、貪心、驕傲":"Selfishness, greed, pride","因為凡世界上的事，就像肉體的情慾、眼目的情慾，並今生的驕傲，都不是從父來的，乃是從世界來的。":"For all that is in the world — the lust of the flesh, the lust of the eyes, and the pride of life — isn't the Father's, but is the world's.","約翰壹書二章16節":"1 John 2:16","虛謊":"Lying","虛假、謊言、邪術":"Falsehood, lies, sorcery","求你使虛假和謊言遠離我；使我也不貧窮也不富足；賜給我需用的飲食。":"Remove far from me falsehood and lies. Give me neither poverty nor riches. Feed me with the food that is needful for me.","箴言三十章8節":"Proverbs 30:8","疾病":"Illness","病痛、遺傳、災害":"Illness, inheritance, disaster","你們要事奉耶和華－你們的上帝，他必賜福與你的糧與你的水，也必從你們中間除去疾病。":"You shall serve Yahweh your God, and he will bless your bread and your water, and I will take sickness away from among you.","出埃及記二十三章25節":"Exodus 23:25","身體":"Body","健康、強壯、活力":"Health, strength, vitality","親愛的兄弟啊，我願你凡事興盛，身體健壯，正如你的靈魂興盛一樣。":"Beloved, I pray that you may prosper in all things and be healthy, even as your soul prospers.","約翰參書1章2節":"3 John 1:2","工作":"Labour","亨通、順利、成功":"Prospering, smooth going, success","平安、喜樂、積極":"Peace, joy, hopefulness","但願使人有盼望的上帝，因信將諸般的喜樂、平安充滿你們的心，使你們藉著聖靈的能力大有盼望。":"Now may the God of hope fill you with all joy and peace in believing, that you may abound in hope in the power of the Holy Spirit.","羅馬書十五章13節":"Romans 15:13","和睦、溝通、建立":"Harmony, understanding, building up","我們務要追求和睦的事與彼此建立德行的事。":"So then, let's follow after things which make for peace, and things by which we may build one another up.","羅馬書十四章19節":"Romans 14:19","靈命":"Spiritual life","得救、重生、更新":"Salvation, new birth, renewal","他便救了我們；並不是因我們自己所行的義，乃是照他的憐憫，藉著重生的洗和聖靈的更新。":"He saved us, not by works of righteousness which we did ourselves, but according to his mercy, through the washing of regeneration and renewing by the Holy Spirit.","提多書三章5節":"Titus 3:5","打開心眼":"Open his inner eyes","此等不信之人被這世界的神弄瞎了心眼，不叫基督榮耀福音的光照著他們。":"The god of this world has blinded the minds of the unbelieving, so that the light of the Good News of the glory of Christ wouldn't dawn on them.","哥林多後書四章4節":"2 Corinthians 4:4","開啟心竅":"Open his understanding","於是耶穌開他們的心竅，使他們能明白聖經。":"Then he opened their minds, that they might understand the Scriptures.","路加福音二十四章45節":"Luke 24:45","攻破營壘":"Break down the strongholds","我們爭戰的兵器本不是屬血氣的，乃是在上帝面前有能力，可以攻破堅固的營壘。":"For the weapons of our warfare are not of the flesh, but mighty before God to the throwing down of strongholds.","哥林多後書十章4節":"2 Corinthians 10:4","捆綁邪靈":"Bind the evil spirits","沒有人能進壯士家裡，搶奪他的家具；必先捆住那壯士，才可以搶奪他的家。":"No one can enter into the house of the strong man to plunder unless he first binds the strong man; then he will plunder his house.","馬可福音三章27節":"Mark 3:27","聖靈引導":"The Spirit's leading","責備自己":"Convicted in himself","他既來了，就要叫世人為罪、為義、為審判，自己責備自己。":"When he has come, he will convict the world about sin, about righteousness, and about judgement.","約翰福音十六章8節":"John 16:8","認罪悔改":"Confession and repentance","並且人要奉他的名傳悔改、赦罪的道，從耶路撒冷起直傳到萬邦。":"Repentance and remission of sins should be preached in his name to all the nations, beginning at Jerusalem.","路加福音二十四章47節":"Luke 24:47","信而受洗":"Believing and baptism","信而受洗的，必然得救；不信的，必被定罪。":"He who believes and is baptised will be saved; but he who disbelieves will be condemned.","馬可福音十六章16節":"Mark 16:16","受聖靈洗":"Baptism in the Spirit","約翰是用水施洗，但不多幾日，你們要受聖靈的洗。":"For John indeed baptised in water, but you will be baptised in the Holy Spirit not many days from now.","使徒行傳一章5節":"Acts 1:5","作主門徒":"Becoming a disciple","打電話":"Telephone","聊天談心問候關懷":"Chat, listen, ask after him","今天挑一個時段打給他，不談信仰，只問他好不好。":"Pick a time today and call him. No talk of faith — just ask how he is.","傳訊息":"Message","用社群媒體傳訊息":"Send a message through social media","傳一則短短的問候，或一張適合他處境的福音卡片。":"Send a short greeting, or a verse card that fits where he is.","去探訪":"Visit","見面訪談深入認識":"Meet, talk, get to know him properly","約一次見面，帶一點小東西，聽他說的時間要比你多。":"Arrange to meet, take a small gift, and let him talk more than you do.","來吃飯":"Share a meal","吃喝玩樂建立關係":"Eat, relax, build the friendship","請他吃一頓飯，或邀他來家裡坐坐，不設任何議程。":"Take him for a meal, or invite him round, with no agenda at all.","作服務":"Serve him","實際行動滿足需要":"Meet a need with practical action","找一件他真正需要、你做得到的小事，實際幫他一次。":"Find one small thing he really needs and you can do, and actually do it.","送禮物":"Give a gift","生活用品福音禮品":"Everyday items, or a gospel gift","送一份他用得到的東西，附上一張卡片或一本十全大福帖。":"Give him something he can use, with a card or a Tenfold Blessing Card enclosed.","作見證":"Give your testimony","得救見證蒙恩見證":"How you were saved, how you were shown grace","分享你自己的一小段：信主前的我、關鍵的轉折、現在的改變。":"Share a small piece of your own story: who you were, the turning point, what has changed.","邀聚會":"Invite him","家組聚會教會聚會":"A home group, or a church gathering","邀他來一個門檻最低的聚會，你去接他，並陪他坐。":"Invite him to the easiest gathering to walk into, collect him, and sit with him.","傳福音":"Share the gospel","個人談道帶領決志":"One to one, leading to commitment","找一個能好好談的時間，把五幕福音講一次，然後發出邀請。":"Find a time to talk properly, tell the gospel through the five acts, and then give the invitation.","約陪讀":"Arrange to study together","約定時間進行陪讀":"Set a time to read together","約下一次陪讀的時間：半小時讀內容，半小時關懷代禱。":"Fix the next session: half an hour on the material, half an hour of care and prayer.","罪得赦免":"Sins forgiven","心靈自由":"Freedom of soul","得赦免其過、遮蓋其罪的，這人是有福的。":"Blessed is he whose disobedience is forgiven, whose sin is covered.","詩篇三十二篇1節":"Psalm 32:1","平安喜樂":"Peace and joy","心靈滿足":"Contentment of soul","我留下平安給你們，我將我的平安賜給你們。":"Peace I leave with you. My peace I give to you.","約翰福音十四章27節":"John 14:27","病得醫治":"Healing","身體健康":"Health of body","因他受的刑罰，我們得平安；因他受的鞭傷，我們得醫治。":"The punishment that brought our peace was on him; and by his wounds we are healed.","以賽亞書五十三章5節":"Isaiah 53:5","愛情如意":"Love fulfilled","感情美滿":"A happy love","愛情，眾水不能息滅，大水也不能淹沒。":"Many waters can't quench love, neither can floods drown it.","雅歌八章7節":"Song of Songs 8:7","家庭和樂":"A home at peace","家庭幸福":"A happy household","看哪，弟兄和睦同居是何等地善，何等地美！":"Behold, how good and how pleasant it is for brothers to live together in unity!","詩篇一百三十三篇1節":"Psalm 133:1","人緣良好":"Well liked","得人喜愛":"Loved by others","事業成功":"Success in work","功成名就":"Achievement and good standing","他要像一棵樹栽在溪水旁，按時候結果子…凡他所做的盡都順利。":"He will be like a tree planted by the streams of water, that produces its fruit in its season… whatever he does shall prosper.","詩篇一篇3節":"Psalm 1:3","凡事富足":"Provision in everything","生活富足":"A well-provided life","耶和華所賜的福使人富足，並不加上憂慮。":"Yahweh's blessing brings wealth, and he adds no trouble to it.","箴言十章22節":"Proverbs 10:22","經歷神能":"Knowing God's power","生命剛強":"Strength of life","但聖靈降臨在你們身上，你們就必得著能力。":"You will receive power when the Holy Spirit has come upon you.","得到永生":"Eternal life","永恆生命":"Life everlasting","約翰福音三章16節":"John 3:16","壓力":"Pressure","迷惘":"Confusion","安慰":"Comfort","盼望":"Hope","救恩":"Salvation","每日":"Daily","馬太福音十一章28節":"Matthew 11:28","凡勞苦擔重擔的人可以到我這裡來，我就使你們得安息。":"Come to me, all you who labour and are heavily burdened, and I will give you rest.","彼得前書五章7節":"1 Peter 5:7","腓立比書四章6至7節":"Philippians 4:6-7","應當一無掛慮，只要凡事藉著禱告、祈求和感謝，將你們所要的告訴神。":"In nothing be anxious, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God.","但那等候耶和華的必從新得力。他們必如鷹展翅上騰。":"But those who wait for Yahweh will renew their strength. They will mount up with wings like eagles.","約書亞記二十四章15節":"Joshua 24:15","至於我和我家，我們必定事奉耶和華。":"But as for me and my house, we will serve Yahweh.","使徒行傳十六章31節":"Acts 16:31","當信主耶穌，你和你一家都必得救。":"Believe in the Lord Jesus Christ, and you will be saved, you and your household.","以弗所書六章2節":"Ephesians 6:2","要孝敬父母，使你得福，在世長壽。":"Honour your father and mother, that it may be well with you and you may live long on the earth.","出埃及記十五章26節":"Exodus 15:26","因為我耶和華是醫治你的。":"For I am Yahweh who heals you.","詩篇一百四十七篇3節":"Psalm 147:3","他醫好傷心的人，裹好他們的傷處。":"He heals the broken in heart, and binds up their wounds.","箴言三章5至6節":"Proverbs 3:5-6","你要專心仰賴耶和華，不可倚靠自己的聰明；在你一切所行的事上都要認定他，他必指引你的路。":"Trust in Yahweh with all your heart, and don't lean on your own understanding. In all your ways acknowledge him, and he will make your paths straight.","詩篇二十三篇4節":"Psalm 23:4","我雖然行過死蔭的幽谷，也不怕遭害，因為你與我同在。":"Even though I walk through the valley of the shadow of death, I will fear no evil, for you are with me.","我留下平安給你們；我將我的平安賜給你們。":"Peace I leave with you. My peace I give to you.","神要擦去他們一切的眼淚；不再有死亡，也不再有悲哀、哭號、疼痛。":"He will wipe away every tear from their eyes. Death will be no more; neither will there be mourning, nor crying, nor pain any more.","看哪，我站在門外叩門，若有聽見我聲音就開門的，我要進到他那裡去。":"Behold, I stand at the door and knock. If anyone hears my voice and opens the door, then I will come in to him.","溫和問候":"A gentle hello","具體關心":"Ask about something specific","實際幫忙":"Offer real help","分享一小段":"Share a little","送一句話":"Send him a sentence","讓他知道你記念他":"Let him know he is on your heart","回應他的問題":"Answer his question","邀他一起讀":"Invite him to read with you","先問他的心":"Ask his heart first","約一次好好談":"Arrange a proper talk","溫和的邀請":"A gentle invitation","誠實地問一次":"Ask him honestly, once","四十八小時內":"Within forty-eight hours","介紹朋友給他":"Introduce him to friends","談受洗":"Talk about baptism","約定的時間":"Your regular time","陪他面對難處":"Face the difficulty with him","帶他去看":"Take him along to watch","問他的名單":"Ask about his list","放手讓他做":"Let him do it","為他的兒女禱告":"Pray for his spiritual children","要認識上帝":"Know God","上帝是福氣的源頭":"God is the source of blessing","就像水庫":"like a reservoir","上帝是天地萬物的創造主宰，是萬神之神，萬福的根源。上帝是創造我們愛我們的天父，他樂意賞賜我們各樣的福氣。":"God is the Creator and Ruler of heaven and earth, God of all gods, the fountain of every blessing. He is the Father who made us and loves us, and He delights to give us every kind of good thing.","要承認罪惡":"Admit sin","罪惡是福氣的攔阻":"Sin blocks the blessing","就像土石流":"like a landslide","罪惡就是不照上帝的意思，不聽從上帝的話語，達不到上帝完全的標準。罪惡使我們與上帝隔絕，攔阻了上帝所要賜給我們的福氣。":"Sin is going against God's intent, not listening to His word, and falling short of His perfect standard. Sin cuts us off from God and blocks the blessing He means to give us.","要接受耶穌":"Receive Jesus","耶穌是福氣的通路":"Jesus is the channel of blessing","就像自來水廠":"like the waterworks","耶穌是上帝所愛的獨生子，為了愛我們，想要賜福我們，降生為人。耶穌擔當我們一切所有罪惡，為我們被釘死在十字架上，並且從死裡復活，為我們開了一條又新又活的蒙福之路。使我們可以除掉罪惡，勝過死亡，得著永生。":"Jesus is God's beloved only Son, who was born a man because He loved us and meant to bless us. He bore all our sin, was crucified for us, and rose from the dead, opening for us a new and living road into blessing — so that sin may be taken away, death overcome, and eternal life received.","要心裡相信":"Believe in your heart","信心是福氣的入口":"Faith is the way in","就像水塔":"like the water tank","信心是心裡看見那看不見之事的確據，是接受上帝所賜之福的容器。當我們聽到上帝所告訴我們的福音而選擇相信時就必領受福氣。":"Faith is the heart's assurance of what cannot be seen, the vessel that receives what God gives. When we hear the good news God tells us and choose to believe it, the blessing is received.","要開口禱告":"Pray out loud","禱告是福氣的出口":"Prayer is the way out","就像水龍頭":"like the tap","禱告就是開口把心裡所相信的事向上帝說出來，求告他的名，並且告訴他我們心裡想要得到的福氣，照著上帝的應許禱告時只要相信是會得到的就必定得到。":"Prayer is speaking out to God what the heart believes, calling on His name, and telling Him the blessing we long for. When we pray according to His promise and believe we will receive, we shall surely receive.","三生有福":"Three lifetimes of blessing","覺得現在已經過得很好的人":"For someone who feels life is already good","人有三生的幸福，要抓住機會，把握幸福":"There are three lifetimes of happiness; take hold of the chance while it is there","上半生的幸福":"The happiness of the first half of life","出生歸入父母家，父母的愛帶給我上半生的幸福。":"Born into your parents' home, their love gives you the happiness of your first half of life.","下半生的幸福":"The happiness of the second half","結婚歸入夫妻家，夫妻的愛帶給我下半生的幸福。":"Married into a home of your own, that love gives you the happiness of your second half.","永生的幸福":"The happiness of eternal life","受洗歸入天父家，天父的愛帶給我永生的幸福。":"Baptised into the Father's home, His love gives you the happiness of eternal life.","現在過得好，是上帝的恩典；但今生的福氣有期限，永生的福氣沒有期限。您已經有兩生的幸福，還差一生，就十全十美了。":"That life is good now is God's grace. But the blessings of this life have an expiry date, and the blessing of eternal life has none. You already have two of the three; one more, and it is complete.","三敬才孝":"Three honours make true filial love","覺得要祭拜祖先才孝順的人":"For someone who feels offerings to ancestors are what filial love means","吃果子要拜樹頭。生命好像果子，我們生命的產生有三個對象要敬愛，才算真正的孝。":"As the saying goes, when you eat the fruit, honour the tree. Life is like fruit, and three must be honoured for filial love to be complete.","生命的源頭 好像樹根":"The source of life · like the root","上帝創造我們的生命，所以我們要敬拜上帝。":"God created our life, so God is the one we worship.","生命的管道 好像樹幹":"The channel of life · like the trunk","祖先傳承我們的生命，所以我們要敬思祖先。":"Our ancestors passed life down to us, so we remember them with honour.","生命的入口 好像樹枝":"The entry of life · like the branch","父母生養我們的生命，所以我們要孝敬父母。":"Our parents bore and raised us, so we honour them as our parents.","基督徒不是不孝，是把敬拜歸給創造生命的上帝，把敬思歸給祖先，把孝敬歸給還在世的父母——趁父母還在，這才是最實在的孝。":"Christians are not unfilial. We give worship to the God who made life, honoured remembrance to our ancestors, and filial devotion to the parents still living — while they are still here. That is the most real filial love of all.","三點有別":"Three points of difference","覺得信什麼宗教都一樣的人":"For someone who feels all religions are much the same","基督教和其他宗教的最大差別":"The greatest difference between Christianity and other religions","使人成為良善的人 就像聖誕樹掛果子和蘋果樹結果子的差別":"It makes a person good · like the difference between fruit hung on a Christmas tree and fruit grown on an apple tree","其他宗教都是勸人為善，基督教卻是使人作新造的人成為善良。":"Other religions urge people to do good; Christianity makes a person a new creation who becomes good.","靠耶穌的犧牲得救 就像自己抱不動自己和別人抱得動我們的差別":"Saved by Jesus' sacrifice · like the difference between trying to lift yourself and being lifted by another","其他宗教都是靠自己的努力得救，基督教卻是靠耶穌的犧牲得救。":"Other religions are saved by one's own effort; Christianity is saved by Jesus' sacrifice.","耶穌已從死裡復活 就像溺水時需要教練或救生員的差別":"Jesus has risen from the dead · like the difference between a swimming coach and a lifeguard when you are drowning","其他宗教的教主都死了，基督教的救主耶穌卻已經從死裡復活。":"The founders of other religions all died; the Saviour of Christianity, Jesus, has risen from the dead.","差別不在誰的道理比較高，而在誰有本事救我們。掛上去的果子會掉，長出來的果子才會結不停。":"The difference is not whose teaching is higher, but who is able to save us. Fruit that is hung on will drop; fruit that grows keeps coming.","三思而信":"Think it through, then believe","覺得沒有需要相信耶穌的人":"For someone who feels there is no need to believe in Jesus","信不信有關係，作決定前好好想一想":"Believing or not does matter; think it over before you decide","如果沒有上帝我卻相信他，那也沒關係；":"If there is no God and I believe in Him anyway, no harm done;","但是如果真的有上帝而我卻不相信他，那就糟了！":"but if there really is a God and I do not believe in Him, that is serious.","如果耶穌不是救主，而我卻接受他，那也沒影響；":"If Jesus is not the Saviour and I receive Him anyway, it costs me nothing;","但是如果耶穌真的是救主而我卻拒絕他，那就慘了！":"but if Jesus really is the Saviour and I refuse Him, that is dreadful.","如果沒有天堂地獄而我卻選擇天堂的路，那也沒損失；":"If there is no heaven or hell and I take the road to heaven, I lose nothing;","但是如果真的有天堂地獄而我卻邁向地獄之門，那就完了！":"but if heaven and hell are real and I walk towards the gate of hell, that is the end.","這不是恐嚇，是算一筆帳。信了沒損失，不信卻有可能全盤皆輸——這樣的選擇題，值得認真想一想。":"This is not a threat; it is arithmetic. Believing costs nothing, while not believing could lose everything. A choice like that is worth thinking through seriously.","問候與自我介紹":"Greeting and introducing yourself","您好，我們是這附近教會的社區服務義工，在這裡做社區關懷服務。":"Hello, we are community volunteers from a church nearby, out doing community care.","寒暄關懷":"Small talk and care","例：您每天都來公園運動嗎？ 哇！您很棒，很懂得照顧自己的身體，難怪您看起來精神氣色不錯。":"e.g. Do you come to the park to exercise every day? That's wonderful — you really take care of yourself. No wonder you look so well.","介紹十全大福帖":"Introducing the Tenfold Blessing Card","請問您有聽過十全大福帖嗎？ 很高興今天我有這個榮幸向您介紹十全大福帖，也就是十項上帝全都能給的大福氣。":"Have you heard of the Tenfold Blessing Card? I would be glad to introduce it to you — ten great blessings that God is able to give.","破冰活動":"Ice-breaker","在介紹之前，先和您做個小小的心理測驗——這兩個封面的圖案，您比較喜歡哪一個？":"Before I begin, here is a small personality test — of these two cover pictures, which do you prefer?","分享五個要方與十帖福氣":"The five keys and the ten blessings","翻到第一頁介紹十全大福帖，再翻到第二頁看十帖蒙福良方，逐一簡介十帖福氣。 最後問他：這十項大福氣，你最需要哪一項呢？":"Turn to page one to introduce the card, then to page two for the ten remedies, and go through the ten blessings one by one. Then ask: of these ten, which do you need most?","分享所選的福氣":"The blessing he chose","翻到他所選擇的福氣，問他在這方面有什麼需要、煩惱、困擾或擔憂的事，藉此關心了解他。 看右頁的禱告良方，請他自己誠心開口一句一句禱告領受上帝應許的福氣。之後為他禱告服事他的需要，使他經歷神。":"Turn to the blessing he chose and ask what needs, worries or troubles he has there — this is how you come to know him. Then look at the prayer on the right-hand page and invite him to pray it aloud, sincerely, line by line, receiving the blessing God has promised. Afterwards pray for his need, so that he experiences God.","指點迷津":"When he hesitates","如果他還不願意禱告接受主耶穌，請問他是什麼原因使他還不想現在就得到最大的福氣？ 覺得現在已經過得很好 → 三生有福 覺得要祭拜祖先才孝順 → 三敬才孝 覺得信什麼宗教都一樣 → 三點有別 覺得沒有需要相信耶穌 → 三思而信 再回到五個要方，邀請他接受主耶穌。":"If he is not yet willing to pray and receive the Lord Jesus, ask what is keeping him from the greatest blessing right now. Life is already good → Three lifetimes of blessing. Offerings to ancestors are what filial love means → Three honours make true filial love. All religions are much the same → Three points of difference. No need to believe in Jesus → Think it through, then believe. Then return to the five keys and invite him to receive the Lord Jesus.","初信造就":"Foundations for a new believer","如果他已經接受耶穌，帶他讀「蒙福的應許與條件」、「栽種福氣的方法」，直到「得勝信心的宣言」。":"If he has received Jesus, read with him the promises and conditions of blessing, how blessing is planted, and on to the declaration of overcoming faith.","填寫回應單":"Filling in the response slip","談到結束後填寫贈送人資料，再請他填寫回應單，撕下回應單，將十全大福帖送給他。":"When the conversation ends, fill in the giver's details, ask him to fill in the response slip, tear it off, and give him the card to keep.","預約陪讀":"Arranging to read together","和他預約下一次陪讀的時間。半小時陪讀十全大福帖的內容，半小時關懷代禱。 並在本 App 的「陪談記錄」留下一份，把他加進你的同行名單。":"Fix a time to read together next. Half an hour on the card's content, half an hour of care and prayer. Then log it here in the app and add him to your list.","封面Ａ 女孩抱十架":"Cover A · the girl holding the cross","恭喜您，根據研究分析，您喜歡這個圖案，表示您是一個年輕有活力、有創意的人，做事情有抱負、有夢想，您想要追求的美夢，一定可以美夢成真。":"Well now — choosing this picture says you are young in spirit, full of energy and imagination, a person with ambition and dreams. The dream you are reaching for can surely come true.","這個女孩抱著乳酪做的十字架，一副心滿意足的樣子。乳酪是牛奶做成的，是最營養的食物；我們的心靈最需要的營養就是愛，而十字架就是上帝犧牲的愛，是我們心靈最營養的食物。":"The girl is holding a cross made of cheese, looking perfectly content. Cheese is made from milk, one of the most nourishing of foods. What our souls need most is love, and the cross is God's self-giving love — the most nourishing food our souls can have.","狗是最忠心的同伴，表示有好同伴陪伴我們追求理想。地上都是愛心，天上都是星星，表示帶著別人愛心的祝福去摘星，追求天父上帝應許的祝福；您的祝福就會像這棵蔓藤一樣從地上蔓延到天上，一直到永遠。":"The dog is the most faithful of companions — a good companion to walk with us as we reach for what we hope. Hearts cover the ground and stars fill the sky: carrying the love and blessing of others, we reach for the stars, for the blessing the Father has promised. Your blessing will spread like this vine, from the ground to the sky, and on forever.","背面的彩虹代表上帝的應許之約，上帝要使我們成為新造的人，舊事已過，都要變成新的了，讓您的生命像這些花一樣燦爛又美麗。":"The rainbow on the back stands for God's covenant of promise. He will make us new creations — the old things passed away, all things become new — so that your life may be as bright and beautiful as these flowers.","您知道蜻蜓代表什麼嗎？蜻蜓就是輕輕鬆鬆停在上帝的祝福中。耶穌說：凡勞苦擔重擔的人可以到我這裡來，我就使你們得安息。":"Do you know what the dragonfly stands for? Resting lightly and easily in God's blessing. Jesus said: come to me, all you who labour and are heavily burdened, and I will give you rest.","封面Ｂ 喜鵲報喜":"Cover B · the magpie bringing good news","恭喜您，根據研究分析，您喜歡這個圖案，表示您是一個成熟又實際的人，做事情實實在在，有原則、有計畫，您心裡想要達到的目標一定可以達成，使您心想事成。":"Well now — choosing this picture says you are mature and practical, someone who does things solidly, with principle and with a plan. The goal you have in mind can surely be reached.","請問在這幅圖案中您可以找到哪些福氣？金魚代表年年有餘，橘子代表大吉大利，牡丹代表花開富貴，葡萄代表多子多孫，桃子代表壽桃長壽，喜鵲代表喜鵲報喜。":"What blessings can you find in this picture? The goldfish stands for abundance year after year, the orange for good fortune, the peony for prosperity, the grapes for many descendants, the peach for long life, and the magpie for good news arriving.","報告大喜的信息，就是上帝賜給人最大的福氣——十字架的恩典。有了十字架的恩典，就能得到十項上帝全都能給的大福氣。":"The great good news it brings is the greatest blessing God gives — the grace of the cross. With that grace comes every one of the ten blessings God is able to give.","您知道蝴蝶代表什麼福氣嗎？蝴蝶就是福氣多到疊起來。上帝所賜的十全大福，一個一個堆疊起來，上帝要傾福於我們甚至無處可容，成為最有福氣的人。":"And do you know what the butterfly stands for? Blessing piled upon blessing. God's ten blessings stack one upon another, until He pours out so much that there is not room enough to receive it, and you become the most blessed of people.","第一帖":"Remedy 1","第二帖":"Remedy 2","第三帖":"Remedy 3","第四帖":"Remedy 4","第五帖":"Remedy 5","第六帖":"Remedy 6","第七帖":"Remedy 7","第八帖":"Remedy 8","第九帖":"Remedy 9","第十帖":"Remedy 10","想要心靈自由的人":"For those who long for freedom of soul","想要心靈滿足的人":"For those who long for contentment of soul","想要身體健康的人":"For those who long for health of body","想要感情美滿的人":"For those who long for a happy love","想要家庭幸福的人":"For those who long for a happy household","想要得人喜愛的人":"For those who long to be well liked","想要功成名就的人":"For those who long for achievement","想要生活富足的人":"For those who long for a well-provided life","想要生命剛強的人":"For those who long for strength of life","想要永恆生命的人":"For those who long for life everlasting","得著永生":"Receiving eternal life","罪就是達不到上帝完全的標準。無論我們在思想、言語、行為上不完全的部分，得罪神和人的事情，只要我們向上帝認罪，並接受耶穌的救贖恩典，上帝必要赦免我們一切的過犯，洗淨我們一切的不義。因為耶穌已擔當我們的罪為我們釘死在十字架上，使我們的罪得赦免。":"Sin is falling short of God's perfect standard. Whatever is imperfect in our thoughts, our words and our conduct, whatever has wronged God and wronged others — if we confess it to God and receive the redeeming grace of Jesus, He will forgive us every offence and cleanse us from all unrighteousness. For Jesus has borne our sin and was crucified for us, so that our sins may be forgiven.","以弗所書一章7節":"Ephesians 1:7","我們藉這愛子的血得蒙救贖，過犯得以赦免，乃是照他豐富的恩典。":"In him we have our redemption through his blood, the forgiveness of our trespasses, according to the riches of his grace.","約翰壹書一章9節":"1 John 1:9","謝謝您已經應許賜給我罪得赦免的福氣。":"Thank You that You have already promised me the blessing of forgiveness.","對不起我沒有遵行您的旨意，犯罪得罪了您，以致於心靈被罪綑綁不自由，求您赦免我的罪並且洗淨我的心靈。我迫切渴慕您賜給我罪得赦免的福氣。":"I am sorry that I have not followed Your will, and have sinned against You, so that my soul is bound by sin and not free. Forgive my sin and cleanse my soul. I long earnestly for You to give me the blessing of forgiveness.","請您赦免我一切的過犯，我知道我的思想、言語、行為常常得罪您也傷害到別人，我願意向您承認我的罪，並請您釋放我因為犯罪而有的心靈不平安、不自由、疾病、失眠等各樣的痛苦。請您賜我信心和能力不再犯罪，並讓我不灰心的持續禱告，直到您釋放我能勝過罪。":"Forgive me every offence. I know that my thoughts, my words and my conduct have often wronged You and hurt others. I am willing to confess my sin to You, and I ask You to release me from all the suffering sin has brought — the unrest, the loss of freedom, the illness, the sleeplessness. Give me faith and strength to sin no more, and keep me praying without losing heart until You set me free to overcome sin.","耶穌是平安的主，喜樂的神。耶穌能除去我們心中一切的憂慮和恐懼，擔當我們生活上的壓力，並能賜給你的心靈，超越外在環境苦難的真平安、大喜樂。":"Jesus is the Lord of peace and the God of joy. He can take away every worry and fear in our hearts, carry the pressures of our lives, and give your soul a true peace and a great joy that rise above whatever hardship surrounds you.","我留下平安給你們，我將我的平安賜給你們。我所賜的，不像世人所賜的，你們心裡不要憂愁，也不要膽怯。":"Peace I leave with you. My peace I give to you; not as the world gives, I give to you. Don't let your heart be troubled, neither let it be fearful.","應當一無掛慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神。神所賜出人意外的平安，必在基督耶穌裡保守你們的心懷意念。":"In nothing be anxious, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God. And the peace of God, which surpasses all understanding, will guard your hearts and your thoughts in Christ Jesus.","彼得前書一章8節":"1 Peter 1:8","你們雖然沒有見過他，卻是愛他；如今雖不得看見，卻因信他就有說不出來、滿有榮光的大喜樂。":"Whom, not having known, you love. In him, though now you don't see him, yet believing, you rejoice greatly with joy that is unspeakable and full of glory.","謝謝您願意賜給我心靈的平安和喜樂。":"Thank You that You are willing to give my soul peace and joy.","對不起我沒有遵行您的旨意，得罪了您，以致於失去了平安和喜樂。現在我向您承認我的不完全和我一切的罪，求您赦免我的罪並且洗淨我的心靈。我迫切渴慕您賜給我平安喜樂的福氣。":"I am sorry that I have not followed Your will and have wronged You, and so have lost my peace and joy. I now confess to You my imperfection and all my sin. Forgive my sin and cleanse my soul. I long earnestly for You to give me the blessing of peace and joy.","請您將在基督裡的平安和在聖靈裡的喜樂充滿我。現在我把心中的沮喪、憂慮、恐懼都交給您，因為您是賜平安喜樂的上帝。求您幫助我遇到任何困難時，不要害怕、不要憂慮和埋怨，不致於影響到我心靈、身體的健康和睡眠的品質。請幫助我不住的禱告，直到您的平安喜樂充滿我的心中。":"Fill me with the peace that is in Christ and the joy that is in the Holy Spirit. I hand You now the discouragement, the worry and the fear in my heart, for You are the God who gives peace and joy. Help me, when difficulty comes, not to be afraid, not to fret or complain, so that my soul, my health and my sleep are not harmed. Help me pray without ceasing until Your peace and joy fill my heart.","上帝是創造我們身體的主宰，也是醫治我們身體疾病的醫生。全能的救主耶穌能醫治一切的疾病。因為耶穌已在十字架上，為我們擔當了一切的疾病和痛苦，為我們受鞭傷使我們能得醫治。耶穌十字架救贖的恩典，可以使相信他的人都能經歷病得醫治的祝福。":"God is the Ruler who created our bodies, and the physician who heals their illnesses. Jesus, the almighty Saviour, can heal every sickness, for on the cross He bore all our sickness and pain, and was wounded that we might be healed. The redeeming grace of His cross lets everyone who believes in Him know the blessing of healing.","他為我們的過犯受害，為我們的罪孽壓傷。因他受的刑罰，我們得平安；因他受的鞭傷，我們得醫治。":"But he was pierced for our transgressions and crushed for our iniquities. The punishment that brought our peace was on him, and by his wounds we are healed.","馬太福音八章17節":"Matthew 8:17","這是要應驗先知以賽亞的話，說：他代替我們的軟弱，擔當我們的疾病。":"That it might be fulfilled which was spoken through Isaiah the prophet, saying: he took our infirmities and bore our diseases.","雅各書五章15至16節":"James 5:15-16","出於信心的祈禱要救那病人，主必叫他起來；他若犯了罪，也必蒙赦免。所以你們要彼此認罪，互相代求，使你們可以得醫治。":"The prayer of faith will heal him who is sick, and the Lord will raise him up; and if he has committed sins, he will be forgiven. Confess your sins to one another and pray for one another, that you may be healed.","謝謝您賜給我身體和心靈並且願意醫治我的疾病。":"Thank You for giving me a body and a soul, and for being willing to heal my illness.","對不起我沒有遵行您的旨意，以致於生病不健康。現在我向您承認我的不完全和我一切的罪，求您赦免我的罪並且洗淨我的心靈。我迫切渴慕您賜給我病得醫治的福氣。":"I am sorry that I have not followed Your will, and so am unwell. I now confess to You my imperfection and all my sin. Forgive my sin and cleanse my soul. I long earnestly for You to give me the blessing of healing.","請您藉著主耶穌為我受的鞭傷醫治我的疾病，並且賜給我信心能禱告接受耶穌的醫治，也請您賜給我的身體有自己復原的力量，並給醫生智慧和能力，為我做最好的診斷和醫療。並讓我不灰心的持續禱告，直到您的醫治臨到我。":"By the wounds the Lord Jesus bore for me, heal my illness. Give me faith to pray and receive His healing, give my body strength to recover, and give my doctors wisdom and skill for the best diagnosis and care. And keep me praying without losing heart until Your healing comes.","上帝就是愛，我們愛因為上帝先愛我們，因為愛從上帝而來。上帝賜下愛情，使男女互相吸引，彼此相愛，享受愛情的歡愉，進而願意結為夫妻二人成為一體，合而為一。":"God is love. We love because He first loved us, for love comes from God. He gave love so that a man and a woman might be drawn to each other, love each other, know the gladness of love, and go on to become husband and wife — two made one.","愛情，眾水不能息滅，大水也不能淹沒。若有人拿家中所有的財寶要換愛情，就全被藐視。":"Many waters can't quench love, neither can floods drown it. If a man would give all the wealth of his house for love, he would be utterly scorned.","哥林多前書十三章7至8節":"1 Corinthians 13:7-8","凡事包容，凡事相信，凡事盼望，凡事忍耐。愛是永不止息。":"Love bears all things, believes all things, hopes all things, endures all things. Love never fails.","約翰壹書三章18節":"1 John 3:18","我們相愛，不要只在言語和舌頭上，總要在行為和誠實上。":"Let's not love in word only, or with the tongue only, but in deed and truth.","謝謝您賜給我愛與被愛的能力，並且願意幫助我愛情如意。":"Thank You for giving me the ability to love and be loved, and for Your willingness to help my love go well.","對不起我沒有遵行您的旨意，以致於我不能無私地愛人。現在我向您承認我的不完全和我一切的罪，求您赦免我的罪，並且洗淨我的心靈。我迫切渴慕您賜給我愛情如意的福氣。":"I am sorry that I have not followed Your will, and so cannot love others selflessly. I now confess to You my imperfection and all my sin. Forgive my sin and cleanse my soul. I long earnestly for You to give me the blessing of a love fulfilled.","請您帶領我的愛情，為我預備一生真心相愛的伴侶。幫助我預備自己成為對方最合適的另一半。請您賜給我無私捨己的愛，願意無怨無悔地接納對方的缺點，欣賞他的優點，饒恕他的過錯，並且尊重他的選擇，愛他如同愛自己一樣。":"Guide me in love, and prepare for me a partner to love truly for life. Help me prepare myself to be the one most fitted for that person. Give me a selfless, self-giving love — willing without complaint to accept the other's faults, to admire their strengths, to forgive their wrongs, to respect their choices, and to love them as I love myself.","上帝設立了家庭，他願意幫助我們家庭和樂而且興盛。耶穌也是我們家庭的救主和一家之主，耶穌能使我們家庭夫妻恩愛，兒女孝敬父母，兄弟姐妹彼此相親相愛，彼此有良好的溝通與互動，家庭幸福又美滿。":"God established the family, and He is willing to help our households be at peace and flourish. Jesus is the Saviour and the Head of our home. He can bring husband and wife to love each other, children to honour their parents, brothers and sisters to be close and affectionate, with good understanding between them — a happy and whole household.","以弗所書六章1至4節":"Ephesians 6:1-4","你們作兒女的，要在主裡聽從父母，這是理所當然的。要孝敬父母，使你得福。你們作父親的，不要惹兒女的氣，只要照著主的教訓和警戒養育他們。":"Children, obey your parents in the Lord, for this is right. Honour your father and mother, that it may be well with you. And fathers, don't provoke your children to wrath, but nurture them in the discipline and instruction of the Lord.","以弗所書五章22、25節":"Ephesians 5:22, 25","你們作妻子的，當順服自己的丈夫，如同順服主。你們作丈夫的，要愛你們的妻子，正如基督愛教會，為教會捨己。":"Wives, be subject to your own husbands as to the Lord. Husbands, love your wives, even as Christ also loved the assembly and gave himself up for it.","謝謝您賜給我家庭並且願意幫助我家庭和樂。":"Thank You for giving me a family, and for Your willingness to help our home be at peace.","對不起我沒有遵行您的旨意，以致於我的家庭不夠和樂。現在我向您承認我的不完全和我一切的罪，求您赦免我的罪並且洗淨我的心靈。我迫切渴慕您賜給我家庭和樂的福氣。":"I am sorry that I have not followed Your will, and so our home is not at peace as it should be. I now confess to You my imperfection and all my sin. Forgive my sin and cleanse my soul. I long earnestly for You to give me the blessing of a home at peace.","請您幫助我們家人，給我們信心、盼望和真愛，使我們家中的衝突能得到好的解決，溝通能得到改善，也請您讓我們能夠彼此付出真誠的關心、真實的彼此相愛。我願意接納家人的缺點和不同的生活習慣，並且饒恕家人的過錯和對我的任何傷害。請您幫助我們家人能夠遵行聖經的原則，扮演好個人在家中的角色及善盡個人的本分，增進家庭的和樂。":"Help my family. Give us faith, hope and real love, so that the conflicts in our home may be well resolved and our understanding of one another improved. Let us offer each other sincere care and truly love one another. I am willing to accept my family's faults and their different ways of living, and to forgive their wrongs and any hurt they have caused me. Help each of us to follow the principles of Scripture, to play our part in the home well and fulfil our own duty, so that peace in our household may grow.","上帝要我們作光作鹽，犧牲自己成全別人。與眾人和睦相處，得眾人的喜愛。朋友不是去尋找的，乃是去交往的。主動地和人作朋友，看到人就微笑，熱情地問候關懷，善待別人，自然能成為受歡迎的人。":"God calls us to be salt and light, giving of ourselves so that others may flourish — living at peace with all and well loved by all. Friends are not found; they are made. Take the first step in friendship, smile when you see someone, greet them warmly, care for them, treat them well, and you will naturally become a person others are glad to see.","路加福音二章52節":"Luke 2:52","耶穌的智慧和身量，並神和人喜愛他的心，都一齊增長。":"And Jesus increased in wisdom and stature, and in favour with God and men.","使徒行傳二章47節":"Acts 2:47","讚美神，得眾民的喜愛。":"Praising God, and having favour with all the people.","路加福音六章31節":"Luke 6:31","你們願意人怎樣待你們，你們也要怎樣待人。":"As you would like people to do to you, do exactly so to them.","謝謝您賜給我朋友並且願意幫助我有良好的人際關係。":"Thank You for giving me friends, and for Your willingness to help my relationships go well.","對不起我沒有遵行您的旨意，以致於我的人際關係不夠好。現在我向您承認我的不完全和我一切的罪，求您赦免我的罪並且洗淨我的心靈。我迫切渴慕您賜給我人緣良好的福氣。":"I am sorry that I have not followed Your will, and so my relationships are not what they should be. I now confess to You my imperfection and all my sin. Forgive my sin and cleanse my soul. I long earnestly for You to give me the blessing of being well liked.","請您幫助我能主動地去結交朋友，去愛別人，欣賞別人的優點，尊重別人的想法，鼓勵別人的表現，關懷別人的需要，成全別人的事情，作別人的好朋友。請您讓我也願意包容別人的個性，接納別人的缺點，饒恕別人的過犯，忍耐別人的脾氣，使我能盡力與眾人和睦，得眾人的喜愛。":"Help me take the first step in making friends and in loving others — admiring their strengths, respecting their views, encouraging what they do, caring for their needs, helping their affairs go well, being a true friend to them. Let me also bear with their temperaments, accept their faults, forgive their wrongs and be patient with their tempers, so that as far as it lies with me I may live at peace with all and be well loved.","上帝是賜福的上帝。只要我們謹守遵行上帝的命令，上帝就要賜福我們的工作事業居上不居下，作首不作尾。只要我們跟隨上帝的道路，上帝的恩惠慈愛必定追隨我們，賜福我們的工作事業順利亨通、興盛成功，使自己得祝福，別人得幫助，上帝得榮耀。":"God is the God who blesses. If we keep and follow His commands, He will bless our work so that we are above and not beneath, the head and not the tail. If we walk in His way, His goodness and mercy will surely follow us, blessing our work to prosper and succeed — so that we are blessed, others are helped, and God is glorified.","詩篇一篇2至3節":"Psalm 1:2-3","惟喜愛耶和華的律法，晝夜思想，這人便為有福。他要像一棵樹栽在溪水旁，按時候結果子，葉子也不枯乾。凡他所做的盡都順利。":"Blessed is the one whose delight is in Yahweh's law, and who meditates on it day and night. He will be like a tree planted by the streams of water, that produces its fruit in its season, whose leaf also does not wither. Whatever he does shall prosper.","申命記二十八章13至14節":"Deuteronomy 28:13-14","你若聽從耶和華你神的誡命，就是我今日所吩咐你的，謹守遵行，不偏左右，也不隨從事奉別神，耶和華就必使你作首不作尾，但居上不居下。":"If you listen to the commandments of Yahweh your God which I command you today, to observe and to do them, and do not turn aside to the right hand or to the left, nor follow other gods to serve them, Yahweh will make you the head and not the tail, and you will be above only and not beneath.","雅各書一章4節":"James 1:4","但忍耐也當成功，使你們成全、完備，毫無缺欠。":"Let endurance have its perfect work, that you may be perfect and complete, lacking in nothing.","謝謝您賜給我工作事業並且願意幫助我事業成功。":"Thank You for giving me my work, and for Your willingness to help it succeed.","對不起我沒有遵行您的旨意，以致於我的工作事業不順利不成功。現在我向您承認我的不完全和我一切的罪，求您赦免我的罪並且洗淨我的心靈。我迫切渴慕您賜給我事業成功的福氣。":"I am sorry that I have not followed Your will, and so my work has not gone well or succeeded. I now confess to You my imperfection and all my sin. Forgive my sin and cleanse my soul. I long earnestly for You to give me the blessing of success in my work.","請您幫助我喜愛思想您的話語，並且遵行您的命令不偏左右。請您照著您的應許賜福我的道路亨通，凡事順利，讓我做事遇到困難時，能夠不灰心、不放棄、忍耐到底，直到最後成功。":"Help me delight in Your word and meditate on it, and to follow Your commands without turning to the right or the left. According to Your promise, bless my way to prosper and go well; and when I meet difficulty in my work, let me not lose heart or give up, but endure to the end until it comes right.","上帝是富足的上帝，他何等希望他的兒女們可以凡事富足，一無所缺，享受他的愛與恩福。以至於我們能去與別人分享上帝的恩福，祝福別人，使別人也能夠認識上帝，信靠上帝成為富足。":"God is rich, and how He longs for His children to have enough in all things and lack nothing, enjoying His love and His good gifts — so that we may share those gifts with others, bless them, and let them too come to know God and be made rich in trusting Him.","哥林多後書八章9節":"2 Corinthians 8:9","你們知道我們主耶穌基督的恩典：他本來富足，卻為你們成了貧窮，叫你們因他的貧窮，可以成為富足。":"For you know the grace of our Lord Jesus Christ, that though he was rich, yet for your sakes he became poor, that you through his poverty might become rich.","哥林多後書九章10至11節":"2 Corinthians 9:10-11","那賜種給撒種的，賜糧給人吃的，必多多加給你們種地的種子，又增添你們仁義的果子；叫你們凡事富足，可以多多施捨，就藉著我們使感謝歸於神。":"Now may he who supplies seed to the sower and bread for food, supply and multiply your seed for sowing, and increase the fruits of your righteousness; you being enriched in everything for all generosity, which produces thanksgiving to God through us.","謝謝您賜給我所需用的一切恩典並且願意幫助我凡事富足。":"Thank You for giving me every grace I need, and for Your willingness to provide for me in all things.","對不起我沒有遵行您的旨意，以致於我得不到您所賜的富足。現在我向您承認我的不完全和我一切的罪，求您赦免我的罪並且洗淨我的心靈。我迫切渴慕您賜給我凡事富足的福氣。":"I am sorry that I have not followed Your will, and so have not received the provision You give. I now confess to You my imperfection and all my sin. Forgive my sin and cleanse my soul. I long earnestly for You to give me the blessing of provision in everything.","請您幫助我努力殷勤地工作，善於理財。請您賜福我凡事富足，一無所缺，不背負債務，也不加上任何憂慮，並且可以多多施捨，幫助別人。":"Help me work hard and diligently, and manage what I have wisely. Bless me with enough in all things, lacking nothing, free of debt, with no trouble added, and able to give generously to help others.","上帝是無所不能的上帝。在人不能的，在上帝凡事都能。人的盡頭就是上帝的起頭。苦難是化妝的祝福，只要信靠上帝，上帝有本事把壞事變好事。上帝最奇妙的能力就是改變人的生命使我們重生，得著新生命，並且讓我們被聖靈充滿，得著能力，生命愈來愈美好。":"God is almighty. What is impossible with man is possible with God. Where man's end is, God's beginning is. Hardship is a blessing in disguise, and if we trust God, He is able to turn bad things to good. His most wonderful power is to change a person's life — to give us new birth and a new life, to fill us with the Holy Spirit and give us power, so that life grows better and better.","馬可福音十六章17、20節":"Mark 16:17, 20","信的人必有神蹟隨著他們。門徒出去，到處宣傳福音。主和他們同工，用神蹟隨著，證實所傳的道。":"These signs will accompany those who believe. They went out and preached everywhere, the Lord working with them and confirming the word by the signs that followed.","彼得前書一章3節":"1 Peter 1:3","他曾照自己的大憐憫，藉耶穌基督從死裡復活，重生了我們，叫我們有活潑的盼望。":"According to his great mercy he caused us to be born again to a living hope through the resurrection of Jesus Christ from the dead.","謝謝您賜給我應許使我可以經歷神能，得著重生並被聖靈充滿，人生愈來愈美好。":"Thank You for the promise by which I may know Your power, be born again, be filled with the Holy Spirit, and see my life grow better and better.","對不起我沒有遵行您的旨意得罪了您，以致於失去了經歷神能的恩典。現在我向您承認我的不完全和我一切的罪，求您赦免我的罪並且洗淨我的心靈。我迫切渴慕您賜給我經歷神能的福氣。":"I am sorry that I have not followed Your will and have wronged You, and so have missed the grace of knowing Your power. I now confess to You my imperfection and all my sin. Forgive my sin and cleanse my soul. I long earnestly for You to give me the blessing of knowing Your power.","請您藉著主耶穌使我重生得著豐盛的新生命，也請您藉著聖靈充滿我，使我得著能力，能夠堅心信靠您，使我在苦難中，能得著祝福，經歷上帝把壞事變好事的神奇大能。":"Through the Lord Jesus, give me new birth and an abundant new life. Fill me with Your Holy Spirit and give me power, that I may trust You with a steady heart, and that even in hardship I may be blessed and know the wonderful power by which You turn bad things to good.","今生是短暫的生命，永生是永遠的生命。今生是不完美的生命，永生是完美的生命。耶穌是賜我們永生的救主，永生就是像上帝的生命，是豐盛的生命，也是可以進入天國屬靈的生命。永生是人生最重要的福氣，只要我們接受、信靠耶穌就能得著永生。":"This life is brief; eternal life lasts forever. This life is imperfect; eternal life is perfect. Jesus is the Saviour who gives it. Eternal life is life like God's own — an abundant life, and a spiritual life that may enter the kingdom of heaven. It is the most important blessing of all, and it is received simply by accepting and trusting Jesus.","約翰福音三章36節":"John 3:36","信子的人有永生；不信子的人得不著永生。":"One who believes in the Son has eternal life, but one who disobeys the Son won't see life.","路加福音十八章29至30節":"Luke 18:29-30","人為神的國撇下…沒有在今世不得百倍，在來世不得永生的。":"There is no one who has left anything for God's Kingdom's sake who will not receive many times more in this time, and in the world to come, eternal life.","謝謝您賜給我今生也應許賜給我得著永生。":"Thank You for giving me this life, and for promising me eternal life as well.","對不起我沒有遵行您的旨意得罪了您，以致於失去了永生。現在我向您承認我的不完全和我一切的罪，求您赦免我的罪並且洗淨我的心靈。我迫切渴慕您賜給我得著永生的福氣。":"I am sorry that I have not followed Your will and have wronged You, and so have lost eternal life. I now confess to You my imperfection and all my sin. Forgive my sin and cleanse my soul. I long earnestly for You to give me the blessing of eternal life.","請您將永生賜給我，使我可以進入天國，不再害怕死亡。也請您幫助我天天能得著像上帝一樣的新生命，我把自己舊生命中的自私、驕傲和貪心以及各樣的軟弱和缺點都交給您。求您用您的生命，來改變我的生命。":"Give me eternal life, that I may enter the kingdom of heaven and fear death no more. Help me each day to receive new life like Your own. I hand You the selfishness, pride and greed of my old life, with all its weaknesses and faults. Take Your life, and change my life with it.","日常問安":"An everyday hello","不談信仰也沒關係，先讓他知道你記得他。":"No need to mention faith. Just let him know you remembered him.","安慰陪伴":"Comfort and company","不用講道理，陪著就好。":"No need to explain anything. Just be there.","病中代禱":"Prayer in illness","一句話，勝過一長串建議。":"One sentence beats a long list of advice.","壓力疲乏":"Pressure and weariness","他不缺道理，缺的是一口氣。":"He is not short of reasons; he is short of breath.","家庭親子":"Family and children","家裡的事，最需要有人一起守望。":"Nothing needs a fellow watchman more than what happens at home.","生日祝福":"Birthday blessing","生日是一年裡最自然的一扇門。":"A birthday is the most natural door in the whole year.","感謝道謝":"Saying thank you","被記得的人，心會軟下來。":"A person who feels remembered softens.","迷惘尋求":"Searching and unsure","他問人生意義的時候，門開了一條縫。":"When he asks what life is for, the door has opened a crack.","盼望復原":"Hope and recovery","在最低的地方，遞一句盼望。":"At the lowest point, hand him one sentence of hope.","福音邀請":"A gospel invitation","不催逼，只把門推開一點點。":"No pressing. Just push the door open a little.","決志初信":"Newly committed","決志後的三十天，是黃金期。":"The thirty days after a commitment are the golden window.","受洗新生":"Baptism and new life","那一天的紀念，會成為他日後的錨。":"The memory of that day will become his anchor later on.","節期問候":"Seasonal greetings","節期是華人最容易接受祝福的時候。":"Festivals are when a Chinese friend most readily receives a blessing.","民數記六章24至25節":"Numbers 6:24-25","願耶和華賜福給你，保護你。願耶和華使他的臉光照你，賜恩給你。":"Yahweh bless you and keep you. Yahweh make his face to shine on you, and be gracious to you.","詩篇一百二十一篇8節":"Psalm 121:8","你出你入，耶和華要保護你，從今時直到永遠。":"Yahweh will keep your going out and your coming in, from this time forth and forever more.","耶利米哀歌三章23節":"Lamentations 3:23","每早晨，這都是新的；你的誠實極其廣大！":"They are new every morning. Great is your faithfulness.","詩篇一百一十八篇24節":"Psalm 118:24","這是耶和華所定的日子，我們在其中要高興歡喜！":"This is the day that Yahweh has made. We will rejoice and be glad in it!","帖撒羅尼迦前書五章16至18節":"1 Thessalonians 5:16-18","要常常喜樂，不住地禱告，凡事謝恩。":"Always rejoice. Pray without ceasing. In everything give thanks.","馬太福音五章4節":"Matthew 5:4","哀慟的人有福了！因為他們必得安慰。":"Blessed are those who mourn, for they shall be comforted.","詩篇四十一篇3節":"Psalm 41:3","他病重在榻，耶和華必扶持他。":"Yahweh will sustain him on his sickbed.","雅各書五章15節":"James 5:15","出於信心的祈禱要救那病人，主必叫他起來。":"The prayer of faith will heal him who is sick, and the Lord will raise him up.","腓立比書四章6節":"Philippians 4:6","詩篇五十五篇22節":"Psalm 55:22","你要把你的重擔卸給耶和華，他必撫養你。":"Cast your burden on Yahweh and he will sustain you.","箴言二十二章6節":"Proverbs 22:6","教養孩童，使他走當行的道，就是到老他也不偏離。":"Train up a child in the way he should go, and when he is old he will not depart from it.","詩篇一百三十九篇14節":"Psalm 139:14","我要稱謝你，因我受造，奇妙可畏。":"I will give thanks to you, for I am fearfully and wonderfully made.","詩篇九十篇12節":"Psalm 90:12","求你指教我們怎樣數算自己的日子，好叫我們得著智慧的心。":"So teach us to count our days, that we may gain a heart of wisdom.","詩篇一百零三篇5節":"Psalm 103:5","他用美物使你所願的得以知足，以致你如鷹返老還童。":"He satisfies your desire with good things, so that your youth is renewed like the eagle's.","詩篇二十篇4節":"Psalm 20:4","將你心所願的賜給你，成就你的一切籌算。":"May he grant you your heart's desire, and fulfil all your counsel.","腓立比書一章3節":"Philippians 1:3","我每逢想念你們，就感謝我的神。":"I thank my God whenever I remember you.","詩篇一百零七篇1節":"Psalm 107:1","你們要稱謝耶和華，因他本為善；他的慈愛永遠長存！":"Give thanks to Yahweh, for he is good, for his loving kindness endures forever.","箴言十七章17節":"Proverbs 17:17","朋友乃時常親愛。":"A friend loves at all times.","哥林多後書九章15節":"2 Corinthians 9:15","感謝神，因他有說不盡的恩賜！":"Now thanks be to God for his unspeakable gift!","帖撒羅尼迦前書五章18節":"1 Thessalonians 5:18","凡事謝恩，因為這是神在基督耶穌裡向你們所定的旨意。":"In everything give thanks, for this is the will of God in Christ Jesus toward you.","馬太福音七章7節":"Matthew 7:7","你們祈求，就給你們；尋找，就尋見；叩門，就給你們開門。":"Ask, and it will be given you. Seek, and you will find. Knock, and it will be opened for you.","傳道書三章11節":"Ecclesiastes 3:11","神造萬物，各按其時成為美好，又將永生安置在世人心裡。":"He has made everything beautiful in its time. He has also set eternity in their hearts.","詩篇三十篇5節":"Psalm 30:5","一宿雖然有哭泣，早晨便必歡呼。":"Weeping may stay for the night, but joy comes in the morning.","以賽亞書四十三章19節":"Isaiah 43:19","看哪，我要做一件新事……我必在曠野開道路，在沙漠開江河。":"Behold, I will do a new thing… I will even make a way in the wilderness, and rivers in the desert.","腓立比書一章6節":"Philippians 1:6","那在你們心裡動了善工的，必成全這工，直到耶穌基督的日子。":"He who began a good work in you will complete it until the day of Jesus Christ.","彼得前書二章2節":"1 Peter 2:2","就要愛慕那純淨的靈奶，像才生的嬰孩愛慕奶一樣，叫你們因此漸長。":"As newborn babies, long for the pure spiritual milk, that with it you may grow.","常在我裡面的，我也常在他裡面，這人就多結果子。":"He who remains in me and I in him bears much fruit.","馬太福音三章17節":"Matthew 3:17","這是我的愛子，我所喜悅的。":"This is my beloved Son, with whom I am well pleased.","加拉太書三章27節":"Galatians 3:27","你們受洗歸入基督的都是披戴基督了。":"As many of you as were baptised into Christ have put on Christ.","以弗所書二章19節":"Ephesians 2:19","你們不再作外人和客旅，是與聖徒同國，是神家裡的人了。":"You are no longer strangers and foreigners, but fellow citizens with the saints and of the household of God.","詩篇六十五篇11節":"Psalm 65:11","你以恩典為年歲的冠冕；你的路徑都滴下脂油。":"You crown the year with your bounty, and your paths overflow with abundance.","路加福音二章11節":"Luke 2:11","因今天在大衛的城裡，為你們生了救主，就是主基督。":"For today, in David's city, there is born to you a Saviour, who is Christ the Lord.","詩篇一百三十六篇9節":"Psalm 136:9","他造月亮星宿管黑夜，因他的慈愛永遠長存。":"He made the moon and stars to rule by night, for his loving kindness endures forever.","約翰福音十一章25節":"John 11:25","復活在我，生命也在我。信我的人雖然死了，也必復活。":"I am the resurrection and the life. He who believes in me will still live, even if he dies.","以賽亞書九章6節":"Isaiah 9:6","因有一嬰孩為我們而生……名稱為奇妙策士、全能的神、永在的父、和平的君。":"For to us a child is born… his name will be called Wonderful Counsellor, Mighty God, Everlasting Father, Prince of Peace.","願主保守你":"May the Lord keep you","出入蒙保守":"Kept coming and going","每早晨都是新的":"New every morning","願你今天喜樂":"May today be glad","願你心裡有平安":"May there be peace in your heart","你不是一個人":"You are not alone","有主與你同行":"The Lord walks with you","願主親自安慰你":"May the Lord Himself comfort you","祂懂你的痛":"He knows your pain","盼望仍然在前面":"Hope is still ahead","願主醫治你":"May the Lord heal you","願你早日康復":"May you soon be well","恩典夠你用":"His grace is enough","願主扶持你":"May the Lord sustain you","我為你守望":"I am watching in prayer for you","願你得著安息":"May you find rest","把重擔交給祂":"Give Him the weight","願你從新得力":"May your strength be renewed","願平安保守你的心":"May peace guard your heart","慢一點也沒關係":"Slower is all right","願主賜福你的家":"May the Lord bless your home","願全家蒙恩":"Grace on the whole household","願主建造你的家":"May the Lord build your house","願主賜你智慧":"May the Lord give you wisdom","願你也被眷顧":"May you be cared for too","生日快樂":"Happy birthday","願你末後有指望":"May your future hold hope","願你歲歲平安":"Peace in every year","願你日日更新":"Renewed day by day","願你心願得成":"May your heart's desire be granted","謝謝有你":"Thankful for you","真心謝謝你":"Truly, thank you","願我們的情誼長存":"May our friendship last","恩典說不盡":"Grace beyond telling","心存感恩":"A thankful heart","願主指引你的路":"May the Lord direct your path","願光照亮你的路":"May light fall on your road","尋找的就尋見":"Those who seek will find","願你尋見所要的":"May you find what you seek","你不是偶然被造的":"You were not made by accident","願你看見出路":"May you see a way through","早晨必要歡呼":"Joy comes in the morning","願主為你開路":"May the Lord open a way","你可以重新開始":"You can begin again","願力量加給你":"May strength be given you","你是被愛的":"You are loved","門把在你這一邊":"The handle is on your side","你不必先變好":"You need not improve first","願意就可以":"Willing is enough","祂一直在找你":"He has been looking for you","恭喜你回家了":"Welcome home","你有一顆新心了":"You have a new heart","祂必成全這工":"He will complete the work","一天一小步":"One small step a day","常在祂裡面":"Remain in Him","恭喜你受洗":"Congratulations on your baptism","你是神所愛的":"You are God's beloved","你已披戴基督":"You have p d: why is it me who is ill?","他長期慢性病，吃藥吃到失去盼望。":"He has a long-term illness and has lost hope somewhere among the medications.","他問：禱告真的能醫病嗎？":"He asked: can prayer really heal?","他問：信了就一定會好嗎？":"He asked: if I believe, will I certainly get better?","他說：我拜過很多廟，都沒有好。":"He said: I have been to many temples and none of it helped.","他快要開刀了，心裡很害怕。":"His operation is close and he is very frightened.","他在照顧生病的家人，快累垮了。":"He is caring for a sick relative and is close to collapse.","他說：我這把年紀，好不了了。":"He said: at my age there is no getting better.","他問：生病是不是上帝在懲罰我？":"He asked: is this illness God punishing me?","醫生說沒辦法了，他很絕望。":"The doctors say there is nothing more to be done, and he is in despair.","他長期疼痛，睡不好也沒力氣。":"He is in constant pain, sleeping badly and with no strength.","他失眠很多年，愈想睡愈睡不著。":"He has not slept properly for years; the harder he tries the worse it gets.","他的孩子生了重病，他快撐不住。":"His child is gravely ill and he is barely holding up.","他說：我最怕的是拖累家人。":"He said: what I fear most is being a burden to my family.","他問：可以一邊看醫生、一邊禱告嗎？":"He asked: can I see a doctor and pray at the same time?","他信了以後病沒有好，覺得很失望。":"He believed and did not get better, and is deeply disappointed.","他在安寧病房，我可以說什麼？":"He is in palliative care. What can I say?","他問：如果沒有醫治，那還信什麼？":"He asked: if there is no healing, what is there to believe in?","幫我帶他做一次病得醫治的禱告。":"Help me lead him in a prayer for healing.","他很想結婚，卻一直遇不到合適的人。":"He longs to marry and keeps not meeting the right person.","他剛失戀，傷得很重。":"He has just come out of a relationship and is badly hurt.","他問：上帝真的會為我預備一個人嗎？":"He asked: will God really prepare someone for me?","他喜歡的人不信主，問可不可以在一起。":"The person he likes does not believe, and he asks whether they can be together.","他被劈腿過，不敢再相信人。":"He was cheated on and dares not trust anyone again.","他正在同居，怕信了就得改變。":"He is living with someone and fears believing would mean changing that.","他說：我條件不好，不會有人要我。":"He said: I have little to offer; no one would want me.","他老是遇到不對的人，一次又一次。":"He keeps meeting the wrong person, time after time.","他被家人催婚，壓力很大。":"His family keeps pressing him to marry and the pressure is heavy.","他離婚了，覺得自己很失敗。":"He is divorced and feels a failure.","他喜歡上有家庭的人，很掙扎。":"He has fallen for someone who is married, and is in turmoil.","他說：我不相信這世上有真愛。":"He said: I do not believe real love exists.","他問：基督徒交往有什麼不一樣？":"He asked: what is different about how Christians court?","他問：為什麼婚前不可以有性關係？":"He asked: why not sex before marriage?","他年紀不小了，怕來不及。":"He is no longer young and fears it is too late.","他和交往對象為了信仰吵架。":"He and the person he is seeing have quarrelled over faith.","他被前一段感情傷得走不出來。":"He cannot get free of the hurt from his last relationship.","他問：怎麼知道這個人是不是對的人？":"He asked: how do I know whether this is the right person?","他很寂寞，用交友軟體填補空虛。":"He is lonely and fills the emptiness with dating apps.","幫我帶他做一次愛情如意的禱告。":"Help me lead him in a prayer for love fulfilled.","他和另一半天天冷戰。":"He and his partner are frozen out from each other day after day.","他的孩子叛逆，已經不跟他說話。":"His child is rebelling and no longer speaks to him.","他和公婆或岳父母處不來。":"He cannot get along with his in-laws.","他說：我這個家已經沒救了。":"He said: this family of mine is beyond saving.","他家人為了錢翻臉。":"His family have fallen out over money.","他在原生家庭受過很深的傷。":"He carries deep wounds from the family he grew up in.","他說：另一半不信，我怎麼辦？":"He said: my partner does not believe. What do I do?","他的孩子沉迷手機和遊戲。":"His child is lost in a phone and video games.","他長期照顧失智或臥床的長輩。":"He has long been caring for an elderly parent with dementia or confined to bed.","他家裡有人酗酒或賭博。":"Someone in his household drinks heavily or gambles.","他說：爸媽偏心，我一直放不下。":"He said: my parents favoured another child, and I have never got over it.","他和兄弟姊妹在爭遺產。":"He and his siblings are fighting over an inheritance.","他說：我不會表達愛，只會罵人。":"He said: I cannot express love; all I do is scold.","他的孩子在外地，很少回家。":"His children live far away and rarely come home.","他的婚姻已經談到要離婚。":"His marriage has reached talk of divorce.","他說：家裡拜拜，我信了會被趕出去。":"He said: my family keeps the traditional observances; if I believe I will be thrown out.","他的孩子中輟或出了狀況。":"His child has dropped out of school or got into trouble.","他想改變家裡的氣氛，卻不知從哪開始。":"He wants to change the atmosphere at home and does not know where to start.","他問：一個人信主，全家真的會蒙福嗎？":"He asked: if one person believes, will the whole household really be blessed?","幫我帶他做一次家庭和樂的禱告。":"Help me lead him in a prayer for a home at peace.","他說：我人緣很差，沒有什麼朋友。":"He said: people do not take to me; I have few friends.","他在職場被排擠。":"He is being frozen out at work.","他很怕生，不太敢跟人講話。":"He is very shy and hardly dares speak to people.","他說：我一開口就得罪人。":"He said: I offend people the moment I open my mouth.","他被同事在背後說壞話。":"His colleagues talk about him behind his back.","他說：我對人很好，卻常常被利用。":"He said: I treat people well and am often taken advantage of.","他非常在意別人的眼光。":"He cares enormously what other people think.","他和主管處不來，每天很痛苦。":"He cannot get along with his manager and every day is painful.","他說：我不會拒絕人，累得要命。":"He said: I cannot say no to anyone, and it is exhausting me.","他退休以後失去了人際圈。":"Since retiring he has lost his circle of people.","他搬到新環境，融不進去。":"He has moved somewhere new and cannot settle in.","他說：我脾氣不好，發完就後悔。":"He said: my temper is bad, and I regret it as soon as it passes.","他被最好的朋友背叛過。":"He was betrayed by his closest friend.","他說：我不擅長交際應酬。":"He said: I am no good at socialising.","孩子長大了，他覺得沒有人需要他。":"His children are grown and he feels nobody needs him.","他問：教會的人會不會排擠我？":"He asked: will the people at church shut me out?","他問：怎麼跟討厭的人相處？":"He asked: how do I get along with someone I dislike?","他一個人住，整天沒和人說到話。":"He lives alone and can go all day without speaking to anyone.","他說：我不想欠人情，所以不跟人來往。":"He said: I do not want to owe anyone, so I keep away from people.","幫我帶他做一次人緣良好的禱告。":"Help me lead him in a prayer for good relationships.","他失業很久，投履歷都沒有回音。":"He has been out of work a long time and hears nothing back from applications.","他工作很拼，卻一直升不上去。":"He works hard and never gets promoted.","他想創業，心裡很不安。":"He wants to start a business and is deeply uneasy.","他說：我做什麼都失敗。":"He said: everything I try fails.","他被公司裁員了。":"He has been made redundant.","公司要他做不誠實的事，他很掙扎。":"His company wants him to do something dishonest and he is in turmoil.","他生意被倒帳，損失慘重。":"He was left with bad debts in his business and lost heavily.","他工作沒有成就感，想換又不敢。":"His work gives him no sense of achievement; he wants to change and dares not.","他問：基督徒可以追求成功嗎？":"He asked: may a Christian pursue success?","他說：我拜文昌、拜關公，生意才會好。":"He said: I make offerings to the gods of learning and of commerce so that business goes well.","他準備考試，壓力大到睡不著。":"He is preparing for an examination and the pressure keeps him awake.","他和合夥人拆夥，關係鬧僵。":"He has split from his business partner and the relationship has soured.","他的功勞被同事搶走。":"A colleague took the credit for his work.","他問：禱告真的能讓生意變好嗎？":"He asked: can prayer really make business better?","他為了工作犧牲家庭，心裡很矛盾。":"He has sacrificed his family for his work and is torn about it.","他年紀大了，怕被淘汰。":"He is getting older and fears being cast aside.","他的店快開不下去了。":"His shop is close to closing.","他說：我沒有背景，哪來的機會。":"He said: I have no connections, so where would an opportunity come from?","他問：成功了為什麼要感謝上帝？":"He asked: if I succeed, why should I thank God?","幫我帶他做一次事業成功的禱告。":"Help me lead him in a prayer for success in his work.","他負債，每天被錢追著跑。":"He is in debt and chased by money every day.","他說：我怎麼賺都不夠用。":"He said: however much I earn it is never enough.","他借錢給朋友，對方不還。":"He lent money to a friend who will not repay it.","他投資虧了一大筆錢。":"He lost a large sum in an investment.","他問：信了是不是要奉獻很多錢？":"He asked: does believing mean giving a lot of money?","他問：上帝連我的錢也要管嗎？":"He asked: does God want a say in my money too?","他退休金不夠，愈想愈焦慮。":"His pension is not enough, and the more he thinks the more anxious he gets.","他為了錢和家人翻臉。":"He has fallen out with his family over money.","他說：有錢人才信得起宗教吧。":"He said: religion must be for people who can afford it.","他被詐騙，損失了大半積蓄。":"He was defrauded and lost most of his savings.","他說：我一輩子省吃儉用，還是這樣。":"He said: I have scrimped all my life and it has come to this.","他有賭博或亂花錢的習慣。":"He gambles, or spends without control.","他背房貸背得很辛苦。":"The mortgage is a heavy weight on him.","他問：什麼叫「富足並不加上憂慮」？":"He asked: what does it mean that God's blessing brings wealth and adds no trouble to it?","他很怕變窮，緊抓著錢不敢放。":"He is terrified of poverty and grips his money tightly.","他想幫助別人，卻覺得自己不夠用。":"He wants to help others and feels he has not enough himself.","他說：我沒有留給孩子什麼。":"He said: I have left my children nothing.","他為醫藥費發愁。":"He is worried about medical costs.","他問：十一奉獻是規定嗎？":"He asked: is the tithe a rule?","幫我帶他做一次凡事富足的禱告。":"Help me lead him in a prayer for provision in everything.","他說：我沒經歷過什麼，怎麼相信？":"He said: I have experienced nothing, so how am I to believe?","他問：神蹟現在還會發生嗎？":"He asked: do miracles still happen now?","他說：我試過禱告，沒有任何回應。":"He said: I have tried praying and there was no answer at all.","他的人生走到絕路了。":"His life has come to a dead end.","他問：怎麼知道那是巧合還是神？":"He asked: how do I know whether that was coincidence or God?","他說：我意志力很弱，什麼都改不了。":"He said: my will is weak; I cannot change anything.","他覺得自己被鬼壓、被跟。":"He feels oppressed by something, as if he is being followed.","他問：什麼是被聖靈充滿？":"He asked: what does being filled with the Holy Spirit mean?","他說：我看教會的人也沒什麼特別。":"He said: the people at church do not seem anything special to me.","他經歷過一件很奇妙的事，說不上來。":"Something remarkable happened to him that he cannot explain.","他說：如果真的有神，就讓我看見。":"He said: if there really is a God, let me see Him.","他遇到重大打擊，整個人垮掉了。":"A heavy blow has left him completely broken.","他問：上帝為什麼不直接改變我的環境？":"He asked: why does God not simply change my circumstances?","他家中有人被恐懼或邪術綑綁。":"Someone in his household is bound by fear or by occult practice.","他說：我這個人已經定型了，改不了。":"He said: I am set in my ways now and cannot change.","他問：苦難怎麼會是化妝的祝福？":"He asked: how can suffering be a blessing in disguise?","他一直想改變，卻一次次失敗。":"He keeps wanting to change and keeps failing.","他問：重生到底是什麼感覺？":"He asked: what does being born again actually feel like?","他說：你們講的能力，我看不到。":"He said: this power you speak of, I cannot see it.","幫我帶他做一次經歷神能的禱告。":"Help me lead him in a prayer to know God's power.","他很怕死，不敢談這個話題。":"He is very afraid of death and will not discuss it.","他剛失去至親，問人死了到底去哪裡。":"He has just lost someone dear and asks where the dead actually go.","他問：真的有天堂和地獄嗎？":"He asked: are heaven and hell real?","他說：人死了就一了百了。":"He said: when you die, that is the end of it.","他問：我過世的家人現在在哪裡？":"He asked: where is my family member who has died?","他的長輩快走了，我可以做什麼？":"His elderly relative is near the end. What can I do?","他問：現在才信會不會太晚？":"He asked: is it too late to believe now?","他年紀很大了，覺得來不及了。":"He is very old and feels there is no time left.","他問：好人不信也會下地獄嗎？":"He asked: does a good person who does not believe go to hell?","他說：永生聽起來很虛，沒有實感。":"He said: eternal life sounds vague and unreal to me.","他問：一定要受洗才能得永生嗎？":"He asked: must one be baptised to receive eternal life?","他剩下的時間不多了。":"He has little time left.","他說：我怕死後被審判。":"He said: I am afraid of being judged after death.","他問：輪迴和永生差在哪裡？":"He asked: what is the difference between reincarnation and eternal life?","他說：我活著都顧不了，想那麼遠做什麼？":"He said: I can barely manage this life; why think that far ahead?","他問：信了以後就不怕死了嗎？":"He asked: once I believe, will I stop fearing death?","他的孩子早逝，他一直過不去。":"His child died young and he has never got past it.","他問：永生是死了以後才開始嗎？":"He asked: does eternal life only begin after death?","他想信，卻怕家人反對到底。":"He wants to believe but fears his family will oppose him to the end.","幫我帶他做一次得著永生的禱告。":"Help me lead him in a prayer to receive eternal life.","還沒有紀錄":"No record yet","今天":"Today","昨天":"Yesterday","天前":" days ago","個月前":" months ago","年前":" years ago","他":"him","又":" and ","筆":" entries","次":" times","位":"","人．已得救":" people · saved: ","確定":"Confirm","七":"7","八":"8","九":"9","十":"10","這個裝置不支援朗讀":"This device does not support reading aloud","已停止朗讀":"Reading stopped","這一頁沒有可朗讀的內容":"There is nothing on this page to read aloud","開始朗讀，再
