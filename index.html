function calcStreak(dates) {
  const set = new Set(dates);
  let n = 0, d = new Date();
  if (!set.has(todayISO(d))) d = new Date(Date.now() - 86400000);
  while (set.has(todayISO(d))) { n++; d = new Date(d.getTime() - 86400000); }
  return n;
}

VIEWS.walk = async function () {
  let ps = await persons();
  if (sortMode === 'cold') ps.sort((a, b) => (daysSince(b.lastContactAt) ?? 99999) - (daysSince(a.lastContactAt) ?? 99999));
  if (sortMode === 'stage') ps.sort((a, b) => b.stage.localeCompare(a.stage));
  if (sortMode === 'new') ps.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));

  const counts = {};
  C.core.stages.forEach(s => counts[s.id] = 0);
  ps.forEach(p => counts[p.stage] = (counts[p.stage] || 0) + 1);

  return `
  <div class="btn-row" style="margin-bottom:14px">
    <button class="btn" data-act="addPerson">＋ 加入一位 2</button>
    <button class="btn quiet" data-act="openMap">看七里程地圖</button>
  </div>

  ${ps.length ? `
  <div class="card tight">
    <div class="eyebrow">排序</div>
    <div class="seg">
      <button data-act="setSort" data-m="cold" aria-pressed="${sortMode === 'cold'}">最久沒聯絡</button>
      <button data-act="setSort" data-m="stage" aria-pressed="${sortMode === 'stage'}">里程進度</button>
      <button data-act="setSort" data-m="new" aria-pressed="${sortMode === 'new'}">加入時間</button>
    </div>
  </div>
  ${ps.map(personCard).join('')}
  <div class="card tight">
    <div class="eyebrow">名單分布</div>
    <div class="meta" style="display:flex;flex-wrap:wrap;gap:8px">
      ${C.core.stages.filter(s => counts[s.id]).map(s =>
        `<span class="chip stage" style="background:${s.color}">${s.id} ${esc(s.name)}　${counts[s.id]}</span>`).join('')}
    </div>
    <p class="tiny" style="margin-top:10px">這只是牧養的參考，不是成績。一個靈魂比一百個數字寶貴。</p>
  </div>`
  : `<div class="empty">
      <div class="big">你心裡的那張名單，是誰？</div>
      <p class="muted">父母、配偶、兒女、同事、老同學……<br>先寫下三個名字，就從今天開始。</p>
      <button class="btn" data-act="addPerson" style="margin-top:14px">寫下第一個名字</button>
    </div>`}`;
};
ACTS.setSort = d => { sortMode = d.m; render(); };

let _rel = null, _stage = null;
ACTS.addPerson = () => { _rel = null; _stage = 'L0'; push('editPerson', {}, '加入一位 2'); };
ACTS.editPerson = d => { _rel = null; _stage = null; push('editPerson', { id: d.id }, '編輯資料'); };
ACTS.pickRel = (d, el) => {
  _rel = d.v;
  el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el));
};
ACTS.pickLock = (d, el) => {
  el.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el));
};
ACTS.pickStage = (d, el) => {

ACTS.savePerson = async d => {
  const name = $('#fName').value.trim();
  if (!name) { toast('請至少填一個名字或代號'); $('#fName').focus(); return; }
  const now = new Date().toISOString();
  let p = d.id ? await DB.get('persons', d.id) : null;
  const relSel = $('#fRel').querySelector('[aria-pressed="true"]');
  const stSel = $('#fStage').querySelector('[aria-pressed="true"]');
  const stage = _stage || (stSel ? stSel.dataset.v : 'L0');
  const oldStage = p ? p.stage : null;
  if (!p) p = { id: uid(), createdAt: now, prayFrom: todayISO(), order: Date.now() };
  p.name = name;
  p.relation = _rel || (relSel ? relSel.dataset.v : '') || p.relation || '';
  p.stage = stage;
  p.birthday = $('#fBirth').value || '';
  p.background = $('#fBg').value.trim();
  p.prayerFocus = $('#fFocus').value.trim();
  const lkSel = $('#fLock') ? $('#fLock').querySelector('[aria-pressed="true"]') : null;
  p.locked = !!(lkSel && lkSel.dataset.v === '1');
  p.updatedAt = now;
  await DB.put('persons', p);
  if (oldStage && oldStage !== stage)
    await DB.put('milestones', { id: uid(), personId: p.id, fromStage: oldStage, toStage: stage, date: todayISO(), story: '' });
  popSheet(); render();
  toast(d.id ? '已儲存' : `已把「${name}」加入你的名單`);
};
ACTS.delPerson = d => {
  confirmBox('確定要刪除嗎？', `「${d.name}」的所有紀錄、代禱與歷程都會被清除，無法復原。`, '確定刪除', async () => {
    for (const s of ['interactions', 'prayers', 'progress', 'milestones', 'signs']) {
      const rows = await DB.all(s);
      for (const r of rows) if (r.personId === d.id) await DB.del(s, r.id);
    }
    await DB.del('persons', d.id);
    closeSheet(); render(); toast('已刪除');
  }, true);
};

  const prayDays = p.prayFrom ? daysSince(p.prayFrom) + 1 : 0;

  return `
  <div class="card">
    <h2 class="sec" style="font-size:calc(27px * var(--fs))">${esc(p.name)}</h2>
    <div class="meta" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">

      <button class="btn sm" data-act="quickLog" data-id="${p.id}">記一筆</button>
      <button class="btn gold sm" data-act="openDraft" data-id="${p.id}">寫訊息</button>
      <button class="btn quiet sm" data-act="editPerson" data-id="${p.id}">編輯</button>
      <button class="btn quiet sm" data-act="openMapFor" data-id="${p.id}">同行地圖</button>
    </div>
  </div>

  <div class="card">
    <div class="eyebrow">下一步建議</div>
    <p style="font-size:calc(20px * var(--fs));line-height:1.9">${esc(tip)}</p>
    <p class="tiny">先禱告，求聖靈引導；不是你在說服他，是聖靈在感動他。</p>
  </div>

  ${hide ? `<div class="card" style="border-left:6px solid var(--navy)">
    <div class="eyebrow">已保護</div>
    <p class="muted">他的背景、代禱與關心紀錄已設為隱藏，避免旁人不小心看見。</p>
    <button class="btn quiet" data-act="reveal" data-id="${p.id}" style="margin-top:10px">點一下顯示</button>
  </div>` : ''}
  ${!hide && p.background ? `<div class="card"><div class="eyebrow">背景與難處</div>
    <p>${nl2br(p.background)}</p></div>` : ''}

  ${hide ? '' : `<div class="card">
    <div class="eyebrow">代禱事項</div>
    ${p.prayerFocus ? `<p>${nl2br(p.prayerFocus)}</p>` : ''}
    ${prs.length ? prs.map(x => `<button class="row" data-act="togglePrayer" data-id="${x.id}">
      <span class="grow"><span class="t" style="${x.answeredAt ? 'text-decoration:line-through;opacity:.7' : ''}">${esc(x.item)}</span>
      <span class="s">${x.answeredAt ? '已蒙應允　' + fmtDate(x.answeredAt) : '從 ' + fmtDate(x.startedAt) + ' 開始求'}</span></span>
      <span class="arrow">${x.answeredAt ? '✓' : '○'}</span></button>`).join('') : '<p class="tiny">還沒有列出具體的事項。</p>'}
    <div style="display:flex;gap:8px;margin-top:8px">
      <input type="text" id="newPrayer" placeholder="加一項代禱事項">
      <button class="btn sm" data-act="addPrayer" data-id="${p.id}">加入</button>
    </div>
  </div>`}

  ${sgs.length ? `<div class="card"><div class="eyebrow">主動工的記號</div>
    ${sgs.slice(0, 6).map(s => `<p style="margin-bottom:8px">・${esc(s.text)}
      <span class="tiny">（${fmtDate(s.date)}）</span></p>`).join('')}</div>` : ''}

  ${hide ? '' : `<div class="card">
    <div class="eyebrow">關心紀錄</div>
    ${inter.length ? inter.slice(0, 12).map(x => `<div style="padding:10px 0;border-bottom:1px solid var(--line)">
      <div style="font-weight:700">${fmtDate(x.date)}　${esc(x.type || '')}
        ${x.mood ? `<span class="chip" style="margin-left:6px">${esc(moodLabel(x.mood))}</span>` : ''}</div>

    </div>`).join('') : '<p class="tiny">還沒有紀錄。按「記一筆」，一句話就好。</p>'}
  </div>`}

  ${mils.length ? `<div class="card"><div class="eyebrow">里程歷程</div>
    ${mils.map(m => `<p>・${fmtDate(m.date)}　${m.fromStage} → ${m.toStage}
      ${m.story ? `<br><span class="muted">${esc(m.story)}</span>` : ''}</p>`).join('')}</div>` : ''}
  `;
};
function moodLabel(id) { const m = C.core.moods.find(x => x.id === id); return m ? m.label : id; }
ACTS.openPerson = d => { G.revealPid = null; push('person', { id: d.id }, '同行紀錄'); };
ACTS.addPrayer = async d => {
  const t = $('#newPrayer').value.trim();
  if (!t) return;
  await DB.put('prayers', { id: uid(), personId: d.id, item: t, startedAt: todayISO(), answeredAt: null, active: true });
  refreshSheet(); toast('加入了');
};
ACTS.togglePrayer = async d => {
  const x = await DB.get('prayers', d.id);
  if (!x) return;
  if (x.answeredAt) { x.answeredAt = null; await DB.put('prayers', x); refreshSheet(); return; }
  x.answeredAt = todayISO(); await DB.put('prayers', x); refreshSheet();
  toast('感謝主！這是祂動工的記號');
};

ACTS.doSetStage = async d => {
  const p = await DB.get('persons', d.id);
  const story = ($('#milStory') || {}).value || '';
  const from = p.stage;
  p.stage = d.s; p.updatedAt = new Date().toISOString();
  if ((d.s === 'L3' || d.s === 'L4') && !p.decidedAt) p.decidedAt = todayISO();
  if (d.s === 'L4' && !p.baptizedAt) p.baptizedAt = todayISO();
  await DB.put('persons', p);
  await DB.put('milestones', { id: uid(), personId: p.id, fromStage: from, toStage: d.s, date: todayISO(), story: story.trim() });
  closeModal(); refreshSheet(); render();
  if (d.s === 'L3' || d.s === 'L4') {
    setTimeout(() => modal(`<h3 class="sub">他親口承認耶穌是主</h3>

      </div>`), 300);
  } else toast('已更新里程');
};

function faqFilter() {
  const box = $('#faqSearch');
  if (!box) return;
  const q = box.value.trim();
  let shown = 0;
  document.querySelectorAll('#faqList details').forEach(el => {
    const okCat = faqCat === 'all' ? true
      : faqCat === 'fav' ? S.favFaq.includes(el.dataset.faq)
      : el.dataset.cat === faqCat;
    const okQ = !q || el.dataset.text.indexOf(q) !== -1;
    const on = okCat && okQ;
    el.style.display = on ? '' : 'none';
    if (on) shown++;
  });
  const e = $('#faqEmpty'); if (e) e.style.display = shown ? 'none' : '';
}

  faqCat = d.c;
  document.querySelectorAll('#faqCats button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.c === faqCat));
  faqFilter();
};
ACTS.favFaq = (d, el) => {
  const i = S.favFaq.indexOf(d.id);
  if (i >= 0) S.favFaq.splice(i, 1); else S.favFaq.push(d.id);
  saveS('favFaq', S.favFaq);
  el.textContent = S.favFaq.includes(d.id) ? '★ 已收藏（點一下取消）' : '☆ 收藏這一題';
  if (faqCat === 'fav') faqFilter();
};

ACTS.openFrame = async d => {

  $('#frame').classList.remove('hidden');
};

ACTS.doExport = async () => {
  const data = { app: '321福音同行', version: APP_VERSION, exportedAt: new Date().toISOString(), settings: {}, stores: {} };
  ['fontScale', 'theme', 'bigcards', 'ttsRate', 'amTime', 'pmTime', 'favFaq', 'rotate'].forEach(k => data.settings[k] = S[k]);
  data.settings.witness = LS.get('witness', null);
  data.settings.partner = LS.get('partner', null);
  for (const s of G.STORES)
    data.stores[s] = await DB.all(s);
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `321福音同行_備份_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  saveS('lastBackupAt', todayISO());
  toast('已匯出。請把檔案存到安全的地方');
};
ACTS.doImport = () => {
  const f = $('#impFile').files[0];
  if (!f) { toast('請先選擇備份檔'); return; }
  const rd = new FileReader();
  rd.onload = async () => {
    let d;
    try { d = JSON.parse(rd.result); } catch (e) { toast('這個檔案讀不出來'); return; }
    if (!d.stores) { toast('這不是 321 福音同行的備份檔'); return; }
    let n = 0;
    for (const s of Object.keys(d.stores)) {
      for (const row of d.stores[s]) { try { await DB.put(s, row); n++; } catch (e) {} }
    }
    if (d.settings) Object.keys(d.settings).forEach(k => { if (k !== 'witness' && k !== 'partner' && d.settings[k] !== undefined) saveS(k, d.settings[k]); });
    if (d.settings && d.settings.witness) LS.set('witness', d.settings.witness);
    if (d.settings && d.settings.partner) LS.set('partner', d.settings.partner);
    applyLook(); closeSheet(); render(); toast(`已還原 ${n} 筆資料`);
  };
  rd.readAsText(f);
};
ACTS.wipeAll = () => {

async function copyText(t) {
  try {
    await navigator.clipboard.writeText(t);
    toast('已複製，可以貼到 LINE 傳給他');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已複製'); }
    catch (x) { toast('這個瀏覽器不支援複製，請長按選取'); }
    ta.remove();
  }
}

function drawCard(cv, v, ratio, dark) {
  const W = 1200, H = ratio === '1:1' ? 1200 : ratio === '4:5' ? 1500 : 675;
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, W, H);
  if (dark) { g.addColorStop(0, '#1B4B7A'); g.addColorStop(1, '#0E2540'); }
  else { g.addColorStop(0, '#FBFAF7'); g.addColorStop(1, '#F0EBE1'); }
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  const ink = dark ? '#FFFFFF' : '#1F2937';
  const gold = dark ? '#E2BE6A' : '#8C6608';
  x.fillStyle = gold; x.fillRect(88, H * 0.16, 8, H * 0.52);

  const F = w => `${w} 46px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif`;
  const pad = 140, maxW = W - pad - 96;
  let size = v.text.length > 60 ? 46 : v.text.length > 38 ? 54 : 62;
  let lines = [];
  for (;;) {
    x.font = F('700').replace('46px', size + 'px');
    lines = wrap(x, v.text, maxW);
    if (lines.length * size * 1.85 < H * 0.56 || size <= 34) break;
    size -= 4;
  }
  const lh = size * 1.85;
  let y = H / 2 - (lines.length * lh) / 2 - 10;
  x.fillStyle = ink; x.textBaseline = 'middle';
  lines.forEach(t => { x.fillText(t, pad, y); y += lh; });

  x.font = F('700').replace('46px', Math.round(size * 0.62) + 'px');
  x.fillStyle = gold;
  x.fillText(v.ref + '（和合本）', pad, y + size * 0.5);

  x.font = F('400').replace('46px', '28px');
  x.fillStyle = dark ? 'rgba(255,255,255,.55)' : 'rgba(31,41,55,.5)';
  x.textAlign = 'right';
  x.fillText('321 福音同行．國度321空中團契', W - 88, H - 62);
  x.textAlign = 'left';
}
function wrap(x, text, maxW) {
  const out = []; let cur = '';
  for (const ch of text) {
    if (x.measureText(cur + ch).width > maxW && cur) { out.push(cur); cur = ''; }
    cur += ch;
    if ('，。；、！？'.includes(ch) && x.measureText(cur).width > maxW * 0.72) { out.push(cur); cur = ''; }
  }
  if (cur) out.push(cur);
  return out;
}

function icsWrap(body) {
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//321福音同行//TW', 'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH', 'X-WR-CALNAME:321福音同行', body, 'END:VCALENDAR'].join('\r\n');
}
function stamp() {
  const d = new Date();
  return d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) + 'T' +
    pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + 'Z';
}
function fold(s) {
  /* RFC 5545：每行不超過 75 位元組，中文以保守長度切 */
  return s.split('\r\n').map(l => {
    if (l.length <= 40) return l;
    const out = [];
    for (let i = 0; i < l.length; i += 40) out.push((i ? ' ' : '') + l.slice(i, i + 40));
    return out.join('\r\n');
  }).join('\r\n');
}
function dailyEvent(hhmm, title, desc, uidSeed) {
  const d = new Date();
  const [h, m] = hhmm.split(':').map(Number);
  const start = d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
    'T' + pad2(h) + pad2(m) + '00';
  const end = d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
    'T' + pad2(h) + pad2(Math.min(59, m + 10)) + '00';
  return ['BEGIN:VEVENT', 'UID:' + uidSeed + '@321gospel', 'DTSTAMP:' + stamp(),
    'DTSTART:' + start, 'DTEND:' + end, 'RRULE:FREQ=DAILY',
    'SUMMARY:' + title, 'DESCRIPTION:' + desc,
    'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY', 'DESCRIPTION:' + title,
    'END:VALARM', 'END:VEVENT'].join('\r\n');
}

/* =========================================================
   二　App 鎖與敏感遮罩
   我們記的是別人靈魂最深的傷處，不能讓任何人隨手翻到。
   ========================================================= */
function lockCfg() { return LS.get('lock', { on: false, salt: '', hash: '' }); }
async function hashPin(pin, salt) {
  const raw = salt + '|' + pin + '|321';
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 5381;
    for (let i = 0; i < raw.length; i++) h = ((h << 5) + h + raw.charCodeAt(i)) >>> 0;
    return 'f' + h.toString(16);
  }
}
G.lockRequired = () => !!lockCfg().on;

let _pin = '';
function pinDots() {
  const el = document.getElementById('pinDots');
  if (el) el.textContent = '●'.repeat(_pin.length) + '○'.repeat(Math.max(0, 4 - _pin.length));
}
function lockHTML(title, hint) {
  return `<div class="inner">
    <div class="eyebrow">${esc(title)}</div>
    <h2 class="sec" style="font-size:calc(25px * var(--fs))">請輸入四位數密碼</h2>
    <p class="muted">${esc(hint)}</p>
    <div id="pinDots" style="font-size:calc(34px * var(--fs));letter-spacing:14px;
      text-align:center;margin:18px 0;color:var(--navy)">○○○○</div>
    <div id="pinPad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
      ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="btn quiet" data-k="${n}"
        style="min-height:64px;font-size:calc(26px * var(--fs))">${n}</button>`).join('')}
      <button class="btn quiet" data-k="x" style="min-height:64px">清除</button>
      <button class="btn quiet" data-k="0" style="min-height:64px;font-size:calc(26px * var(--fs))">0</button>
      <button class="btn quiet" data-k="b" style="min-height:64px">←</button>
    </div>
    <p class="tiny" style="text-align:center;margin-top:16px" id="pinMsg">　</p>
    <button class="btn quiet sm" id="pinForgot" style="width:100%;margin-top:8px">我忘記密碼了</button>
  </div>`;
}
function ensureLockEl() {
  let el = document.getElementById('lock');
  if (!el) {
    el = document.createElement('div');
    el.id = 'lock'; el.className = 'hidden';
    document.body.appendChild(el);
  }
  return el;
}
function bindPad(onFull) {
  const pad = document.getElementById('pinPad');
  pad.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k;
    if (k === 'x') _pin = '';
    else if (k === 'b') _pin = _pin.slice(0, -1);
    else if (_pin.length < 4) _pin += k;
    pinDots();
    if (_pin.length === 4) setTimeout(() => onFull(_pin), 120);
  }));
  pinDots();
}
G.askUnlock = function () {
  return new Promise(res => {
    const el = ensureLockEl();
    el.innerHTML = lockHTML('321 福音同行', '這些名字很寶貴，所以我們把門關上了。');
    el.classList.remove('hidden');
    _pin = '';
    bindPad(async pin => {
      const cfg = lockCfg();
      const h = await hashPin(pin, cfg.salt);
      if (h === cfg.hash) {
        el.classList.add('hidden'); el.innerHTML = ''; res(true);
      } else {
        _pin = ''; pinDots();
        const m = document.getElementById('pinMsg');
        m.textContent = '密碼不對，再試一次。';
        m.style.color = 'var(--orange-t)';
      }
    });
    document.getElementById('pinForgot').addEventListener('click', () => {
      const m = document.getElementById('pinMsg');
      m.innerHTML = '為了保護資料，密碼無法被找回。<br>若真的忘記，只能清除本機資料重新開始' +
        '（若你有備份檔，還原後一切都在）。';
      m.style.color = 'var(--ink-2)';
      const b = document.getElementById('pinForgot');
      b.textContent = '我確定要清除本機資料';
      b.onclick = async () => {
        if (!confirm('所有同行紀錄將被永久清除，確定嗎？')) return;
        for (const st of G.STORES) { try { await DB.clear(st); } catch (e) {} }

        location.reload();
      };
    });
  });
};

/* =========================================================
   三　本機快照雙保險
   iOS 長期未用會清除 IndexedDB，但 localStorage 是另一個籃子。
   ========================================================= */
const SNAP = 'snap';
async function snapshot() {
  try {
    const ps = await DB.all('persons');
    if (!ps.length) return;
    const prs = await DB.all('prayers');
    LS.set(SNAP, {
      at: new Date().toISOString(),
      persons: ps.map(p => ({
        id: p.id, name: p.name, relation: p.relation, stage: p.stage,
        birthday: p.birthday, decidedAt: p.decidedAt, baptizedAt: p.baptizedAt,
        prayFrom: p.prayFrom, lastContactAt: p.lastContactAt, locked: p.locked,
        background: (p.background || '').slice(0, 300),
        prayerFocus: (p.prayerFocus || '').slice(0, 300),
        createdAt: p.createdAt, order: p.order
      })),
      prayers: prs.map(x => ({
        id: x.id, personId: x.personId, item: x.item,
        startedAt: x.startedAt, answeredAt: x.answeredAt, active: x.active
      }))
    });
  } catch (e) { /* 空間不足就安靜略過 */ }
}
G.snapStart = function () {
  setInterval(snapshot, 90000);
  document.addEventListener('visibilitychange', () => { if (document.hidden) snapshot(); });
  window.addEventListener('pagehide', snapshot);
  setTimeout(snapshot, 5000);
};
G.snapCheck = async function () {
  const snap = LS.get(SNAP, null);
  if (!snap || !snap.persons || !snap.persons.length) return;
  const ps = await DB.all('persons');

  await new Promise(res => {
    modal(`<h3 class="sub">要不要把名單救回來？</h3>

    };
  });
};

/* =========================================================
   五　生日與屬靈生日
   記得一個人的日子，就是在愛他。
   ========================================================= */
function nextIn(mmdd) {
  if (!mmdd) return null;
  const now = new Date();
  const [m, d] = mmdd.split('-').map(Number);
  let t = new Date(now.getFullYear(), m - 1, d);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (t < today) t = new Date(now.getFullYear() + 1, m - 1, d);
  return Math.round((t - today) / 86400000);
}
G.daysCard = async function (ps) {
  const rows = [];
  ps.forEach(p => {
    if (p.birthday) {
      const n = nextIn(p.birthday.slice(5));
      if (n !== null && n <= 7) rows.push({ p, n, what: '生日' });
    }
    if (p.decidedAt && daysSince(p.decidedAt) >= 300) {
      const n = nextIn(p.decidedAt.slice(5));
      const yr = new Date().getFullYear() - +p.decidedAt.slice(0, 4) + (n === 0 ? 0 : 1);
      if (n !== null && n <= 7) rows.push({ p, n, what: `屬靈生日．第 ${yr} 年` });
    }
    if (p.baptizedAt && daysSince(p.baptizedAt) >= 300) {
      const n = nextIn(p.baptizedAt.slice(5));
      if (n !== null && n <= 7) rows.push({ p, n, what: '受洗週年' });
    }
  });
  if (!rows.length) return '';
  rows.sort((a, b) => a.n - b.n);
  return `<div class="card" style="border-left:6px solid var(--green)">
    <div class="eyebrow">本週的日子</div>
    <h3 class="sub">記得一個人的日子，就是在愛他</h3>
    ${rows.map(r => `<button class="row" data-act="openDraft" data-id="${r.p.id}">
      <span class="grow"><span class="t">${esc(r.p.name)}　${esc(r.what)}</span>

/* ---------------- 把「他的情況」整理成給小智的背景 ---------------- */
function personCtx() {
  var p = chat._p;
  if (!p) return '';
  var st = null;
  try { st = stageOf(p.stage); } catch (e) {}
  var nm = chat.anon ? '這位朋友' : p.name;
  var L = [];
  L.push('\n\n【他的情況（使用者提供，請保密，只用於這一次的陪伴建議）】');
  L.push('稱呼：' + nm);
  if (p.relation) L.push('關係：' + p.relation);
  if (st) L.push('目前里程：' + st.id + ' ' + st.name + '（' + st.state + '），陪伴者的角色是「' + st.role + '」，下一個記號是「' + st.sign + '」');
  if (p.prayFrom) L.push('已為他代禱：' + ((daysSince(p.prayFrom) || 0) + 1) + ' 天');
  L.push('上次接觸：' + fmtAgo(p.lastContactAt));
  if (p.background) L.push('背景：' + p.background);
  if (p.prayerFocus) L.push('代禱焦點：' + p.prayerFocus);
  if (chat._inter && chat._inter.length) {
    L.push('最近的關心紀錄：');
    chat._inter.slice(0, 5).forEach(function (x) {
      L.push('・' + fmtDate(x.date) + '　' + (x.type || '') + (x.note ? '：' + x.note : ''));
    });
  }
  if (chat._signs && chat._signs.length) {
    L.push('主動工的記號：');
    chat._signs.slice(0, 4).forEach(function (s) { L.push('・' + s.text); });
  }
  L.push('請以上面的情況為背景，給出貼合他這個里程的具體建議。不要催促使用者往前推進，寧可慢，不可急。若情況顯示應該先停下來單純愛他，就誠實這樣說。');
  return L.join('\n');
}

function sysPrompt() { return baseSystem() + personCtx(); }

/* ---------------- 呼叫 ---------------- */
async function call() {
  chat.busy = true; draw(); toBottom();
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    chat.msgs.push({ role: 'assistant', text: '目前似乎沒有網路，小智暫時陪不了你 🙏\n別忘了——最好的同伴是聖靈與神的話。你隨時可以直接向主傾心吐意，也可以先翻開工具頁的內容。' });
    chat.busy = false; draw(); toBottom(); return;
  }
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 40000) : null;
  try {
    var res = await fetch(XZ_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl ? ctrl.signal : undefined,
      body: JSON.stringify({
        model: XZ_MODEL, max_tokens: 1000,
        system: sysPrompt(),
        messages: chat.msgs.map(function (m) { return { role: m.role, content: m.text }; })
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    var text = (data.content || []).filter(function (b) { return b.type === 'text'; })
      .map(function (b) { return b.text; }).join('\n').trim();
    if (!text) text = '小智一時想不出合適的話，但神的話永不落空。要不要換個方式再問一次？';
    chat.msgs.push({ role: 'assistant', text: text });
  } catch (e) {
    var aborted = e && e.name === 'AbortError';
    chat.msgs.push({ role: 'assistant', text: (aborted ? '小智等候得有點久，先暫停一下 🙏 請稍後再試。' : '小智暫時連不上線，請稍後再試 🙏') + '\n別忘了——使人重生的是聖靈，不是我們。你現在就可以為他禱告一分鐘。' });
  } finally { if (timer) clearTimeout(timer); }
  chat.busy = false; draw(); toBottom();
}

function favs() { return LS.get('xzFavs', []); }
function favSig(q, a) { return String(q || '').replace(/\s+/g, '').slice(0, 80) + '⟶' + String(a || '').replace(/\s+/g, '').slice(0, 120); }
function isFav(q, a) { var F = favs(), s = favSig(q, a); for (var i = 0; i < F.length; i++) if (favSig(F[i].q, F[i].a) === s) return true; return false; }

function fmt(s) { return esc(s).split('\n').join('<br>'); }
function toBottom() { var m = document.getElementById('xz-msgs'); if (m) m.scrollTop = m.scrollHeight; }
window.__xzText = function (i) { var m = chat.msgs[i]; return m ? String(m.text || '') : ''; };
window.__xzFavText = function (i) { var f = favs()[i]; return f ? String(f.a || '') : ''; };

function whoBar() {
  var h = '<div class="xz-who"><span class="lb">陪伴對象</span>';
  h += '<button class="xz-wchip" aria-pressed="' + (chat.pid ? 'false' : 'true') + '" data-xz="who" data-id="">不指定</button>';
  people.forEach(function (p) {
    var st = null; try { st = stageOf(p.stage); } catch (e) {}
    h += '<button class="xz-wchip" aria-pressed="' + (chat.pid === p.id ? 'true' : 'false') + '" data-xz="who" data-id="' + p.id + '">'
      + esc(p.name) + (st ? '・' + st.id : '') + '</button>';
  });
  if (chat.pid) h += '<button class="xz-wchip" aria-pressed="' + (chat.anon ? 'true' : 'false') + '" data-xz="anon">🔒 用代號</button>';
  return h + '</div>';
}

function picker(label) {
  var h = '<div class="xz-lb">' + esc(label) + '</div><div class="xz-cats">';
  h += XZ_TOPICS.map(function (t, i) {
    return '<button class="xz-cat" aria-pressed="' + (chat.topic === i ? 'true' : 'false') + '" data-xz="cat" data-i="' + i + '">' + esc(t.c) + '</button>';
  }).join('');
  h += '</div>';
  if (chat.topic >= 0 && XZ_TOPICS[chat.topic]) {
    h += '<div class="xz-quicks" id="xz-topicqs" style="margin-top:10px">'
      + XZ_TOPICS[chat.topic].qs.map(function (q, j) {
        return '<button class="xz-quick" data-xz="ask" data-i="' + chat.topic + '" data-j="' + j + '">' + esc(q) + '</button>';
      }).join('') + '</div>';
  }
  return h;
}

function draw() {
  if (!host) return;
  var h = '<button class="xz-fab" data-xz="open"><span class="ic">✨</span>小智</button>';
  if (chat.open) {
    var body = '';
    if (chat.favView) body = favsHTML();
    else {
      var intro = chat._p
        ? ('平安！我是小智 ✨ 我們一起來想想' + (chat.anon ? '「這位朋友」' : '「' + chat._p.name + '」') + '的事。要開口、要回答疑問、要擬訊息、要禱告，都可以問我。')
        : '平安！我是小智 ✨ 我是你傳福音路上的屬靈同伴。開口、破冰、回答疑問、講福音、邀請決志、跟進初信、擬一則訊息、為他禱告——都可以問我。你也可以先在上面選一位陪伴對象。';
      body = '<div class="xz-msg"><div class="xz-bub">' + esc(intro) + '</div></div>';
      chat.msgs.forEach(function (m, i) {
        if (m.role === 'user') {
          body += '<div class="xz-msg me"><div class="xz-bub">' + fmt(m.text) + '</div></div>';
        } else {
          var q = (i > 0 && chat.msgs[i - 1] && chat.msgs[i - 1].role === 'user') ? chat.msgs[i - 1].text : '';
          var on = isFav(q, m.text);
          body += '<div class="xz-msg"><div class="xz-bub">' + fmt(m.text)
            + '<div class="xz-acts">'
            + '<button class="xz-act" data-xz="speak" data-i="' + i + '">🔊 朗讀</button>'
            + '<button class="xz-act" data-xz="copy" data-i="' + i + '">📋 複製</button>'
            + '<button class="xz-act' + (on ? ' on' : '') + '" data-xz="fav" data-i="' + i + '">' + (on ? '★ 已收藏' : '☆ 收藏') + '</button>'
            + '<button class="xz-act" data-xz="del" data-i="' + i + '">🗑 刪除</button>'
            + '</div></div></div>';
        }
      });
      if (chat.busy) body += '<div class="xz-msg"><div class="xz-bub xz-typing"><span></span><span></span><span></span></div></div>';
      if (!chat.msgs.length) {
        body += '<div class="xz-lb">先從這裡開始</div><div class="xz-quicks">'
          + quicks().map(function (q, i) { return '<button class="xz-quick" data-xz="quick" data-i="' + i + '">' + esc(q) + '</button>'; }).join('')
          + '</div>' + picker('或者，挑一個需要．點範疇看更多提問');

      + '<div class="rl">傳福音的屬靈同伴 · 陪你把人帶到耶穌面前</div></div>'
      + '<button class="xz-hbtn" data-xz="favs" aria-label="收藏">⭐</button>'
      + '<button class="xz-hbtn" data-xz="clear" aria-label="重新開始">🏠</button>'

      + '</div></div>';

  wireFab();

/* ---------------- 互動 ---------------- */
function send(t) {
  if (chat.busy) return;
  t = (t || '').trim(); if (!t) return;
  chat.favView = false; chat.topic = -1;
  chat.msgs.push({ role: 'user', text: t });
  draw(); toBottom(); call();
}
window.__xzSend = function () {
  var i = document.getElementById('xz-in'); if (!i) return;
  var t = i.value; i.value = ''; send(t);
};

async function loadPeople() {
  try { people = (await DB.all('persons')).sort(function (a, b) { return (a.order || 0) - (b.order || 0); }); }
  catch (e) { people = []; }
}
async function setPerson(id) {
  chat.pid = id || '';
  chat._p = null; chat._inter = null; chat._signs = null;
  if (!id) { draw(); return; }
  try {
    chat._p = await DB.get('persons', id);
    var all = await DB.all('interactions');
    chat._inter = all.filter(function (x) { return x.personId === id; }).sort(function (a, b) { return b.date.localeCompare(a.date); });
    var sg = await DB.all('signs');
    chat._signs = sg.filter(function (x) { return x.personId === id; });
  } catch (e) {}
  draw();
}

async function open(pid) {
  await loadPeople();
  chat.open = true;
  if (pid !== undefined) await setPerson(pid);
  else draw();
  toBottom();
  setTimeout(function () { var i = document.getElementById('xz-in'); if (i) i.focus(); }, 80);
}
function close() { chat.open = false; TTS.stop(); draw(); }

/* 供其他模組呼叫：直接打開小智並展開指定主題 */
window.__xzTopic = function (name) {
  for (var i = 0; i < XZ_TOPICS.length; i++) {
    if (XZ_TOPICS[i].c === name) { chat.topic = i; break; }
  }
  open();
};

function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function () { toast('已複製，可以貼到 LINE 傳給他'); },
      function () { toast('複製失敗，請長按選取文字'); });
  } else {
    try {
      var ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      toast('已複製，可以貼到 LINE 傳給他');
    } catch (e) { toast('複製失敗，請長按選取文字'); }
  }
}

/* 事件：整包委派，重畫也不會失效 */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-xz]') : null;
  if (!el) return;
  var a = el.dataset.xz, i = +el.dataset.i, j = +el.dataset.j;
  if (a === 'bg') { if (ev.target === el) close(); return; }
  ev.preventDefault();
  if (a === 'open') { if (!window.__xzDragged) open(); }
  else if (a === 'close') close();
  else if (a === 'send') window.__xzSend();
  else if (a === 'who') setPerson(el.dataset.id);
  else if (a === 'anon') { chat.anon = !chat.anon; draw(); toast(chat.anon ? '將以「這位朋友」代稱' : '將使用名單上的稱呼'); }
  else if (a === 'cat') { chat.topic = (chat.topic === i ? -1 : i); draw(); var q = document.getElementById('xz-topicqs'); if (q && q.scrollIntoView) q.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  else if (a === 'ask') { var t = XZ_TOPICS[i] && XZ_TOPICS[i].qs[j]; if (t) send(t); }
  else if (a === 'quick') { send(quicks()[i]); }
  else if (a === 'speak') { TTS.speak(window.__xzText(i)); }
  else if (a === 'speakfav') { TTS.speak(window.__xzFavText(i)); }
  else if (a === 'copy') { copyText(window.__xzText(i)); }
  else if (a === 'copyfav') { copyText(window.__xzFavText(i)); }
  else if (a === 'fav') {
    var m = chat.msgs[i]; if (!m) return;
    var q0 = (i > 0 && chat.msgs[i - 1] && chat.msgs[i - 1].role === 'user') ? chat.msgs[i - 1].text : '';
    var F = favs(), sig = favSig(q0, m.text), idx = -1;
    for (var k = 0; k < F.length; k++) if (favSig(F[k].q, F[k].a) === sig) { idx = k; break; }
    if (idx >= 0) { F.splice(idx, 1); toast('已移除收藏'); }
    else { F.unshift({ q: q0, a: m.text, t: Date.now() }); toast('⭐ 已收藏'); }
    LS.set('xzFavs', F); draw();
  }
  else if (a === 'del') {
    if (!chat.msgs[i]) return;
    if (!window.confirm('刪除這則對話？')) return;
    var from = i, cnt = 1;
    if (i > 0 && chat.msgs[i - 1] && chat.msgs[i - 1].role === 'user') { from = i - 1; cnt = 2; }
    chat.msgs.splice(from, cnt); draw();
  }
  else if (a === 'delfav') {
    if (!window.confirm('從收藏移除這一則？')) return;
    var Fx = favs(); Fx.splice(i, 1); LS.set('xzFavs', Fx); draw();
  }
  else if (a === 'favs') { chat.favView = !chat.favView; draw(); var mm = document.getElementById('xz-msgs'); if (mm) mm.scrollTop = 0; }
  else if (a === 'clear') {
    if (chat.msgs.length && !window.confirm('要清空目前所有問答、重新開始嗎？（已收藏的不受影響）')) return;
    TTS.stop(); chat.msgs = []; chat.topic = -1; chat.favView = false; draw();
  }
}, true);

/* 浮動鈕可拖曳，位置記住 */
function wireFab() {
  var fab = host.querySelector('.xz-fab'); if (!fab) return;
  var pos = LS.get('xzPos', null);
  if (pos) {
    var w = fab.offsetWidth || 110, hh = fab.offsetHeight || 48;
    var x = Math.max(6, Math.min(pos.x, window.innerWidth - w - 6));
    var y = Math.max(6, Math.min(pos.y, window.innerHeight - hh - 6));
    fab.style.left = x + 'px'; fab.style.top = y + 'px'; fab.style.right = 'auto'; fab.style.bottom = 'auto';
  }
  if (fab.__wired) return; fab.__wired = true;
  var sx = 0, sy = 0, ox = 0, oy = 0, moved = false, dragging = false;
  fab.addEventListener('pointerdown', function (e) {
    var r = fab.getBoundingClientRect();
    sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top; moved = false; dragging = true;
    try { fab.setPointerCapture(e.pointerId); } catch (x) {}
  });
  fab.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) moved = true;
    if (!moved) return;
    var w = fab.offsetWidth, hh = fab.offsetHeight;
    fab.style.left = Math.max(6, Math.min(ox + dx, window.innerWidth - w - 6)) + 'px';
    fab.style.top = Math.max(6, Math.min(oy + dy, window.innerHeight - hh - 6)) + 'px';
    fab.style.right = 'auto'; fab.style.bottom = 'auto';
  });
  function end(e) {
    if (!dragging) return; dragging = false;
    try { fab.releasePointerCapture(e.pointerId); } catch (x) {}
    if (moved) {
      var r = fab.getBoundingClientRect();
      LS.set('xzPos', { x: Math.round(r.left), y: Math.round(r.top) });
      window.__xzDragged = true; setTimeout(function () { window.__xzDragged = false; }, 350);
    }
  }
  fab.addEventListener('pointerup', end);
  fab.addEventListener('pointercancel', end);
}

    dv.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7FFF, true); o += 2;
  }

}

ACTS.gcRecStart = async function () {
  if (va.recording) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
    toast('這支裝置不支援錄音，可以改用手機的語音備忘錄'); return;
  }
  try {
    va.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) { toast('沒有取得麥克風權限，請到設定裡開啟'); return; }
  var types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
  var mt = '';
  for (var i = 0; i < types.length; i++) {
    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(types[i])) { mt = types[i]; break; }
  }
  var chunks = [];
  try { va.rec = mt ? new MediaRecorder(va.stream, { mimeType: mt }) : new MediaRecorder(va.stream); }
  catch (e) { toast('錄音啟動失敗，請稍後再試'); stopStream(); return; }
  va.rec.ondataavailable = function (ev) { if (ev.data && ev.data.size) chunks.push(ev.data); };
  va.rec.onstop = function () {
    var b = new Blob(chunks, { type: (va.rec && va.rec.mimeType) || 'audio/mp4' });
    if (va.voiceURL) { try { URL.revokeObjectURL(va.voiceURL); } catch (e) {} }
    va.voice = b; va.voiceURL = URL.createObjectURL(b); va.voiceSec = va.sec;
    va.recording = false; clearInterval(va.timer); va.timer = null;
    stopStream(); clearMix(); refreshSheet();
    toast('錄好了，可以先聽聽看');
  };
  va.sec = 0; va.recording = true; va.rec.start();
  refreshSheet();
  va.timer = setInterval(function () {
    va.sec++;
    var el = document.getElementById('gcRecT');
    if (!el) { ACTS.gcRecStop(); return; }   /* 使用者離開了工作室，立刻收工 */
    el.textContent = mmss(va.sec);
    if (va.sec >= 90) ACTS.gcRecStop();
  }, 1000);
};
function stopStream() {
  if (va.stream) { try { va.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} }
  va.stream = null;
}
ACTS.gcRecStop = function () {
  if (!va.recording || !va.rec) return;
  try { va.rec.stop(); } catch (e) { va.recording = false; stopStream(); refreshSheet(); }
};
ACTS.gcVoiceDel = function () {

};

ACTS.gcMusicTry = function (d) {

    var g = ac.createGain(); g.gain.value = 0.28; g.connect(ac.destination);

/* ---------------- 混音：語音 ＋ 配樂 ---------------- */
ACTS.gcMix = async function () {
  if (va.busy) return;
  if (!va.voice && va.music === 'none') { toast('先錄一段語音，或選一首配樂'); return; }
  va.busy = true; toast('正在合成，請稍候…');
  try {
    var vb = va.voice ? await decodeAudio(va.voice) : null;
    var mb = va.musicFile ? await decodeAudio(va.musicFile) : null;
    var whole = (va.musicSec === 0);          /* 0 ＝ 全首 */
    var dur = vb ? vb.duration + 1.6 : 0;
    if (!dur) {                               /* 只有音樂：照選定的長度 */
      if (whole) dur = mb ? mb.duration : tuneLen(tuneOf(va.music)) + 1.2;
      else dur = mb ? Math.min(mb.duration, va.musicSec) : va.musicSec;
    }
    dur = Math.max(3, Math.min(dur, whole ? 600 : 180));
    var OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    var off;
    /* 22050 單聲道足夠語音使用，檔案只有一半大；舊版 Safari 不接受就退回 44100 */
    try { off = new OAC(1, Math.ceil(dur * 22050), 22050); }
    catch (e1) { off = new OAC(1, Math.ceil(dur * 44100), 44100); }
    var master = off.createGain(); master.gain.value = 1; master.connect(off.destination);

    if (vb) {
      var vs = off.createBufferSource(); vs.buffer = vb;
      var vg = off.createGain(); vg.gain.value = 1;
      vs.connect(vg); vg.connect(master); vs.start(0.4);
    }
    var hasM = (va.music !== 'none');
    if (hasM) {
      var base = Math.max(0.05, va.vol * (vb ? 1 : 1.5));
      var mg = off.createGain();
      mg.gain.setValueAtTime(0.0001, 0);
      mg.gain.linearRampToValueAtTime(base, Math.min(1.5, dur * 0.2));
      mg.gain.setValueAtTime(base, Math.max(0.1, dur - 1.8));
      mg.gain.linearRampToValueAtTime(0.0001, dur - 0.05);
      mg.connect(master);
      if (va.musicFile && mb) {
        var ms = off.createBufferSource(); ms.buffer = mb; ms.loop = true;
        ms.connect(mg); ms.start(0);
      } else if (va.music !== 'file') {
        scheduleTune(off, mg, tuneOf(va.music), dur, whole && !vb);
      }
    }
    var out = await off.startRendering();
    clearMix();
    va.mixBlob = wavBlob(out);
    va.mixURL = URL.createObjectURL(va.mixBlob);
    va.busy = false; refreshSheet();
    toast('有聲卡片做好了');
  } catch (e) {
    va.busy = false; refreshSheet();
    toast('合成失敗了，換一首配樂或重錄一次試試');
  }
};

ACTS.tgSave = async function () {
  var name = ($('#tgName').value || '').trim();
  var sel = $('#tgPid');
  var pid = sel ? sel.value : '';
  if (!name && !pid) { toast('請至少填一個姓名或代號'); $('#tgName').focus(); return; }
  if (!name && pid) {
    var p0 = await DB.get('persons', pid);
    if (p0) name = p0.name;
  }
  var rec = {
    id: uid(), kind: 'ten', date: todayISO(), name: name, personId: pid,
    b: _pick.b.slice(), r: _pick.r,
    bar: ($('#tgBar').value || '').trim(), note: ($('#tgNote').value || '').trim(),
    createdAt: new Date().toISOString()
  };
  await DB.put('logs', rec);

  if (pid) {
    var names = rec.b.map(function (id) {
      var i, n = ''; for (i = 0; i < TEN.length; i++) if (TEN[i].id === id) n = TEN[i].name;
      return n;
    }).filter(Boolean).join('、');
    var rn = ''; REACT.forEach(function (x) { if (x[0] === rec.r) rn = x[1]; });
    var note = '十全大福帖陪談' + (names ? '。他要的福氣：' + names : '')
      + (rn ? '。屬靈反應：' + rn : '') + (rec.bar ? '。障礙：' + rec.bar : '')
      + (rec.note ? '。' + rec.note : '');
    await DB.put('interactions', {
      id: uid(), personId: pid, date: rec.date, type: '見面',
      mood: '', note: note.slice(0, 400), createdAt: new Date().toISOString()
    });
    var p = await DB.get('persons', pid);
    if (p) { p.lastContactAt = rec.date; p.updatedAt = new Date().toISOString(); await DB.put('persons', p); }
  }
  _pick = { b: [], r: '', pid: '' };
  refreshSheet(); render();
  toast(pid ? '記下了，也寫進他的紀錄' : '記下了');
};
ACTS.tgDel = function (d) {

    DB.del('logs', d.id).then(function () { refreshSheet(); toast('已刪除'); });

async function getNames() {

  if (!r || r.kind !== 'blessNames') r = { id: NAMES_ID, kind: 'blessNames', cats: {} };
  CATS.forEach(function (c) { if (!Array.isArray(r.cats[c[0]])) r.cats[c[0]] = []; });

function blank(name, pid) {
  var r = { id: uid(), kind: 'bless', name: name || '', personId: pid || '',
    angel: S.blessAngel || '', date: todayISO(), b: {}, need: {}, prayN: 0,
    act: [], acti: [], shr: [], inv: [], grow: {},
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
  B10.forEach(function (x) { r.b[x.id] = 0; r.need[x.id] = ''; });
  GROW.forEach(function (g) { r.grow[g[0]] = { s: '', e: '', m: '', o: '' }; });
  return r;
}
function fix(r) {
  if (!r.b) r.b = {}; if (!r.need) r.need = {}; if (!r.grow) r.grow = {};
  B10.forEach(function (x) { if (r.b[x.id] == null) r.b[x.id] = 0; if (r.need[x.id] == null) r.need[x.id] = ''; });
  GROW.forEach(function (g) { if (!r.grow[g[0]]) r.grow[g[0]] = { s: '', e: '', m: '', o: '' }; });
  PLAN.forEach(function (p) { if (!Array.isArray(r[p[0]])) r[p[0]] = []; });
  if (typeof r.prayN !== 'number') r.prayN = 0;
  return r;
}

function doneCount(r) {

function zheng(n) {
  var f = Math.floor(n / 5), r = n % 5, s = '', i;
  for (i = 0; i < f; i++) s += '正';
  return { s: s, f: f, r: r };
}

function handSVG(mirror, names, saved, palm, palmSaved) {
  var W = 300, H = 330;
  var m = function (x) { return mirror ? (W - x) : x; };
  var skin = '#F7D3C4', line = '#E0A992', ink = 'var(--ink)';
  var tips = [];   /* [x, y] 指尖標籤位置，順序：拇指、食指、中指、無名指、小指 */
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-width:340px;display:block;margin:0 auto">';
  /* 手掌與手腕 */
  s += '<rect x="' + m(mirror ? 208 : 72) + '" y="150" width="136" height="130" rx="34" fill="' + skin + '" stroke="' + line + '"/>';
  s += '<rect x="' + m(mirror ? 190 : 96) + '" y="270" width="94" height="42" rx="16" fill="' + skin + '" stroke="' + line + '"/>';
  /* 四指 */
  var f = [[82, 78, 26, 86], [114, 62, 26, 102], [146, 74, 26, 90], [178, 100, 24, 64]];
  f.forEach(function (a, i) {
    var x = mirror ? (W - a[0] - a[2]) : a[0];
    s += '<rect x="' + x + '" y="' + a[1] + '" width="' + a[2] + '" height="' + (a[3] + 60) + '" rx="13" fill="' + skin + '" stroke="' + line + '"/>';
    tips[i + 1] = [x + a[2] / 2, a[1] - 8];
  });
  /* 拇指 */
  var tx = mirror ? 232 : 68;
  s += '<g transform="translate(' + tx + ',196) rotate(' + (mirror ? 42 : -42) + ')">'
    + '<rect x="-15" y="-58" width="30" height="96" rx="15" fill="' + skin + '" stroke="' + line + '"/></g>';
  tips[0] = [mirror ? 262 : 38, 150];
  /* 指尖名字 */
  for (var i = 0; i < 5; i++) {
    var nm = String(names[i] || '').trim();
    var on = saved.indexOf(i) >= 0;
    if (!nm) continue;
    if (on) s += '<circle cx="' + tips[i][0] + '" cy="' + (tips[i][1] - 5) + '" r="20" fill="none" stroke="#C8791F" stroke-width="2.5"/>';
    s += '<text x="' + tips[i][0] + '" y="' + tips[i][1] + '" text-anchor="middle" '
      + 'font-size="14" font-weight="700" fill="' + (on ? '#C8791F' : ink) + '">' + esc(nm.slice(0, 5)) + '</text>';
  }
  /* 手掌上的名字 */
  var pn = String(palm || '').trim();
  if (pn) {
    if (palmSaved) s += '<circle cx="140" cy="212" r="34" fill="none" stroke="#C8791F" stroke-width="2.5"/>';
    s += '<text x="140" y="218" text-anchor="middle" font-size="17" font-weight="700" fill="'
      + (palmSaved ? '#C8791F' : ink) + '">' + esc(pn.slice(0, 5)) + '</text>';
  } else {
    s += '<text x="140" y="218" text-anchor="middle" font-size="17" fill="#B9A99C">（　）</text>';
  }
  return s + '</svg>';
}

    $('#gateList').innerHTML = C.core.ethics.map((e, i) =>
      `<li><span class="n">${['一', '二', '三', '四', '五'][i]}</span><span>${esc(e)}</span></li>`).join('');
    g.classList.remove('hidden');
    $('#gateOk').onclick = () => { saveS('gateOk', true); g.classList.add('hidden'); afterGate(); };
  } else afterGate();

  /* 主畫面長按捷徑（manifest shortcuts） */
  const h = (location.hash || '').replace('#', '');
  go(['walk', 'tools', 'cards', 'learn', 'me'].includes(h) ? h : 'today');
  if (h === 'pray') setTimeout(() => ACTS.prayStart && ACTS.prayStart(), 400);
  if (G.snapStart) G.snapStart();
}

function afterGate() {
  /* 備份提醒：超過 30 天 */
  const d = S.lastBackupAt ? daysSince(S.lastBackupAt) : null;
  if (d === null || d > 30) {
    setTimeout(async () => {
      const ps = await DB.all('persons');
      if (!ps.length) return;
      modal(`<h3 class="sub">請備份您的資料</h3>
        <p class="muted">${d === null ? '你還沒有備份過。' : `上次備份已經是 ${d} 天前。`}
        資料只存在這支手機裡，換手機或系統清理都可能遺失。</p>
        <div class="btn-row" style="margin-top:14px">
          <button class="btn quiet" data-act="closeModal">稍後</button>
          <button class="btn gold" data-act="gotoBackup">現在備份</button>
        </div>`);
    }, 1200);
  }
}
ACTS.gotoBackup = () => { closeModal(); go('me'); setTimeout(() => ACTS.openBackup(), 120); };

/* ---------------- 全域事件 ---------------- */
document.querySelectorAll('.nav button').forEach(b =>
  b.addEventListener('click', () => go(b.dataset.tab)));
$('#sheetBack').addEventListener('click', () => popSheet());
$('#speakBtn').addEventListener('click', () => TTS.speak(readableText($('#view'))));
$('#setBtn').addEventListener('click', () => { if (window.__G && window.__G.ACTS.openSettings) window.__G.ACTS.openSettings(); });
$('#sheetSpeak').addEventListener('click', () => TTS.speak(readableText($('#sheetView'))));
$('#frameClose').addEventListener('click', () => {
  $('#frame').classList.add('hidden'); $('#frameBody').src = 'about:blank';
});
$('#frameOpen').addEventListener('click', () => {
  const u = $('#frame').dataset.url; if (u) window.open(u, '_blank', 'noopener');
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('input', e => {
  if (e.target.id === 'faqSearch') faqFilter();
});
/* 開啟疑問解答庫後套用目前的分類篩選 */
const _origDraw = SHEETS.faq;
SHEETS.faq = async function (arg) {
  const html = await _origDraw(arg);
  setTimeout(faqFilter, 0);
  return html;
};
window.addEventListener('pagehide', () => TTS.stop());

if ('serviceWorker' in navigator)
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

boot();
})();

</script>

<script>
/* =========================================================
   真人語音朗讀引擎（移植自國度321空中團契）
   繁體 · 簡體 · 英文各有專屬聲音；金鑰保管在後端代理，
   前端只送文字、收音檔。連不上時自動退回系統語音，
   絕不因為後端出狀況就讓長輩按不出聲音。
   ========================================================= */
(function () {
  'use strict';
  var G = window.__G; if (!G) return;
  var LS = G.LS, TTS = G.TTS, toast = G.toast, esc = G.esc,
      ACTS = G.ACTS, SHEETS = G.SHEETS, refreshSheet = G.refreshSheet, S = G.S;

  var EP = 'https://azure-tts.spch321.workers.dev';

  /* 三語聲音清單：key 是存檔用的代號，name 是語音服務的聲音代號 */
  var VOICES = {
    tc: [
      { k:'yunjhe',  name:'zh-TW-YunJheNeural',   label:'雲哲', desc:'溫潤親切男聲（預設）' },
      { k:'hsiaoyu', name:'zh-TW-HsiaoYuNeural',  label:'曉雨', desc:'清亮女聲' },
      { k:'hsiaochen', name:'zh-TW-HsiaoChenNeural', label:'曉臻', desc:'沉穩女聲' }
    ],
    sc: [
      { k:'yunxi',    name:'zh-CN-YunxiNeural',    label:'雲希', desc:'溫暖男聲（預設）' },
      { k:'xiaoxiao', name:'zh-CN-XiaoxiaoNeural', label:'曉曉', desc:'親切女聲' },
      { k:'yunjian',  name:'zh-CN-YunjianNeural',  label:'雲健', desc:'厚實男聲' }
    ],
    en: [
      { k:'guy',   name:'en-US-GuyNeural',   label:'Guy',   desc:'Warm male voice (default)' },
      { k:'jenny', name:'en-US-JennyNeural', label:'Jenny', desc:'Clear female voice' },
      { k:'aria',  name:'en-US-AriaNeural',  label:'Aria',  desc:'Gentle female voice' }
    ]
  };

  function lang() { return (window.I18N && window.I18N.lang) || 'tc'; }
  function list() { return VOICES[lang()] || VOICES.tc; }
  function voiceKey() {
    var saved = LS.get('rvVoice_' + lang(), '');
    var L = list();
    for (var i = 0; i < L.length; i++) if (L[i].k === saved) return saved;
    return L[0].k;
  }
  function voiceName() {
    var L = list(), k = voiceKey();
    for (var i = 0; i < L.length; i++) if (L[i].k === k) return L[i].name;
    return L[0].name;
  }
  function on() { return LS.get('rvOn', true) !== false; }
  function rateAttr() {
    var r = +S.ttsRate || 0.95;
    var pct = Math.round((r - 1) * 100);
    return (pct >= 0 ? '+' : '') + pct + '%';
  }

  var SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
  var rv = { audio:null, cache:{}, unlocked:false, queue:[], idx:0, token:0, active:false };

  function audio() {
    if (!rv.audio) {
      rv.audio = new Audio(); rv.audio.preload = 'auto';
      try { rv.audio.playsInline = true;
            rv.audio.setAttribute('playsinline','');
            rv.audio.setAttribute('webkit-playsinline',''); } catch (e) {}
    }
    return rv.audio;
  }
  /* iOS 必須在使用者手勢裡先播一次無聲，之後才准自動播放 */
  function unlock() {
    if (rv.unlocked) return;
    try {
      var a = audio(); a.loop = false; a.src = SILENT;
      var p = a.play();
      if (p && p.then) p.then(function () { rv.unlocked = true; try { a.pause(); } catch (e) {} })
                        .catch(function () {});
      else rv.unlocked = true;
    } catch (e) {}
  }

  /* 依標點切句，一段 100 到 300 字，唸起來自然、請求數也不會太多 */
  function chunks(text) {
    var t = String(text || '').replace(/\s+/g, ' ').trim();
    if (!t) return [];
    var enders = '。！？；.!?\n', out = [], buf = '';
    for (var i = 0; i < t.length; i++) {
      buf += t[i];
      if (enders.indexOf(t[i]) >= 0 && buf.length >= 100) { out.push(buf); buf = ''; }
    }
    if (buf.trim()) out.push(buf);
    var fin = [];
    out.forEach(function (seg) {
      while (seg.length > 300) { fin.push(seg.slice(0, 300)); seg = seg.slice(300); }
      if (seg) fin.push(seg);
    });
    return fin.length ? fin : [t];
  }

  /* IndexedDB 永久快取：同一段話同一個聲音，只跟後端要一次 */
  var DBN = 'g321_tts_cache';
  function dbOpen(cb) {
    try {
      if (!window.indexedDB) return cb(null);
      var q = indexedDB.open(DBN, 1);
      q.onupgradeneeded = function () {
        try { var d = q.result;
              if (!d.objectStoreNames.contains('audio')) d.createObjectStore('audio'); } catch (e) {}
      };
      q.onsuccess = function () { cb(q.result); };
      q.onerror = function () { cb(null); };
    } catch (e) { cb(null); }
  }
  function cacheGet(k, cb) {
    dbOpen(function (d) { if (!d) return cb(null);
      try { var r = d.transaction('audio','readonly').objectStore('audio').get(k);
            r.onsuccess = function () { cb(r.result || null); };
            r.onerror = function () { cb(null); };
      } catch (e) { cb(null); }
    });
  }
  function cachePut(k, b) {
    dbOpen(function (d) { if (!d) return;
      try { d.transaction('audio','readwrite').objectStore('audio').put(b, k); } catch (e) {}
    });
  }
  function cacheClear(cb) {
    dbOpen(function (d) { if (!d) { if (cb) cb(false); return; }
      try { var r = d.transaction('audio','readwrite').objectStore('audio').clear();
            r.onsuccess = function () { rv.cache = {}; if (cb) cb(true); };
            r.onerror = function () { if (cb) cb(false); };
      } catch (e) { if (cb) cb(false); }
    });
  }

  function fetchPiece(piece) {
    var key = voiceName() + '|' + rateAttr() + '|' + piece;
    if (rv.cache[key]) return Promise.resolve(rv.cache[key]);
    return new Promise(function (res, rej) {
      cacheGet(key, function (blob) {
        if (blob) { try { var u = URL.createObjectURL(blob); rv.cache[key] = u; res(u); return; } catch (e) {} }
        fetch(EP, { method:'POST', headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ voice: voiceName(), rate: rateAttr(),
                                 sil:140, silc:140, sile:260, text: piece }) })
          .then(function (r) { if (!r.ok) throw new Error('TTS ' + r.status); return r.blob(); })
          .then(function (b) {
            try { cachePut(key, b); } catch (e) {}
            var u; try { u = URL.createObjectURL(b); rv.cache[key] = u; } catch (e) {}
            res(u);
          })
          .catch(rej);
      });
    });
  }

  function rvStop() {
    rv.token++; rv.active = false; rv.queue = []; rv.idx = 0;
    if (rv.audio) { try { rv.audio.pause(); } catch (e) {} rv.audio.onended = null; rv.audio.onerror = null; }
    try { if (navigator.mediaSession) navigator.mediaSession.playbackState = 'none'; } catch (e) {}
  }

  /* 某一段抓不到，就用系統語音把這一段補完，唸完再接下一段 */
  function fallbackChunk(piece, cb) {
    if (!('speechSynthesis' in window)) { if (cb) cb(); return; }
    try {
      var u = new SpeechSynthesisUtterance(piece);
      u.lang = (window.I18N && window.I18N.ttsLang) ? window.I18N.ttsLang() : 'zh-TW';
      u.rate = +S.ttsRate || 0.95;
      u.onend = cb; u.onerror = cb;
      speechSynthesis.speak(u);
    } catch (e) { if (cb) cb(); }
  }

  function rvSpeak(text) {
    unlock();
    var q = chunks(text);
    if (!q.length) { toast('這一頁沒有可朗讀的內容'); return; }
    rv.queue = q; rv.idx = 0; rv.active = true;
    var my = ++rv.token, a = audio();
    try {
      if (navigator.mediaSession && window.MediaMetadata) {
        navigator.mediaSession.metadata = new MediaMetadata({ title: '321福音同行' });
        navigator.mediaSession.playbackState = 'playing';
      }
    } catch (e) {}
    function playAt(i) {
      if (my !== rv.token) return;
      if (i >= rv.queue.length) { rvStop(); return; }
      fetchPiece(rv.queue[i]).then(function (url) {
        if (my !== rv.token) return;
        a.onended = null; a.onerror = null; a.src = url;
        a.onended = function () { if (my === rv.token) playAt(i + 1); };
        a.onerror = function () { fallbackChunk(rv.queue[i], function () { if (my === rv.token) playAt(i + 1); }); };
        var p = a.play();
        if (p && p.catch) p.catch(function () {
          fallbackChunk(rv.queue[i], function () { if (my === rv.token) playAt(i + 1); });
        });
        if (rv.queue[i + 1]) fetchPiece(rv.queue[i + 1]).catch(function () {});
      }).catch(function () {
        fallbackChunk(rv.queue[i], function () { if (my === rv.token) playAt(i + 1); });
      });
    }
    playAt(0);
    toast('開始朗讀，再按一次可停止');
  }

  /* ---- 接到原本的朗讀鈕上：所有「🔊 朗讀」自動改用真人聲音 ---- */
  var origSpeak = TTS.speak.bind(TTS);
  var origStop = TTS.stop.bind(TTS);

  TTS.stop = function () { rvStop(); origStop(); };
  TTS.speak = function (text) {
    if (rv.active || TTS.speaking) { TTS.stop(); toast('已停止朗讀'); return; }
    if (on() && /^https?:\/\//i.test(EP)) rvSpeak(text);
    else origSpeak(text);
  };
  window.__rvClearCache = cacheClear;

  document.addEventListener('visibilitychange', function () { if (document.hidden) rvStop(); });

  /* ---- 設定頁：真人語音開關與聲音選擇 ---- */
  ACTS.setRealVoice = function (d) { LS.set('rvOn', d.v === '1'); TTS.stop(); refreshSheet(); };
  ACTS.setRvVoice = function (d) { LS.set('rvVoice_' + lang(), d.v); TTS.stop(); refreshSheet(); };
  ACTS.tryRvVoice = function () {
    var demo = lang() === 'en'
      ? 'Jesus is my Role Model. The Bible is my Standard. The Holy Spirit is my Guide.'
      : lang() === 'sc'
        ? '耶稣是我的榜样，圣经是我的准则，圣灵是我的引导。'
        : '耶穌是我的榜樣，聖經是我的準則，聖靈是我的引導。';
    TTS.stop(); setTimeout(function () { TTS.speak(demo); }, 120);
  };
  ACTS.clearVoiceCache = function () {
    cacheClear(function (ok) { toast(ok ? '已清空語音快取' : '清除失敗，請稍後再試'); });
  };

  var _set = SHEETS.settings;
  SHEETS.settings = async function () {
    var html = await _set.apply(this, arguments);
    var L = list();
    var block =
      '<div class="card">' +
      '<div class="eyebrow">真人語音</div>' +
      '<p class="tiny">像真人一樣的朗讀聲音，比手機內建的語音自然得多。' +
      '第一次唸會稍等一下，之後同一段話就直接播，不用再等。</p>' +
      '<div class="seg" style="margin-top:8px">' +
      '<button data-act="setRealVoice" data-v="1" aria-pressed="' + on() + '">真人語音</button>' +
      '<button data-act="setRealVoice" data-v="0" aria-pressed="' + (!on()) + '">系統語音</button>' +
      '</div>' +
      (on() ?
        '<div class="eyebrow" style="margin-top:14px">選一個聲音</div><div class="seg">' +
        L.map(function (v) {
          return '<button data-act="setRvVoice" data-v="' + v.k + '" aria-pressed="' +
                 (voiceKey() === v.k) + '">' + esc(v.label) + '</button>';
        }).join('') + '</div>' +
        '<p class="tiny" style="margin-top:8px">' +
        L.map(function (v) { return esc(v.label) + '：' + esc(v.desc); }).join('<br>') + '</p>' +
        '<button class="btn quiet sm" data-act="tryRvVoice" style="width:100%;margin-top:10px">試聽這個聲音</button>' +
        '<button class="btn quiet sm" data-act="clearVoiceCache" style="width:100%;margin-top:8px">清空語音快取</button>' +
        '<p class="tiny" style="margin-top:10px">聲音會依語言自動切換：繁體、簡體、英文各有一組。' +
        '真人語音連不上時，會自動改用系統語音，不會中斷。</p>'
      : '<p class="tiny" style="margin-top:10px">目前使用手機內建的語音。</p>') +
      '</div>';
    return html + block;
  };
})();
</script>
