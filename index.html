<script>
/* =========================================================
   321 福音同行　語言引擎
   繁體＝原文；簡體＝即時轉換；英文＝對照字典
   資料一律不動，只轉換畫面上看見的字。
   ========================================================= */
(function () {
'use strict';

const KEY = 'lang', LANGS = ['tc', 'sc', 'en'];
let lang = 'tc';
try { const v = JSON.parse(localStorage.getItem(KEY) || '"tc"'); if (LANGS.indexOf(v) >= 0) lang = v; } catch (e) {}

function readJSON(id) {
  const el = document.getElementById(id);
  if (!el) return null;
  try { return JSON.parse(el.textContent); } catch (e) { return null; }
}

/* ---------------- 繁 → 簡 ---------------- */
let SC = null;
function scTable() {
  if (SC) return SC;
  const t = readJSON('d-sc');
  if (!t) return (SC = { s: {}, p: [] });
  const c = t.c || '', s = {};
  for (let i = 0; i + 1 < c.length; i += 2) s[c[i]] = c[i + 1];
  SC = { s: s, p: t.p || [] };
  return SC;
}
function toSC(str) {
  const t = scTable();
  let out = str;
  for (let i = 0; i < t.p.length; i++) {
    const k = t.p[i][0];
    if (out.indexOf(k) >= 0) out = out.split(k).join(t.p[i][1]);
  }
  let r = '';
  for (let i = 0; i < out.length; i++) { const ch = out.charAt(i); r += (t.s[ch] || ch); }
  return r;
}

/* ---------------- 中 → 英 ---------------- */
let EN = null, ENP = null;
function rxEsc(x) { return x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function patterns() {
  if (ENP) return ENP;
  const raw = readJSON('d-enp') || [];
  ENP = raw.map(function (r) {
    return { re: new RegExp('^' + r[0].split('{}').map(rxEsc).join('([\\s\\S]*?)') + '$'), en: r[1] };
  });
  return ENP;
}
function toEN(str) {
  if (!EN) EN = readJSON('d-en') || {};
  const m = str.match(/^(\s*)([\s\S]*?)(\s*)$/);
  const head = m[1], tail = m[3];
  const key = m[2].replace(/\s+/g, ' ');
  if (!key) return str;
  let v = EN[key];
  /* 二、數字佔位 */
  if (v === undefined) {
    const nums = [];
    const norm = key.replace(/\d+/g, function (x) { nums.push(x); return '#'; });
    const t = EN[norm];
    if (t !== undefined) { let i = 0; v = t.replace(/#/g, function () { return nums[i++] || '#'; }); }
  }
  /* 三、句型比對：帶變數的句子，變數本身再翻一次 */
  if (v === undefined) {
    const ps = patterns();
    for (let i = 0; i < ps.length; i++) {
      const g = key.match(ps[i].re);
      if (g) {
        let j = 1;
        v = ps[i].en.replace(/\{\}/g, function () { return tr(g[j++] || ''); });
        break;
      }
    }
  }
  if (v === undefined) return str;
  return head + v + tail;
}

const HAS_CJK = /[\u3400-\u9fff]/;
function tr(str) {
  if (!str || !HAS_CJK.test(str)) return str;
  if (lang === 'sc') return toSC(str);
  if (lang === 'en') return toEN(str);
  return str;
}

/* ---------------- 套用到畫面 ---------------- */
const ATTRS = ['placeholder', 'aria-label', 'title', 'alt'];
function doNode(n) {
  if (!n) return;
  if (n.nodeType === 3) {
    if (n.__lz === n.nodeValue) return;
    const v = tr(n.nodeValue);
    if (v !== n.nodeValue) n.nodeValue = v;
    n.__lz = n.nodeValue;
  } else if (n.nodeType === 1) {
    for (let i = 0; i < ATTRS.length; i++) {
      const a = ATTRS[i];
      if (n.hasAttribute && n.hasAttribute(a)) {
        const o = n.getAttribute(a), v = tr(o);
        if (v !== o) n.setAttribute(a, v);
      }
    }
  }
}
const FILTER = { acceptNode: function (n) {
  if (n.nodeType === 1) {
    const t = n.tagName;
    if (t === 'SCRIPT' || t === 'STYLE' || t === 'IFRAME' || t === 'TEXTAREA') return NodeFilter.FILTER_REJECT;
  }
  return NodeFilter.FILTER_ACCEPT;
} };
function walk(root) {
  if (lang === 'tc' || !root) return;
  doNode(root);
  if (root.nodeType !== 1 && root.nodeType !== 9 && root.nodeType !== 11) return;
  if (root.nodeType === 1 && (root.tagName === 'SCRIPT' || root.tagName === 'STYLE')) return;
  let w;
  try { w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, FILTER); }
  catch (e) { return; }
  let n;
  while ((n = w.nextNode())) doNode(n);
}

const mo = new MutationObserver(function (ms) {
  if (lang === 'tc') return;
  for (let i = 0; i < ms.length; i++) {
    const m = ms[i];
    if (m.type === 'characterData') doNode(m.target);
    else if (m.type === 'attributes') doNode(m.target);
    else for (let j = 0; j < m.addedNodes.length; j++) walk(m.addedNodes[j]);
  }
});

function start() {
  document.documentElement.setAttribute('lang',
    lang === 'en' ? 'en' : lang === 'sc' ? 'zh-Hans' : 'zh-Hant');
  if (lang !== 'tc') walk(document.body);
  mo.observe(document.documentElement, {
    childList: true, subtree: true, characterData: true,
    attributes: true, attributeFilter: ATTRS
  });
}
if (document.body) start();
else document.addEventListener('DOMContentLoaded', start);

window.I18N = {
  get lang() { return lang; },
  ttsLang: function () { return lang === 'en' ? 'en-US' : lang === 'sc' ? 'zh-CN' : 'zh-TW'; },
  tr: tr,
  set: function (v) {
    if (LANGS.indexOf(v) < 0 || v === lang) return;
    try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {}
    location.reload();
  }
};

})();
</script>
<script>
/* =========================================================
   321 福音同行  ——  國度321空中團契
   陪伴每一個人成為得勝者
   資料一律留在使用者自己的裝置，不上傳、不追蹤。
   ========================================================= */
(function () {
'use strict';

const APP_VERSION = '4.0.0';

/* ---------------- 安全的本機設定（Safari 私密模式亦可用） ---------------- */
const mem = {};
const LS = {
  get(k, d) {
    try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }
    catch (e) { return k in mem ? mem[k] : d; }
  },
  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { mem[k] = v; }
  }
};

const S = {
  fontScale: LS.get('fontScale', 1),
  theme: LS.get('theme', 'light'),
  bigcards: LS.get('bigcards', false),
  ttsRate: LS.get('ttsRate', 0.95),
  amTime: LS.get('amTime', '07:00'),
  pmTime: LS.get('pmTime', '21:30'),
  gateOk: LS.get('gateOk', false),
  favFaq: LS.get('favFaq', []),
  lastBackupAt: LS.get('lastBackupAt', null),
  rotate: LS.get('rotate', true)
};
function saveS(k, v) { S[k] = v; LS.set(k, v); }

/* ---------------- IndexedDB ---------------- */
const DB_NAME = 'gospel321', DB_VER = 2;
const STORES = ['persons', 'interactions', 'prayers', 'progress', 'milestones', 'logs', 'signs',
  'checkins', 'wall'];
let _db = null;

function db() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const rq = indexedDB.open(DB_NAME, DB_VER);
    rq.onupgradeneeded = e => {
      const d = e.target.result;
      STORES.forEach(n => {
        if (!d.objectStoreNames.contains(n)) {
          const st = d.createObjectStore(n, { keyPath: 'id' });
          if (n !== 'persons') { try { st.createIndex('personId', 'personId', { unique: false }); } catch (x) {} }
        }
      });
    };
    rq.onsuccess = e => { _db = e.target.result; res(_db); };
    rq.onerror = e => rej(e.target.error);
  });
}
async function txAll(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(store, mode);
    const st = tx.objectStore(store);
    const out = fn(st);
    tx.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    tx.onerror = () => rej(tx.error);
  });
}
const DB = {
  all: s => txAll(s, 'readonly', st => st.getAll()),
  get: (s, id) => txAll(s, 'readonly', st => st.get(id)),
  put: (s, o) => txAll(s, 'readwrite', st => st.put(o)),
  del: (s, id) => txAll(s, 'readwrite', st => st.delete(id)),
  clear: s => txAll(s, 'readwrite', st => st.clear())
};

/* ---------------- 工具 ---------------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl2br = s => esc(s).replace(/\n/g, '<br>');

function todayISO(d) { const x = d ? new Date(d) : new Date(); const o = x.getTimezoneOffset(); return new Date(x - o * 60000).toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.floor((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 86400000); }
function daysSince(iso) { return iso ? daysBetween(iso, todayISO()) : null; }
function fmtDate(iso) { if (!iso) return '—'; const p = iso.split('-'); return `${+p[1]}月${+p[2]}日`; }
function fmtAgo(iso) {
  if (!iso) return '還沒有紀錄';
  const n = daysSince(iso);
  if (n <= 0) return '今天';
  if (n === 1) return '昨天';
  if (n < 30) return n + ' 天前';
  if (n < 365) return Math.floor(n / 30) + ' 個月前';
  return Math.floor(n / 365) + ' 年前';
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2100);
}
function seedOfDay(n) {
  const d = new Date(); const k = d.getFullYear() * 372 + d.getMonth() * 31 + d.getDate();
  return k % n;
}

/* ---------------- 內容資料 ---------------- */
const C = { core: null, faq: null, gospel: null, lessons: null, prayers: null, resources: null };
async function loadContent() {
  const names = ['core', 'faq', 'gospel', 'lessons', 'prayers', 'resources'];
  await Promise.all(names.map(async n => {
    /* 1. 先用內嵌資料，確保單檔開啟也能運作 */
    const el = document.getElementById('d-' + n);
    if (el) { try { C[n] = JSON.parse(el.textContent); } catch (e) { C[n] = null; } }
    /* 2. 若同層有 data/ 資料夾，以它覆蓋（牧者可自行增修內容） */
    try {
      const r = await fetch('data/' + n + '.json', { cache: 'no-cache' });
      if (r.ok) {
        const j = await r.json();
        if (j && j.version) C[n] = j;
      }
    } catch (e) { /* 單檔開啟或離線，維持內嵌資料 */ }
  }));
}
const stageOf = id => (C.core.stages.find(s => s.id === id) || C.core.stages[0]);

/* ---------------- 朗讀 ---------------- */
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent);
const TTS = {
  voice: null, speaking: false, queue: [], idx: 0, _keep: null,
  init() {
    if (!('speechSynthesis' in window)) return;
    const pick = () => {
      const v = speechSynthesis.getVoices();
      this.voice = v.find(x => /zh[-_]TW/i.test(x.lang)) || v.find(x => /zh[-_]HK/i.test(x.lang))
        || v.find(x => /^zh/i.test(x.lang)) || null;
    };
    pick(); speechSynthesis.onvoiceschanged = pick;
  },
  /* 長文一次送出時，iOS 與 Chrome 都會在中途斷掉，所以切成短句排隊念 */
  split(text) {
    const clean = String(text).replace(/\s+/g, ' ').trim().slice(0, 12000);
    const out = []; let cur = '';
    for (const ch of clean) {
      cur += ch;
      if ('。！？；\n'.includes(ch) && cur.length >= 12) { out.push(cur); cur = ''; }
      else if (cur.length >= 90 && '，、）」』'.includes(ch)) { out.push(cur); cur = ''; }
      else if (cur.length >= 140) { out.push(cur); cur = ''; }
    }
    if (cur.trim()) out.push(cur);
    return out;
  },
  stop() {
    this.queue = []; this.idx = 0; this.speaking = false;
    if (this._keep) { clearInterval(this._keep); this._keep = null; }
    try { speechSynthesis.cancel(); } catch (e) {}
  },
  _next() {
    if (!this.speaking || this.idx >= this.queue.length) {
      const done = this.speaking && this.idx >= this.queue.length;
      this.stop();
      if (done) { const t = document.getElementById('toast'); if (t) { /* 念完不打擾 */ } }
      return;
    }
    const u = new SpeechSynthesisUtterance(this.queue[this.idx]);
    if (this.voice) u.voice = this.voice;
    u.lang = (window.I18N && window.I18N.ttsLang) ? window.I18N.ttsLang() : 'zh-TW';
    u.rate = S.ttsRate; u.pitch = 1;
    u.onend = () => { this.idx++; this._next(); };
    u.onerror = () => { this.idx++; setTimeout(() => this._next(), 120); };
    try { speechSynthesis.speak(u); } catch (e) { this.stop(); }
  },
  speak(text) {
    if (!('speechSynthesis' in window)) { toast('這個裝置不支援朗讀'); return; }
    if (this.speaking) { this.stop(); toast('已停止朗讀'); return; }
    const parts = this.split(text);
    if (!parts.length) { toast('這一頁沒有可朗讀的內容'); return; }
    try { speechSynthesis.cancel(); } catch (e) {}
    this.queue = parts; this.idx = 0; this.speaking = true;
    /* Chrome 桌面版約十五秒會自行停住，需定時喚醒；iOS 不需要也不宜 */
    if (!IS_IOS) this._keep = setInterval(() => {
      if (this.speaking && speechSynthesis.speaking) { try { speechSynthesis.resume(); } catch (e) {} }
    }, 9000);
    this._next();
    toast('開始朗讀，再按一次可停止');
  }
};
function readableText(el) {
  const c = el.cloneNode(true);
  c.querySelectorAll('button,input,textarea,select,.nav').forEach(n => n.remove());
  return c.textContent;
}

/* ---------------- 主題與字級 ---------------- */
function applyLook() {
  document.documentElement.style.setProperty('--fs', S.fontScale);
  document.documentElement.setAttribute('data-theme', S.theme === 'dark' ? 'dark' : 'light');
  document.body.classList.toggle('bigcards', !!S.bigcards);
  const m = document.querySelector('meta[name=theme-color]');
  if (m) m.setAttribute('content', S.theme === 'dark' ? '#101820' : '#4E2061');
}

/* ---------------- 路由 ---------------- */
const R = { tab: 'today', stack: [] };
const VIEWS = {};      // 分頁
const SHEETS = {};     // 覆蓋層

function go(tab) {
  R.tab = tab; R.stack = [];
  closeSheet(true);
  document.querySelectorAll('.nav button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  render();
}
async function render() {
  const v = $('#view');
  v.innerHTML = '<p class="muted">載入中…</p>';
  const html = await VIEWS[R.tab]();
  v.innerHTML = html;
  window.scrollTo(0, 0);
  $('#title').textContent = ({ today: '今日', walk: '同行', tools: '工具', cards: '福音卡片', learn: '學習', me: '我的' })[R.tab];
  bind(v);
}
function push(name, arg, title) {
  R.stack.push({ name, arg, title });
  drawSheet();
}
function popSheet() {
  R.stack.pop();
  if (!R.stack.length) closeSheet(); else drawSheet();
}
async function drawSheet() {
  const top = R.stack[R.stack.length - 1];
  const sv = $('#sheetView');
  $('#sheet').classList.remove('hidden');
  sv.innerHTML = '<p class="muted">載入中…</p>';
  const html = await SHEETS[top.name](top.arg);
  sv.innerHTML = html;
  $('#sheetTitle').textContent = top.title || '';
  $('#sheet').scrollTop = 0;
  bind(sv);
}
function closeSheet(silent) {
  $('#sheet').classList.add('hidden');
  $('#sheetView').innerHTML = '';
  if (!silent) R.stack = [];
  TTS.stop();
}
function refreshSheet() { if (R.stack.length) drawSheet(); }

/* ---------------- 事件綁定（宣告式 data-act） ---------------- */
const ACTS = {};
function bind(root) {
  root.querySelectorAll('[data-act]').forEach(el => {
    if (el._bound) return; el._bound = true;
    el.addEventListener('click', ev => {
      const fn = ACTS[el.dataset.act];
      if (fn) { ev.preventDefault(); fn(el.dataset, el, ev); }
    });
  });
}

/* ---------------- 對話框 ---------------- */
function modal(html) {
  $('#modalBox').innerHTML = html;
  $('#modal').classList.remove('hidden');
  bind($('#modalBox'));
}
function closeModal() { $('#modal').classList.add('hidden'); $('#modalBox').innerHTML = ''; }
ACTS.closeModal = closeModal;

function confirmBox(title, msg, okLabel, onOk, danger) {
  modal(`<h3 class="sub">${esc(title)}</h3><p class="muted">${nl2br(msg)}</p>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn quiet" data-act="closeModal">取消</button>
      <button class="btn ${danger ? 'gold' : ''}" data-act="__confirmOk">${esc(okLabel)}</button>
    </div>`);
  ACTS.__confirmOk = () => { closeModal(); onOk(); };
}

/* ---------------- 共用查詢 ---------------- */
async function persons() {
  const a = await DB.all('persons');
  return a.sort((x, y) => (x.order || 0) - (y.order || 0) || x.createdAt.localeCompare(y.createdAt));
}
async function byPerson(store, pid) {
  const a = await DB.all(store);
  return a.filter(x => x.personId === pid);
}
async function touch(pid, iso) {
  const p = await DB.get('persons', pid);
  if (!p) return;
  if (!p.lastContactAt || iso > p.lastContactAt) p.lastContactAt = iso;
  p.updatedAt = new Date().toISOString();
  await DB.put('persons', p);
}
function warnClass(p) {
  const n = daysSince(p.lastContactAt);
  if (n === null || n > 30) return 'w30';
  if (n > 14) return 'w14';
  return '';
}
function stageChip(p) {
  const st = stageOf(p.stage);
  return `<span class="chip stage" style="background:${st.color}">${st.id}　${esc(st.name)}</span>`;
}
function personCard(p) {
  const st = stageOf(p.stage);
  const prayDays = p.prayFrom ? daysSince(p.prayFrom) + 1 : 0;
  return `<button class="pcard ${warnClass(p)}" style="border-left-color:${st.color}"
      data-act="openPerson" data-id="${p.id}">
    <div class="nm">${esc(p.name)}</div>
    <div class="meta">${stageChip(p)}
      ${p.relation ? `<span class="chip">${esc(p.relation)}</span>` : ''}
      ${prayDays > 0 ? `<span class="chip">已代禱 ${prayDays} 天</span>` : ''}</div>
    <div class="last">上次接觸：${fmtAgo(p.lastContactAt)}</div>
  </button>`;
}

VIEWS.today = async function () {
  const ps = await persons();
  const v = C.core.dailyVerses[seedOfDay(C.core.dailyVerses.length)];
  const fruit = C.prayers.fruits[seedOfDay(C.prayers.fruits.length)];

  /* 今日輪值代禱（每天輪播三位） */
  let todays = [];
  if (ps.length) {
    if (S.rotate && ps.length > 3) {
      const start = seedOfDay(ps.length);
      for (let i = 0; i < 3; i++) todays.push(ps[(start + i) % ps.length]);
    } else todays = ps.slice(0, 3);
  }
  const f920 = todays[0] || ps[0];

  /* 需要關心的人 */
  const cold = ps.filter(p => { const n = daysSince(p.lastContactAt); return n === null || n > 14; })
    .sort((a, b) => (daysSince(b.lastContactAt) ?? 9999) - (daysSince(a.lastContactAt) ?? 9999))
    .slice(0, 4);

  /* 下一步建議 */
  let nextHtml = '';
  if (ps.length) {
    const target = cold[0] || todays[0];
    const st = stageOf(target.stage);
    const tip = st.next[seedOfDay(st.next.length)];
    nextHtml = `<div class="card">
      <div class="eyebrow">下一步建議</div>
      <h3 class="sub">對「${esc(target.name)}」，今天可以做的一件小事</h3>
      <p style="font-size:calc(20px * var(--fs));line-height:1.9">${esc(tip)}</p>
      <p class="tiny">現在的里程：${st.id}　${esc(st.name)}．先禱告，求聖靈引導。</p>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn quiet sm" data-act="openPerson" data-id="${target.id}">打開他的卡片</button>
        <button class="btn sm" data-act="openDraft" data-id="${target.id}">寫訊息</button>
      </div></div>`;
  }

  /* 本週同行 */
  const logs = await DB.all('interactions');
  const wk = todayISO(new Date(Date.now() - 6 * 86400000));
  const wkCount = logs.filter(x => x.date >= wk).length;
  const prayLogs = (await DB.all('logs')).filter(x => x.kind === 'pray');
  const streak = calcStreak(prayLogs.map(x => x.date));
  const prayedToday = prayLogs.some(x => x.date === todayISO());

  return `
  <div class="card">
    <div class="eyebrow">今日經文</div>
    <div class="verse" style="margin-top:2px">${esc(v.text)}<span class="ref">${esc(v.ref)}</span></div>
  </div>

  <div class="card">
    <div class="eyebrow">每日代禱</div>
    <h2 class="sec">為我的 2 禱告</h2>
    ${ps.length ? `<p class="muted">今天輪到：${todays.map(p => esc(p.name)).join('、')}</p>`
      : `<p class="muted">還沒有人在你的名單上。先寫下一個名字，就從那裡開始。</p>`}
    <button class="btn gold" data-act="prayStart" style="margin-top:8px">
      ${prayedToday ? '再禱告一次' : '開始禱告'}</button>
    <p class="tiny" style="margin-top:10px">
      ${streak > 0 ? `已連續 ${streak} 天為他們禱告。` : '禱告是我們唯一完全可以負責的事。'}
    </p>
  </div>

  ${f920 ? `<div class="card">
    <div class="eyebrow">920 每日操練</div>
    <h3 class="sub">今天，對「${esc(f920.name)}」，操練「${esc(fruit.name)}」</h3>
    <p class="muted">${esc(fruit.teach)}</p>
    <div class="verse">${esc(fruit.verse.text)}<span class="ref">${esc(fruit.verse.ref)}</span></div>
    <p style="font-weight:700">今日行動：${esc(fruit.action)}</p>
    <button class="btn quiet" data-act="open920" data-pid="${f920.id}">晚間回顧</button>
  </div>` : ''}

  ${G.daysCard ? await G.daysCard(ps) : ''}

  ${G.newbelieverCard ? await G.newbelieverCard(ps) : ''}

  ${cold.length ? `<div class="card">
    <div class="eyebrow">需要關心的人</div>
    <p class="tiny" style="margin-bottom:10px">這不是責備，只是提醒你別讓愛停在心裡。</p>
    ${cold.map(p => `<button class="row" data-act="openPerson" data-id="${p.id}">
      <span class="grow"><span class="t">${esc(p.name)}</span>

      <span class="arrow">›</span></button>`).join('')}

  ${ps.length ? `<div class="card tight">

    <p class="muted" style="margin:0">這七天，你主動接觸了 ${wkCount} 次，名單上有 ${ps.length} 位。</p>
  </div>` : `<div class="empty">
    <div class="big">先寫下一個名字</div>
    <p class="muted">每一位基督徒的心裡，都有一張看不見的名單。<br>把它變成看得見的，就是第一步。</p>
    <button class="btn" data-act="addPerson" style="margin-top:14px">加入我的第一位 2</button>
  </div>`}

  <p class="tiny" style="text-align:center;margin-top:18px">
    放下手機，去見他一面。<br>App 只是提醒，愛要親自去給。</p>
  `;
};

function calcStreak(dates) {
  const set = new Set(dates);
  let n = 0, d = new Date();
  if (!set.has(todayISO(d))) d = new Date(Date.now() - 86400000);
  while (set.has(todayISO(d))) { n++; d = new Date(d.getTime() - 86400000); }
  return n;
}

/* ---------------- 代禱進行 ---------------- */

  const p = ps[i];
  const items = (await byPerson('prayers', p.id)).filter(x => x.active !== false);
  const st = stageOf(p.stage);
  const tmpl = C.prayers.prayers[seedOfDay(C.prayers.prayers.length)];

  return `
  <div class="card">
    <div class="eyebrow">第 ${i + 1} 位／共 ${ps.length} 位</div>

    ${p.background ? `<p class="muted" style="margin-top:10px">${nl2br(p.background)}</p>` : ''}
  </div>

  ${items.length ? `<div class="card">
    <div class="eyebrow">為這些事求</div>
    ${items.map(x => `<p style="font-size:calc(20px * var(--fs))">・${esc(x.item)}</p>`).join('')}
  </div>` : ''}

  <div class="card">
    <div class="eyebrow">可以這樣禱告</div>
    <p style="white-space:pre-wrap;font-size:calc(20px * var(--fs));line-height:2">${esc(tmpl.text)}</p>
    <p class="tiny" style="margin-top:8px">（${esc(tmpl.title)}．也可以用自己的話說，神聽的是心。）</p>
    <button class="btn quiet sm" data-act="speakThis" style="margin-top:10px;width:100%">🔊 朗讀這段禱告</button>
  </div>

  <div class="card">
    <div class="eyebrow">主動工的記號</div>
    <p class="tiny">看見一點小改變就記下來，日後這些會成為你信心的見證。</p>
    <textarea id="signText" placeholder="例：他今天主動問我週末在忙什麼"></textarea>
    <button class="btn quiet sm" data-act="addSign" data-pid="${p.id}" style="width:100%;margin-top:8px">記下這個記號</button>
  </div>

  <div class="btn-row">
    ${i > 0 ? `<button class="btn quiet" data-act="prayGo" data-i="${i - 1}">‹ 上一位</button>` : ''}
    ${i < ps.length - 1
      ? `<button class="btn" data-act="prayGo" data-i="${i + 1}">下一位 ›</button>`

  <p class="tiny" style="text-align:center;margin-top:14px">我栽種了，亞波羅澆灌了，惟有神叫他生長。（哥林多前書三章6節）</p>
  `;
};

let sortMode = 'cold';
VIEWS.walk = async function () {
  let ps = await persons();
  if (sortMode === 'cold') ps.sort((a, b) => (daysSince(b.lastContactAt) ?? 99999) - (daysSince(a.lastContactAt) ?? 99999));
  if (sortMode === 'stage') ps.sort((a, b) => b.stage.localeCompare(a.stage));
  if (sortMode === 'new') ps.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));

  const counts = {};
  C.core.stages.forEach(s => counts[s.id] = 0);
  ps.forEach(p => counts[p.stage] = (counts[p.stage] || 0) + 1);

  return `
  <div class="btn-row" style="margin-bottom:14px">
    <button class="btn" data-act="addPerson">＋ 加入一位 2</button>
    <button class="btn quiet" data-act="openMap">看七里程地圖</button>
  </div>

  ${ps.length ? `
  <div class="card tight">
    <div class="eyebrow">排序</div>
    <div class="seg">
      <button data-act="setSort" data-m="cold" aria-pressed="${sortMode === 'cold'}">最久沒聯絡</button>
      <button data-act="setSort" data-m="stage" aria-pressed="${sortMode === 'stage'}">里程進度</button>
      <button data-act="setSort" data-m="new" aria-pressed="${sortMode === 'new'}">加入時間</button>
    </div>
  </div>
  ${ps.map(personCard).join('')}
  <div class="card tight">
    <div class="eyebrow">名單分布</div>
    <div class="meta" style="display:flex;flex-wrap:wrap;gap:8px">
      ${C.core.stages.filter(s => counts[s.id]).map(s =>
        `<span class="chip stage" style="background:${s.color}">${s.id} ${esc(s.name)}　${counts[s.id]}</span>`).join('')}
    </div>
    <p class="tiny" style="margin-top:10px">這只是牧養的參考，不是成績。一個靈魂比一百個數字寶貴。</p>
  </div>`
  : `<div class="empty">
      <div class="big">你心裡的那張名單，是誰？</div>
      <p class="muted">父母、配偶、兒女、同事、老同學……<br>先寫下三個名字，就從今天開始。</p>
      <button class="btn" data-act="addPerson" style="margin-top:14px">寫下第一個名字</button>
    </div>`}`;
};
ACTS.setSort = d => { sortMode = d.m; render(); };

ACTS.savePerson = async d => {
  const name = $('#fName').value.trim();
  if (!name) { toast('請至少填一個名字或代號'); $('#fName').focus(); return; }
  const now = new Date().toISOString();
  let p = d.id ? await DB.get('persons', d.id) : null;
  const relSel = $('#fRel').querySelector('[aria-pressed="true"]');
  const stSel = $('#fStage').querySelector('[aria-pressed="true"]');
  const stage = _stage || (stSel ? stSel.dataset.v : 'L0');
  const oldStage = p ? p.stage : null;
  if (!p) p = { id: uid(), createdAt: now, prayFrom: todayISO(), order: Date.now() };
  p.name = name;
  p.relation = _rel || (relSel ? relSel.dataset.v : '') || p.relation || '';
  p.stage = stage;
  p.birthday = $('#fBirth').value || '';
  p.background = $('#fBg').value.trim();
  p.prayerFocus = $('#fFocus').value.trim();
  const lkSel = $('#fLock') ? $('#fLock').querySelector('[aria-pressed="true"]') : null;
  p.locked = !!(lkSel && lkSel.dataset.v === '1');
  p.updatedAt = now;
  await DB.put('persons', p);
  if (oldStage && oldStage !== stage)
    await DB.put('milestones', { id: uid(), personId: p.id, fromStage: oldStage, toStage: stage, date: todayISO(), story: '' });
  popSheet(); render();
  toast(d.id ? '已儲存' : `已把「${name}」加入你的名單`);
};

    for (const s of ['interactions', 'prayers', 'progress', 'milestones', 'signs']) {
      const rows = await DB.all(s);
      for (const r of rows) if (r.personId === d.id) await DB.del(s, r.id);
    }
    await DB.del('persons', d.id);
    closeSheet(); render(); toast('已刪除');
  }, true);
};

function faqFilter() {
  const box = $('#faqSearch');
  if (!box) return;
  const q = box.value.trim();
  let shown = 0;
  document.querySelectorAll('#faqList details').forEach(el => {
    const okCat = faqCat === 'all' ? true
      : faqCat === 'fav' ? S.favFaq.includes(el.dataset.faq)
      : el.dataset.cat === faqCat;
    const okQ = !q || el.dataset.text.indexOf(q) !== -1;
    const on = okCat && okQ;
    el.style.display = on ? '' : 'none';
    if (on) shown++;
  });
  const e = $('#faqEmpty'); if (e) e.style.display = shown ? 'none' : '';
}

};
ACTS.favFaq = (d, el) => {
  const i = S.favFaq.indexOf(d.id);
  if (i >= 0) S.favFaq.splice(i, 1); else S.favFaq.push(d.id);
  saveS('favFaq', S.favFaq);
  el.textContent = S.favFaq.includes(d.id) ? '★ 已收藏（點一下取消）' : '☆ 收藏這一題';
  if (faqCat === 'fav') faqFilter();
};

ACTS.doExport = async () => {
  const data = { app: '321福音同行', version: APP_VERSION, exportedAt: new Date().toISOString(), settings: {}, stores: {} };
  ['fontScale', 'theme', 'bigcards', 'ttsRate', 'amTime', 'pmTime', 'favFaq', 'rotate'].forEach(k => data.settings[k] = S[k]);
  data.settings.witness = LS.get('witness', null);
  data.settings.partner = LS.get('partner', null);
  for (const s of G.STORES)
    data.stores[s] = await DB.all(s);
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `321福音同行_備份_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  saveS('lastBackupAt', todayISO());
  toast('已匯出。請把檔案存到安全的地方');
};
ACTS.doImport = () => {
  const f = $('#impFile').files[0];
  if (!f) { toast('請先選擇備份檔'); return; }
  const rd = new FileReader();
  rd.onload = async () => {
    let d;
    try { d = JSON.parse(rd.result); } catch (e) { toast('這個檔案讀不出來'); return; }
    if (!d.stores) { toast('這不是 321 福音同行的備份檔'); return; }
    let n = 0;
    for (const s of Object.keys(d.stores)) {
      for (const row of d.stores[s]) { try { await DB.put(s, row); n++; } catch (e) {} }
    }
    if (d.settings) Object.keys(d.settings).forEach(k => { if (k !== 'witness' && k !== 'partner' && d.settings[k] !== undefined) saveS(k, d.settings[k]); });
    if (d.settings && d.settings.witness) LS.set('witness', d.settings.witness);
    if (d.settings && d.settings.partner) LS.set('partner', d.settings.partner);
    applyLook(); closeSheet(); render(); toast(`已還原 ${n} 筆資料`);
  };
  rd.readAsText(f);
};
ACTS.wipeAll = () => {

function drawCard(cv, v, ratio, dark) {
  const W = 1200, H = ratio === '1:1' ? 1200 : ratio === '4:5' ? 1500 : 675;
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, W, H);
  if (dark) { g.addColorStop(0, '#1B4B7A'); g.addColorStop(1, '#0E2540'); }
  else { g.addColorStop(0, '#FBFAF7'); g.addColorStop(1, '#F0EBE1'); }
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  const ink = dark ? '#FFFFFF' : '#1F2937';
  const gold = dark ? '#E2BE6A' : '#8C6608';
  x.fillStyle = gold; x.fillRect(88, H * 0.16, 8, H * 0.52);

  const F = w => `${w} 46px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif`;
  const pad = 140, maxW = W - pad - 96;
  let size = v.text.length > 60 ? 46 : v.text.length > 38 ? 54 : 62;
  let lines = [];
  for (;;) {
    x.font = F('700').replace('46px', size + 'px');
    lines = wrap(x, v.text, maxW);
    if (lines.length * size * 1.85 < H * 0.56 || size <= 34) break;
    size -= 4;
  }
  const lh = size * 1.85;
  let y = H / 2 - (lines.length * lh) / 2 - 10;
  x.fillStyle = ink; x.textBaseline = 'middle';
  lines.forEach(t => { x.fillText(t, pad, y); y += lh; });

  x.font = F('700').replace('46px', Math.round(size * 0.62) + 'px');
  x.fillStyle = gold;
  x.fillText(v.ref + '（和合本）', pad, y + size * 0.5);

  x.font = F('400').replace('46px', '28px');
  x.fillStyle = dark ? 'rgba(255,255,255,.55)' : 'rgba(31,41,55,.5)';
  x.textAlign = 'right';
  x.fillText('321 福音同行．國度321空中團契', W - 88, H - 62);
  x.textAlign = 'left';
}
function wrap(x, text, maxW) {
  const out = []; let cur = '';
  for (const ch of text) {
    if (x.measureText(cur + ch).width > maxW && cur) { out.push(cur); cur = ''; }
    cur += ch;
    if ('，。；、！？'.includes(ch) && x.measureText(cur).width > maxW * 0.72) { out.push(cur); cur = ''; }
  }
  if (cur) out.push(cur);
  return out;
}

function icsWrap(body) {
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//321福音同行//TW', 'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH', 'X-WR-CALNAME:321福音同行', body, 'END:VCALENDAR'].join('\r\n');
}
function stamp() {
  const d = new Date();
  return d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) + 'T' +
    pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + 'Z';
}
function fold(s) {
  /* RFC 5545：每行不超過 75 位元組，中文以保守長度切 */
  return s.split('\r\n').map(l => {
    if (l.length <= 40) return l;
    const out = [];
    for (let i = 0; i < l.length; i += 40) out.push((i ? ' ' : '') + l.slice(i, i + 40));
    return out.join('\r\n');
  }).join('\r\n');
}
function dailyEvent(hhmm, title, desc, uidSeed) {
  const d = new Date();
  const [h, m] = hhmm.split(':').map(Number);
  const start = d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
    'T' + pad2(h) + pad2(m) + '00';
  const end = d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
    'T' + pad2(h) + pad2(Math.min(59, m + 10)) + '00';
  return ['BEGIN:VEVENT', 'UID:' + uidSeed + '@321gospel', 'DTSTAMP:' + stamp(),
    'DTSTART:' + start, 'DTEND:' + end, 'RRULE:FREQ=DAILY',
    'SUMMARY:' + title, 'DESCRIPTION:' + desc,
    'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY', 'DESCRIPTION:' + title,
    'END:VALARM', 'END:VEVENT'].join('\r\n');
}

async function hashPin(pin, salt) {
  const raw = salt + '|' + pin + '|321';
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 5381;
    for (let i = 0; i < raw.length; i++) h = ((h << 5) + h + raw.charCodeAt(i)) >>> 0;
    return 'f' + h.toString(16);
  }
}

const SNAP = 'snap';
async function snapshot() {
  try {
    const ps = await DB.all('persons');
    if (!ps.length) return;
    const prs = await DB.all('prayers');
    LS.set(SNAP, {
      at: new Date().toISOString(),
      persons: ps.map(p => ({
        id: p.id, name: p.name, relation: p.relation, stage: p.stage,
        birthday: p.birthday, decidedAt: p.decidedAt, baptizedAt: p.baptizedAt,
        prayFrom: p.prayFrom, lastContactAt: p.lastContactAt, locked: p.locked,
        background: (p.background || '').slice(0, 300),
        prayerFocus: (p.prayerFocus || '').slice(0, 300),
        createdAt: p.createdAt, order: p.order
      })),
      prayers: prs.map(x => ({
        id: x.id, personId: x.personId, item: x.item,
        startedAt: x.startedAt, answeredAt: x.answeredAt, active: x.active
      }))
    });
  } catch (e) { /* 空間不足就安靜略過 */ }
}
G.snapStart = function () {

};

   五　生日與屬靈生日
   記得一個人的日子，就是在愛他。
   ========================================================= */
function nextIn(mmdd) {
  if (!mmdd) return null;
  const now = new Date();
  const [m, d] = mmdd.split('-').map(Number);
  let t = new Date(now.getFullYear(), m - 1, d);
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (t < today) t = new Date(now.getFullYear() + 1, m - 1, d);
  return Math.round((t - today) / 86400000);
}
G.daysCard = async function (ps) {
  const rows = [];
  ps.forEach(p => {
    if (p.birthday) {
      const n = nextIn(p.birthday.slice(5));
      if (n !== null && n <= 7) rows.push({ p, n, what: '生日' });
    }
    if (p.decidedAt && daysSince(p.decidedAt) >= 300) {
      const n = nextIn(p.decidedAt.slice(5));
      const yr = new Date().getFullYear() - +p.decidedAt.slice(0, 4) + (n === 0 ? 0 : 1);
      if (n !== null && n <= 7) rows.push({ p, n, what: `屬靈生日．第 ${yr} 年` });
    }
    if (p.baptizedAt && daysSince(p.baptizedAt) >= 300) {
      const n = nextIn(p.baptizedAt.slice(5));
      if (n !== null && n <= 7) rows.push({ p, n, what: '受洗週年' });
    }
  });
  if (!rows.length) return '';
  rows.sort((a, b) => a.n - b.n);
  return `<div class="card" style="border-left:6px solid var(--green)">
    <div class="eyebrow">本週的日子</div>
    <h3 class="sub">記得一個人的日子，就是在愛他</h3>

/* ---------------- 把「他的情況」整理成給小智的背景 ---------------- */
function personCtx() {
  var p = chat._p;
  if (!p) return '';
  var st = null;
  try { st = stageOf(p.stage); } catch (e) {}
  var nm = chat.anon ? '這位朋友' : p.name;
  var L = [];
  L.push('\n\n【他的情況（使用者提供，請保密，只用於這一次的陪伴建議）】');
  L.push('稱呼：' + nm);
  if (p.relation) L.push('關係：' + p.relation);
  if (st) L.push('目前里程：' + st.id + ' ' + st.name + '（' + st.state + '），陪伴者的角色是「' + st.role + '」，下一個記號是「' + st.sign + '」');
  if (p.prayFrom) L.push('已為他代禱：' + ((daysSince(p.prayFrom) || 0) + 1) + ' 天');
  L.push('上次接觸：' + fmtAgo(p.lastContactAt));
  if (p.background) L.push('背景：' + p.background);
  if (p.prayerFocus) L.push('代禱焦點：' + p.prayerFocus);
  if (chat._inter && chat._inter.length) {
    L.push('最近的關心紀錄：');
    chat._inter.slice(0, 5).forEach(function (x) {
      L.push('・' + fmtDate(x.date) + '　' + (x.type || '') + (x.note ? '：' + x.note : ''));
    });
  }
  if (chat._signs && chat._signs.length) {
    L.push('主動工的記號：');
    chat._signs.slice(0, 4).forEach(function (s) { L.push('・' + s.text); });
  }
  L.push('請以上面的情況為背景，給出貼合他這個里程的具體建議。不要催促使用者往前推進，寧可慢，不可急。若情況顯示應該先停下來單純愛他，就誠實這樣說。');
  return L.join('\n');
}

function sysPrompt() { return baseSystem() + personCtx(); }

/* ---------------- 呼叫 ---------------- */
async function call() {
  chat.busy = true; draw(); toBottom();
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    chat.msgs.push({ role: 'assistant', text: '目前似乎沒有網路，小智暫時陪不了你 🙏\n別忘了——最好的同伴是聖靈與神的話。你隨時可以直接向主傾心吐意，也可以先翻開工具頁的內容。' });
    chat.busy = false; draw(); toBottom(); return;
  }
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 40000) : null;
  try {
    var res = await fetch(XZ_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl ? ctrl.signal : undefined,
      body: JSON.stringify({
        model: XZ_MODEL, max_tokens: 1000,
        system: sysPrompt(),
        messages: chat.msgs.map(function (m) { return { role: m.role, content: m.text }; })
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    var text = (data.content || []).filter(function (b) { return b.type === 'text'; })
      .map(function (b) { return b.text; }).join('\n').trim();
    if (!text) text = '小智一時想不出合適的話，但神的話永不落空。要不要換個方式再問一次？';
    chat.msgs.push({ role: 'assistant', text: text });
  } catch (e) {
    var aborted = e && e.name === 'AbortError';
    chat.msgs.push({ role: 'assistant', text: (aborted ? '小智等候得有點久，先暫停一下 🙏 請稍後再試。' : '小智暫時連不上線，請稍後再試 🙏') + '\n別忘了——使人重生的是聖靈，不是我們。你現在就可以為他禱告一分鐘。' });
  } finally { if (timer) clearTimeout(timer); }
  chat.busy = false; draw(); toBottom();
}

async function loadPeople() {

  if (!el) return;
  var a = el.dataset.xz, i = +el.dataset.i, j = +el.dataset.j;

  ev.preventDefault();

  else if (a === 'close') close();
  else if (a === 'send') window.__xzSend();
  else if (a === 'who') setPerson(el.dataset.id);
  else if (a === 'anon') { chat.anon = !chat.anon; draw(); toast(chat.anon ? '將以「這位朋友」代稱' : '將使用名單上的稱呼'); }

  else if (a === 'speak') { TTS.speak(window.__xzText(i)); }

  else if (a === 'copy') { copyText(window.__xzText(i)); }

    var q0 = (i > 0 && chat.msgs[i - 1] && chat.msgs[i - 1].role === 'user') ? chat.msgs[i - 1].text : '';

  else if (a === 'clear') {
    if (chat.msgs.length && !window.confirm('要清空目前所有問答、重新開始嗎？（已收藏的不受影響）')) return;
    TTS.stop(); chat.msgs = []; chat.topic = -1; chat.favView = false; draw();

}, true);

/* 浮動鈕可拖曳，位置記住 */
function wireFab() {
  var fab = host.querySelector('.xz-fab'); if (!fab) return;
  var pos = LS.get('xzPos', null);
  if (pos) {
    var w = fab.offsetWidth || 110, hh = fab.offsetHeight || 48;
    var x = Math.max(6, Math.min(pos.x, window.innerWidth - w - 6));
    var y = Math.max(6, Math.min(pos.y, window.innerHeight - hh - 6));
    fab.style.left = x + 'px'; fab.style.top = y + 'px'; fab.style.right = 'auto'; fab.style.bottom = 'auto';
  }
  if (fab.__wired) return; fab.__wired = true;
  var sx = 0, sy = 0, ox = 0, oy = 0, moved = false, dragging = false;
  fab.addEventListener('pointerdown', function (e) {
    var r = fab.getBoundingClientRect();
    sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top; moved = false; dragging = true;
    try { fab.setPointerCapture(e.pointerId); } catch (x) {}
  });
  fab.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) moved = true;
    if (!moved) return;
    var w = fab.offsetWidth, hh = fab.offsetHeight;
    fab.style.left = Math.max(6, Math.min(ox + dx, window.innerWidth - w - 6)) + 'px';
    fab.style.top = Math.max(6, Math.min(oy + dy, window.innerHeight - hh - 6)) + 'px';
    fab.style.right = 'auto'; fab.style.bottom = 'auto';
  });
  function end(e) {
    if (!dragging) return; dragging = false;
    try { fab.releasePointerCapture(e.pointerId); } catch (x) {}
    if (moved) {
      var r = fab.getBoundingClientRect();
      LS.set('xzPos', { x: Math.round(r.left), y: Math.round(r.top) });
      window.__xzDragged = true; setTimeout(function () { window.__xzDragged = false; }, 350);
    }
  }
  fab.addEventListener('pointerup', end);
  fab.addEventListener('pointercancel', end);
}

    /* 22050 單聲道足夠語音使用，檔案只有一半大；舊版 Safari 不接受就退回 44100 */
    try { off = new OAC(1, Math.ceil(dur * 22050), 22050); }
    catch (e1) { off = new OAC(1, Math.ceil(dur * 44100), 44100); }
    var master = off.createGain(); master.gain.value = 1; master.connect(off.destination);

    if (vb) {
      var vs = off.createBufferSource(); vs.buffer = vb;
      var vg = off.createGain(); vg.gain.value = 1;
      vs.connect(vg); vg.connect(master); vs.start(0.4);
    }
    var hasM = (va.music !== 'none');
    if (hasM) {
      var base = Math.max(0.05, va.vol * (vb ? 1 : 1.5));
      var mg = off.createGain();
      mg.gain.setValueAtTime(0.0001, 0);
      mg.gain.linearRampToValueAtTime(base, Math.min(1.5, dur * 0.2));
      mg.gain.setValueAtTime(base, Math.max(0.1, dur - 1.8));
      mg.gain.linearRampToValueAtTime(0.0001, dur - 0.05);
      mg.connect(master);
      if (va.musicFile && mb) {
        var ms = off.createBufferSource(); ms.buffer = mb; ms.loop = true;
        ms.connect(mg); ms.start(0);
      } else if (va.music !== 'file') {
        scheduleTune(off, mg, tuneOf(va.music), dur, whole && !vb);
      }
    }
    var out = await off.startRendering();
    clearMix();
    va.mixBlob = wavBlob(out);
    va.mixURL = URL.createObjectURL(va.mixBlob);
    va.busy = false; refreshSheet();
    toast('有聲卡片做好了');
  } catch (e) {
    va.busy = false; refreshSheet();
    toast('合成失敗了，換一首配樂或重錄一次試試');
  }
};

function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function () { toast('已複製，可以貼到 LINE 傳給他'); },
      function () { toast('複製失敗，請長按選取文字'); });
  } else {
    try {
      var ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      toast('已複製，可以貼到 LINE 傳給他');
    } catch (e) { toast('複製失敗，請長按選取文字'); }
  }
}

    + '<div class="card tight"><p class="tiny" style="margin:0">'
    + '雙手是工具，不是法術。捆綁與釋放的權柄在主耶穌，不在我們的手指。<br>'
    + '焦點在耶穌，不在自己，也不在方法。</p></div>';
};
ACTS.openHands = function () { push('handsIndex', {}, '奇妙的雙手'); };

/* ---------------- 認領圖 ---------------- */
SHEETS.handsClaim = async function () {
  if (!claim) claim = await loadClaim();
  function block(k, title, sub) {
    var L = k === 'L';
    var names = L ? claim.L : claim.R, saved = L ? claim.savedL : claim.savedR;
    var palm = L ? claim.PL : claim.PR, ps = L ? claim.savedPL : claim.savedPR;
    return '<div class="card">'
      + '<div class="eyebrow">' + esc(sub) + '</div>'
      + '<h3 class="sub">' + esc(title) + '</h3>'
      + handSVG(L, names, saved, palm, ps)
      + names.map(function (v, i) {
          return '<div class="field" style="margin-bottom:10px">'
            + '<label>' + (i + 1) + '　' + FING[i] + '</label>'
            + '<div style="display:flex;gap:8px;align-items:center">'
            + '<input type="text" id="hc' + k + i + '" value="' + esc(v) + '" placeholder="寫下他的名字" style="flex:1">'
            + '<button class="btn quiet sm" data-act="hSaved" data-k="' + k + '" data-i="' + i + '" '
            + 'style="white-space:nowrap">' + (saved.indexOf(i) >= 0 ? '✓ 得救' : '○ 未信') + '</button>'
            + '</div></div>';
        }).join('')
      + '<div class="field" style="margin-bottom:0">'
      + '<label>手掌　雙手抓雙人<span class="hint">（最重要、最優先的那一位）</span></label>'
      + '<div style="display:flex;gap:8px;align-items:center">'
      + '<input type="text" id="hcP' + k + '" value="' + esc(palm) + '" placeholder="寫下他的名字" style="flex:1">'
      + '<button class="btn quiet sm" data-act="hSaved" data-k="' + k + '" data-i="p" '
      + 'style="white-space:nowrap">' + (ps ? '✓ 得救' : '○ 未信') + '</button>'
      + '</div></div>'
      + '</div>';
  }
  return '<div class="card">'
    + '<div class="eyebrow">奇妙的雙手認領圖</div>'
    + '<h2 class="sec">十指認十人</h2>'
    + '<p class="muted">十個有需要的人、兩個有興趣的人、一個有感動的人。<br>'
    + '寫下來，就開始為他們禱告；得救了，就把他圈起來。</p>'
    + '</div>'
    + block('L', '左手認領「親友」', '家人、親戚、老朋友')
    + block('R', '右手認領「鄰舍」', '鄰居、同事、生活中遇見的人')
    + '<div class="card">'
    + '<button class="btn" data-act="hSaveClaim" style="width:100%">儲存認領圖</button>'
    + '<button class="btn quiet" data-act="hToList" style="width:100%;margin-top:10px">把名字加進同行名單</button>'
    + '<p class="tiny" style="margin-top:12px">至少救一人。一年之後回頭看，這張圖會是你最寶貝的一張紙。</p>'
    + '</div>';
};
ACTS.hClaim = function () { push('handsClaim', {}, '認領圖'); };
function readClaim() {
  if (!claim || !document.getElementById('hcL0')) return;
  for (var i = 0; i < 5; i++) {
    var a = document.getElementById('hcL' + i), b = document.getElementById('hcR' + i);
    if (a) claim.L[i] = a.value.trim();
    if (b) claim.R[i] = b.value.trim();
  }
  var pl = document.getElementById('hcPL'), pr = document.getElementById('hcPR');
  if (pl) claim.PL = pl.value.trim();
  if (pr) claim.PR = pr.value.trim();
}
ACTS.hSaved = function (d) {
  readClaim();
  if (d.i === 'p') {
    if (d.k === 'L') claim.savedPL = !claim.savedPL; else claim.savedPR = !claim.savedPR;
  } else {
    var arr = d.k === 'L' ? claim.savedL : claim.savedR, i = +d.i, j = arr.indexOf(i);
    if (j >= 0) arr.splice(j, 1); else arr.push(i);
  }
  refreshSheet();
};
ACTS.hSaveClaim = async function () {
  readClaim();
  claim.kind = 'hands'; claim.id = CLAIM_ID; claim.updatedAt = new Date().toISOString();
  await DB.put('logs', claim);
  refreshSheet(); toast('認領圖已儲存');
};
ACTS.hToList = async function () {
  readClaim();
  var all = claim.L.concat(claim.R); all.push(claim.PL); all.push(claim.PR);
  var ps = await DB.all('persons');
  var have = {}; ps.forEach(function (p) { have[p.name] = 1; });
  var add = [];
  all.forEach(function (n) { n = String(n || '').trim(); if (n && !have[n] && add.indexOf(n) < 0) add.push(n); });
  if (!add.length) { toast('名單裡都已經有了'); return; }
  confirmBox('加入同行名單？', '會把還沒在名單上的 ' + add.length + ' 個名字加進去：\n' + add.join('、'),
    '確定加入', async function () {
      var now = new Date().toISOString();
      for (var i = 0; i < add.length; i++) {
        await DB.put('persons', { id: uid(), name: add[i], relation: '', stage: 'L0',
          background: '', prayerFocus: '', createdAt: now, updatedAt: now,
          prayFrom: todayISO(), order: Date.now() + i });
      }
      await ACTS.hSaveClaim();
      render(); toast('已加入 ' + add.length + ' 位');
    });
};

/* ---------------- 一根手指 ---------------- */
SHEETS.handsFinger = async function (arg) {
  var h = handOf(arg.h), f = h.fs[+arg.i];
  if (!f) return '<p class="muted">找不到這一根手指。</p>';
  var head = '<div class="card">'
    + '<div class="eyebrow">' + esc(h.act + '　' + h.side + FING[+arg.i]) + '</div>'
    + '<h2 class="sec">' + (f.en ? esc(f.en) + ' ' : '') + esc(f.n) + '</h2>'
    + (f.sub ? '<p class="muted">' + esc(f.sub) + '</p>' : '')

    return head
      + '<div class="card"><div class="eyebrow">這一根手指要做的事</div>'
      + '<p style="font-size:calc(20px * var(--fs));line-height:1.95">' + esc(f.do) + '</p></div>'
      + '<div class="card tight"><p class="tiny" style="margin:0">'
      + '做完之後，回到同行名單為他記一筆。記錄不是為了管理他，是為了更好地愛他。</p></div>';

    + '<div class="card"><div class="verse">' + esc(f.v.t) + '<span class="ref">' + esc(f.v.r) + '</span></div></div>'

    + '<p style="font-size:calc(21px * var(--fs));line-height:2.05">' + esc(fill(f.p)) + '</p>'
    + '<button class="btn quiet" data-act="hCopy" data-h="' + h.id + '" data-i="' + arg.i + '" '
    + 'style="width:100%;margin-top:12px">複製這段禱告</button></div>'
    + '<div class="card tight"><p class="tiny" style="margin:0">'
    + '禱告的權柄不在字句，在主耶穌的名。慢慢念，一句一句相信。</p></div>';
};
ACTS.hFinger = function (d) {

/* =========================================================
   啟動
   ========================================================= */
async function boot() {
  applyLook();
  TTS.init();
  /* App 鎖：在任何資料被畫到畫面上之前先擋住 */
  if (G.lockRequired && G.lockRequired()) await G.askUnlock();
  await loadContent();

  if (!C.core) {
    $('#view').innerHTML = `<div class="empty"><div class="big">內容檔載入失敗</div>
      <p class="muted">請確認 data 資料夾與 index.html 放在同一層，並用網址開啟（而非直接雙擊檔案）。</p></div>`;
    return;
  }

  /* 資料庫若被系統清空，先問要不要從本機快照救回 */
  if (G.snapCheck) await G.snapCheck();

  /* 五條守則閘門 */
  if (!S.gateOk) {
    const g = $('#gate');
    $('#gateList').innerHTML = C.core.ethics.map((e, i) =>
      `<li><span class="n">${['一', '二', '三', '四', '五'][i]}</span><span>${esc(e)}</span></li>`).join('');
    g.classList.remove('hidden');
    $('#gateOk').onclick = () => { saveS('gateOk', true); g.classList.add('hidden'); afterGate(); };
  } else afterGate();

  /* 主畫面長按捷徑（manifest shortcuts） */
  const h = (location.hash || '').replace('#', '');
  go(['walk', 'tools', 'cards', 'learn', 'me'].includes(h) ? h : 'today');
  if (h === 'pray') setTimeout(() => ACTS.prayStart && ACTS.prayStart(), 400);
  if (G.snapStart) G.snapStart();
}

function afterGate() {
  /* 備份提醒：超過 30 天 */
  const d = S.lastBackupAt ? daysSince(S.lastBackupAt) : null;
  if (d === null || d > 30) {
    setTimeout(async () => {
      const ps = await DB.all('persons');
      if (!ps.length) return;
      modal(`<h3 class="sub">請備份您的資料</h3>
        <p class="muted">${d === null ? '你還沒有備份過。' : `上次備份已經是 ${d} 天前。`}
        資料只存在這支手機裡，換手機或系統清理都可能遺失。</p>
        <div class="btn-row" style="margin-top:14px">
          <button class="btn quiet" data-act="closeModal">稍後</button>
          <button class="btn gold" data-act="gotoBackup">現在備份</button>
        </div>`);
    }, 1200);
  }
}
ACTS.gotoBackup = () => { closeModal(); go('me'); setTimeout(() => ACTS.openBackup(), 120); };

/* ===== 臨時診斷：找出擋住覆蓋層的元素（確認後請移除整段） ===== */
(function () {
  var bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;' +
    'background:#000;color:#0f0;font:12px/1.5 monospace;padding:6px 8px;' +
    'pointer-events:none;white-space:pre-wrap;word-break:break-all';
  bar.textContent = '診斷版就緒：請點設定頁的按鈕';
  document.body.appendChild(bar);

  function desc(el) {
    if (!el) return 'null';
    var c = (typeof el.className === 'string' ? el.className : '') || '-';
    var a = (el.dataset && el.dataset.act) ? el.dataset.act : '-';
    return el.tagName + ' #' + (el.id || '-') + ' .' + c + ' act=' + a;
  }
  function report(tag, x, y) {
    var top = document.elementFromPoint(x, y);
    var z = top, chain = [];
    while (z && chain.length < 3) { chain.push(desc(z)); z = z.parentElement; }
    bar.textContent = tag + ' @' + Math.round(x) + ',' + Math.round(y) +
      '\n最上層：' + chain.join('\n  ↑ ');
  }
  document.addEventListener('touchstart', function (e) {
    var t = e.touches[0]; if (t) report('touch', t.clientX, t.clientY);
  }, true);
  document.addEventListener('click', function (e) {
    bar.textContent += '\nclick 有觸發 → ' + desc(e.target);
  }, true);
})();

boot();
})();
