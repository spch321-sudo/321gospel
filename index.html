<title>321福音同行</title>
<style>
:root{
  --navy:#4E2061; --navy-d:#351449; --gold:#B8860B; --green:#2E7D5B;
  --orange:#C8791F; --bg:#FAF7FB; --ink:#1F2937; --ink-2:#4B5563;
  /* 文字專用變體：與品牌同色系，但通過 WCAG AA 4.5:1 */
  --gold-t:#8C6608; --orange-t:#9B5E18;
  --card:#FFFFFF; --line:#E4DCEA; --soft:#F2ECF6;
  --warn-a:#FDF6E3; --warn-b:#FBEBDC;
  --fs:1;
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
[data-theme="dark"]{
  --navy:#C9A6E0; --navy-d:#B08CC9; --gold:#E0B84A; --green:#63B98D;
  --orange:#E5A05C; --bg:#14171C; --ink:#ECEFF3; --ink-2:#B4BCC7;
  --gold-t:#E0B84A; --orange-t:#E5A05C;
  --card:#1E232B; --line:#3A3345; --soft:#272233;
  --warn-a:#2A2617; --warn-b:#2E2318;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:calc(18px * var(--fs)); line-height:1.8;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--navy)}

/* ---------- 版面骨架 ---------- */
#app{padding-top:calc(var(--safe-t) + 52px);padding-bottom:calc(var(--safe-b) + 74px);min-height:100dvh}
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  background:var(--navy);color:#fff;
  padding:var(--safe-t) 12px 0;
  height:calc(var(--safe-t) + 52px);
  display:flex;align-items:center;gap:8px;
  box-shadow:0 1px 6px rgba(0,0,0,.12)
}
[data-theme="dark"] .topbar{background:#101820}
.topbar h1{flex:1;margin:0;font-size:calc(19px * var(--fs));font-weight:700;letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:52px}
.tb-btn{
  min-width:44px;height:44px;border-radius:10px;color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:calc(14px * var(--fs));padding:0 8px;gap:4px
}
.tb-btn:active{background:rgba(255,255,255,.18)}

.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding-bottom:var(--safe-b)
}
.nav button{
  min-height:56px;padding:6px 2px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--ink-2);font-size:calc(13px * var(--fs));font-weight:600
}
.nav button .ic{font-size:calc(22px * var(--fs));line-height:1.1}
.nav button[aria-current="page"]{color:var(--navy)}
[data-theme="dark"] .nav button[aria-current="page"]{color:var(--navy)}

.wrap{padding:14px 14px 28px;max-width:720px;margin:0 auto}

/* ---------- 通用元件 ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:14px
}
.card.tight{padding:12px 14px}
.eyebrow{
  font-size:calc(13px * var(--fs));font-weight:700;letter-spacing:1.5px;
  color:var(--gold-t);margin-bottom:6px;text-transform:none
}
h2.sec{font-size:calc(22px * var(--fs));margin:0 0 10px;font-weight:700;line-height:1.5}
h3.sub{font-size:calc(19px * var(--fs));margin:0 0 8px;font-weight:700;line-height:1.6}
p{margin:0 0 10px}
p:last-child{margin-bottom:0}
.muted{color:var(--ink-2);font-size:calc(16px * var(--fs))}
.tiny{font-size:calc(15px * var(--fs));color:var(--ink-2)}

.verse{
  background:var(--soft);border-left:4px solid var(--gold);border-radius:8px;
  padding:12px 14px;font-size:calc(20px * var(--fs));line-height:2;margin:10px 0
}
.verse .ref{display:block;margin-top:6px;font-size:calc(15px * var(--fs));color:var(--ink-2);font-weight:600}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:12px 18px;border-radius:12px;
  background:var(--navy);color:#fff;font-weight:700;font-size:calc(18px * var(--fs));
  width:100%;text-align:center
}
[data-theme="dark"] .btn{color:#0F141A}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.btn.gold{background:var(--gold-t);color:#fff}
[data-theme="dark"] .btn.gold{color:#1A1406}
.btn.green{background:var(--green);color:#fff}
[data-theme="dark"] .btn.green{color:#08170F}
.btn.quiet{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:44px;padding:8px 14px;font-size:calc(16px * var(--fs));width:auto}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:140px}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:999px;background:var(--soft);
  font-size:calc(15px * var(--fs));font-weight:600;color:var(--ink-2);border:1px solid var(--line)
}
.chip.stage{color:#fff;border:0}
[data-theme="dark"] .chip.stage{color:#11161C}

.field{margin-bottom:14px}
.field label{display:block;font-weight:700;margin-bottom:6px;font-size:calc(17px * var(--fs))}
.field .hint{font-weight:400;color:var(--ink-2);font-size:calc(15px * var(--fs))}
input[type=text],input[type=date],input[type=time],input[type=password],textarea,select{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);min-height:52px;font-size:calc(18px * var(--fs))
}
textarea{min-height:110px;line-height:1.8;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{
  padding:10px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-size:calc(16px * var(--fs));font-weight:600;min-height:48px
}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
[data-theme="dark"] .seg button[aria-pressed="true"]{color:#11161C}

.list{list-style:none;margin:0;padding:0}
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:14px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);margin-bottom:10px;min-height:60px
}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;font-size:calc(18px * var(--fs));line-height:1.5}
.row .s{color:var(--ink-2);font-size:calc(15px * var(--fs));line-height:1.6}
.row .arrow{color:var(--ink-2);font-size:calc(20px * var(--fs))}

.empty{
  text-align:center;padding:36px 18px;border:2px dashed var(--line);
  border-radius:var(--r);background:var(--card)
}
.empty .big{font-size:calc(21px * var(--fs));font-weight:700;margin-bottom:8px}

/* ---------- 人物卡 ---------- */
.pcard{
  display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-left:6px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:12px
}
.pcard.w14{background:var(--warn-a)}
.pcard.w30{background:var(--warn-b)}
.pcard .nm{font-size:calc(21px * var(--fs));font-weight:700;line-height:1.4}
.pcard .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.pcard .last{color:var(--ink-2);font-size:calc(15px * var(--fs));margin-top:6px}
body.bigcards .pcard{padding:20px 16px}
body.bigcards .pcard .nm{font-size:calc(25px * var(--fs))}

/* ---------- 七里程路徑（signature） ---------- */
.path{position:relative;padding-left:34px;margin:6px 0}
.path::before{
  content:"";position:absolute;left:12px;top:14px;bottom:14px;width:3px;
  background:linear-gradient(180deg,#7C8B99,#5B8C6E,#4A87A8,#B8860B,#C8791F,#2E7D5B,#1B4B7A);
  border-radius:2px;opacity:.5
}
.node{position:relative;margin-bottom:12px}
.node .dot{
  position:absolute;left:-28px;top:16px;width:15px;height:15px;border-radius:50%;
  border:3px solid var(--bg);box-shadow:0 0 0 2px currentColor
}
.node.cur .dot{width:21px;height:21px;left:-31px;top:13px;background:currentColor}
.node .head{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:56px
}
.node.cur .head{border-width:2px;box-shadow:0 2px 10px rgba(27,75,122,.10)}
.node .code{font-weight:800;font-size:calc(16px * var(--fs));letter-spacing:.5px}
.node .nname{font-weight:700;font-size:calc(19px * var(--fs))}
.node .body{padding:6px 2px 6px 4px}

/* ---------- 五幕 ---------- */
.act{border-left:4px solid var(--gold);padding-left:14px;margin-bottom:18px}
.act .no{font-size:calc(15px * var(--fs));font-weight:700;color:var(--gold-t);letter-spacing:1px}
.act .tt{font-size:calc(23px * var(--fs));font-weight:700;margin:2px 0 6px;line-height:1.5}
.act .key{font-size:calc(19px * var(--fs));font-weight:700;color:var(--navy);margin-bottom:8px;line-height:1.7}
.act .bd{white-space:pre-wrap;line-height:2}

.slide{
  min-height:52vh;display:flex;flex-direction:column;justify-content:center;
  padding:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)
}
.slide .tt{font-size:calc(30px * var(--fs));font-weight:800;line-height:1.4;margin-bottom:14px}
.slide .key{font-size:calc(24px * var(--fs));line-height:1.8;color:var(--navy);font-weight:700}
.slide .vs{margin-top:16px;font-size:calc(21px * var(--fs));line-height:2}

/* ---------- 摺疊 ---------- */
details{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
details>summary{
  list-style:none;padding:14px;font-weight:700;font-size:calc(18px * var(--fs));
  display:flex;align-items:center;gap:10px;min-height:56px;cursor:pointer
}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"＋";margin-left:auto;color:var(--ink-2);font-size:calc(20px * var(--fs))}
details[open]>summary::after{content:"－"}
details .dbody{padding:0 14px 14px}

/* ---------- 覆蓋層 ---------- */
.sheet{
  position:fixed;inset:0;z-index:60;background:var(--bg);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-top:0;padding-bottom:calc(var(--safe-b) + 20px)
}
/* 捲動容器內不可用 position:fixed，iOS 會算錯觸控位置 */
.sheet > .topbar{position:sticky;top:0;left:auto;right:auto}
.sheet.hidden{display:none}
.frame{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.frame.hidden{display:none}
.frame .fbar{
  background:var(--navy);color:#fff;padding:var(--safe-t) 10px 0;
  height:calc(var(--safe-t) + 52px);display:flex;align-items:center;gap:8px
}
.frame .fbar .ttl{flex:1;font-weight:700;font-size:calc(17px * var(--fs));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame iframe{flex:1;width:100%;border:0;background:#fff}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--safe-b) + 88px);z-index:90;
  background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;
  font-size:calc(16px * var(--fs));font-weight:600;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .22s
}
.toast.on{opacity:.96}

.modal{position:fixed;inset:0;z-index:80;background:rgba(15,20,26,.55);
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal.hidden{display:none}
.modal .box{background:var(--card);border-radius:16px;padding:20px;max-width:440px;width:100%;
  max-height:82dvh;overflow-y:auto}

/* ---------- 首次啟動守則 ---------- */
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;
  padding:calc(var(--safe-t) + 24px) 20px calc(var(--safe-b) + 24px)}
#gate.hidden{display:none}
#gate .inner{max-width:560px;margin:0 auto}
#gate ol{padding-left:0;list-style:none;margin:18px 0}
#gate li{display:flex;gap:12px;margin-bottom:14px;font-size:calc(19px * var(--fs));line-height:1.8}
#gate li .n{
  flex:0 0 34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(17px * var(--fs))
}
[data-theme="dark"] #gate li .n{color:#11161C}

#lock{position:fixed;inset:0;z-index:110;background:var(--bg);overflow-y:auto;
  padding:calc(var(--safe-t) + 28px) 20px calc(var(--safe-b) + 24px)}
#lock.hidden{display:none}
#lock .inner{max-width:420px;margin:0 auto}

.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat .s{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat .s .v{font-size:calc(28px * var(--fs));font-weight:800;color:var(--navy);line-height:1.3}
.stat .s .l{font-size:calc(15px * var(--fs));color:var(--ink-2)}

.tree{list-style:none;padding-left:0;margin:0}
.tree ul{list-style:none;margin:6px 0 0;padding-left:20px;border-left:2px solid var(--line)}
.tree li{padding:6px 0 0 12px;position:relative}

hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- 小智 · AI 傳福音屬靈同伴 ---------- */
.xz-fab{
  position:fixed;right:14px;bottom:calc(var(--safe-b) + 86px);z-index:55;
  display:flex;align-items:center;gap:7px;
  padding:12px 16px;border-radius:999px;
  background:var(--navy);color:#fff;font-weight:700;
  font-size:calc(17px * var(--fs));
  box-shadow:0 4px 14px rgba(0,0,0,.22);touch-action:none
}
[data-theme="dark"] .xz-fab{color:#0F141A}
.xz-fab:active{filter:brightness(.92)}
.xz-fab .ic{font-size:calc(19px * var(--fs));line-height:1}

.xz-overlay{position:fixed;inset:0;z-index:95;background:rgba(15,20,26,.5);display:flex;align-items:flex-end}
.xz-sheet{
  width:100%;max-width:720px;margin:0 auto;height:92dvh;
  background:var(--bg);border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;overflow:hidden;
  padding-bottom:var(--safe-b)
}
.xz-head{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:var(--navy);color:#fff;flex:0 0 auto
}
[data-theme="dark"] .xz-head{color:#0F141A}
.xz-head .ava{
  width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:calc(20px * var(--fs))
}
.xz-head .nm{font-weight:700;font-size:calc(19px * var(--fs));line-height:1.3}
.xz-head .rl{font-size:calc(14px * var(--fs));opacity:.85;line-height:1.4}
.xz-head .grow{flex:1;min-width:0}
.xz-hbtn{
  width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.16);
  color:inherit;font-size:calc(18px * var(--fs));display:flex;align-items:center;justify-content:center
}

.xz-who{
  display:flex;align-items:center;gap:8px;overflow-x:auto;
  padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);flex:0 0 auto
}
.xz-who::-webkit-scrollbar{display:none}
.xz-who .lb{font-size:calc(14px * var(--fs));color:var(--ink-2);font-weight:700;white-space:nowrap}
.xz-wchip{
  white-space:nowrap;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:calc(15px * var(--fs));font-weight:600;color:var(--ink-2)
}
.xz-wchip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
[data-theme="dark"] .xz-wchip[aria-pressed="true"]{color:#11161C}

.xz-msgs{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.xz-msg{display:flex;margin-bottom:12px}
.xz-msg.me{justify-content:flex-end}
.xz-bub{
  max-width:88%;padding:13px 15px;border-radius:14px;
  font-size:calc(18px * var(--fs));line-height:1.9;
  background:var(--card);border:1px solid var(--line);color:var(--ink)
}
.xz-msg.me .xz-bub{background:var(--navy);color:#fff;border-color:var(--navy)}
[data-theme="dark"] .xz-msg.me .xz-bub{color:#0F141A}
.xz-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.xz-act{
  padding:6px 11px;border-radius:8px;background:var(--soft);border:1px solid var(--line);
  font-size:calc(14px * var(--fs));font-weight:600;color:var(--ink-2);min-height:36px
}
.xz-act.on{background:var(--gold-t);color:#fff;border-color:var(--gold-t)}
.xz-typing span{
  display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:999px;
  background:var(--ink-2);animation:xzb 1.1s infinite
}
.xz-typing span:nth-child(2){animation-delay:.18s}
.xz-typing span:nth-child(3){animation-delay:.36s}
@keyframes xzb{0%,60%,100%{opacity:.25}30%{opacity:1}}

.xz-lb{font-size:calc(15px * var(--fs));font-weight:700;color:var(--ink-2);margin:14px 0 8px}
.xz-quicks{display:flex;flex-direction:column;gap:8px}
.xz-quick{
  text-align:left;padding:12px 14px;border-radius:12px;background:var(--card);
  border:1px solid var(--line);font-size:calc(17px * var(--fs));line-height:1.6;min-height:50px
}
.xz-cats{display:flex;flex-wrap:wrap;gap:8px}
.xz-cat{
  padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  font-size:calc(16px * var(--fs));font-weight:600;min-height:46px
}
.xz-cat[aria-pressed="true"]{background:var(--gold-t);color:#fff;border-color:var(--gold-t)}
.xz-sep{text-align:center;font-size:calc(14px * var(--fs));color:var(--ink-2);margin:16px 0 6px}

.xz-foot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);flex:0 0 auto}
.xz-input{flex:1;min-height:50px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:calc(17px * var(--fs))}
.xz-send{padding:0 20px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:calc(17px * var(--fs));min-height:50px}
[data-theme="dark"] .xz-send{color:#0F141A}

<script type="application/json" id="d-core">{"version":"1.0","stages":[{"id":"L0","name":"相遇","color":"#677785","state":"彼此還是點頭之交","role":"作朋友：真誠關心生活","sign":"他願意跟你說心裡的事","heart":"許多福音行動失敗在這裡：太快切入主題，對方覺得自己是「目標」不是「朋友」。人比事重要，關係比東西重要。這個階段唯一的任務，是讓他確定「你是真的關心我，不是要我信什麼」。","actions":["記住並主動關心他的重要日子與難處","在他有需要時真的出現、真的幫忙","操練 920：對他結出聖靈的果子","為他每日禱告，一天不斷"],"next":["傳一則問候，不提任何信仰的事","記下他最近的一個難處，這週為這件事禱告","找一件小事實際幫他一次","問他一個關於生活的開放問題（見破冰問題）"]},{"id":"L1","name":"撒種","color":"#527E63","state":"知道你是基督徒，不排斥","role":"作見證：自然分享主的作為","sign":"他主動問起信仰的事","heart":"撒種不是講道理，是分享「發生在我身上的事」。最有力量的不是「聖經說」，是「上個月我遇到一件事」。目標是把信仰從禁忌話題變成正常話題。","actions":["分享個人的三分鐘見證（不談教義，只談改變）","在合適時機邀請他一起吃飯、聽詩歌、看短片","分享一段適合他處境的金句","邀請他參加低門檻的活動（不是主日崇拜）"],"next":["分享你見證裡的一小段，不用講完","傳一張適合他現在處境的金句給他","邀他吃一頓飯，不談信仰也沒關係","跟他說一句：我最近有為你禱告"]},{"id":"L2","name":"澆灌","color":"#447B9A","state":"有興趣但有疑問與攔阻","role":"作聆聽者：回答並陪他面對","sign":"他願意讀經、禱告或來聚會","heart":"這是最多人退卻的階段，因為會被問倒。但要記得：他問問題，代表他在意。回答的原則是「先接住情緒，再處理問題」。很多疑問底下藏的不是理性難題，是一段受傷的經歷。","actions":["分辨這是「知識的問題」還是「心裡的傷」","誠實承認自己不懂的部分，一起去找答案","邀他一起讀一卷福音書（約翰福音或路加福音）","處理具體攔阻：家人反對、拜祖先、時間、罪的捆綁"],"next":["問他：你會這樣想，是因為遇過什麼事嗎？","去疑問解答庫找一題，先自己讀熟","邀他一起讀約翰福音，一天一小段","老實跟他說：這題我也不確定，我們一起找答案"]},{"id":"L3","name":"扎根","color":"#8C6608","state":"心被聖靈感動，願意相信","role":"作接生者：帶領決志禱告","sign":"他親口承認耶穌是主","heart":"決志不是話術的成功，是聖靈的工作。我們的責任是把福音講清楚，並且勇敢地發出邀請。很多人一輩子沒信主，只因為從來沒有人正式邀請過他。","actions":["用五幕結構完整講一次福音","誠實說明信主的代價與福分","發出明確的邀請：「你願意現在接受嗎？」","帶領決志禱告，並立刻約好下一次見面"],"next":["先禱告，然後約一個能好好談的時間","把五幕福音先自己讀一遍","誠實跟他說福分，也說代價","鼓起勇氣問那一句：你願意現在接受嗎？"]},{"id":"L4","name":"歸屬","color":"#9B5E18","state":"信了，但還沒公開委身","role":"作引路人：陪他受洗、進小組","sign":"受洗，並融入一個群體","heart":"決志後的三十天是黃金期也是危險期。一個人若在六週內沒有交到三個教會的朋友，流失的機率極高。所以這個階段的重點不是課程，是「關係的移植」。","actions":["決志後四十八小時內第一次跟進","帶他認識至少三位弟兄姊妹","陪他上完慕道班八課","陪他預備受洗見證，出席他的受洗"],"next":["今天就傳訊息給他，不要等","約好這週介紹一位弟兄姊妹給他","陪他上慕道班的下一課","問他：關於受洗，你心裡有什麼想法？"]},{"id":"L5","name":"長大","color":"#2E7D5B","state":"初信者，需要建造生命","role":"作父母：一對一門訓十二課","sign":"生活有改變，能自己靈修","heart":"受洗是起點不是終點。這個階段要把「先生命、再關係、後事工」的次序建造進去，並且完成從「舊人有己」到「新人無己」的觀念轉換。","actions":["每週一次一對一，持續三個月","教他讀經、禱告、記錄","陪他處理生命中的具體難題","示範給他看：帶他一起去關心別人"],"next":["約這週的一對一時間","問他這週靈修讀到什麼","帶他一起去關心另一個人","陪他處理他現在最卡住的那件事"]},{"id":"L6","name":"生養","color":"#1B4B7A","state":"門徒，開始有負擔","role":"作教練：放手讓他去帶人","sign":"他開始陪伴他自己的一個 2","heart":"這是最容易被忽略、卻決定一切的一步。若不繁殖，一切努力只是加法。真正的成功，是他不再需要你，並且開始有他自己的名單。","actions":["把你會的教給他，然後讓他去做","陪他寫下他自己的第一張名單","在旁邊支持，但不代替他做","為他的屬靈兒女一同禱告"],"next":["問他：你心裡有沒有想帶的人？","陪他寫下他的第一張名單（三個名字）","讓他講一次福音給你聽，你只聽不改","為他的第一個 2 一起禱告"]}],"ethics":["我記錄他，是為了更好地愛他，不是為了管理他。","我絕不把他的私事告訴不相干的人，包括在代禱時。","我尊重他的自由，他有權利說不，也有權利慢慢來。","我不把人數當成績。一個靈魂比一百個數字寶貴。","我知道使人重生的是聖靈，不是我。我只負責忠心。"],"dailyVerses":[{"ref":"馬太福音二十八章19節","text":"所以，你們要去，使萬民作我的門徒。"},{"ref":"約翰福音十五章5節","text":"常在我裡面的，我也常在他裡面，這人就多結果子；因為離了我，你們就不能做甚麼。"},{"ref":"加拉太書二章20節","text":"現在活著的不再是我，乃是基督在我裡面活著。"},{"ref":"腓立比書二章5節","text":"你們當以基督耶穌的心為心。"},{"ref":"雅各書四章6節","text":"神阻擋驕傲的人，賜恩給謙卑的人。"},{"ref":"哥林多前書三章6節","text":"我栽種了，亞波羅澆灌了，惟有神叫他生長。"},{"ref":"以賽亞書四十章31節","text":"但那等候耶和華的必從新得力。"},{"ref":"詩篇一百二十六篇6節","text":"那帶種流淚出去的，必要歡歡樂樂地帶禾捆回來。"},{"ref":"羅馬書一章16節","text":"我不以福音為恥；這福音本是神的大能，要救一切相信的。"},{"ref":"彼得前書三章15節","text":"有人問你們心中盼望的緣由，就要常作準備，以溫柔、敬畏的心回答各人。"},{"ref":"加拉太書六章9節","text":"我們行善，不可喪志；若不灰心，到了時候就要收成。"},{"ref":"提摩太後書二章2節","text":"你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人。"},{"ref":"路加福音十九章10節","text":"人子來，為要尋找、拯救失喪的人。"},{"ref":"約翰福音一章12節","text":"凡接待他的，就是信他名的人，他就賜他們權柄作神的兒女。"},{"ref":"馬太福音九章37節","text":"要收的莊稼多，做工的人少。"},{"ref":"以弗所書六章18節","text":"靠著聖靈，隨時多方禱告祈求。"},{"ref":"歌羅西書四章5至6節","text":"你們要愛惜光陰，用智慧與外人交往。你們的言語要常常帶著和氣。"},{"ref":"詩篇三十四篇18節","text":"耶和華靠近傷心的人，拯救靈性痛悔的人。"},{"ref":"哥林多後書五章17節","text":"若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。"},{"ref":"腓立比書四章13節","text":"我靠著那加給我力量的，凡事都能做。"},{"ref":"箴言十一章30節","text":"有智慧的，必能得人。"},{"ref":"使徒行傳一章8節","text":"但聖靈降臨在你們身上，你們就必得著能力，並要在……直到地極，作我的見證。"},{"ref":"馬可福音十六章15節","text":"你們往普天下去，傳福音給萬民聽。"},{"ref":"約翰福音十三章35節","text":"你們若有彼此相愛的心，眾人因此就認出你們是我的門徒了。"},{"ref":"羅馬書十章14節","text":"然而，人未曾信他，怎能求他呢？未曾聽見他，怎能信他呢？"},{"ref":"帖撒羅尼迦前書二章8節","text":"不但願意將神的福音給你們，連自己的性命也願意給你們。"},{"ref":"詩篇一百二十七篇1節","text":"若不是耶和華建造房屋，建造的人就枉然勞力。"},{"ref":"瑪拉基書三章16節","text":"且有紀念冊在他面前，記錄那敬畏耶和華、思念他名的人。"},{"ref":"以西結書三十六章26節","text":"我也要賜給你們一個新心，將新靈放在你們裡面。"},{"ref":"彼得後書三章9節","text":"主……不願有一人沉淪，乃願人人都悔改。"}],"quickNotes":["見面","電話","訊息","一起吃飯","來聚會","為他禱告"],"moods":[{"id":"open","label":"開放","color":"#2E7D5B"},{"id":"normal","label":"平常","color":"#7C8B99"},{"id":"resist","label":"抗拒","color":"#C8791F"}],"relations":["家人","同事","朋友","鄰居","同學","其他"]}</script>
<script type="application/json" id="d-faq">{"version":"1.0","note":"每題四層：短答、經文（和合本）、比喻、反問。結尾一律「不要爭贏，要愛贏。」","categories":[{"id":"exist","name":"神的存在","icon":"✦"},{"id":"suffer","name":"苦難的問題","icon":"☂"},{"id":"bible","name":"聖經可信度","icon":"📖"},{"id":"religion","name":"其他宗教","icon":"🛤"},{"id":"church","name":"教會的問題","icon":"⛪"},{"id":"science","name":"科學與信仰","icon":"🔬"},{"id":"chinese","name":"華人處境","icon":"🏮"},{"id":"life","name":"生活與道德","icon":"🌱"}],"items":[{"id":"q1","cat":"exist","q":"你怎麼證明有神？","short":"神不是實驗室裡的一個物件，祂是萬有的源頭。我們證明祂，不是把祂放上天平，而是看見祂留下的痕跡：宇宙的秩序、生命的奧妙、人心裡那把是非的尺。","verses":[{"ref":"羅馬書一章20節","text":"自從造天地以來，神的永能和神性是明明可知的，雖是眼不能見，但藉著所造之物就可以曉得，叫人無可推諉。"}],"analogy":"你走進一間屋子，桌上茶還溫著，燈亮著，門是關上的。你不會說「這屋子從來沒有人」，你會說「剛剛有人在」。宇宙就是那間屋子。","askback":"如果真的有一位神，你希望祂是怎樣的一位神？"},{"id":"q2","cat":"exist","q":"科學能不能證明神？","short":"科學回答「怎麼運作」，信仰回答「為什麼存在」。科學不能證明神，正如顯微鏡不能證明母愛——不是母愛不存在，是工具用錯了。","verses":[{"ref":"希伯來書十一章3節","text":"我們因著信，就知道諸世界是藉神話造成的；這樣，所看見的，並不是從顯然之物造出來的。"}],"analogy":"把一鍋湯拿去化驗，可以驗出鹽分、脂肪、蛋白質，卻驗不出「這是媽媽煮的」。驗不出來，不代表沒有媽媽。","askback":"你生命裡最重要的那些事——愛、意義、值不值得——有哪一件是靠科學證明才相信的？"},{"id":"q3","cat":"exist","q":"宇宙是怎麼來的？","short":"科學告訴我們宇宙有一個開始，那就表示它不是自有的。凡有開始的，必有使它開始的。基督信仰說：那位使它開始的，就是神。","verses":[{"ref":"創世記一章1節","text":"起初，神創造天地。"}],"analogy":"一列火車，第一節車廂被第二節推動，第二節被第三節推動……推到最後你總得問：最前面那一節，是誰發動的？總要有一個不需要被推的推動者。","askback":"你覺得「一切都是偶然」和「一切都有心意」，哪一個比較需要信心？"},{"id":"q4","cat":"exist","q":"我為什麼感覺不到神？","short":"感覺不到，不代表不存在，很多時候是因為我們忙到聽不見，或者心裡有一堵牆。神從來沒有離開，只是我們把祂關在門外。","verses":[{"ref":"耶利米書二十九章13節","text":"你們尋求我，若專心尋求我，就必尋見。"}],"analogy":"收音機一直有訊號，是我們沒有調到那個頻道。頻道不對，不是電台沒播音。","askback":"如果有一天你真的感覺到了，你願意怎麼回應祂？"},{"id":"q5","cat":"exist","q":"如果有神，為何祂不現身？","short":"祂現身過。兩千年前，祂成為一個嬰孩降生，走在人群中間，最後為我們死在十字架上。神不是躲起來，是走進來。","verses":[{"ref":"約翰福音一章14節","text":"道成了肉身，住在我們中間，充充滿滿的有恩典有真理。"}],"analogy":"如果太陽為了讓螞蟻看清楚它，直接靠過來，螞蟻不會看見太陽，只會被燒掉。所以太陽選擇成為一道溫暖的光。耶穌就是那道光。","askback":"如果神真的來過，而且是以受苦的方式來的，這跟你原本想像的神有什麼不一樣？"},{"id":"q6","cat":"suffer","q":"好人為什麼受苦？","short":"苦難不是神的懲罰清單，是這個已經破碎的世界的共同處境。福音真正的答案不是解釋苦難，而是神自己親身走進苦難，與我們一同承受。","verses":[{"ref":"約翰福音十六章33節","text":"在世上，你們有苦難；但你們可以放心，我已經勝了世界。"}],"analogy":"孩子半夜發燒，父母給的不是一篇「為什麼會發燒」的論文，是整夜守在床邊的那隻手。神給我們的，是那隻手。","askback":"你現在最想有人陪你走過的，是哪一段？"},{"id":"q7","cat":"suffer","q":"神為何不阻止災難？","short":"神給了人真實的自由，而自由必然帶著被濫用的可能。祂沒有選擇做一個把人變成木偶的神，祂選擇了在災難中與人同在，並要在末了更新一切。","verses":[{"ref":"啟示錄二十一章4節","text":"神要擦去他們一切的眼淚；不再有死亡，也不再有悲哀、哭號、疼痛，因為以前的事都過去了。"}],"analogy":"父母若把孩子鎖在家裡一輩子，孩子確實不會受傷，但那也不叫人生了。愛必須冒險，因為愛只能在自由裡發生。","askback":"你希望神現在就把所有惡都除掉嗎？那你我會不會也在那份名單上？"},{"id":"q8","cat":"suffer","q":"我的家人早逝，神在哪裡？","short":"祂就在你哭的地方。聖經裡耶穌站在朋友的墳墓前，明明知道下一刻要叫他復活，仍然先哭了。神不是站在遠處看你痛，祂是陪你一起痛的那一位。","verses":[{"ref":"約翰福音十一章35節","text":"耶穌哭了。"}],"analogy":"最深的安慰從來不是一句「別難過了」，是有人坐下來，什麼也不說，陪你到天亮。","askback":"願意跟我說說他是個怎樣的人嗎？我想認識他。"},{"id":"q9","cat":"suffer","q":"神既全能又全善，為何有惡？","short":"惡不是神造的一樣東西，惡是「善的缺席」，是受造者離開本位、要自己作主的結果。神容許惡存在一段時間，是因為祂要的不是機器人，是願意愛祂的兒女。","verses":[{"ref":"羅馬書五章8節","text":"惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們顯明了。"}],"analogy":"黑暗不是一種物質，是沒有光。冷不是一種能量，是沒有熱。惡也一樣——它是人離開神以後留下的那個空洞。","askback":"你心裡真正在意的，是「惡為什麼存在」這個問題，還是某一件具體發生在你身上的事？"},{"id":"q10","cat":"suffer","q":"我信了就不會受苦嗎？","short":"不會。信耶穌不是買保險，是換一個生命。苦難仍會來，但你不再是一個人面對，而且苦難在祂手中會成為造就你的東西。","verses":[{"ref":"羅馬書八章28節","text":"我們曉得萬事都互相效力，叫愛神的人得益處。"}],"analogy":"同樣一場大雨，沒傘的人是災難，有傘的人也一樣淋到風、聽到雷，但他能走完那條路。信仰不是取消雨，是給你走下去的力量。","askback":"如果苦難不會消失，但你有一位永遠不離開的同伴，這樣的信仰對你有意義嗎？"},{"id":"q11","cat":"suffer","q":"為何禱告沒有得到答應？","short":"神對禱告的回答有三種：好、等一等、我有更好的。沒有一種是「不理你」。有時候祂不改變環境，是因為祂要先改變我們。","verses":[{"ref":"哥林多後書十二章9節","text":"我的恩典夠你用的，因為我的能力是在人的軟弱上顯得完全。"}],"analogy":"孩子要一把水果刀，爸爸沒有給。不是爸爸不愛他，是爸爸看得比較遠。","askback":"你最近最想求神成就的那件事，可以跟我說嗎？我想陪你一起求。"},{"id":"q12","cat":"bible","q":"聖經被人改過嗎？","short":"聖經是古代抄本數量最多、年代最早的文獻。死海古卷發現的以賽亞書抄本，比原先所有的抄本早了一千年，內容卻幾乎一模一樣。它經得起檢驗。","verses":[{"ref":"馬太福音二十四章35節","text":"天地要廢去，我的話卻不能廢去。"}],"analogy":"一份文件如果只有一份，改了沒人知道。但如果同一份文件散在幾千個地方、幾百種語言、幾個世紀，任何人想改，立刻就被對出來。聖經就是這種情況。","askback":"如果聖經真的可信，你最想先看哪一卷？我可以陪你讀。"},{"id":"q13","cat":"bible","q":"聖經裡的矛盾怎麼解釋？","short":"多數所謂的矛盾，來自角度不同或文體不同，就像四個人描述同一場車禍。真正難解的地方確實有，但沒有一處動搖福音的核心。","verses":[{"ref":"提摩太後書三章16節","text":"聖經都是神所默示的，於教訓、督責、使人歸正、教導人學義都是有益的。"}],"analogy":"四個證人若說得一字不差，法官反而要懷疑他們串供。細節有差異，主軸卻一致，這才是真實的見證。","askback":"你讀到哪一段覺得對不起來？我們一起查查看，我也想知道。"},{"id":"q14","cat":"bible","q":"聖經只是古人的神話嗎？","short":"神話沒有地名、沒有年代、沒有可查證的人物。聖經卻滿是可考的君王、城市、碑文與年份，它把自己交給歷史檢驗。","verses":[{"ref":"路加福音一章3節","text":"這些事我既從起頭都詳細考察了，就定意要按著次序寫給你。"}],"analogy":"神話開頭是「很久很久以前，在一個遙遠的國度」；路加福音開頭是「該撒亞古士督在位的時候，居里扭作敘利亞巡撫」。這是新聞的寫法，不是童話的寫法。","askback":"如果它真的是歷史，而不是故事，這對你會有差別嗎？"},{"id":"q15","cat":"bible","q":"為什麼有那麼多版本？","short":"版本多是因為翻譯多、語言在變，不是因為內容被改。就像同一本書有不同譯者，原文卻只有一份。","verses":[{"ref":"以賽亞書四十章8節","text":"草必枯乾，花必凋殘，惟有我們神的話必永遠立定。"}],"analogy":"同一首歌，有人用鋼琴彈，有人用吉他唱，曲子沒有變。譯本是樂器，原文是曲譜。","askback":"你想從哪一本開始讀？我推薦和合本或現代中文譯本，看你讀哪個順。"},{"id":"q16","cat":"bible","q":"舊約的神為何那麼嚴厲？","short":"舊約的神和新約的神是同一位。祂的嚴厲從來針對的是壓迫、殘忍與獻嬰的邪惡，而祂的耐心，是等了幾百年才動手。同一位神，最後選擇讓自己的兒子承受一切審判。","verses":[{"ref":"出埃及記三十四章6節","text":"耶和華，耶和華，是有憐憫有恩典的神，不輕易發怒，並有豐盛的慈愛和誠實。"}],"analogy":"一個對癌症不動刀的醫生，不叫慈愛，叫失職。神的嚴厲，是祂對邪惡認真；祂的十字架，是祂對我們認真。","askback":"你比較介意一位對惡不聞不問的神，還是一位會處理惡的神？"},{"id":"q17","cat":"religion","q":"條條大路通羅馬，為何只有基督教？","short":"問題不在哪條路，在於「誰走得動」。所有宗教都在教人怎麼爬上去見神，只有福音說：神自己走下來找人。這不是同一種東西的競爭，是兩個方向。","verses":[{"ref":"約翰福音十四章6節","text":"耶穌說：我就是道路、真理、生命；若不藉著我，沒有人能到父那裡去。"}],"analogy":"掉進深井的人，井上遞下來的繩子只有一條——不是因為繩子霸道，是因為別的都是畫在牆上的。","askback":"你會怎麼描述你心中那位神？我很想知道你是怎麼想的。"},{"id":"q18","cat":"religion","q":"沒聽過福音的人怎麼辦？","short":"神是公義的，祂必按各人所領受的光審判，我們可以把這一題安心交給祂。但有一件事我很確定：你已經聽見了，所以這一題現在其實是關於你。","verses":[{"ref":"創世記十八章25節","text":"審判全地的主豈不行公義嗎？"}],"analogy":"船難時救生艇來了，你不會先問「還沒被找到的人怎麼辦」，你會先上船，然後幫忙划回去找人。","askback":"既然你已經聽見了，你打算怎麼回應？"},{"id":"q19","cat":"religion","q":"基督教是不是太排他？","short":"真理本來就有排他性，2＋2＝4 就排斥了 5，這不叫傲慢，叫誠實。但基督信仰在「誰可以來」這件事上，是全世界最包容的——不論你是誰、做過什麼，都可以來。","verses":[{"ref":"啟示錄二十二章17節","text":"口渴的人也當來；願意的，都可以白白取生命的水喝。"}],"analogy":"醫院只用有效的藥，這叫排他；但醫院不挑病人，這叫包容。福音在真理上專一，在人的身上全開。","askback":"你覺得一個「什麼都可以」的信仰，還救得了人嗎？"},{"id":"q20","cat":"religion","q":"各宗教都教人向善不是一樣嗎？","short":"教人向善的多，能給人新生命的只有一位。問題不在我們不知道該行善，而在我們知道卻做不到。福音處理的正是這個做不到。","verses":[{"ref":"羅馬書七章18節","text":"立志為善由得我，只是行出來由不得我。"}],"analogy":"所有的健身教練都叫你早起運動，這不難懂。難的是明天早上六點，你起不起得來。福音不是再給一張課表，是換一顆心。","askback":"有沒有哪一件事，你明明知道該做，卻怎麼樣都做不到？"},{"id":"q21","cat":"religion","q":"我拜的神也很靈驗","short":"靈驗不等於真實，能力也不等於良善。真正要問的不是「靈不靈」，是「祂愛不愛你、祂為你付過什麼代價」。","verses":[{"ref":"約翰福音十章11節","text":"我是好牧人，好牧人為羊捨命。"}],"analogy":"願意借錢給你的人很多，願意為你去死的只有一個。你會把一生託給哪一個？","askback":"你所拜的那一位，曾經為你付出過什麼嗎？"},{"id":"q22","cat":"church","q":"基督徒為什麼很虛偽？","short":"你說得對，而且我自己也是其中一個。教會不是聖人的展示櫃，是病人的醫院。我們不是宣稱自己很好，是承認自己需要醫生。","verses":[{"ref":"馬可福音二章17節","text":"康健的人用不著醫生，有病的人才用得著。我來本不是召義人，乃是召罪人。"}],"analogy":"健身房裡都是身材還沒練好的人，那正是他們在那裡的原因。若有人因此嘲笑健身房，那反而奇怪了。","askback":"有沒有哪個基督徒傷過你？如果有，我想先為那件事跟你說抱歉。"},{"id":"q23","cat":"church","q":"教會歷史上的黑暗怎麼說？","short":"十字軍、獵巫、包庇——這些是真的，我們不辯護，也不遮掩。但要分清楚：那些事違背了耶穌的教導，不是實踐了祂的教導。要評斷一位老師，得看他自己怎麼活。","verses":[{"ref":"馬太福音七章20節","text":"所以，憑著他們的果子就可以認出他們來。"}],"analogy":"有醫生犯錯害死人，我們追究那位醫生，不會廢掉醫學。看基督信仰要看耶穌本人，不是看每一個掛著祂名字的人。","askback":"如果把那些人先放一邊，單單看耶穌這個人，你怎麼看祂？"},{"id":"q24","cat":"church","q":"教會是不是只要奉獻？","short":"聖經裡的奉獻是甘心樂意的回應，不是入場費。你可以一輩子不奉獻一塊錢，照樣被神愛、照樣得救。任何用金錢施壓的作法，都不是福音。","verses":[{"ref":"哥林多後書九章7節","text":"各人要隨本心所酌定的，不要作難，不要勉強，因為捐得樂意的人是神所喜愛的。"}],"analogy":"你不會因為要送媽媽禮物才叫她媽媽。奉獻是關係的果子，不是關係的門票。","askback":"如果去教會完全不用花一毛錢，你願意來看看嗎？"},{"id":"q25","cat":"church","q":"我被教會的人傷害過","short":"我很難過，也不會替他辯解。人會讓你失望，這是真的。但求你別讓那個人擋住耶穌——傷你的是人，不是主。","verses":[{"ref":"詩篇三十四篇18節","text":"耶和華靠近傷心的人，拯救靈性痛悔的人。"}],"analogy":"被燙過的人怕熱水，這很正常。但我們不會因此一輩子不洗澡，只是需要有人先幫你把水溫調好。","askback":"你願意跟我說說當時發生了什麼嗎？我只想聽，不會替誰說話。"},{"id":"q26","cat":"church","q":"我可以信耶穌但不去教會嗎？","short":"可以得救，但會長不大。信仰不是私人嗜好，是進入一個家。一根柴自己燒，很快就滅了。","verses":[{"ref":"希伯來書十章25節","text":"你們不可停止聚會，好像那些停止慣了的人，倒要彼此勸勉。"}],"analogy":"一個新生兒可以自己活嗎？活得下來，但沒有家人抱他、餵他、教他說話，他長不成一個完整的人。","askback":"如果有一個地方，你來了不會被推銷、不會被追問，只是有人陪你吃頓飯，你願意試一次嗎？"},{"id":"q27","cat":"science","q":"進化論與創造論怎麼看？","short":"聖經關心的是「誰造的、為什麼造」，不是「用幾種方法造」。基督徒在過程的細節上有不同看法，但都同意一件事：這一切背後有一位有心意的創造者，而人是照著祂的形像造的。","verses":[{"ref":"創世記一章27節","text":"神就照著自己的形像造人，乃是照著他的形像造男造女。"}],"analogy":"一幅畫，你可以研究顏料的成分、筆觸的順序，那是科學；但「這幅畫是誰畫的、想說什麼」，顏料回答不了。","askback":"如果人真的是被有心意地造出來的，那對你自己的價值會有什麼影響？"},{"id":"q28","cat":"science","q":"六日創造是真的嗎？","short":"「日」在希伯來文可指二十四小時，也可指一段時期。忠心的基督徒對此有不同理解，這不是得救的關鍵。關鍵是第一句：起初神創造。","verses":[{"ref":"彼得後書三章8節","text":"主看一日如千年，千年如一日。"}],"analogy":"你問媽媽「這鍋湯燉多久」，她說「燉了一整天」。你不會拿碼表去核對她講的是不是二十四小時整。文體決定讀法。","askback":"撇開時間長短，你覺得「宇宙有一位創造者」這件事本身，合不合理？"},{"id":"q29","cat":"science","q":"神蹟合乎理性嗎？","short":"如果神存在，神蹟就一點也不奇怪；如果神不存在，才需要解釋。神蹟不是打破規律，是規律的訂立者在特定時刻親自介入。","verses":[{"ref":"路加福音一章37節","text":"因為出於神的話，沒有一句不帶能力的。"}],"analogy":"球在桌上滾，遵守物理定律；我伸手把球接住，也沒有違反物理，只是有一隻手介入了。神就是那隻手。","askback":"最大的神蹟其實是一個人從死裡復活。如果那件事是真的，你會怎麼想？"},{"id":"q30","cat":"science","q":"宇宙這麼大，有外星人嗎？","short":"聖經沒有說有，也沒有說沒有，這不是它要回答的問題。但它非常清楚地說：在這顆星球上，神為了你，願意付上祂兒子的性命。","verses":[{"ref":"詩篇八篇3至4節","text":"我觀看你指頭所造的天，並你所陳設的月亮星宿，便說：人算甚麼，你竟顧念他？"}],"analogy":"宇宙很大，不代表你很小。母親有十個孩子，不會讓她對其中一個的愛少十分之一。","askback":"在這麼大的宇宙裡，如果真的有一位神特別記得你的名字，你會有什麼感覺？"},{"id":"q31","cat":"chinese","q":"信了就不能拜祖先，算不算不孝？","short":"基督徒非常敬重祖先，只是不用祭拜的方式。我們仍然掃墓、追思、講述長輩的故事、照顧在世的父母——聖經把孝敬父母列為十誡之一。改變的是形式，不是那份心。","verses":[{"ref":"以弗所書六章2至3節","text":"要孝敬父母，使你得福，在世長壽。這是第一條帶應許的誡命。"}],"analogy":"父母在世時你天天噓寒問暖，勝過過世後燒一屋子的房子。真正的孝，是活著的時候給的。","askback":"你們家最看重的是哪一項禮俗？我想先了解，再一起想怎麼做既合宜又不失敬意。"},{"id":"q32","cat":"chinese","q":"家人強烈反對怎麼辦？","short":"先別急著辯論，先讓他們看見你變好了。當媳婦更孝順、丈夫更顧家、脾氣變柔和，反對的力道會自己軟下來。真理靠講，生命靠活。","verses":[{"ref":"彼得前書三章1節","text":"你們作妻子的要順服自己的丈夫；這樣，若有不信從道理的丈夫，他們雖然不聽道，也可以因妻子的品行被感化過來。"}],"analogy":"推一扇上鎖的門，越用力越推不開。但你把屋子裡的燈打開，屋外的人自然會靠過來。","askback":"他們最擔心的是什麼？是怕你被騙、怕你不管家裡，還是怕別人的眼光？"},{"id":"q33","cat":"chinese","q":"喪禮怎麼辦？","short":"基督教喪禮一樣莊重、一樣盡孝，只是用追思禮拜取代祭拜的部分。多數殯葬業者都很熟悉，可以事先跟家人溝通好流程，減少誤會。","verses":[{"ref":"帖撒羅尼迦前書四章13節","text":"論到睡了的人，我們不願意弟兄們不知道，恐怕你們憂傷，像那些沒有指望的人一樣。"}],"analogy":"同樣是送別，有人是揮手說再見，有人是揮手說永別。基督徒的告別式裡，有淚水，也有再見面的盼望。","askback":"家裡是誰在主持這些事？也許可以先跟他好好聊一次。"},{"id":"q34","cat":"chinese","q":"清明節怎麼辦？","short":"照樣去掃墓、整理墓園、獻花、追思、講長輩的故事、全家一起禱告感恩。基督徒不缺席清明，只是不燒香不祭拜。","verses":[{"ref":"傳道書七章2節","text":"往遭喪的家去，強如往宴樂的家去，因為死是眾人的結局，活人也必將這事放在心上。"}],"analogy":"同一個節日，有人是對著墓碑說話，有人是對著神說話，然後在墓前說給家人聽。心意一樣重，方式不一樣。","askback":"你們家清明通常怎麼過？我想聽聽看有沒有哪些部分是可以照樣做的。"},{"id":"q35","cat":"chinese","q":"算命與改運可以嗎？","short":"聖經明確反對，不是因為迷信，而是因為那會把你的人生交給一個不愛你的東西。神要你把未來交在祂手中，祂對你的心意是好的。","verses":[{"ref":"耶利米書二十九章11節","text":"耶和華說：我知道我向你們所懷的意念是賜平安的意念，不是降災禍的意念，要叫你們末後有指望。"}],"analogy":"地圖再準，也不如有一位認得路、而且會陪你走完全程的嚮導。算命給的是一張圖，神給的是祂自己。","askback":"你最想知道的是未來的哪一件事？那件事背後，你真正擔心的是什麼？"},{"id":"q36","cat":"chinese","q":"婚禮習俗要怎麼處理？","short":"大部分習俗屬於文化而非拜偶像，可以保留；涉及祭拜與求問的部分則調整。原則是：能保留的儘量保留，該堅持的溫柔堅持，事前溝通遠勝當天堅持。","verses":[{"ref":"羅馬書十二章18節","text":"若是能行，總要盡力與眾人和睦。"}],"analogy":"同一場婚宴，桌數、禮金、敬酒都照舊，只是把敬拜的那一杯留給神。多數長輩在意的是被尊重，不是那個動作本身。","askback":"婚禮裡哪一項是家裡長輩最堅持的？我們可以先想想那一項怎麼處理。"},{"id":"q37","cat":"life","q":"信了以後有哪些不能做？","short":"神不是給你一張禁令清單，是給你一個新生命。當生命變了，很多事你會自己不想再做了——不是不能，是不想。","verses":[{"ref":"哥林多前書六章12節","text":"凡事我都可行，但不都有益處；凡事我都可行，但無論哪一件，我總不受它的轄制。"}],"analogy":"戀愛的人不需要規定他不准跟別人曖昧，他自己就不想。愛會做規則做不到的事。","askback":"你現在生活裡，有沒有哪一件事其實你自己也想戒掉，卻戒不掉？"},{"id":"q38","cat":"life","q":"婚姻與兩性的教導","short":"聖經對婚姻的標準很高，因為它相信婚姻承載的東西很重。它要求的不是壓抑，是委身；不是限制愛，是保護愛。","verses":[{"ref":"以弗所書五章25節","text":"你們作丈夫的，要愛你們的妻子，正如基督愛教會，為教會捨己。"}],"analogy":"河水沒有堤岸就成了洪水，有了堤岸才能一路奔流到海。界線不是敵人，是讓愛走得遠的東西。","askback":"你自己心裡覺得，一段真正好的關係，最重要的是什麼？"},{"id":"q39","cat":"life","q":"基督徒怎麼看金錢？","short":"金錢是好僕人、壞主人。聖經沒有說錢是惡的，它說的是「貪財是萬惡之根」。關鍵不在你有多少，在誰在作主。","verses":[{"ref":"馬太福音六章24節","text":"一個人不能事奉兩個主……你們不能又事奉神，又事奉瑪門。"}],"analogy":"船在水裡沒問題，水進到船裡就出事了。錢在你手裡沒問題，錢進到你心裡才危險。","askback":"如果錢完全不是問題了，你最想拿人生去做什麼？"},{"id":"q40","cat":"life","q":"職場的壓力與妥協怎麼辦？","short":"基督徒在職場不是要當糾察隊，是要當那個可以被信任的人。有些事可以彈性，有些事不能——分辨的原則是：這件事會不會傷害人、會不會需要說謊。","verses":[{"ref":"歌羅西書三章23節","text":"無論做甚麼，都要從心裡做，像是給主做的，不是給人做的。"}],"analogy":"職場像一場長跑，能跑到最後的不是跑最快的人，是姿勢對的人。誠信就是那個姿勢。","askback":"你現在最難的是哪一種壓力？是業績、人際，還是被要求做你不安心的事？"}]}</script>
<script type="application/json" id="d-gospel">{"version":"1.0","acts":[{"id":"a1","no":"第一幕","title":"美好的起初","key":"你不是意外，你是被想念著造出來的。","body":"在一切的起頭，有一位神。祂造了光、造了海、造了會開花的樹，最後祂造了人——不是隨手一造，是照著祂自己的形像造的。祂把生氣吹進人的鼻孔裡，人就成了有靈的活人。\n那時候，人與神之間沒有隔閡。神在園子裡走，人聽得見祂的腳步聲。人不需要證明什麼、不需要爭什麼，因為他知道自己是被愛的。\n所以，人心裡那份「總覺得少了什麼」的空，不是你有毛病，是你本來就是為一位神造的。","verses":[{"ref":"創世記一章27節","text":"神就照著自己的形像造人，乃是照著他的形像造男造女。"},{"ref":"創世記二章7節","text":"耶和華神用地上的塵土造人，將生氣吹在他鼻孔裡，他就成了有靈的活人。"}]},{"id":"a2","no":"第二幕","title":"有己的墮落","key":"罪的根不是你做了什麼壞事，是你想自己作主。","body":"問題不是從殺人放火開始的。是從一個念頭開始的：「我可以自己決定什麼是對、什麼是錯。」蛇對人說的那一句話是——「你們便如神能知道善惡」。\n人吃那果子，不是因為肚子餓。是因為想坐上那個位子。這就是驕傲：離開人的本位，抓住神的權力，想要代替神。\n這就是聖經說的「罪」的根，我們叫它「有己」——凡事以自己為中心，自己要作主作王。\n有己一進來，四道裂縫立刻出現：人與神隔絕了，人與自己不和了，人與人開始互相推卸、互相傷害，人與所處的世界也失了序。\n所以你不必先承認自己是壞人。你只要誠實地問一句：我這一生，究竟是誰在作王？","verses":[{"ref":"創世記三章5節","text":"你們吃的日子眼睛就明亮了，你們便如神能知道善惡。"},{"ref":"以賽亞書五十三章6節","text":"我們都如羊走迷，各人偏行己路。"},{"ref":"羅馬書三章23節","text":"因為世人都犯了罪，虧缺了神的榮耀。"}]},{"id":"a3","no":"第三幕","title":"十架的救贖","key":"祂不是來給你一套規矩，是來替你死。","body":"神大可以放手不管，但祂沒有。祂做了一件我們無法想像的事——祂自己來了。\n耶穌基督，神的兒子，成為一個真實的人，走在塵土裡，餓過、累過、被誤解過。最後祂被釘在十字架上。那一天祂承擔的，不只是我們做過的錯事（罪行），更是我們裡面那個要自己作主的本性（罪性）。\n這是一場交換：祂受該我們受的，我們得該祂得的。祂沒有討價還價，祂是心甘情願的。\n所以十字架不是一個宗教符號，是一張已經付清的收據。","verses":[{"ref":"羅馬書五章8節","text":"惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們顯明了。"},{"ref":"彼得前書三章18節","text":"因基督也曾一次為罪受苦，就是義的代替不義的，為要引我們到神面前。"}]},{"id":"a4","no":"第四幕","title":"復活的新生命","key":"祂死了，解決舊的；祂活了，給你新的。","body":"如果故事停在十字架，那只是一個好人的悲劇。但第三天，墳墓空了。\n耶穌的復活成就了第二件事：祂不只赦免你的過去，祂還要給你一個全新的生命。舊人有己的生命被釘死了，新人無己的生命賜下來了。\n這是福音最好的消息——你不是被要求「從今以後要努力做好人」，你是被賜下一個新的生命，讓基督住在你裡面活出來。\n不再是我，乃是基督。這不是你更用力，是你換了主人。","verses":[{"ref":"哥林多後書五章17節","text":"若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。"},{"ref":"加拉太書二章20節","text":"我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著。"}]},{"id":"a5","no":"第五幕","title":"讓耶穌作王","key":"祂在門外敲門，門把在你這一邊。","body":"現在只剩一件事：你願不願意讓祂進來，把生命的主權交給祂。\n這不是簽一份合約，是打開一扇門。神不會硬闖，祂在外面敲門，等你自己開。\n信主的意思是：我承認我一直自己作王，我做不好；我相信耶穌為我死、為我復活；從今天起，我請祂進來，讓祂作王。\n這一步不需要你先變好，只需要你願意。願意的人，就可以白白取生命的水喝。","verses":[{"ref":"啟示錄三章20節","text":"看哪，我站在門外叩門，若有聽見我聲音就開門的，我要進到他那裡去，我與他，他與我一同坐席。"},{"ref":"羅馬書十章9節","text":"你若口裡認耶穌為主，心裡信神叫他從死裡復活，就必得救。"}]}],"scripts":[{"id":"s3","title":"三分鐘電梯版","duration":"約 3 分鐘","hint":"適合等車、排隊、飯後閒聊的空檔。目標不是講完，是讓他想再聽。","lines":["我用三分鐘跟你講一件對我最重要的事，好不好？講完你當笑話聽也沒關係。","聖經說，人本來是神照著自己的形像造的，人跟神原本是很近的。所以我們心裡總覺得少一塊，其實不是我們有毛病。","後來出問題了。問題不是從殺人放火開始，是從一個念頭開始的——「我要自己作主」。聖經把這個叫做罪的根，我們稱它「有己」：凡事以自己為中心，想要代替神。","你想想看，我們一生的煩惱，是不是大半都出在這裡？想控制、想贏、想被看見。","神的解決辦法不是給我們一本規矩。祂自己來了。耶穌被釘在十字架上，替我們承擔了這一切；第三天祂復活了，為的是把一個全新的生命賜給我們。","所以信耶穌不是變得更會守規矩，是換一個生命，讓祂在我裡面作王。","祂現在就站在你心門外敲門，門把在你這邊。哪一天你願意開，隨時可以告訴我，我陪你。"]},{"id":"s15","title":"十五分鐘完整版","duration":"約 15 分鐘","hint":"適合坐下來好好談一次。每一幕講完停一下，問他：「聽到這裡，你有什麼想法？」","lines":["【開場】我想跟你分享一個故事，這個故事有五幕。你隨時可以打斷我、隨時可以問。","【第一幕　美好的起初】聖經第一句話是「起初，神創造天地」。祂造了萬物，最後照著自己的形像造了人。那時候人跟神之間沒有隔閡，人不需要證明什麼，因為他知道自己是被愛的。所以我們心裡那個「總覺得少了什麼」的空，不是缺陷，是原廠設定——我們本來就是為一位神造的。","【停一下】你有沒有過那種感覺？什麼都有了，還是覺得空？","【第二幕　有己的墮落】問題怎麼開始的？蛇對人說：「你們便如神能知道善惡。」人吃那果子不是因為餓，是因為想坐上神的位子。這就是驕傲——離開人的本位，抓住神的權力。聖經稱它為罪，我們叫它「有己」：凡事以自己為中心，自己要作主作王。有己一進來，四道裂縫就出現了：人與神隔絕、人與自己不和、人與人互相傷害、人與世界失序。","【停一下】你覺得，人最大的問題是行為不好，還是裡面那個「我要自己作主」？","【第三幕　十架的救贖】神沒有放手不管。祂自己來了。耶穌成為一個真實的人，最後被釘在十字架上。祂承擔的不只是我們做過的錯事，更是我們裡面那個要作主的本性。這是一場交換：祂受該我們受的，我們得該祂得的。","【第四幕　復活的新生命】如果故事停在這裡，只是一個好人的悲劇。但第三天，墳墓空了。復活成就了第二件事——祂不只赦免你的過去，祂要給你一個全新的生命。舊人有己的生命被釘死了，新人無己的生命賜下來。保羅說：現在活著的不再是我，乃是基督在我裡面活著。","【停一下】如果不是靠你更努力，而是有一個新生命被賜下來，這對你有沒有吸引力？","【第五幕　讓耶穌作王】現在只剩一件事：你願不願意讓祂進來作王。祂不會硬闖，祂在門外敲門。信主不是先變好才能來，是願意就可以來。","【誠實說明】我也要老實告訴你：信主不保證從此順利，有時候家人還會反對。但你會多一位永不離開的同伴，而且你的生命會真的開始不一樣。","【邀請】所以我想問你一句話——你願意現在就接受祂嗎？"]},{"id":"sc","title":"一杯咖啡的深談版","duration":"約 40 分鐘","hint":"適合已經有信任基礎、他也開始問問題的階段。原則是：他講的時間要比你多。","lines":["【先聽，不先講】今天我不急著講什麼，我想先聽你說。可以跟我說說，你這一路走來，最辛苦的是哪一段嗎？","【接住他】（他說的時候不要急著給答案，也不要急著轉入信仰。真的聽完，並且回應他的感受。）","【切入】謝謝你願意跟我說這些。其實我以前也有一段很類似的日子，我想跟你說說那時候發生在我身上的事。","【個人見證】（在這裡插入你自己的三分鐘見證：信主前的我／遇見主的關鍵／現在的改變。）","【第一幕】我後來才明白，人心裡那個填不滿的空，是有來歷的。聖經說人是照著神的形像造的，我們本來就是為一位神造的。","【第二幕】而我們的問題也有一個很準確的診斷。不是「你做了什麼壞事」，是「我要自己作主」。聖經稱它為罪，這個「有己」把人跟神隔開，也把人跟人隔開。我自己就是最好的例子——（舉一個你自己想控制、想贏的真實例子）。","【第三幕】神的辦法不是要我改進，是祂親自來替我死。十字架上，祂處理的不只是我做過的錯事，是我這個人的老我。","【第四幕】而祂復活了。這一點對我最關鍵——因為我試過靠自己變好，我做不到。祂復活是要把祂的生命給我，讓基督在我裡面活。","【第五幕】所以現在祂站在你的門外敲門。祂不會闖進來，祂等你開。","【誠實說明代價】我不想騙你說信了就一路順風。可能有人不理解你，有些習慣要慢慢改。但我可以跟你保證兩件事：你不再是一個人，而且你會親眼看見自己變得不一樣。","【明確邀請】我想正式地問你一次：你願意現在把生命的主權交給耶穌嗎？如果願意，我可以帶你做一個很簡單的禱告。","【若他說還沒準備好】完全沒關係，我等你。我會繼續為你禱告，我們照樣是朋友。"]}],"decision":{"title":"決志禱告","intro":"不用背，也不用講得好聽。跟著念，或用自己的話說都可以。神聽的是心。","text":"親愛的主耶穌：\n我來到你面前。\n我承認我這一生都是自己作主、自己作王，凡事以自己為中心，我做不好，我也累了。\n我相信你為我死在十字架上，擔當了我的罪；我相信你第三天從死裡復活，為要賜給我新的生命。\n現在，我打開我的心門，請你進來。\n我願意讓你作我生命的主，讓你在我裡面作王。\n求你赦免我，潔淨我，用你的生命住在我裡面。\n從今天起，我不再一個人走了。\n奉主耶穌基督的名禱告，阿們。","after":["立刻約好下一次見面的時間（越快越好，48 小時內最好）。","把今天的日期記下來，這是他的屬靈生日。","為他做一個簡短的祝福禱告，然後恭喜他。","在 App 裡按下「決志登錄」，系統會自動排好初信三十天的陪伴提醒。"]},"cost":{"title":"信主之後會怎樣：福分與代價都要說","blessings":["罪得赦免，與神和好，不再需要靠表現換取被愛。","有一位永不離開的同在，最難的時候也不再一個人。","得著新的生命，那些你戒不掉的，開始鬆動。","進入一個屬靈的家，有一群人真心記念你。","有永恆的盼望，死亡不再是句點。"],"costs":["可能有家人不理解，甚至反對，需要時間與智慧。","有些習慣、有些場合，你會漸漸不想再去。","苦難不會消失，只是你不再獨自面對。","需要委身：讀經、禱告、聚會，都要花時間。","會被要求誠實面對自己，那有時候很不舒服。"]},"icebreakers":[{"id":"i1","cat":"生活","q":"你最近有沒有一件事，是想起來就覺得撐得很累的？"},{"id":"i2","cat":"生活","q":"如果可以放下所有責任一個月，你最想做什麼？"},{"id":"i3","cat":"生活","q":"你這幾年最大的改變是什麼？"},{"id":"i4","cat":"家庭","q":"你跟家裡的關係，這幾年是變近了還是變遠了？"},{"id":"i5","cat":"家庭","q":"你小時候家裡最重視什麼？"},{"id":"i6","cat":"家庭","q":"你最希望孩子將來成為怎樣的人？"},{"id":"i7","cat":"意義","q":"你覺得什麼樣的人生算是「值得」？"},{"id":"i8","cat":"意義","q":"如果只剩一年，你會怎麼過？"},{"id":"i9","cat":"意義","q":"有沒有什麼事，是你一直想做卻沒去做的？"},{"id":"i10","cat":"意義","q":"你覺得人死了以後會怎樣？"},{"id":"i11","cat":"情緒","q":"最近有沒有什麼事讓你睡不好？"},{"id":"i12","cat":"情緒","q":"難過的時候，你通常會找誰？"},{"id":"i13","cat":"情緒","q":"你什麼時候會覺得自己最平靜？"},{"id":"i14","cat":"信仰","q":"你們家有拜拜的習慣嗎？通常是誰在張羅？"},{"id":"i15","cat":"信仰","q":"你對宗教的印象是什麼？好的壞的都可以說。"},{"id":"i16","cat":"信仰","q":"有沒有哪一次，你覺得好像有什麼在保守你？"},{"id":"i17","cat":"信仰","q":"你有沒有被哪個宗教的人傷過？"},{"id":"i18","cat":"信仰","q":"如果真的有神，你最想問祂什麼？"},{"id":"i19","cat":"邀請","q":"我最近在讀一本書，裡面有一段我很想聽聽你的看法，可以嗎？"},{"id":"i20","cat":"邀請","q":"我可以為你這件事禱告嗎？不用你信，就當我掛念你。"}]}</script>
<script type="application/json" id="d-lessons">{"version":"1.0","tracks":[{"id":"seeker","name":"慕道班八課","subtitle":"決志前後　認識神、認識自己、認識救恩","color":"#1B4B7A","lessons":[{"id":"s1","no":"第一課","title":"有一位神","verse":{"ref":"羅馬書一章20節","text":"自從造天地以來，神的永能和神性是明明可知的，雖是眼不能見，但藉著所造之物就可以曉得，叫人無可推諉。"},"info":"我們從三個地方認得出神：一是萬物的秩序——四季有時、細胞精密，這不像隨手打翻的顏料；二是人心裡那把尺——沒有人教你，你就知道背叛是不對的；三是心裡那個填不滿的空——你什麼都有了，還是覺得少一塊。\n聖經沒有花力氣證明神存在，它第一句就說：「起初，神創造天地。」因為神不是一個等著被證明的假設，祂是一切的前提。而祂不只是有能力，祂還有性情：祂是有位格的，會說話、會心疼、會等候。","reflect":"安靜三分鐘，回想你人生中有沒有哪一刻，你覺得「這件事好像不只是巧合」。求聖靈提醒你。","respond":"如果真的有一位神，而且祂認得我的名字，這對我今天的生活會有什麼不同？","practice":["第一天：走到戶外，抬頭看天空三分鐘，說一句「如果祢在，請讓我認識祢」。","第二天：寫下三件你覺得「不可能是偶然」的事。","第三天：讀創世記第一章。","第四天：留意今天有沒有哪件小事讓你想到神。","第五天：問一位基督徒朋友：你是怎麼開始相信有神的？","第六天：試著用自己的話禱告一分鐘。","第七天：回顧這一週，寫下一句話。"],"tip":"陪伴者提示：這一課不要急著辯論。你的任務是聽他說他心裡的疑問，然後告訴他「這個問題很好，我也問過」。人比道理重要。"},{"id":"s2","no":"第二課","title":"人的真問題","verse":{"ref":"創世記三章5節","text":"你們吃的日子眼睛就明亮了，你們便如神能知道善惡。"},"info":"多數人以為信仰要處理的是「行為」——少說謊、多做好事。但聖經的診斷更深：問題出在根，不在果。\n人的根本問題是「有己」——凡事以自己為中心，自己要作主作王，想要代替神。這就是驕傲：離開人的本位，抓住神的權力。亞當夏娃吃那果子不是為了吃飽，是為了「如神能知道善惡」。\n有己一進來，四道裂縫立刻出現：人與神隔絕、人與自己不和、人與人互相傷害、人與環境失序。你我一生的煩惱，幾乎都能在這四道裂縫裡找到出處。\n所以福音真正的問題不是「你做過什麼壞事」，而是「你這一生，究竟是誰在作王」。","reflect":"求聖靈讓你看見一件具體的事——最近哪一次，你其實是在爭「我要作主」？","respond":"承認「我一直在自己作王」對我來說難不難？難在哪裡？","practice":["第一天：寫下最近一次你生氣的事，問自己：我當時想控制什麼？","第二天：讀創世記第三章。","第三天：一整天觀察自己說「我覺得」「我認為」的次數。","第四天：對一個人讓步一次，練習不爭。","第五天：跟神說：我承認我一直想自己作主。","第六天：讀羅馬書七章15至25節。","第七天：寫下一句話：我最想交出來的是什麼。"],"tip":"陪伴者提示：這一課是整套福音的關鍵。不要用「你有罪」開場，用「你是不是也常常想自己作主」開場。多數人會安靜下來，因為那正是他一生的寫照。"},{"id":"s3","no":"第三課","title":"耶穌是誰","verse":{"ref":"約翰福音一章14節","text":"道成了肉身，住在我們中間，充充滿滿的有恩典有真理。"},"info":"耶穌不是一個宗教創辦人。祂是一個歷史人物，有確切的年代、地點與見證人。祂做了三件沒有人敢做的事：祂赦免人的罪，祂接受人的敬拜，祂說「我就是道路、真理、生命」。\n面對這樣的宣告，只有三種可能：祂是騙子，祂是瘋子，或者祂真的是主。祂的品格與生命讓前兩種說不通——一個騙子不會為謊言被釘死，一個瘋子不會講出登山寶訓。\n而祂的死與復活有堅實的歷史支撐：空墳墓、五百多位見證人、門徒從逃跑變成殉道。沒有人會為自己知道是假的事去死。","reflect":"求聖靈幫助你，把耶穌當成一個真實的人來認識，而不是一個名詞。","respond":"在騙子、瘋子、主這三個選項裡，我目前傾向哪一個？為什麼？","practice":["第一天：讀馬可福音第一章。","第二天：讀馬可福音第二章，注意祂怎麼對待被排擠的人。","第三天：讀約翰福音第八章1至11節。","第四天：寫下耶穌哪一點最吸引你。","第五天：讀路加福音二十三章。","第六天：讀路加福音二十四章。","第七天：對祂說一句話，隨便什麼都好。"],"tip":"陪伴者提示：不要急著講教義，帶他讀福音書。讓他自己遇見耶穌，比你替耶穌介紹自己有力量得多。"},{"id":"s4","no":"第四課","title":"白白的救恩","verse":{"ref":"以弗所書二章8至9節","text":"你們得救是本乎恩，也因著信；這並不是出於自己，乃是神所賜的；也不是出於行為，免得有人自誇。"},"info":"全世界的宗教都在教人怎麼爬上去見神，只有福音說：神自己走下來找人。\n救恩有兩面：耶穌的死，解決我們的罪性和罪行；耶穌的復活，賜給我們新生命。前者是赦免，後者是重生。若只有赦免，你仍然帶著老我；有了新生命，才是真正的好消息。\n這一切是白白的。不是你先變好祂才收你，是祂先收了你，你才變得好。你唯一要做的，是伸手接。\n所以基督徒不是比較好的人，是知道自己得了恩典的人。","reflect":"求聖靈讓你分辨：我心裡是不是還想「先做到什麼」才敢來？","respond":"「白白得著」這件事，我心裡最難相信的部分是什麼？","practice":["第一天：讀以弗所書二章1至10節。","第二天：寫下你覺得自己「不夠格」的那件事，然後在旁邊寫「恩典」。","第三天：讀路加福音十五章11至24節（浪子）。","第四天：對神說：我不靠自己了。","第五天：讀羅馬書五章1至11節。","第六天：對一個人施予一次不求回報的善意。","第七天：寫下一句感謝。"],"tip":"陪伴者提示：華人最難的一關就是「白白」。多數人寧可付代價也不願欠人情。允許他問「真的不用做什麼嗎」，並且一次一次地說：真的不用。"},{"id":"s5","no":"第五課","title":"如何禱告","verse":{"ref":"馬太福音六章6節","text":"你禱告的時候，要進你的內屋，關上門，禱告你在暗中的父；你父在暗中察看，必然報答你。"},"info":"禱告不是儀式，不是交易，也不是背誦。禱告就是跟父親說話。\n所以不必文謅謅，不必跪很久，也不必先想好措辭。你可以在開車時、洗碗時、睡前跟祂說。\n一個簡單的架構：先感謝（今天有什麼可以謝的）、再認罪（有什麼我知道不對的）、然後代求（為別人求）、最後才是自己的需要。這個次序會慢慢把你從自我中心裡帶出來。\n禱告最重要的不是說什麼，是「知道有人在聽」。而神的回答有三種：好、等一等、我有更好的。沒有一種是不理你。","reflect":"求聖靈幫助你，把禱告從「功課」變成「說話」。","respond":"我最想跟神說的第一句話是什麼？","practice":["第一天：用一分鐘，只講感謝。","第二天：用一分鐘，說一件你做錯的事。","第三天：為一個你在乎的人禱告。","第四天：為一個你不喜歡的人禱告。","第五天：讀主禱文（馬太福音六章9至13節），慢慢念三遍。","第六天：安靜三分鐘，什麼都不說，只是坐著。","第七天：寫下這一週神有沒有回應你什麼。"],"tip":"陪伴者提示：第一次帶他禱告時，你先開口，讓他跟著。很多人不禱告只是因為不好意思開口，不是不想。"},{"id":"s6","no":"第六課","title":"如何讀經","verse":{"ref":"詩篇一百一十九篇105節","text":"你的話是我腳前的燈，是我路上的光。"},"info":"聖經是我的準則。它不是一本道德教科書，是神的自我介紹。\n讀經的建議：新朋友從約翰福音或路加福音開始，不要從創世記一路啃。每天一小段，讀不懂的先跳過，讀得懂的先照著做。\n一個好用的方法（三個問題）：這段話講神是怎樣的一位神？講人是怎樣的？今天我要做什麼？\n讀經不求快，求「有一句話進到心裡」。一節經文被你活出來，勝過一章被你讀過去。","reflect":"求聖靈在你讀的時候親自開你的眼睛，不然字就只是字。","respond":"我打算每天什麼時間讀？讀多久？（訂一個小到你一定做得到的量）","practice":["第一天：讀約翰福音第一章1至18節。","第二天：讀約翰福音第三章1至21節。","第三天：讀約翰福音第四章1至26節。","第四天：挑一節你最有感覺的，抄下來。","第五天：讀詩篇二十三篇。","第六天：把那節經文傳給一個朋友。","第七天：回顧這一週哪一句最觸動你。"],"tip":"陪伴者提示：送他一本實體聖經，並且陪他讀第一次。翻不到書卷是很多人放棄的原因，這件小事你要幫他解決。"},{"id":"s7","no":"第七課","title":"教會是什麼","verse":{"ref":"哥林多前書十二章27節","text":"你們就是基督的身子，並且各自作肢體。"},"info":"教會不是建築物，是一群被神呼召出來的人；不是一個組織，是一個家，是基督的身體。\n所以「去教會」這個講法其實不準確——你不是去一個地方，你是進入一群人。也因此，教會一定有缺點，因為有人的地方就有問題。但那正是我們需要彼此的原因。\n在教會裡你會找到三種關係：屬靈同伴（彼此扶持的同輩）、屬靈父母與兒女（生命的傳承）、屬靈戰友（一起服事的團隊）。這就是 235 的體系。\n一根柴自己燒，很快就滅；放進火堆裡，能燒很久。","reflect":"求聖靈除去你對教會的成見，也求祂醫治你曾受過的傷。","respond":"我對教會最大的擔心是什麼？","practice":["第一天：認識一位新的弟兄姊妹，記住他的名字。","第二天：讀使徒行傳二章42至47節。","第三天：問一個人：你為什麼留在這間教會？","第四天：參加一次小組或聚會。","第五天：主動幫忙一件小事。","第六天：為教會的一位同工禱告。","第七天：寫下你在這裡遇到的三個人的名字。"],"tip":"陪伴者提示：這一課的作業比課文重要——務必在六週內幫他認識三位弟兄姊妹。一個人若六週內沒交到三個朋友，流失的機率極高。"},{"id":"s8","no":"第八課","title":"受洗的意義","verse":{"ref":"羅馬書六章4節","text":"所以，我們藉著洗禮歸入死，和他一同埋葬，原是叫我們一舉一動有新生的樣式，像基督藉著父的榮耀從死裡復活一樣。"},"info":"受洗不是入會儀式，是一場公開的葬禮與一場公開的生日。入水，表示舊人有己的生命與基督同死；出水，表示新人無己的生命與基督同活。\n受洗不能使人得救，是信心使人得救；但受洗是信心的公開表明，是主自己的吩咐。悄悄地信可以開始，公開地認才長得大。\n受洗前要準備的：一份簡短的見證（信主前、關鍵時刻、現在的改變），以及跟家人的溝通。受洗後要記得：這是起點不是終點，接下來才是一對一被建造的開始。","reflect":"求聖靈給你勇氣，也給你合適的時機。","respond":"我準備好公開承認自己是基督徒了嗎？如果還沒，是什麼攔阻我？","practice":["第一天：讀馬太福音二十八章18至20節。","第二天：寫下「信主前的我」三句話。","第三天：寫下「遇見主的關鍵」三句話。","第四天：寫下「現在的改變」三句話。","第五天：把這份見證念給陪伴你的人聽。","第六天：跟家人談一次（先禱告再談）。","第七天：跟牧者或陪伴者約時間，談受洗。"],"tip":"陪伴者提示：受洗那天務必出席，並且拍照留念。多年以後，那張照片會是他信心動搖時的錨。"}]},{"id":"disciple","name":"門訓十二課","subtitle":"受洗後　四層關係的建造","color":"#2E7D5B","lessons":[{"id":"d1","no":"第一課","title":"每日與主同行","layer":"與神的關係","summary":"建立每天固定的靈修節奏：讀經、禱告、記錄。生命的次序是先生命、再關係、後事工。","verse":{"ref":"約翰福音十五章5節","text":"我是葡萄樹，你們是枝子。常在我裡面的，我也常在他裡面，這人就多結果子；因為離了我，你們就不能做甚麼。"},"info":"靈修不是一份要交的功課，是一場天天的約會。功課會讓人有罪惡感，約會讓人有期待感。主耶穌說：「離了我，你們就不能做甚麼。」注意祂沒有說「你們會做得比較差」，是說「不能做甚麼」——枝子離開葡萄樹，不是結果少一點，是三天就枯了。\n實際的節奏很簡單，三件事：讀、禱、記。讀，一天一小段，不貪多，讀完問一句「這裡讓我看見神是怎樣的一位神？」；禱，把讀到的直接跟祂說，不必用宗教的語言；記，一行就好，記下今天神對你說的一句話。這一行字，一年之後會變成三百多句你與神之間的私房話。\n次序是先生命、再關係、後事工。許多人服事到乾涸，不是因為做太多，是因為沒有先與主同行就衝出去。水管沒接上水源，再粗也只是空的。","reflect":"安靜三分鐘，問聖靈：這一週，我心裡最忙、最吵的是什麼？求祂讓你看見，你的枯乾是從哪一天離開葡萄樹開始的。","respond":"我要每天與主約會，不是為了作好基督徒，是因為我離了祂就不能做甚麼。","practice":["第一至七天：固定一個時段（建議早晨），十五分鐘，手機放在看不見的地方。","讀：約翰福音第一至七章，一天一章。讀完寫下一句「今天我看見的耶穌」。","禱：用讀到的經文向神說話，最後為你的一位「2」禱告一分鐘。","記：準備一本小本子或用 App 的靈修紀錄，一天只寫一行。","第七天回顧：這七天哪一天最難？是什麼攔阻了你？"],"tip":"陪伴者提示：不要一開始就要求三十分鐘。先幫他建立「天天有」，再談「時間長」。頭兩週每隔一天問他一句「今天讀到哪裡？」比講十次道理有用。"},{"id":"d2","no":"第二課","title":"認識聖靈的引導","layer":"與神的關係","summary":"聖靈是我的引導。用心靠聖靈，不要用腦靠自己；用心就開心，用腦就煩惱。","verse":{"ref":"約翰福音十六章13節","text":"只等真理的聖靈來了，他要引導你們明白一切的真理。"},"info":"主耶穌說：「只等真理的聖靈來了，他要引導你們明白一切的真理。」聖靈不是一種感覺，也不是一股力量，祂是一位有位格的神，住在我們裡面。祂會引導、會提醒、會責備、會安慰，也會擔憂。\n聖靈住在心中，不住在腦中。所以我們的習慣要調整過來：用心靠聖靈，不要用腦靠自己；用心就開心，用腦就煩惱。用腦的人一直在算：這樣做划不划算、別人會怎麼看、萬一失敗怎麼辦——算到最後動彈不得。用心的人問的是：主，祢要我怎麼做？然後就去做。\n怎麼分辨是聖靈的引導，還是自己的念頭？四把尺可以量：一、合不合聖經（聖靈絕不引導人違背祂自己寫的話）；二、是不是把榮耀歸給耶穌（聖靈不會高舉你）；三、心裡是平安還是催逼（神給的是催促中的平安，撒但給的是慌張中的急迫）；四、有沒有屬靈同伴的印證（重大的事，讓身邊敬虔的人一同尋求）。\n一生的果效是從心發出。所以每天要作的第一件事，是把心打開，說：聖靈，今天請祢引導我。","reflect":"回想最近一次你「心裡有一個聲音」但你沒有理它。安靜下來問聖靈：那是祢嗎？如果是，祢現在還要我去做嗎？","respond":"我要學習用心不用腦，凡事先問聖靈，而不是先算後果。","practice":["第一至七天：每天早晨起床先說一句：「聖靈，今天求祢引導我。」","當天若心裡有一個感動（打一通電話、道一次歉、幫一個忙），十二小時內去做，不拖過夜。","晚上記下：今天我照著感動做了什麼？結果如何？","讀：約翰福音十四至十六章，圈出所有關於聖靈的應許。","用四把尺檢視一件你目前正在猶豫的事。"],"tip":"陪伴者提示：初信者最怕「我聽不到神的聲音」。要告訴他：神的引導多半不是雷聲，是一個安靜卻不肯走開的念頭。先從小事順服，聽力就會長大。"},{"id":"d3","no":"第三課","title":"以耶穌為榜樣","layer":"與神的關係","summary":"耶穌是我的榜樣。焦點在耶穌，不在自己、不在別人、不在環境。","verse":{"ref":"腓立比書二章5節","text":"你們當以基督耶穌的心為心。"},"info":"「你們當以基督耶穌的心為心。」保羅接著描寫的，是一條向下的路：祂本有神的形像，卻虛己、取了奴僕的形像、存心順服以至於死。這是耶穌的樣式——不是往上爬，是往下走；不是抓住權力，是放下權力。\n以耶穌為榜樣，最實際的操練是「換焦點」。我們一天的情緒起伏，多半來自三個錯誤的焦點：看自己（我表現得好不好、我有沒有面子）、看別人（他為什麼那樣說我）、看環境（怎麼又出事了）。焦點在哪裡，情緒就在哪裡。焦點在耶穌，不在自己、不在別人、不在環境——耶穌是一切的焦點。\n學耶穌不是模仿祂的動作，是讓祂的生命在我裡面活出來。你不必咬牙去愛那個難愛的人，你要作的是把自己讓開，讓住在你裡面的那一位去愛他。這就是為什麼下一課要談無己：沒有無己，效法基督只會變成疲倦的表演。","reflect":"問聖靈：這一週，我的焦點最常落在哪裡？是自己的面子、別人的評價，還是難處的環境？","respond":"我要把焦點從自己、別人、環境挪回耶穌身上，因為祂是一切的焦點。","practice":["讀：腓立比書二章1至11節，一天讀一次，連讀七天。","每天挑一件讓你不舒服的事，問自己：「如果是耶穌，祂會怎麼作？」然後照著作一次。","操練「往下走」：這週主動作一件沒有人看見、也沒有人會謝謝你的服事。","當情緒上來時，停三秒，說一句：「主，我把焦點交還給祢。」","第七天：寫下這一週你最像耶穌的一刻，把榮耀歸給祂。"],"tip":"陪伴者提示：不要把這課講成道德要求。重點在「換焦點」，不在「更努力」。他若開始說「我做不到」，那是好消息——他快要進入第五課了。"},{"id":"d4","no":"第四課","title":"舊人與新人","layer":"與自己的關係","summary":"舊人有己的生命，變成新人無己的生命。這是一次成就、一生經歷的功課。","verse":{"ref":"以弗所書四章22至24節","text":"就要脫去你們從前行為上的舊人……又要將你們的心志改換一新，並且穿上新人。"},"info":"「就要脫去你們從前行為上的舊人……又要將你們的心志改換一新，並且穿上新人。」脫、換、穿——三個動作，說明得救不是換一套衣服的外表工程，是換一個人。\n舊人的特徵只有一個字：己。以自己為中心，自己要作主作王，想要代替神。這不是某些壞人的問題，是全人類共同的病根。亞當夏娃吃分別善惡樹的果子，不是嘴饞，是想「如神能知道善惡」——想自己當那個定義對錯的人。所以罪的根源不是行為，是有己；問題的根源不是別人，是驕傲。\n新人的特徵也是一個字：無。無己，讓耶穌在裡面活。這個新生命，是耶穌復活的時候就已經賜給你的，是既成的事實，不是要靠努力賺來的資格。\n但這裡有一個張力：地位上，你已經是新人了；經歷上，舊人的習慣還會跳出來。所以保羅說要「天天」脫去。這不是懷疑你的得救，是描述你的成長。一次成就，一生經歷——你不是在爭取新生命，你是在學習照著已經有的新生命而活。","reflect":"求聖靈指出一個你最熟悉的「舊人反應」——那個一被踩到就自動跳出來的反應。不要辯解，只要看見。","respond":"我已經是新人了。我不是靠努力變好，我是學習照著已經有的新生命而活。","practice":["讀：以弗所書四章17至32節、歌羅西書三章1至17節。","畫一張兩欄表：左欄寫「我的舊人反應」，右欄寫「新人可以怎麼反應」。","每天挑右欄的一項，實際作一次。","當舊人跳出來時，不要自責，只說：「這是舊人，不是我了。主，求祢活出來。」","第七天：把這張表拿給你的屬靈同伴看，請他為你禱告。"],"tip":"陪伴者提示：這一課最容易變成自我控訴。要一再強調：看見舊人不是失敗的證據，是聖靈動工的證據。瞎子看不見自己髒。"},{"id":"d5","no":"第五課","title":"從有己到無己","layer":"與自己的關係","summary":"無己不是沒有，乃是進入無限、活出無限。無己讓耶穌在裡面活。","verse":{"ref":"加拉太書二章20節","text":"現在活著的不再是我，乃是基督在我裡面活著。"},"info":"「我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著。」這節經文是整個門訓的心臟。保羅沒有說「我努力學基督」，他說「不再是我」。\n很多人一聽「無己」就害怕：那我不就沒有了嗎？剛好相反。無己不是沒有，乃是進入無限、活出無限。一滴水單獨存在，太陽一曬就乾了；一滴水回到大海，它就有了大海的浩瀚。無己不是消滅你，是把那個又小又擠的「己」，換成基督無限的生命。\n無己有五個果效，值得背下來：無己才能讓耶穌作王；無己才能被聖靈引導；無己才能合一；無己才能得勝；無己才能建立屬神的體系。反過來說，我們一切的卡關——關係破裂、事工爭競、禱告無力——追到底幾乎都是同一個原因：己還在王位上。\n捨己是動作，無己是狀態。捨己是背起自己的十字架，為耶穌、為別人、不為自己；無己是那個十字架背久了之後，你發現裡面活著的真的不再是你。","reflect":"安靜下來，問聖靈：我裡面還有哪一塊地方，是我死不肯交出去的？不必立刻交，先誠實承認。","respond":"無己不是我失去，是我進入基督的無限。我今天要把王位交還給祂。","practice":["讀：加拉太書二章20節，背下來，一天默想一次。","每天早晨作一次交託禱告：把時間、金錢、關係、名聲、未來，一樣一樣點名交給主。","這週遇到一次「我明明有理」的場合，選擇不爭，把它獻上。","記下：當我不爭的時候，我心裡發生了什麼？","第七天：寫下一段「我要交出去的清單」，日期簽上。"],"tip":"陪伴者提示：不要用「你要無己」來壓人，那反而是律法。要幫他看見無己的甘甜——被基督愛到不必再證明自己，那是何等的釋放。"},{"id":"d6","no":"第六課","title":"謙卑戰勝驕傲","layer":"與自己的關係","summary":"驕傲是離開本位抓住權力；謙卑是放下權力回到本位。讓人作人，讓神作神。","verse":{"ref":"雅各書四章6節","text":"神阻擋驕傲的人，賜恩給謙卑的人。"},"info":"「神阻擋驕傲的人，賜恩給謙卑的人。」這節經文把屬靈爭戰的勝負講得非常直白：一邊是神親自阻擋，一邊是神主動施恩。同一位神，兩種完全相反的態度，差別只在謙卑或驕傲。\n什麼是驕傲？驕傲是離開本位，抓住權力——離開人的本位，抓住神的權力，想要代替神。所以驕傲不一定是趾高氣揚，一個天天焦慮、什麼都要掌控、放不下心的人，也是驕傲的一種：他在作神。\n什麼是謙卑？謙卑是放下權力，回到本位——回到人的本位，放下神的權力。一句話：讓人作人，讓神作神。\n在人際之間，這條原則帶來一個驚人的果效：驕傲激起驕傲，驕傲對抗驕傲，兩敗俱傷；謙卑帶動謙卑，謙卑對謙卑，達到雙贏。所以在一場衝突裡，先謙卑的那個人不是輸家，是那個把死局解開的人。謙卑是復興的鑰匙——不論是一個家庭的復興，還是一間教會的復興，都從有人肯先低頭開始。","reflect":"求聖靈照出：我的驕傲通常穿著什麼衣服？是強勢、是完美主義、是自卑不肯求助，還是什麼都要管的焦慮？","respond":"我要放下神的權力，回到人的本位。讓人作人，讓神作神。","practice":["讀：雅各書四章1至10節、彼得前書五章5至7節。","這週向一個人道歉——不是「如果我有錯」，是具體說出你錯在哪裡。","每天作一次「放手禱告」：把一件你一直想掌控的事交給神，說：「這件事祢作神，我作人。」","操練接受幫助：主動開口請人幫你一個忙。","記下：先謙卑之後，那段關係發生了什麼變化？"],"tip":"陪伴者提示：這一課要陪伴者先示範。你在他面前承認過自己的失敗嗎？你若不先低頭，他學不會低頭。"},{"id":"d7","no":"第七課","title":"饒恕與和好","layer":"與人的關係","summary":"不饒恕是把自己關在牢裡，卻等別人受苦。饒恕是先放自己出來。","verse":{"ref":"以弗所書四章32節","text":"並要以恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。"},"info":"「並要以恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。」饒恕的標準不是對方值不值得，是「正如神饒恕了你們一樣」。\n不饒恕最大的荒謬在於：我們把自己關在牢裡，卻等著別人受苦。你反覆咀嚼那件事，痛的是你的胃；他可能早就忘了。饒恕不是說那件事沒關係，也不是說他沒有錯，更不是要你立刻回到從前的親密。饒恕是一個決定：我不再親手向他討這筆債，我把這筆帳交給神來處理。\n要分清楚兩件事：饒恕是單方面的，你自己可以決定；和好是雙方面的，需要對方的悔改與時間。你可以饒恕一個從未道歉的人，但不必勉強自己立刻與一個仍在傷害你的人恢復親密。饒恕釋放的是你，和好修復的是關係。\n饒恕也常常不是一次完成的。傷害越深，你可能要在神面前把同一件事交出去很多次。每一次交出去，捆綁就鬆一分。這不是失敗，這是醫治的過程。","reflect":"問聖靈：我心裡還關著誰？不必勉強自己有感覺，只要誠實地把那個名字說出來。","respond":"我選擇把討債的權利交還給神。我要先走出這座牢。","practice":["寫下那個人的名字與那件事，然後在紙上寫：「我把這筆帳交給神。」","為他禱告七天——不是禱告他遭報，是求神祝福他。第一天會很難，第七天你會發現不一樣。","讀：馬太福音十八章21至35節。問自己：我欠主的那一萬他連得，還記得嗎？","若有需要和好且對方安全，本週約他見一次面。若不安全，先不必勉強。","第七天：把那張紙撕掉或燒掉，作為一個記號。"],"tip":"陪伴者提示：不要催逼他饒恕，尤其是深度創傷。你的角色是陪他把傷口帶到主面前，不是替他決定進度。必要時建議尋求專業協助。"},{"id":"d8","no":"第八課","title":"920 的操練","layer":"與人的關係","summary":"對每一個跟我有關係的人（2），操練無己（0），結出聖靈九個果子（9）。","verse":{"ref":"加拉太書五章22至23節","text":"聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。"},"info":"920 是把靈修落在一個具體的人身上的操練。「9」是聖靈的九個果子：仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。「2」是每一個跟我們有關係的人——你的配偶、你的孩子、你的同事、那位讓你頭痛的鄰居，都是你的2。「0」是無己。\n請注意保羅用的是「果子」不是「果實們」——原文是單數。九樣不是九種可以挑選的才藝，是同一個生命的九個面向。你不能說「我比較擅長喜樂，忍耐就算了」。它們是一整串葡萄，一起長出來。\n更要緊的是：果子是結出來的，不是擰出來的。你若靠自己去擠溫柔，擠三天就翻臉，而且翻得比平常更兇。次序是先0，再9：先無己，讓耶穌在裡面活，果子就從裡面長出來。\n所以每天的操練很具體：今天，對【某某某】，操練【某個果子】。不是抽象地「我要有愛心」，是「今天中午，對我媽，操練忍耐——她再問第三次，我不嘆氣。」傳福音最真實的預工就在這裡：人要先看見基督的生命，才聽得進基督的道理。","reflect":"求聖靈指定一個人和一個果子。通常祂指的那一個，正是你最不想面對的那一個。","respond":"我不要擰出果子，我要無己，讓基督在我裡面結出果子。","practice":["每天早上寫一句：「今天，對【　　】，操練【　　】。」","晚上寫一行回顧：今天做到了嗎？發生了什麼？（一行就好，不寫檢討報告）","讀：加拉太書五章16至26節。","其中一天，選你最難相處的那位2。","第七天：回顧七天的紀錄，看看哪一個果子對你最難，把它帶到禱告中。"],"tip":"陪伴者提示：這是全課程最容易落地、也最容易放棄的一課。頭兩週每天傳一句提醒給他，幫他把習慣建立起來，之後就會自己跑了。"},{"id":"d9","no":"第九課","title":"建立 235 的關係","layer":"與人的關係","summary":"2 是屬靈同伴，3 是屬靈父母與兒女，5 是五重職份的團隊。體系從關係長出來。","verse":{"ref":"傳道書四章12節","text":"有人攻勝孤身一人，若有二人便能敵擋他；三股合成的繩子不容易折斷。"},"info":"「有兩人便能抵擋一人。三股合成的繩子不容易折斷。」屬靈生命不是單打獨鬥的競技，是編織成繩的工程。235 就是這條繩子的三股。\n2 是屬靈同伴：同輩、平行的關係，彼此扶持、彼此問責。同伴不是來糾正你的，是來讓你不必假裝的。有一個人知道你真實的光景，你就很難假冒偽善。\n3 是屬靈父母與屬靈兒女：上下傳承的關係。屬靈父母不是屬靈上司——父母的目標是有一天孩子不再需要他，上司的目標是有更多人聽他的。這是分辨的關鍵。\n5 是屬靈戰友：五重職份的團隊，使徒、先知、傳福音的、牧師、教師。每個人的恩賜不同，配搭起來才能成全聖徒、各盡其職、建立基督的身體。\n這三種關係都有一個共同的入場券：無己。有己的人建立不了體系，因為他總在比較誰比較重要。無己才能合一，無己才能建立屬神的體系。你今天缺哪一股？多半就是主要你去主動建立的那一股。","reflect":"問聖靈：我的2是誰？我的3在哪裡？我在哪一個5的團隊裡？哪一股是空的？","respond":"我不再單打獨鬥。我要主動去建立那條三股的繩子。","practice":["列出：我現在的屬靈同伴（2）、屬靈父母與屬靈兒女（3）、所屬的團隊（5）。","若缺同伴，本週主動邀請一位弟兄姊妹，約定每週互相問責一次。","問責五題：這週你與主如何？你有沒有隱藏的罪？你為誰禱告了？你關心了誰？你需要什麼幫助？","為你的屬靈父母寫一段感謝的話，傳給他。","讀：以弗所書四章11至16節。"],"tip":"陪伴者提示：這一課要具體到名字。不要讓他停在「我知道要有同伴」，要在課堂上就打開通訊錄，當場約好第一次見面的時間。"},{"id":"d10","no":"第十課","title":"金錢、時間與工作","layer":"與事的關係","summary":"人比事重要，關係比東西重要。不要為了事而傷害人，不要為了東西破壞關係。","verse":{"ref":"馬太福音六章33節","text":"你們要先求他的國和他的義，這些東西都要加給你們了。"},"info":"「你們要先求他的國和他的義，這些東西都要加給你們了。」金錢、時間、工作，本身都不是敵人，錯位才是。次序一顛倒，好東西就變成偶像。\n本課只要記住兩句話：人比事重要，關係比東西重要。因此：不要為了事而傷害人，不要為了東西破壞關係。多少家庭為了一筆遺產從此不再往來，多少同工為了一次流程爭執從此不再同工——事情辦成了，人卻散了，那是虧本的生意。\n金錢：你怎麼用錢，就顯出誰在你心裡作王。奉獻的意義不是神缺錢，是我用一個具體的動作宣告：這一切本來就是祢的。\n時間：時間管理的本質是價值排序。當你說「我沒有時間」，多半的真相是「這件事在我的排序裡不夠前面」。誠實一點，反而好調整。\n工作：工作是服事的現場，不是服事的對手。你在職場上的誠實、勤奮與不佔便宜，就是最有力的見證——同事聽你講三十分鐘的福音，不如看你三年不作假帳。","reflect":"求聖靈照出：我最近一次為了事而傷害人，是什麼時候？為了東西而讓關係變冷，又是哪一件？","respond":"人比事重要，關係比東西重要。我要先求神的國，其餘的交給祂加給我。","practice":["檢視上個月的支出，問一句：這些錢說出我心裡誰在作王？","這週安排一次「不為了辦事」的相處——單純陪伴家人，不談正事。","排出你這一季最重要的三件事，把不在其中的事勇敢地說不。","在職場作一件誠實但吃虧的選擇，記下心裡的感受。","讀：馬太福音六章19至34節。"],"tip":"陪伴者提示：談錢容易讓人防衛。先分享你自己的掙扎與失敗，再問他。不要查帳，要同行。"},{"id":"d11","no":"第十一課","title":"恩賜與服事","layer":"與事的關係","summary":"服侍之路：靈、悟、命、侍、神。讓耶穌作王，讓耶穌得著一切的榮耀。","verse":{"ref":"彼得前書四章10節","text":"各人要照所得的恩賜彼此服事，作神百般恩賜的好管家。"},"info":"「各人要照所得的恩賜彼此服事，作神百般恩賜的好管家。」恩賜是託付，不是勳章。管家的意思是：東西不是我的，我只是替主人管。\n服事之路有五個字，是次序也是根基：靈、悟、命、侍、神。靈——聖靈是我的引導，先尋求聖靈的引導與感動；悟——聖經是我的準則，領悟並遵行聖經的真理；命——耶穌是我的榜樣，培養並活出耶穌的生命；侍——讓耶穌作王，靠祂的權柄與能力去服事；神——讓耶穌得著一切的榮耀。\n多數服事的疲乏，是從第四個字直接開始的：跳過靈、悟、命，直接下去作。那是用自己的力氣作神的工，做多久就傷多久。\n還有一個試驗恩賜的簡單方法：這件事作完之後，人的目光是落在你身上，還是落在耶穌身上？若人只記得你多能幹，那不是服事的成功，是服事的危險。一切都是神在耶穌裡所作成的，都是恩典；凡事謝恩，把榮耀歸給耶穌。","reflect":"問聖靈：我目前的服事，是從靈開始的，還是從侍開始的？我在服事中偷偷享受的，是主的喜悅還是人的稱讚？","respond":"我是管家不是主人。我要靠聖靈服事，把一切榮耀歸給耶穌。","practice":["盤點恩賜：問三位認識你的弟兄姊妹「你覺得神給我什麼？」把答案寫下來。","這週的每一次服事前，先安靜兩分鐘禱告，再開始。","作一件無名的服事，不讓任何人知道。","若正在服事中疲乏，寫下原因，帶到你的屬靈父母面前談。","讀：羅馬書十二章1至8節、哥林多前書十二章。"],"tip":"陪伴者提示：留意他是不是在用服事換取價值感。要幫他分清楚：他被愛，不是因為他有用。這一分辨若不處理，服事早晚會壓垮他。"},{"id":"d12","no":"第十二課","title":"成為屬靈父母","layer":"與事的關係","summary":"結業的標準不是上完了，是教過別人了。保羅、提摩太、忠心的人、別人——四代才叫體系。","verse":{"ref":"提摩太後書二章2節","text":"你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人。"},"info":"「你在許多見證人面前聽見我所教訓的，也要交託那忠心能教導別人的人。」這一節經文裡有四代：保羅、提摩太、忠心的人、別人。四代之後，才叫作體系。\n這是整個門訓的終點，也是新的起點。我們常常只作到第二代——帶人信主，然後就停了。結果是加法的增長，不是乘法的繁殖。一百個信徒各自帶一個人，是兩百；但若每一個被帶的人都學會帶人，四代之後就是一片森林。\n所以結業的標準不是「上完了」，是「教過別人了」。這一條規則，會從根本上改變一間教會的體質——因為它把每一個坐著聽的人，換成一個站起來帶的人。\n你可能會說：我還不夠好。屬靈父母不是完美的人，是走在前面一步的人。你不必是博士，只要比他早走一里路，你就有東西可以交給他。而且教別人的時候，你自己會學得最多。\n現在，寫下第一個名字吧。那個一直在你心裡、你卻遲遲沒有開口的名字。","reflect":"安靜下來，求聖靈把一個名字放在你心裡——不是你覺得最容易的那個，是祂指給你的那個。","respond":"我要成為屬靈父母。我不再只是被餵養的人，我要開始餵養一個人。","practice":["寫下你的第一張名單：三個名字。","每天為這三個人禱告一分鐘，連續七天。","從這十二課裡挑一課，本週把它教給其中一個人。","約定一個固定的見面時間，寫進行事曆。","讀：提摩太後書二章1至7節、馬太福音二十八章18至20節。"],"tip":"陪伴者提示：這一課上完，要立刻進入實作。陪他打開 App 的「我的2」，當場建立第一張卡片。不要等他準備好——他永遠不會覺得自己準備好。"}]},{"id":"parent","name":"屬靈父母裝備六課","subtitle":"從被陪伴，到陪伴別人","color":"#8C6608","lessons":[{"id":"p1","no":"第一課","title":"如何陪伴","summary":"先作朋友，不急著傳。人比事重要。陪伴的核心不是技巧，是不離開。","verse":{"ref":"帖撒羅尼迦前書二章8節","text":"我們既是這樣愛你們，不但願意將神的福音給你們，連自己的性命也願意給你們。"},"info":"「我們既是這樣愛你們，不但願意將神的福音給你們，連自己的性命也願意給你們。」保羅說的是兩樣東西：福音，和自己。只給福音不給自己的，是傳單；連自己都給出去的，才是屬靈父母。\n陪伴的第一條原則：先作朋友，不急著傳。許多福音行動失敗在這裡——太快切入主題，對方立刻感覺到自己是一個「目標」，不是一個朋友。人比事重要，關係比東西重要。這個階段唯一的任務，是讓他確定：你是真的關心我，不是要我信什麼。\n陪伴的核心不是技巧，是不離開。你不必口才好，不必懂神學，你只要在他難處的時候真的出現。多數人一生記得的，不是誰對他講了一篇多好的道，是誰在他最狼狽的那一夜還沒有走。\n陪伴也需要界線。你是父母，不是救主。你能陪他走，不能替他走；你能為他禱告，不能替他相信。分清楚這一條，你才走得遠。","reflect":"問聖靈：我對我的2，是在愛他，還是在推進進度？如果他一輩子不信，我還會不會愛他？","respond":"我要把福音給他，也把自己給他。陪伴的核心不是技巧，是不離開。","practice":["為你的2建立一張關係卡：家庭、工作、興趣、壓力、最近的難處。","這週作一件實際幫忙的小事，並且不提信仰。","每天為他禱告一分鐘，記下天數。","操練920：對他結出一個聖靈的果子。","記下：這週我有沒有一次，因為想推進而讓他感覺被當成目標？"],"tip":"本課實作：請學員當場打開名單，為第一位2寫下三件他最近的難處。寫不出來，就是還不夠認識他——那正是這週的功課。"},{"id":"p2","no":"第二課","title":"如何講福音","summary":"五幕敘事的實際操作：怎麼開場、怎麼停頓、怎麼發出邀請。","verse":{"ref":"羅馬書一章16節","text":"我不以福音為恥；這福音本是神的大能，要救一切相信的。"},"info":"「我不以福音為恥，這福音本是神的大能，要救一切相信的。」講福音的能力不在你的口才，在福音本身。你的責任是把它講清楚，不是把人說服——說服是聖靈的工作。\n五幕敘事的實際操作：第一幕美好的起初，用一句話帶過，不必久留；第二幕有己的墮落，這是全場的關鍵，慢下來；第三幕十架的救贖，說得具體；第四幕復活的新生命，強調這是現在就有的，不是死後的保險；第五幕讓耶穌作王，發出明確的邀請。\n第二幕為什麼是關鍵？因為我們一講「你有罪」，對方立刻防衛：我又沒殺人放火。但你若說：「罪的意思不是壞事做多少，是我想自己作主、自己作王，不要神管我。」——多數人會安靜下來，因為那正是他一生的寫照。\n三個現場技巧：一、講你自己的故事，不要只講道理；二、學會停頓，講完第二幕停下來問一句「你覺得呢？」，讓他說話；三、勇敢邀請。很多人一輩子沒有信主，只因為從來沒有人正式邀請過他。","reflect":"求聖靈提醒你：上一次你有機會開口卻吞回去，是在怕什麼？是怕講不清楚，還是怕失去這段關係？","respond":"福音本是神的大能。我的責任是講清楚並且發出邀請，說服是聖靈的事。","practice":["對著鏡子或錄音，完整講一次五幕福音，控制在十五分鐘內。","寫出你自己的三分鐘見證：信主前的我／關鍵的轉折／現在的改變。","練習第二幕的一句話講法：把「有己」用你自己的話說出來。","本週找一位已信主的弟兄姊妹，實際講一次給他聽，請他回饋。","預備一句邀請的話，練到不尷尬：「你願意現在把生命的主權交給祂嗎？」"],"tip":"本課實作：兩人一組互相演練，一人講、一人扮演慕道友發問。演練過的人，現場開口的機率高出數倍。"},{"id":"p3","no":"第三課","title":"如何回答疑問","summary":"先接住情緒，再處理問題。不要爭贏，要愛贏。","verse":{"ref":"彼得前書三章15節","text":"有人問你們心中盼望的緣由，就要常作準備，以溫柔、敬畏的心回答各人。"},"info":"「有人問你們心中盼望的緣由，就要常作準備，以溫柔、敬畏的心回答各人。」注意經文的兩個重點：要常作準備（所以要裝備），也要溫柔敬畏（所以不是要贏）。\n第一條原則：先接住情緒，再處理問題。很多疑問底下藏的不是理性難題，是一段受傷的經歷。「為什麼好人會受苦」這一題，有人問是哲學問題，有人問是因為他媽媽上個月走了。同樣的問題，不同的答案。所以每一題的第一個動作，都是反問一句：「你怎麼會想到這個問題？」\n第二條原則：誠實承認你不懂的。說「這題我答不出來，我回去查，下週告訴你」——這比硬掰更有說服力，也給了你們下一次見面的理由。\n第三條原則：不要爭贏，要愛贏。你把他辯倒了，他會閉嘴，但他的心會關得更緊。答案的目的不是贏辯論，是打開心門。\n疑問解答庫的四十題，每題都有四層：一句話短答、相關經文、一個生活比喻、一個反問回去的問題。用的時候，先用第四層，最後才用第一層。","reflect":"問自己：我上一次跟人談信仰，心裡真正想要的是什麼——是他得救，還是我對？","respond":"先接住情緒，再處理問題。不要爭贏，要愛贏。","practice":["熟讀疑問解答庫中「華人處境」六題，這是最常被問到的。","練習反問：這週不論誰問你什麼，先問一句「你怎麼會想到這個？」","挑一題你最怕被問的，把答案寫成三句話，背下來。","這週遇到一次你答不出來的，誠實說「我不知道」，並且真的去查。","讀：彼得前書三章8至17節。"],"tip":"本課實作：現場點名發問，讓學員即席回答，然後全班一起修飾。要刻意製造「被問倒」的經驗，讓他在安全的地方先跌一次。"},{"id":"p4","no":"第四課","title":"如何帶門訓","summary":"八大步驟的落實：資訊、啟示、信服、實踐、檢討、修正、反覆、繁殖。","verse":{"ref":"歌羅西書一章28節","text":"我們傳揚他，是用諸般的智慧勸戒各人，教導各人，要把各人在基督裡完完全全地引到神面前。"},"info":"「我們傳揚他，是用諸般的智慧勸戒各人，教導各人，要把各人在基督裡完完全全地引到神面前。」保羅的目標不是講完課，是把人完完全全地引到神面前。\n門訓不是上課，是同行。所以八大步驟不能只走到第三步：資訊——把真理講給他；啟示——安靜禱告，求聖靈使他看見；信服——問他「這對你意味著什麼」，等他從頭腦走到心裡；實踐——給他一個七天的具體行動；檢討——下一週第一件事是回顧上週的行動；修正——他卡住的地方陪他調整方法；反覆——同一個主題三個月後再回訪；繁殖——讓他把這一課教給另一個人。\n多數門訓失敗在第四步與第五步之間：講完了，卻沒有人陪他實踐與檢討。於是知識堆積，生命不動。\n帶門訓的三個實務：一、固定時間，寧可短而規律，不要長而隨興；二、你講的不要超過一半，多問問題，讓他說；三、每次結束前，具體約定下一次的時間與作業。\n結業的標準不是上完，是教過別人了。","reflect":"問聖靈：我帶人的時候，是不是講得太多、問得太少？我有沒有陪他走到「實踐」與「檢討」？","respond":"門訓不是上課，是同行。我要陪他走完八大步驟，直到他能教別人。","practice":["排出未來十二週的門訓時間表，寫進行事曆並傳給對方。","預備第一課：自己先作一次那課的七天行動作業。","練習提問：把一段真理改寫成三個開放式問題。","每次見面後記一行：他今天說的哪句話，讓我看見聖靈在動工？","讀：歌羅西書一章24至29節。"],"tip":"本課實作：讓學員現場設計一次六十分鐘的門訓流程——開場十分鐘回顧、二十分鐘真理、二十分鐘討論、十分鐘作業與禱告。"},{"id":"p5","no":"第五課","title":"如何處理挫折","summary":"他不回訊息、他決志後消失了、他家人反對……忠心比成果重要。","verse":{"ref":"加拉太書六章9節","text":"我們行善，不可喪志；若不灰心，到了時候就要收成。"},"info":"「我們行善，不可喪志；若不灰心，到了時候就要收成。」保羅沒有說不會累，他說不要喪志。累是體力的事，喪志是心的事。\n最常見的幾種挫折：他不回我訊息了；他決志之後就消失了；他的家人強烈反對；他信了卻沒有改變；我陪了三年，他還是那樣。每一種都會讓人開始懷疑自己。\n幾句要記住的話。第一，我栽種了，亞波羅澆灌了，惟有神叫他生長——生長不是你的責任，忠心才是。第二，沒有回應不等於沒有果效，種子在土裡的時候是看不見的。第三，你的價值不是由結果決定的；如果人數決定你的價值，那你早晚會為了數字而傷害人。\n實際的作法：找你的屬靈同伴說出來，不要一個人撐；把挫折寫下來帶到禱告中，不要壓在心裡發酵；記錄「主動工的記號」——那些很小很小的改變，是你在漫長等待中的信心糧食。\n還有一句要老實說：有時候不是他的問題，是我們太急。停下來問一句，往往比再推一把有用。","reflect":"問聖靈：我心裡有沒有一個已經放棄的名字？求祂讓你看見，那是聖靈的釋放，還是我的灰心。","respond":"生長是神的事，忠心是我的事。我不喪志，因為到了時候就要收成。","practice":["寫下你目前最大的一個挫折，具體到那件事、那句話。","約你的屬靈同伴，把它說出來，並請他為你禱告。","翻閱你為他禱告的紀錄，找出三個「主動工的記號」，寫下來。","這週為他禱告時，改成為他祝福，不求結果。","讀：加拉太書六章1至10節、哥林多前書三章5至9節。"],"tip":"本課實作：讓每位學員說出一個挫折，全班一同為他按手禱告。挫折說出口的那一刻，捆綁就鬆了一半。"},{"id":"p6","no":"第六課","title":"如何繁殖","summary":"放手讓他去帶人。真正的成功，是他不再需要你，並且有了他自己的名單。","verse":{"ref":"約翰福音十五章16節","text":"乃是我揀選了你們，並且分派你們去結果子，叫你們的果子常存。"},"info":"「不是你們揀選了我，是我揀選了你們，並且分派你們去結果子，叫你們的果子常存。」注意「常存」兩個字——常存的果子，是那個會再結果子的果子。\n繁殖是屬靈父母的終點測驗。真正的成功，不是他多需要你，是他不再需要你，並且開始有他自己的名單。這一點違反人的天性：我們喜歡被需要。若你發現自己捨不得放手，要誠實面對——那多半不是為了他好，是我們的己還在。\n放手的四個步驟，可以背下來：我作你看、我作你幫、你作我幫、你作我看。多數人卡在第二步就不肯往前，結果帶了十年還在當保母。\n要主動製造機會：帶他一起去關心別人，讓他在旁邊看；下一次讓他開口，你在旁邊補；再下一次你完全不說話。回程的路上，先問他「你覺得剛剛怎麼樣」，再給回饋——先肯定兩件，再調整一件。\n最後，為他的屬靈兒女禱告。當你看見你的屬靈孫子出生的那一天，你就明白為什麼保羅說四代。體系不是組織圖，是一代一代真實的生命。","reflect":"問聖靈：我現在陪伴的人裡，誰已經可以往前一步了？我卡在放手的哪一個階段？","respond":"真正的成功，是他不再需要我，並且有了他自己的名單。","practice":["評估你的每一位屬靈兒女，現在各在哪一步：我作你看／我作你幫／你作我幫／你作我看。","挑一位，本週帶他一起去關心另一個人。","下一次讓他主導，你只在旁邊。回程給他兩個肯定、一個調整。","陪他寫下他自己的第一張名單。","為你的屬靈孫子禱告——即使他還沒有出現。"],"tip":"本課實作：畫出你的屬靈家譜樹，看見自己在第幾代，並寫下你希望三年後這棵樹長成什麼樣子。"}]}]}</script>
<script type="application/json" id="d-prayers">{"version":"1.0","prayers":[{"id":"pr1","cat":"家人","title":"為配偶得救","text":"主啊，祢知道我心裡最深的掛念。我把我的另一半交在祢手中。\n求祢挪去他心裡的攔阻，軟化那些年日累積的剛硬；求祢差人到他身邊，用他聽得懂的方式對他說話。\n主，也求祢先改變我。不要讓我用嘮叨代替愛，不要讓我用比較代替接納。求祢讓他從我身上先看見基督的溫柔。\n我不知道還要等多久，但我願意等。奉主耶穌的名禱告，阿們。"},{"id":"pr2","cat":"家人","title":"為父母得救","text":"天父，謝謝祢把我放在這個家。\n我為我的父母來到祢面前。他們養育我一生，我卻還沒能把最好的給他們。求祢憐憫他們，在他們年日漸長的時候，開他們的心眼。\n求祢賜我智慧，知道什麼時候該說、什麼時候該安靜；求祢讓我的孝順先讓他們看見這位神是真的。\n主，時間不多了，求祢加快祢的工作。奉主耶穌的名禱告，阿們。"},{"id":"pr3","cat":"家人","title":"為兒女得救","text":"主啊，這孩子本來就是祢賜的。\n我把他交還給祢。求祢保守他不走偏路，在他心裡放下對祢的渴慕；在他最需要的時候，讓他想起小時候聽過的那些話。\n求祢讓我作一個他願意親近的父母，不用權柄壓他，用生命吸引他。\n主，求祢自己得著他。奉主耶穌的名禱告，阿們。"},{"id":"pr4","cat":"家人","title":"為手足與親戚","text":"天父，我為我的家人來到祢面前。\n我們之間有太多陳年的心結，有些話說了會傷，不說又隔著。求祢先醫治我心裡的苦毒，讓我先跨出去。\n求祢預備合適的時機，讓福音藉著一頓飯、一次探望自然地進到他們心裡。\n奉主耶穌的名禱告，阿們。"},{"id":"pr5","cat":"職場","title":"為同事得救","text":"主啊，祢把我放在這間公司不是偶然的。\n求祢讓我在工作上作一個值得信任的人，讓我的誠實與從容成為一段無聲的見證。\n我特別為【某某】禱告，求祢挪去他心裡的重擔，賜我一個開口的機會，也賜我合宜的話語。\n奉主耶穌的名禱告，阿們。"},{"id":"pr6","cat":"職場","title":"為主管與同業","text":"天父，求祢賜我一顆順服而不諂媚、正直而不驕傲的心。\n我為我的主管禱告，求祢祝福他的家庭與健康。求祢讓我不論他怎麼待我，都能以善報之。\n求祢使我在職場作光作鹽，不是靠口才，是靠生命。奉主耶穌的名禱告，阿們。"},{"id":"pr7","cat":"朋友","title":"為多年好友","text":"主啊，我們認識這麼多年，我卻一直沒能把最重要的事告訴他。\n求祢赦免我的膽怯。求祢預備他的心，也預備我的口。\n讓我們的友誼不因為信仰而變得尷尬，反而因為信仰更深。奉主耶穌的名禱告，阿們。"},{"id":"pr8","cat":"朋友","title":"為鄰舍","text":"天父，謝謝祢把這些人放在我身邊。\n求祢讓我成為一個好鄰舍——記得他們的名字，在他們需要時真的出現。\n求祢藉著日常的小事，讓他們看見基督的樣式。奉主耶穌的名禱告，阿們。"},{"id":"pr9","cat":"處境","title":"為病痛中的人","text":"主耶穌，祢在世上的時候醫治了許多人，祢的心腸沒有改變。\n我為【某某】的身體禱告，求祢親自摸他，減輕他的疼痛，賜他安穩的睡眠，也堅固照顧他的家人。\n若祢還沒有醫治，求祢讓他在病中先遇見祢。奉主耶穌的名禱告，阿們。"},{"id":"pr10","cat":"處境","title":"為喪親的人","text":"天父，祢是安慰人的神。\n我為正在失去至親的【某某】禱告。求祢不用道理安慰他，用祢的同在抱住他。\n求祢讓他在最黑的夜裡，知道有一雙手一直沒有放開。奉主耶穌的名禱告，阿們。"},{"id":"pr11","cat":"處境","title":"為失業與經濟壓力","text":"主啊，祢知道他現在的難處。\n求祢開路，賜下合適的工作與供應；也求祢在等待的日子裡，保守他的尊嚴與盼望。\n求祢讓我知道可以實際幫上什麼，而不只是說些好聽的話。奉主耶穌的名禱告，阿們。"},{"id":"pr12","cat":"處境","title":"為婚姻困難的人","text":"天父，求祢憐憫這個家。\n求祢先軟化兩顆剛硬的心，讓他們願意停下爭辯，開始聽對方說話。\n求祢賜下饒恕的能力，那是人做不到而祢做得到的事。奉主耶穌的名禱告，阿們。"},{"id":"pr13","cat":"處境","title":"為憂鬱與失眠的人","text":"主啊，他很累了。\n求祢賜他今晚一夜好眠，賜他明天早上一點點力氣。求祢除去他心裡那個譴責自己的聲音。\n也求祢預備合適的醫治管道與願意陪伴的人。奉主耶穌的名禱告，阿們。"},{"id":"pr14","cat":"處境","title":"為捆綁與癮的人","text":"主耶穌，祢說祢來是要釋放被擄的。\n我奉祢的名為【某某】禱告，求祢斷開那些綑綁他的鎖鏈，賜他新的意志與新的渴望。\n求祢賜下扶持他的群體，讓他不用一個人對抗。奉主耶穌的名禱告，阿們。"},{"id":"pr15","cat":"屬靈","title":"為剛硬的心","text":"主啊，我已經為他禱告很久了，看不出什麼改變。\n求祢除掉他的石心，賜他肉心。求祢用祢的方法，不是我的方法。\n也求祢保守我不灰心，讓我記得：使人重生的是聖靈，我只負責忠心。奉主耶穌的名禱告，阿們。"},{"id":"pr16","cat":"屬靈","title":"為決志前的預備","text":"天父，我感覺祢正在他心裡動工。\n求祢預備那個時刻，也預備我的口。不讓我急躁催逼，也不讓我因膽怯錯過。\n求聖靈在那一刻親自感動他，讓他自己願意開口。奉主耶穌的名禱告，阿們。"},{"id":"pr17","cat":"屬靈","title":"為初信者站立得穩","text":"主啊，謝謝祢，他信了。\n求祢保守他這株剛發芽的苗，抵擋隨之而來的攪擾與試探。\n求祢在六週之內，賜給他三位真心的屬靈朋友。奉主耶穌的名禱告，阿們。"},{"id":"pr18","cat":"屬靈","title":"為受洗預備","text":"天父，這是一個公開歸屬祢的日子。\n求祢賜他勇氣面對家人的眼光，賜他清楚的見證，賜他一顆歡喜的心。\n求祢使這一天成為他一生的錨。奉主耶穌的名禱告，阿們。"},{"id":"pr19","cat":"自己","title":"陪伴者的每日禱告","text":"主啊，在我去愛人之前，求祢先充滿我。\n我承認我常常想靠自己的口才、自己的方法。求祢除去我的有己，讓耶穌在我裡面活。\n今天，求祢讓我對【某某】結出聖靈的果子；不是我努力做好人，是祢在我裡面活。\n讓耶穌作王，讓耶穌得著一切的榮耀。奉主耶穌的名禱告，阿們。"},{"id":"pr20","cat":"自己","title":"灰心時的禱告","text":"主啊，我有點撐不住了。\n我看不見果效，也懷疑自己是不是做錯了什麼。求祢提醒我：我栽種、亞波羅澆灌，惟有祢叫他生長。\n求祢把喜樂還給我，讓我單單為著祢，不為著結果。\n我願意繼續忠心。奉主耶穌的名禱告，阿們。"}],"fruits":[{"id":"f1","name":"仁愛","teach":"仁愛不是有感覺才去愛，是決定去愛。對那個難愛的人，仁愛是主動邁出的那一步。","verse":{"ref":"哥林多前書十三章4節","text":"愛是恆久忍耐，又有恩慈。"},"action":"今天為他做一件他不知道是你做的事。"},{"id":"f2","name":"喜樂","teach":"喜樂不靠環境，靠與主同在。環境給的是快樂，主給的是喜樂。","verse":{"ref":"腓立比書四章4節","text":"你們要靠主常常喜樂。我再說，你們要喜樂。"},"action":"今天跟他分享一件讓你感謝的小事。"},{"id":"f3","name":"和平","teach":"和平不是沒有衝突，是在衝突裡不失去裡面的安穩。無己的人不需要贏，所以能和平。","verse":{"ref":"羅馬書十二章18節","text":"若是能行，總要盡力與眾人和睦。"},"action":"今天有一次可以爭的機會，選擇不爭。"},{"id":"f4","name":"忍耐","teach":"忍耐是把時間交給神。你已經等了很久，那是因為神看見的比你長遠。","verse":{"ref":"雅各書五章7節","text":"弟兄們哪，你們要忍耐，直到主來。"},"action":"今天不催他任何事，只是問候他。"},{"id":"f5","name":"恩慈","teach":"恩慈是在他不值得的時候仍然待他好。那正是神待我們的方式。","verse":{"ref":"以弗所書四章32節","text":"並要以恩慈相待，存憐憫的心。"},"action":"今天說一句肯定他的話，具體到一件事。"},{"id":"f6","name":"良善","teach":"良善是即使沒有人看見也照樣做對的事。良善是無己最安靜的樣子。","verse":{"ref":"加拉太書六章10節","text":"有了機會就當向眾人行善。"},"action":"今天做一件沒有人會知道的好事。"},{"id":"f7","name":"信實","teach":"信實是說到做到。在一個人人失信的世代，準時與守約本身就是見證。","verse":{"ref":"路加福音十六章10節","text":"人在最小的事上忠心，在大事上也忠心。"},"action":"今天把一件答應過他卻沒做的事完成。"},{"id":"f8","name":"溫柔","teach":"溫柔不是軟弱，是有力量卻選擇不用。溫柔是把權力放下，回到本位。","verse":{"ref":"馬太福音十一章29節","text":"我心裡柔和謙卑，你們當負我的軛，學我的樣式。"},"action":"今天用最柔和的語氣跟他說話，特別是意見不同的時候。"},{"id":"f9","name":"節制","teach":"節制是讓耶穌作王的具體樣子——不是我控制不住，是我把主權交出去了。","verse":{"ref":"箴言二十五章28節","text":"人不制伏自己的心，好像毀壞的城邑沒有牆垣。"},"action":"今天在他面前少說一半的話，多聽一倍。"}],"newbeliever":[{"day":1,"title":"第一天：恭喜與陪伴","goal":"讓他知道昨天發生的事是真的，而且你在。","script":"今天怎麼樣？我一早就想到你。\n昨天你做的那個決定，是你一生最重要的一件事，我為你高興。\n我想告訴你一件事：接下來幾天你可能會覺得沒什麼特別，也可能會有些混亂，這都很正常。得救不是靠感覺，是靠神的應許。\n（一起讀約翰福音一章12節）\n這禮拜我們找一天吃個飯好嗎？"},{"day":3,"title":"第三天：教他禱告","goal":"讓禱告從第一次開始，而不是等他自己摸索。","script":"我想教你一件很簡單的事——怎麼跟神說話。\n不用文謅謅，不用跪，開車、洗碗、睡前都可以。就四件事：謝謝、對不起、求祢幫某某人、我自己的需要。\n我先禱告一次給你聽，然後換你，一句就好。"},{"day":7,"title":"第七天：教他讀經","goal":"解決「翻不到書卷」這個最現實的障礙。","script":"我帶了一本聖經給你。\n我們從約翰福音開始，一天讀一小段就好，讀不懂的先跳過。\n每天問三個問題：這段講神是怎樣的？講人是怎樣的？今天我要做什麼？\n（現場陪他讀完第一段）"},{"day":14,"title":"第十四天：介紹朋友","goal":"關係的移植。六週內三個朋友，是留下來的關鍵。","script":"這禮拜聚會我想介紹幾個朋友給你認識。\n他們也都是普通人，有的信很久，有的跟你差不多。\n（事先跟那三位講好，請他們主動來打招呼、記住他的名字）"},{"day":21,"title":"第二十一天：面對第一波攪擾","goal":"預先處理家人反對、懷疑與生活不順。","script":"這三個禮拜有沒有遇到什麼卡住的事？家裡有人說什麼嗎？\n（先聽完，不急著給答案）\n這很正常，幾乎每個人都會遇到。我當時是這樣（分享你自己的經驗）。\n我們一起為這件事禱告好嗎？"},{"day":30,"title":"第三十天：談受洗","goal":"把公開的委身放上桌面。","script":"滿一個月了，我想跟你談一件事——受洗。\n受洗不是入會，是公開表明：舊的我跟主一起埋葬了，新的我跟主一起活。\n不用急著決定，但我想先讓你知道這件事。\n如果你有意願，我陪你準備見證，也陪你跟家人談。"}],"frustrations":[{"q":"他不回我訊息，我還要繼續嗎？","a":"先確認你傳的是「關心」還是「邀請」。多數人不回，是因為感覺自己被當成一個要被完成的項目。停止傳資料，改成問一句「最近好嗎」，然後真的等他回。若還是沒回，就安靜地為他禱告，等下一個自然的時機——生日、生病、換工作，都是門重新打開的時候。"},{"q":"他決志後就消失了，怎麼辦？","a":"先不要自責，也不要下結論說他是假的。決志後最常見的斷點是「沒有人在四十八小時內出現」。現在能做的是重新接觸，但不要提屬靈的事，只約吃飯。關係接回來了，門才會再開。"},{"q":"他家人強烈反對，我該不該退？","a":"不要正面對抗家人，那會讓他兩面為難。你要做的是讓他家人看見你是個好人——逢年過節問候一聲，見面客氣有禮。多數反對其實是害怕失去，不是討厭信仰。"},{"q":"我被他問倒了，覺得很丟臉。","a":"「我不知道，我回去查，下次告訴你」是一個非常有力的回答。它比硬掰更贏得尊重。而且它給了你們下一次見面的理由。"},{"q":"我為他禱告好幾年了，一點動靜也沒有。","a":"禱告不是投幣機。你這幾年的忠心，神一次都沒有漏掉。奧古斯丁的母親禱告了三十一年。你可以老實跟神說你累了——祂受得住，而且祂會扶你。"},{"q":"他信了別的宗教，還很虔誠。","a":"不要攻擊他的信仰，那只會關上門。改成問他：你在那裡得著了什麼？聽他說。然後在合適的時候分享你自己得著的。比較很容易讓人防衛，見證卻不會。"},{"q":"我覺得自己不夠格傳福音，我自己都做不好。","a":"沒有人夠格，這就是重點。你不是在推銷一個你已經完成的成品，你是在告訴人你在哪裡找到了醫生。乞丐告訴另一個乞丐哪裡有麵包，不需要先變成麵包店老闆。"},{"q":"他一直說「我再想想」，已經好幾年了。","a":"有時候「再想想」不是理性的猶豫，是情感上還沒準備好放下控制權。不要一直催，改成問：如果你有一天真的要信，你覺得最難放下的是什麼？那個答案才是真正的攔阻。"},{"q":"我陪的人比別人少，覺得很挫折。","a":"這正是我們刻意不做排行榜的原因。神量的是忠心，不是數量。一個靈魂比一百個數字寶貴，而你不會知道，你手上這一位將來會帶出多少人。"},{"q":"我發現我在心裡把他當成一個「案子」。","a":"願意察覺這一點，本身就是聖靈的工作。停下來禱告，把他的名字重新交給神，並且問自己一句話：這個月，我更愛他了嗎？必要時，先放下記錄，只是去見他一面。"}]}</script>
