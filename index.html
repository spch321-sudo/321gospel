<title>321福音同行</title>
<style>
:root{
  --navy:#4E2061; --navy-d:#351449; --gold:#B8860B; --green:#2E7D5B;
  --orange:#C8791F; --bg:#FAF7FB; --ink:#1F2937; --ink-2:#4B5563;
  /* 文字專用變體：與品牌同色系，但通過 WCAG AA 4.5:1 */
  --gold-t:#8C6608; --orange-t:#9B5E18;
  --card:#FFFFFF; --line:#E4DCEA; --soft:#F2ECF6;
  --warn-a:#FDF6E3; --warn-b:#FBEBDC;
  --fs:1;
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
[data-theme="dark"]{
  --navy:#C9A6E0; --navy-d:#B08CC9; --gold:#E0B84A; --green:#63B98D;
  --orange:#E5A05C; --bg:#14171C; --ink:#ECEFF3; --ink-2:#B4BCC7;
  --gold-t:#E0B84A; --orange-t:#E5A05C;
  --card:#1E232B; --line:#3A3345; --soft:#272233;
  --warn-a:#2A2617; --warn-b:#2E2318;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:calc(18px * var(--fs)); line-height:1.8;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--navy)}

/* ---------- 版面骨架 ---------- */
#app{padding-top:calc(var(--safe-t) + 52px);padding-bottom:calc(var(--safe-b) + 74px);min-height:100dvh}
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  background:var(--navy);color:#fff;
  padding:var(--safe-t) 12px 0;
  height:calc(var(--safe-t) + 52px);
  display:flex;align-items:center;gap:8px;
  box-shadow:0 1px 6px rgba(0,0,0,.12)
}
[data-theme="dark"] .topbar{background:#101820}
.topbar h1{flex:1;margin:0;font-size:calc(19px * var(--fs));font-weight:700;letter-spacing:.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:52px}
.tb-btn{
  min-width:44px;height:44px;border-radius:10px;color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:calc(14px * var(--fs));padding:0 8px;gap:4px
}
.tb-btn{flex:0 0 auto}
.tb-btn:active{background:rgba(255,255,255,.18)}

.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);
  padding-bottom:var(--safe-b)
}
.nav button{
  min-height:56px;padding:6px 2px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--ink-2);font-size:calc(13px * var(--fs));font-weight:600
}
.nav button .ic{font-size:calc(22px * var(--fs));line-height:1.1}
.nav button[aria-current="page"]{color:var(--navy)}
[data-theme="dark"] .nav button[aria-current="page"]{color:var(--navy)}

.wrap{padding:14px 14px 28px;max-width:720px;margin:0 auto}

/* ---------- 通用元件 ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin-bottom:14px
}
.card.tight{padding:12px 14px}
.eyebrow{
  font-size:calc(13px * var(--fs));font-weight:700;letter-spacing:1.5px;
  color:var(--gold-t);margin-bottom:6px;text-transform:none
}
h2.sec{font-size:calc(22px * var(--fs));margin:0 0 10px;font-weight:700;line-height:1.5}
h3.sub{font-size:calc(19px * var(--fs));margin:0 0 8px;font-weight:700;line-height:1.6}
p{margin:0 0 10px}
p:last-child{margin-bottom:0}
.muted{color:var(--ink-2);font-size:calc(16px * var(--fs))}
.tiny{font-size:calc(15px * var(--fs));color:var(--ink-2)}

.verse{
  background:var(--soft);border-left:4px solid var(--gold);border-radius:8px;
  padding:12px 14px;font-size:calc(20px * var(--fs));line-height:2;margin:10px 0
}
.verse .ref{display:block;margin-top:6px;font-size:calc(15px * var(--fs));color:var(--ink-2);font-weight:600}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:12px 18px;border-radius:12px;
  background:var(--navy);color:#fff;font-weight:700;font-size:calc(18px * var(--fs));
  width:100%;text-align:center
}
[data-theme="dark"] .btn{color:#0F141A}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.btn.gold{background:var(--gold-t);color:#fff}
[data-theme="dark"] .btn.gold{color:#1A1406}
.btn.green{background:var(--green);color:#fff}
[data-theme="dark"] .btn.green{color:#08170F}
.btn.quiet{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:44px;padding:8px 14px;font-size:calc(16px * var(--fs));width:auto}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:140px}

.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:999px;background:var(--soft);
  font-size:calc(15px * var(--fs));font-weight:600;color:var(--ink-2);border:1px solid var(--line)
}
.chip.stage{color:#fff;border:0}
[data-theme="dark"] .chip.stage{color:#11161C}

.field{margin-bottom:14px}
.field label{display:block;font-weight:700;margin-bottom:6px;font-size:calc(17px * var(--fs))}
.field .hint{font-weight:400;color:var(--ink-2);font-size:calc(15px * var(--fs))}
input[type=text],input[type=date],input[type=time],input[type=password],textarea,select{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);min-height:52px;font-size:calc(18px * var(--fs))
}
textarea{min-height:110px;line-height:1.8;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{
  padding:10px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-size:calc(16px * var(--fs));font-weight:600;min-height:48px
}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
[data-theme="dark"] .seg button[aria-pressed="true"]{color:#11161C}

.list{list-style:none;margin:0;padding:0}
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:14px;border:1px solid var(--line);border-radius:12px;
  background:var(--card);margin-bottom:10px;min-height:60px
}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;font-size:calc(18px * var(--fs));line-height:1.5}
.row .s{color:var(--ink-2);font-size:calc(15px * var(--fs));line-height:1.6}
.row .arrow{color:var(--ink-2);font-size:calc(20px * var(--fs))}

.empty{
  text-align:center;padding:36px 18px;border:2px dashed var(--line);
  border-radius:var(--r);background:var(--card)
}
.empty .big{font-size:calc(21px * var(--fs));font-weight:700;margin-bottom:8px}

/* ---------- 人物卡 ---------- */
.pcard{
  display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-left:6px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:12px
}
.pcard.w14{background:var(--warn-a)}
.pcard.w30{background:var(--warn-b)}
.pcard .nm{font-size:calc(21px * var(--fs));font-weight:700;line-height:1.4}
.pcard .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.pcard .last{color:var(--ink-2);font-size:calc(15px * var(--fs));margin-top:6px}
body.bigcards .pcard{padding:20px 16px}
body.bigcards .pcard .nm{font-size:calc(25px * var(--fs))}

/* ---------- 七里程路徑（signature） ---------- */
.path{position:relative;padding-left:34px;margin:6px 0}
.path::before{
  content:"";position:absolute;left:12px;top:14px;bottom:14px;width:3px;
  background:linear-gradient(180deg,#7C8B99,#5B8C6E,#4A87A8,#B8860B,#C8791F,#2E7D5B,#1B4B7A);
  border-radius:2px;opacity:.5
}
.node{position:relative;margin-bottom:12px}
.node .dot{
  position:absolute;left:-28px;top:16px;width:15px;height:15px;border-radius:50%;
  border:3px solid var(--bg);box-shadow:0 0 0 2px currentColor
}
.node.cur .dot{width:21px;height:21px;left:-31px;top:13px;background:currentColor}
.node .head{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:56px
}
.node.cur .head{border-width:2px;box-shadow:0 2px 10px rgba(27,75,122,.10)}
.node .code{font-weight:800;font-size:calc(16px * var(--fs));letter-spacing:.5px}
.node .nname{font-weight:700;font-size:calc(19px * var(--fs))}
.node .body{padding:6px 2px 6px 4px}

/* ---------- 五幕 ---------- */
.act{border-left:4px solid var(--gold);padding-left:14px;margin-bottom:18px}
.act .no{font-size:calc(15px * var(--fs));font-weight:700;color:var(--gold-t);letter-spacing:1px}
.act .tt{font-size:calc(23px * var(--fs));font-weight:700;margin:2px 0 6px;line-height:1.5}
.act .key{font-size:calc(19px * var(--fs));font-weight:700;color:var(--navy);margin-bottom:8px;line-height:1.7}
.act .bd{white-space:pre-wrap;line-height:2}

.slide{
  min-height:52vh;display:flex;flex-direction:column;justify-content:center;
  padding:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)
}
.slide .tt{font-size:calc(30px * var(--fs));font-weight:800;line-height:1.4;margin-bottom:14px}
.slide .key{font-size:calc(24px * var(--fs));line-height:1.8;color:var(--navy);font-weight:700}
.slide .vs{margin-top:16px;font-size:calc(21px * var(--fs));line-height:2}

/* ---------- 摺疊 ---------- */
details{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
details>summary{
  list-style:none;padding:14px;font-weight:700;font-size:calc(18px * var(--fs));
  display:flex;align-items:center;gap:10px;min-height:56px;cursor:pointer
}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"＋";margin-left:auto;color:var(--ink-2);font-size:calc(20px * var(--fs))}
details[open]>summary::after{content:"－"}
details .dbody{padding:0 14px 14px}

/* ---------- 覆蓋層 ---------- */
/* 上下兩段式：外框只負責蓋滿畫面，內容區自己捲。
   不在固定定位的外框裡再放捲動＋固定元素，iOS 26 才不會錯亂。 */
.sheet{
  position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;isolation:isolate
}
.sheet > .topbar{position:relative;flex:0 0 auto;top:auto;left:auto;right:auto}
#sheetView{flex:1 1 auto;overflow-y:auto;padding-bottom:calc(var(--safe-b) + 24px)}
.sheet.hidden{display:none}
.frame{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.frame.hidden{display:none}
.frame .fbar{
  background:var(--navy);color:#fff;padding:var(--safe-t) 10px 0;
  height:calc(var(--safe-t) + 52px);display:flex;align-items:center;gap:8px
}
.frame .fbar .ttl{flex:1;font-weight:700;font-size:calc(17px * var(--fs));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame iframe{flex:1;width:100%;border:0;background:#fff}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--safe-b) + 88px);z-index:90;
  background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;
  font-size:calc(16px * var(--fs));font-weight:600;max-width:88vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .22s
}
.toast.on{opacity:.96}

.modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;background:rgba(15,20,26,.55);
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal.hidden{display:none}
.modal .box{background:var(--card);border-radius:16px;padding:20px;max-width:440px;width:100%;
  max-height:82dvh;overflow-y:auto}

/* ---------- 首次啟動守則 ---------- */
#gate{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;background:var(--bg);overflow-y:auto;
  padding:calc(var(--safe-t) + 24px) 20px calc(var(--safe-b) + 24px)}
#gate.hidden{display:none}
#gate .inner{max-width:560px;margin:0 auto}
#gate ol{padding-left:0;list-style:none;margin:18px 0}
#gate li{display:flex;gap:12px;margin-bottom:14px;font-size:calc(19px * var(--fs));line-height:1.8}
#gate li .n{
  flex:0 0 34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(17px * var(--fs))
}
[data-theme="dark"] #gate li .n{color:#11161C}

#lock{position:fixed;top:0;right:0;bottom:0;left:0;z-index:110;background:var(--bg);overflow-y:auto;
  padding:calc(var(--safe-t) + 28px) 20px calc(var(--safe-b) + 24px)}
#lock.hidden{display:none}
#lock .inner{max-width:420px;margin:0 auto}

.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat .s{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat .s .v{font-size:calc(28px * var(--fs));font-weight:800;color:var(--navy);line-height:1.3}
.stat .s .l{font-size:calc(15px * var(--fs));color:var(--ink-2)}

.tree{list-style:none;padding-left:0;margin:0}
.tree ul{list-style:none;margin:6px 0 0;padding-left:20px;border-left:2px solid var(--line)}
.tree li{padding:6px 0 0 12px;position:relative}

hr.sep{border:0;border-top:1px solid var(--line);margin:18px 0}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- 小智 · AI 傳福音屬靈同伴 ---------- */
.xz-fab{
  position:fixed;right:14px;bottom:calc(var(--safe-b) + 86px);z-index:55;
  display:flex;align-items:center;gap:7px;
  padding:12px 16px;border-radius:999px;
  background:var(--navy);color:#fff;font-weight:700;
  font-size:calc(17px * var(--fs));
  box-shadow:0 4px 14px rgba(0,0,0,.22);touch-action:none
}
[data-theme="dark"] .xz-fab{color:#0F141A}
.xz-fab:active{filter:brightness(.92)}
.xz-fab .ic{font-size:calc(19px * var(--fs));line-height:1}

.xz-overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:95;background:rgba(15,20,26,.5);display:flex;align-items:flex-end}
.xz-sheet{
  width:100%;max-width:720px;margin:0 auto;height:92dvh;
  background:var(--bg);border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;overflow:hidden;
  padding-bottom:var(--safe-b)
}
.xz-head{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:var(--navy);color:#fff;flex:0 0 auto
}
[data-theme="dark"] .xz-head{color:#0F141A}
.xz-head .ava{
  width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:calc(20px * var(--fs))
}
.xz-head .nm{font-weight:700;font-size:calc(19px * var(--fs));line-height:1.3}
.xz-head .rl{font-size:calc(14px * var(--fs));opacity:.85;line-height:1.4}
.xz-head .grow{flex:1;min-width:0}
.xz-hbtn{
  width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.16);
  color:inherit;font-size:calc(18px * var(--fs));display:flex;align-items:center;justify-content:center
}

.xz-who{
  display:flex;align-items:center;gap:8px;overflow-x:auto;
  padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);flex:0 0 auto
}
.xz-who::-webkit-scrollbar{display:none}
.xz-who .lb{font-size:calc(14px * var(--fs));color:var(--ink-2);font-weight:700;white-space:nowrap}
.xz-wchip{
  white-space:nowrap;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:calc(15px * var(--fs));font-weight:600;color:var(--ink-2)
}
.xz-wchip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
[data-theme="dark"] .xz-wchip[aria-pressed="true"]{color:#11161C}

.xz-msgs{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.xz-msg{display:flex;margin-bottom:12px}
.xz-msg.me{justify-content:flex-end}
.xz-bub{
  max-width:88%;padding:13px 15px;border-radius:14px;
  font-size:calc(18px * var(--fs));line-height:1.9;
  background:var(--card);border:1px solid var(--line);color:var(--ink)
}
.xz-msg.me .xz-bub{background:var(--navy);color:#fff;border-color:var(--navy)}
[data-theme="dark"] .xz-msg.me .xz-bub{color:#0F141A}
.xz-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
.xz-act{
  padding:6px 11px;border-radius:8px;background:var(--soft);border:1px solid var(--line);
  font-size:calc(14px * var(--fs));font-weight:600;color:var(--ink-2);min-height:36px
}
.xz-act.on{background:var(--gold-t);color:#fff;border-color:var(--gold-t)}
.xz-typing span{
  display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:999px;
  background:var(--ink-2);animation:xzb 1.1s infinite
}
.xz-typing span:nth-child(2){animation-delay:.18s}
.xz-typing span:nth-child(3){animation-delay:.36s}
@keyframes xzb{0%,60%,100%{opacity:.25}30%{opacity:1}}

.xz-lb{font-size:calc(15px * var(--fs));font-weight:700;color:var(--ink-2);margin:14px 0 8px}
.xz-quicks{display:flex;flex-direction:column;gap:8px}
.xz-quick{
  text-align:left;padding:12px 14px;border-radius:12px;background:var(--card);
  border:1px solid var(--line);font-size:calc(17px * var(--fs));line-height:1.6;min-height:50px
}
.xz-cats{display:flex;flex-wrap:wrap;gap:8px}
.xz-cat{
  padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  font-size:calc(16px * var(--fs));font-weight:600;min-height:46px
}
.xz-cat[aria-pressed="true"]{background:var(--gold-t);color:#fff;border-color:var(--gold-t)}
.xz-sep{text-align:center;font-size:calc(14px * var(--fs));color:var(--ink-2);margin:16px 0 6px}

.xz-foot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--card);flex:0 0 auto}

<script>
/* =========================================================
   321 福音同行　語言引擎
   繁體＝原文；簡體＝即時轉換；英文＝對照字典
   資料一律不動，只轉換畫面上看見的字。
   ========================================================= */
(function () {
'use strict';

const KEY = 'lang', LANGS = ['tc', 'sc', 'en'];
let lang = 'tc';
try { const v = JSON.parse(localStorage.getItem(KEY) || '"tc"'); if (LANGS.indexOf(v) >= 0) lang = v; } catch (e) {}

const LANGVER = '4.6.1';   /* 改這個數字，全世界的手機下次開啟就會取新字典 */
const RAW = {};   /* 外部語言檔載入後放這裡 */
function loadLangFiles(done) {
  if (lang === 'tc') return done();
  const need = lang === 'sc' ? ['sc'] : ['en', 'enp'];
  let n = 0;
  need.forEach(function (k) {
    fetch('lang-' + k + '.json?v=' + LANGVER)
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (j) { if (j) RAW[k] = j; if (++n === need.length) done(); });
  });
}

function readJSON(id) {
  const el = document.getElementById(id);
  if (!el) return null;
  try { return JSON.parse(el.textContent); } catch (e) { return null; }
}

/* ---------------- 繁 → 簡 ---------------- */
let SC = null;
function scTable() {
  if (SC) return SC;
  const t = RAW.sc || readJSON('d-sc');
  if (!t) return (SC = { s: {}, p: [] });
  const c = t.c || '', s = {};
  for (let i = 0; i + 1 < c.length; i += 2) s[c[i]] = c[i + 1];
  SC = { s: s, p: t.p || [] };
  return SC;
}
function toSC(str) {
  const t = scTable();
  let out = str;
  for (let i = 0; i < t.p.length; i++) {
    const k = t.p[i][0];
    if (out.indexOf(k) >= 0) out = out.split(k).join(t.p[i][1]);
  }
  let r = '';
  for (let i = 0; i < out.length; i++) { const ch = out.charAt(i); r += (t.s[ch] || ch); }
  return r;
}

/* ---------------- 中 → 英 ---------------- */
let EN = null, ENP = null;
function rxEsc(x) { return x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function patterns() {
  if (ENP) return ENP;
  const raw = RAW.enp || readJSON('d-enp') || [];
  ENP = raw.map(function (r) {
    return { re: new RegExp('^' + r[0].split('{}').map(rxEsc).join('([\\s\\S]*?)') + '$'), en: r[1] };
  });
  return ENP;
}
function toEN(str) {
  if (!EN) EN = RAW.en || readJSON('d-en') || {};
  const m = str.match(/^(\s*)([\s\S]*?)(\s*)$/);
  const head = m[1], tail = m[3];
  const key = m[2].replace(/\s+/g, ' ');
  if (!key) return str;
  let v = EN[key];
  /* 二、數字佔位 */
  if (v === undefined) {
    const nums = [];
    const norm = key.replace(/\d+/g, function (x) { nums.push(x); return '#'; });
    const t = EN[norm];
    if (t !== undefined) { let i = 0; v = t.replace(/#/g, function () { return nums[i++] || '#'; }); }
  }
  /* 三、句型比對：帶變數的句子，變數本身再翻一次 */
  if (v === undefined) {
    const ps = patterns();
    for (let i = 0; i < ps.length; i++) {
      const g = key.match(ps[i].re);
      if (g) {
        let j = 1;
        v = ps[i].en.replace(/\{\}/g, function () { return tr(g[j++] || ''); });
        break;
      }
    }
  }
  if (v === undefined) return str;
  return head + v + tail;
}

const HAS_CJK = /[\u3400-\u9fff]/;
function tr(str) {
  if (!str || !HAS_CJK.test(str)) return str;
  if (lang === 'sc') return toSC(str);
  if (lang === 'en') return toEN(str);
  return str;
}

/* ---------------- 套用到畫面 ---------------- */
const ATTRS = ['placeholder', 'aria-label', 'title', 'alt'];
function doNode(n) {
  if (!n) return;
  if (n.nodeType === 3) {
    if (n.__lz === n.nodeValue) return;
    const v = tr(n.nodeValue);
    if (v !== n.nodeValue) n.nodeValue = v;
    n.__lz = n.nodeValue;
  } else if (n.nodeType === 1) {
    for (let i = 0; i < ATTRS.length; i++) {
      const a = ATTRS[i];
      if (n.hasAttribute && n.hasAttribute(a)) {
        const o = n.getAttribute(a), v = tr(o);
        if (v !== o) n.setAttribute(a, v);
      }
    }
  }
}
const FILTER = { acceptNode: function (n) {
  if (n.nodeType === 1) {
    const t = n.tagName;
    if (t === 'SCRIPT' || t === 'STYLE' || t === 'IFRAME' || t === 'TEXTAREA') return NodeFilter.FILTER_REJECT;
  }
  return NodeFilter.FILTER_ACCEPT;
} };
function walk(root) {
  if (lang === 'tc' || !root) return;
  doNode(root);
  if (root.nodeType !== 1 && root.nodeType !== 9 && root.nodeType !== 11) return;
  if (root.nodeType === 1 && (root.tagName === 'SCRIPT' || root.tagName === 'STYLE')) return;
  let w;
  try { w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, FILTER); }
  catch (e) { return; }
  let n;
  while ((n = w.nextNode())) doNode(n);
  /* TEXTAREA 被過濾器擋掉，但它的 placeholder 仍要翻譯；只碰屬性，不動使用者輸入 */
  try {
    if (root.nodeType === 1 && root.querySelectorAll) {
      const ta = root.querySelectorAll('textarea');
      for (let i = 0; i < ta.length; i++) doNode(ta[i]);
    }
  } catch (e) {}
}

const mo = new MutationObserver(function (ms) {
  if (lang === 'tc') return;
  for (let i = 0; i < ms.length; i++) {
    const m = ms[i];
    if (m.type === 'characterData') doNode(m.target);
    else if (m.type === 'attributes') doNode(m.target);
    else for (let j = 0; j < m.addedNodes.length; j++) walk(m.addedNodes[j]);
  }
});

function start() {
  document.documentElement.setAttribute('lang',
    lang === 'en' ? 'en' : lang === 'sc' ? 'zh-Hans' : 'zh-Hant');
  if (lang !== 'tc') walk(document.body);
  mo.observe(document.documentElement, {
    childList: true, subtree: true, characterData: true,
    attributes: true, attributeFilter: ATTRS
  });
}
function begin() { loadLangFiles(start); }
if (document.body) begin();
else document.addEventListener('DOMContentLoaded', begin);

window.I18N = {
  get lang() { return lang; },
  ttsLang: function () { return lang === 'en' ? 'en-US' : lang === 'sc' ? 'zh-CN' : 'zh-TW'; },
  tr: tr,
  set: function (v) {
    if (LANGS.indexOf(v) < 0 || v === lang) return;
    try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {}
    location.reload();
  }
};

})();
</script>
<script>
const APPVER = '4.7.1';

/* =========================================================
   321 福音同行  ——  國度321空中團契
   陪伴每一個人成為得勝者
   資料一律留在使用者自己的裝置，不上傳、不追蹤。
   ========================================================= */
(function () {
'use strict';

const APP_VERSION = '4.0.0';

/* ---------------- 安全的本機設定（Safari 私密模式亦可用） ---------------- */
const mem = {};
const LS = {
  get(k, d) {
    try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }
    catch (e) { return k in mem ? mem[k] : d; }
  },
  set(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { mem[k] = v; }
  }
};

const S = {
  fontScale: LS.get('fontScale', 1),
  theme: LS.get('theme', 'light'),
  bigcards: LS.get('bigcards', false),
  ttsRate: LS.get('ttsRate', 0.95),
  amTime: LS.get('amTime', '07:00'),
  pmTime: LS.get('pmTime', '21:30'),
  gateOk: LS.get('gateOk', false),
  favFaq: LS.get('favFaq', []),
  lastBackupAt: LS.get('lastBackupAt', null),
  rotate: LS.get('rotate', true)
};
function saveS(k, v) { S[k] = v; LS.set(k, v); }

/* ---------------- IndexedDB ---------------- */
const DB_NAME = 'gospel321', DB_VER = 2;
const STORES = ['persons', 'interactions', 'prayers', 'progress', 'milestones', 'logs', 'signs',
  'checkins', 'wall'];
let _db = null;

function db() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const rq = indexedDB.open(DB_NAME, DB_VER);
    rq.onupgradeneeded = e => {
      const d = e.target.result;
      STORES.forEach(n => {
        if (!d.objectStoreNames.contains(n)) {
          const st = d.createObjectStore(n, { keyPath: 'id' });
          if (n !== 'persons') { try { st.createIndex('personId', 'personId', { unique: false }); } catch (x) {} }
        }
      });
    };
    rq.onsuccess = e => { _db = e.target.result; res(_db); };
    rq.onerror = e => rej(e.target.error);
  });
}
async function txAll(store, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction(store, mode);
    const st = tx.objectStore(store);
    const out = fn(st);
    tx.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    tx.onerror = () => rej(tx.error);
  });
}
const DB = {
  all: s => txAll(s, 'readonly', st => st.getAll()),
  get: (s, id) => txAll(s, 'readonly', st => st.get(id)),
  put: (s, o) => txAll(s, 'readwrite', st => st.put(o)),
  del: (s, id) => txAll(s, 'readwrite', st => st.delete(id)),
  clear: s => txAll(s, 'readwrite', st => st.clear())
};

/* ---------------- 工具 ---------------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl2br = s => esc(s).replace(/\n/g, '<br>');

function todayISO(d) { const x = d ? new Date(d) : new Date(); const o = x.getTimezoneOffset(); return new Date(x - o * 60000).toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.floor((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 86400000); }
function daysSince(iso) { return iso ? daysBetween(iso, todayISO()) : null; }
function fmtDate(iso) { if (!iso) return '—'; const p = iso.split('-'); return `${+p[1]}月${+p[2]}日`; }
function fmtAgo(iso) {
  if (!iso) return '還沒有紀錄';
  const n = daysSince(iso);
  if (n <= 0) return '今天';
  if (n === 1) return '昨天';
  if (n < 30) return n + ' 天前';
  if (n < 365) return Math.floor(n / 30) + ' 個月前';
  return Math.floor(n / 365) + ' 年前';
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2100);
}
function seedOfDay(n) {
  const d = new Date(); const k = d.getFullYear() * 372 + d.getMonth() * 31 + d.getDate();
  return k % n;
}

/* ---------------- 內容資料 ---------------- */
const C = { core: null, faq: null, gospel: null, lessons: null, prayers: null, resources: null };
async function loadContent() {
  const names = ['core', 'faq', 'gospel', 'lessons', 'prayers', 'resources'];
  await Promise.all(names.map(async n => {
    /* 1. 先用內嵌資料，確保單檔開啟也能運作 */
    const el = document.getElementById('d-' + n);
    if (el) { try { C[n] = JSON.parse(el.textContent); } catch (e) { C[n] = null; } }
    /* 2. 若同層有 data/ 資料夾，以它覆蓋（牧者可自行增修內容） */
    try {
      const r = await fetch('data-' + n + '.json?v=' + APPVER, { cache: 'default' });
      if (r.ok) {
        const j = await r.json();
        if (j && j.version) C[n] = j;
      }
    } catch (e) { /* 單檔開啟或離線，維持內嵌資料 */ }
  }));
}
const stageOf = id => (C.core.stages.find(s => s.id === id) || C.core.stages[0]);

/* ---------------- 朗讀 ---------------- */
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent);
const TTS = {
  voice: null, speaking: false, queue: [], idx: 0, _keep: null,
  init() {
    if (!('speechSynthesis' in window)) return;
    const pick = () => {
      const v = speechSynthesis.getVoices();
      this.voice = v.find(x => /zh[-_]TW/i.test(x.lang)) || v.find(x => /zh[-_]HK/i.test(x.lang))
        || v.find(x => /^zh/i.test(x.lang)) || null;
    };
    pick(); speechSynthesis.onvoiceschanged = pick;
  },
  /* 長文一次送出時，iOS 與 Chrome 都會在中途斷掉，所以切成短句排隊念 */
  split(text) {
    const clean = String(text).replace(/\s+/g, ' ').trim().slice(0, 12000);
    const out = []; let cur = '';
    for (const ch of clean) {
      cur += ch;
      if ('。！？；\n'.includes(ch) && cur.length >= 12) { out.push(cur); cur = ''; }
      else if (cur.length >= 90 && '，、）」』'.includes(ch)) { out.push(cur); cur = ''; }
      else if (cur.length >= 140) { out.push(cur); cur = ''; }
    }
    if (cur.trim()) out.push(cur);
    return out;
  },
  stop() {
    this.queue = []; this.idx = 0; this.speaking = false;
    if (this._keep) { clearInterval(this._keep); this._keep = null; }
    try { speechSynthesis.cancel(); } catch (e) {}
  },
  _next() {
    if (!this.speaking || this.idx >= this.queue.length) {
      const done = this.speaking && this.idx >= this.queue.length;
      this.stop();
      if (done) { const t = document.getElementById('toast'); if (t) { /* 念完不打擾 */ } }
      return;
    }
    const u = new SpeechSynthesisUtterance(this.queue[this.idx]);
    if (this.voice) u.voice = this.voice;
    u.lang = (window.I18N && window.I18N.ttsLang) ? window.I18N.ttsLang() : 'zh-TW';
    u.rate = S.ttsRate; u.pitch = 1;
    u.onend = () => { this.idx++; this._next(); };
    u.onerror = () => { this.idx++; setTimeout(() => this._next(), 120); };
    try { speechSynthesis.speak(u); } catch (e) { this.stop(); }
  },
  speak(text) {
    if (!('speechSynthesis' in window)) { toast('這個裝置不支援朗讀'); return; }
    if (this.speaking) { this.stop(); toast('已停止朗讀'); return; }
    const parts = this.split(text);
    if (!parts.length) { toast('這一頁沒有可朗讀的內容'); return; }
    try { speechSynthesis.cancel(); } catch (e) {}
    this.queue = parts; this.idx = 0; this.speaking = true;
    /* Chrome 桌面版約十五秒會自行停住，需定時喚醒；iOS 不需要也不宜 */
    if (!IS_IOS) this._keep = setInterval(() => {
      if (this.speaking && speechSynthesis.speaking) { try { speechSynthesis.resume(); } catch (e) {} }
    }, 9000);
    this._next();
    toast('開始朗讀，再按一次可停止');
  }
};
function readableText(el) {
  const c = el.cloneNode(true);
  c.querySelectorAll('button,input,textarea,select,.nav').forEach(n => n.remove());
  return c.textContent;
}

/* ---------------- 主題與字級 ---------------- */
function applyLook() {
  document.documentElement.style.setProperty('--fs', S.fontScale);
  document.documentElement.setAttribute('data-theme', S.theme === 'dark' ? 'dark' : 'light');
  document.body.classList.toggle('bigcards', !!S.bigcards);
  const m = document.querySelector('meta[name=theme-color]');
  if (m) m.setAttribute('content', S.theme === 'dark' ? '#101820' : '#4E2061');
}

/* ---------------- 路由 ---------------- */
const R = { tab: 'today', stack: [] };
const VIEWS = {};      // 分頁
const SHEETS = {};     // 覆蓋層

function go(tab) {
  R.tab = tab; R.stack = [];
  closeSheet(true);
  document.querySelectorAll('.nav button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  render();
}
async function render() {
  const v = $('#view');
  v.innerHTML = '<p class="muted">載入中…</p>';
  const html = await VIEWS[R.tab]();
  v.innerHTML = html;
  window.scrollTo(0, 0);
  $('#title').textContent = ({ today: '今日', walk: '同行', tools: '工具', cards: '福音卡片', learn: '學習', me: '我的' })[R.tab];
  bind(v);
}
function push(name, arg, title) {
  R.stack.push({ name, arg, title });
  drawSheet();
}
function popSheet() {
  R.stack.pop();
  if (!R.stack.length) closeSheet(); else drawSheet();
}
async function drawSheet() {
  const top = R.stack[R.stack.length - 1];
  const sv = $('#sheetView');
  $('#sheet').classList.remove('hidden');
  sv.innerHTML = '<p class="muted">載入中…</p>';
  const html = await SHEETS[top.name](top.arg);
  sv.innerHTML = html;
  $('#sheetTitle').textContent = top.title || '';
  $('#sheetView').scrollTop = 0;
  bind(sv);
}
function closeSheet(silent) {
  $('#sheet').classList.add('hidden');
  $('#sheetView').innerHTML = '';
  if (!silent) R.stack = [];
  TTS.stop();
}
function refreshSheet() { if (R.stack.length) drawSheet(); }

/* ---------------- 事件綁定（宣告式 data-act） ---------------- */
const ACTS = {};
function bind(root) {
  root.querySelectorAll('[data-act]').forEach(el => {
    if (el._bound) return; el._bound = true;
    el.addEventListener('click', ev => {
      const fn = ACTS[el.dataset.act];
      if (fn) { ev.preventDefault(); fn(el.dataset, el, ev); }
    });
  });
}

/* ---------------- 對話框 ---------------- */
function modal(html) {
  $('#modalBox').innerHTML = html;
  $('#modal').classList.remove('hidden');
  bind($('#modalBox'));
}
function closeModal() { $('#modal').classList.add('hidden'); $('#modalBox').innerHTML = ''; }
ACTS.closeModal = closeModal;

function confirmBox(title, msg, okLabel, onOk, danger) {
  modal(`<h3 class="sub">${esc(title)}</h3><p class="muted">${nl2br(msg)}</p>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn quiet" data-act="closeModal">取消</button>
      <button class="btn ${danger ? 'gold' : ''}" data-act="__confirmOk">${esc(okLabel)}</button>
    </div>`);
