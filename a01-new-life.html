舉一例。":"Share some occasions when God answered your prayer. If you can, give an example of each of the four kinds of answer.","請他分享神回應他禱告的經歷。":"Ask him to share how God has answered his own prayers.","最後問：他對第五課有什麼回應或疑問？":"Close by asking: what response or questions does he have to Lesson 5?","一起使用「五指禱告」的模式禱告。":"Pray together using the five-finger pattern.","為屬靈孩子靈命的成長禱告。":"Pray for your spiritual child's spiritual growth.","提醒他預先讀完第六課。":"Remind him to read Lesson 6 in advance.","認罪、離棄、得釋放":"Confess, forsake, be set free","罪是我們生命中的一大問題，會帶來內疚和挫敗的感覺。然而神差耶穌基督來，在十字架上解決了我們罪的問題。這意味著我們能從罪所引起的內疚和挫敗感中得釋放。":"Sin is a great problem in our lives, bringing guilt and a sense of defeat. But God sent Jesus Christ, and on the cross He settled the problem of our sin. That means we can be set free from the guilt and defeat that sin brings.","一、問題的根源":"1. The root of the problem","何謂罪？聖經上有兩個關於罪的意義，那就是「":"What is sin? Scripture uses the word in two senses: ","罪性":"the sinful nature","」和「":" and ","罪行":"sinful deeds","「罪性」是根源，是人犯罪的本性；「罪行」則是所結出的果子，是人犯罪的行為。":"The sinful nature is the root — our disposition to sin. Sinful deeds are the fruit — the sinful things we do.","就像蘋果樹會結出蘋果（果子），因為它原本（根源）就是一棵蘋果樹；蘋果樹不會長出梨子。我們生命中罪的問題也是如此：我們犯下罪行（果子），是因為我們的本性（根源）是罪惡的。":"An apple tree bears apples (the fruit) because it is, at root, an apple tree; it will never grow pears. So it is with sin in our lives: we commit sinful deeds (the fruit) because our nature (the root) is sinful.","罪性產生罪行。":"The sinful nature produces sinful deeds.","得赦免其過、遮蓋其罪的，這人是有福的。":"Blessed are they whose disobedience is forgiven, whose sin is covered.","所以，不要容罪在你們必死的身上作王，使你們順從身子的私慾。":"Therefore don't let sin reign in your mortal body, that you should obey it in its lusts.","人的問題與他生活中的「果子」並沒有主要的關聯，問題在於他生命中的根源。人的問題在於其罪性。要處理罪行的問題，就必須先解決罪性的問題。":"A person's problem is not chiefly about the fruit in his life; it lies at the root. The problem is the sinful nature. To deal with sinful deeds, the sinful nature must be settled first.","「罪」在原文的意思是指「人射箭時射不中靶心」，所以罪也就是達不到神造人的目的及標準，虧缺了神的榮耀。":"In the original language, sin means an archer's arrow missing the centre of the target. So sin is falling short of the purpose and standard for which God made us — falling short of the glory of God.","因此，罪是一種錯誤的狀況：是人自立為王，自命為生命之主。":"Sin is therefore a wrong state of affairs: a man setting himself up as king, appointing himself lord of his own life.","當我們這樣做，我們的「自我」便取代了神的地位，佔據了我們生命的寶座。要解決罪性與罪行的問題，我們一定要退下生命的寶座，讓神作我們生命的王和生命之主。":"When we do that, self takes the place of God and occupies the throne of our life. To settle both the sinful nature and sinful deeds, we must step down from that throne and let God be King and Lord of our life.","自我管理的生命":"A life run by self","我":"S","自我在生命的寶座上":"Self on the throne of the life","基督在生命之外":"Christ outside the life","基督管理的生命":"A life run by Christ","基督在生命的寶座上":"Christ on the throne of the life","自我退下寶座":"Self stepped down from the throne","感謝神！因為你們從前雖然作罪的奴僕，現今卻從心裏順服了所傳給你們道理的模範。你們既從罪裏得了釋放，就作了義的奴僕。":"But thanks be to God, that whereas you were bondservants of sin, you became obedient from the heart to that form of teaching to which you were delivered. Being made free from sin, you became bondservants of righteousness.","二、除去問題":"2. Removing the problem","基督已經為我們的罪被釘死在十字架上，解決了罪的刑罰問題，所以我們已經不再被定罪；但是我們卻必須等到基督第二次再來時，才能完全從罪中得以釋放。":"Christ was crucified for our sin and settled the penalty of it, so we are no longer condemned. Yet we must wait until Christ comes again before we are wholly freed from sin's presence.","當我們接受耶穌作救主時，已經解決了罪性的問題。":"When we received Jesus as Saviour, the problem of the sinful nature was settled.","我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裏面活著；並且我如今在肉身活著，是因信神的兒子而活；他是愛我，為我捨己。":"I have been crucified with Christ, and it is no longer I that live, but Christ lives in me. That life which I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself up for me.","我們可以選擇不再用有罪性的舊人活著，而選擇用在基督裏沒有罪性的新人活著。我們必須不斷地操練作正確的選擇。因著在主裏新人的新生命，我們若忠心順服神的引導，就能活出一個正直的生命，並在每日生活中戰勝罪的捆綁。":"We can choose to stop living as the old self with its sinful nature, and to live instead as the new self in Christ, which has none. That right choice must be practised again and again. Because of the new life of the new self in the Lord, if we faithfully obey God's leading we can live an upright life and overcome the grip of sin day by day.","在主裏經歷自由的兩大要點":"Two keys to experiencing freedom in the Lord","A 赦免罪行":"A. Forgiveness of sinful deeds","基督徒依然會犯罪，你或許會問：「我若犯了罪該怎麼辦？」":"Christians still sin. You may ask, “what should I do if I sin?”","1. 向神認罪。":"1. Confess your sin to God.","認罪就是根據神的標準去看待罪的問題，就是同意神對罪的看法。":"To confess is to see sin by God's standard — to agree with God's view of it.","「我向你犯罪，惟獨得罪了你，在你眼前行了這惡。」":"“Against you, and you only, I have sinned, and done that which is evil in your sight.”","認罪就是承認罪是一項罪，而不是一個錯誤、一項弱點或一項決定。人必須為自己的罪行負全責，決不找藉口或歸咎他人。":"Confession means calling sin sin, and not a mistake, a weakness, or a decision. A person must take full responsibility for what he has done, never making excuses or blaming others.","2. 離棄罪行。":"2. Forsake the sin.","我們要下定決心，不再得罪神。求神幫助你克服試探，不再失足。":"Make up your mind not to sin against God again. Ask God to help you overcome temptation and stumble no more.","「他自己既然被試探而受苦，就能搭救被試探的人。」":"“For in that he himself has suffered being tempted, he is able to help those who are tempted.”","你或許會問：要是我再一次犯罪，神依然會赦免我嗎？會的，祂會不斷地赦免你，只要你不是抱著「既然神應許要赦免我，我犯罪又何妨」的態度。":"You may ask: if I sin again, will God still forgive me? He will, and He will go on forgiving — provided you are not taking the attitude that since God has promised forgiveness, sinning does not matter.","3. 接受神的赦免和潔淨。":"3. Receive God's forgiveness and cleansing.","沒有什麼罪會嚴重到神無法赦免或不肯赦免。只要我們真心誠意地向神認罪，祂就必定會赦免。神既然應許要赦免你的罪，就必然會實現祂的應許，這點你可以肯定。":"No sin is so grave that God cannot or will not forgive it. If we confess sincerely, He will certainly forgive. God has promised to forgive your sin, and He will keep His promise — of that you can be sure.","4. 感謝神的赦免。":"4. Thank God for His forgiveness.","每一次你祈求神的赦免，都要為此感謝祂。這麼做能幫助你更肯定神的赦免，而不會理所當然地以為這是你應當得到的。":"Every time you ask God's forgiveness, thank Him for it. Doing so strengthens your assurance of that forgiveness, and keeps you from taking it as something you were owed.","B 從堅固營壘中得釋放":"B. Freedom from strongholds","有時候我們發覺自己被生命中長久已經成型的某種罪行或壞習慣纏繞著，苦苦掙扎卻仍然無法得勝。這種情形可能是以下因素所造成的：":"Sometimes we find ourselves bound by a long-established sin or bad habit, struggling hard and still not overcoming. Any of the following may lie behind it:","苦毒、憤恨，無法饒恕一位曾經傷害你的人，也許是家人、親戚或朋友。":"Bitterness and resentment, an inability to forgive someone who hurt you — perhaps family, a relative, or a friend.","損害健康的不良習慣。":"Habits that damage your health.","祭拜偶像，使用符咒，迷信占星術。":"Idol worship, the use of charms, trust in astrology.","對過去的行為感覺羞恥，無法原諒自己。":"Shame over past conduct, and an inability to forgive yourself.","閱讀色情書刊，手淫，其他放縱情慾的習慣等。":"Pornography, masturbation, and other habits of indulging the flesh.","以上種種都是生命中的堅固營壘，撒但就是利用這些堅固營壘捆綁我們。然而神要我們從中得釋放。":"Each of these is a stronghold in the life, and Satan uses such strongholds to bind us. But God intends to set us free from them.","1. 透過禱告，宣告剷除有關的堅固營壘。":"1. Through prayer, declare the stronghold torn down.","你可以這樣禱告：":"You may pray like this:","主啊，感謝祢在十字架上擊毀了撒但和罪的權勢。我如今奉祢的名剷除○○堅固營壘，從今以後不再與○○堅固營壘有任何關係。求祢以祢的寶血潔淨我，並以祢在十字架上得勝的大能攻破我生命中堅固的營壘，使我得到釋放。我將我的意願獻上交託給祢，願祢來掌管我的生命。願祢賜我聖靈的能力，使我能夠順服祢，勝過撒但的攻擊和試探。主啊，我感謝祢，奉主耶穌的名禱告，阿們！":"Lord, thank You that on the cross You broke the power of Satan and of sin. In Your name I now tear down the stronghold of ______, and from this day I will have nothing more to do with it. Cleanse me with Your precious blood, and with the victorious power of Your cross break down the strongholds in my life and set me free. I offer up my will and entrust it to You; take charge of my life. Give me the power of the Holy Spirit, that I may obey You and overcome Satan's attacks and temptations. Lord, I thank You. In the name of the Lord Jesus I pray. Amen!","2. 決定與神同行。":"2. Decide to walk with God.","得勝的基督徒生活是一生的過程，必須在每日生活中去體驗和追求。藉著依靠聖靈的能力，學習恆常地與神同行——聆聽神說話，向祂禱告，順服祂的引導。當你落入試探和罪惡中時，總要轉向祂，讓祂幫助你，引導你走義路。":"The victorious Christian life is the work of a lifetime, to be experienced and pursued in daily living. Relying on the power of the Holy Spirit, learn to walk steadily with God — hearing Him speak, praying to Him, obeying His leading. Whenever you fall into temptation or sin, turn to Him, let Him help you and lead you in the paths of righteousness.","3. 拒絕撒但的謊言。":"3. Refuse Satan's lies.","撒但會經常在你的思想中散播謊言，企圖欺騙你。":"Satan constantly sows lies in your thinking, trying to deceive you.","「他本來是說謊的，也是說謊之人的父。」":"“He is a liar, and the father of lies.”","牠常對我們說：":"He often says to us:","「你不夠好，不配得到神的愛。」":"“You are not good enough; you do not deserve God's love.”","「神並不真正關心你。」":"“God does not really care about you.”","「你可以獨自應付生活中一切事。」":"“You can handle everything in life on your own.”","「你太忙了，沒有時間和神交談。」":"“You are far too busy to talk with God.”","「沒關係的，沒有人會知道。」":"“It does not matter — nobody will know.”","「每個人都這麼做，只有你說不。」":"“Everyone does this. You are the only one saying no.”","你必須抗拒撒但的謊言，站立在神的真理上。你可以這樣禱告：":"You must resist Satan's lies and stand on God's truth. You may pray like this:","主啊！我向祢承認我接受了撒但的謊言「＿＿＿＿＿」，現在，我奉主的名棄絕這個謊言，砍斷這個謊言在我生命中的影響。奉主耶穌的名禱告，阿們。":"Lord, I confess to You that I accepted Satan's lie that “______.” Now, in the name of the Lord, I renounce this lie and cut off its influence in my life. In the name of the Lord Jesus I pray. Amen.","你們要靠著主，倚賴他的大能大力作剛強的人。要穿戴神所賜的全副軍裝，就能抵擋魔鬼的詭計。":"Be strong in the Lord and in the strength of his might. Put on the whole armour of God, that you may be able to stand against the wiles of the devil.","4. 接受肢體的服事。":"4. Receive ministry from the body.","若你生命中有堅固營壘，需要別人的幫助，可以讓你的家組長知道。他會很樂意幫助你，或為你安排一位受過事工訓練的家人來幫助你。":"If there is a stronghold in your life and you need help, let your home group leader know. He will gladly help you, or arrange for a member trained in this ministry to help you.","這一課，是 321 最核心的一課。課本說得非常準：":"This is the most central lesson in the whole of 321. The text puts it exactly: ","罪是人自立為王，自命為生命之主":"sin is a man setting himself up as king and appointing himself lord of his own life","。這正是我們說的——":". This is precisely what we mean by ","有己是人類墮落的根源，驕傲是問題的根源":"self is the root of humanity's fall, and pride is the root of the problem","。驕傲就是離開人的本位、抓住神的權力想要代替神。":". Pride is leaving the place of a man and seizing the authority of God, wanting to take God's place.","所以解決之道不是更努力不犯罪，而是":"So the remedy is not to try harder not to sin. It is to ","換寶座":"change who is on the throne","「現在活著的不再是我，乃是基督在我裏面活著。」":"“It is no longer I that live, but Christ lives in me.”","這就是":"This is ","：不是沒有，乃是進入無限、活出無限。舊人有己的生命，變成新人無己的生命；":": not having nothing, but entering the infinite and living the infinite. The old self-centred life becomes the new selfless life. ","謙卑戰勝驕傲，無己戰勝撒但":"Humility overcomes pride, and selflessness overcomes Satan","，失敗的人生就變成得勝的人生。":" — and a life of defeat becomes a life of victory.","堅固營壘的拆毀，也是同一條路：":"Strongholds come down along the very same road: ","無己讓耶穌在裡面活，無己才能讓耶穌作王，無己才能得勝。":"selflessness lets Jesus live within; only the selfless can let Jesus reign; only the selfless can overcome.","背誦約翰壹書一 9。":"Memorise 1 John 1:9.","在禱告中仔細察驗你的生命，看是否有任何需要處理的堅固營壘，也可以請家組長幫助你。":"Examine your life carefully in prayer for any stronghold that needs dealing with; you may also ask your home group leader to help you.","學習向神認罪，接受祂的赦免和潔淨——每當你犯了罪，或聖靈向你顯明某些罪行時，就這樣做。":"Learn to confess to God and receive His forgiveness and cleansing — do this whenever you sin, or whenever the Holy Spirit shows you something.","幫助屬靈孩子明白罪的問題，並教導他如何勝過罪：赦免罪行、從堅固營壘中得釋放。":"Help your spiritual child understand the problem of sin, and teach him how to overcome it: forgiveness of sinful deeds, and freedom from strongholds.","為什麼這一課極其重要":"Why this lesson matters so much","若不妥當地處理罪，它將影響我們與神的關係。撒但不斷地使用罪來攔阻我們在主裏的成長：牠先欺騙我們說我們無法戰勝罪，接著試探我們犯罪，然後因我們的過犯控告我們，再欺騙我們說神與其他信徒都因我們犯罪而對我們失望了。但真理絕非如此。當屬靈孩子明白並應用這些真理，他們將從罪的重擔中得自由，可以過著喜樂又有能力的生活！":"Sin left unaddressed will affect our relationship with God. Satan uses sin relentlessly to block our growth in the Lord: first he deceives us into believing we cannot overcome it, then he tempts us into it, then he accuses us of our failures, and then he deceives us again into believing that God and the other believers are disappointed in us. None of that is true. When a spiritual child understands and applies these truths, he will be free of sin's weight and able to live a joyful and powerful life.","與他分享你過去一週靈修會主中的領受。":"Share what you received in your times of listening to the Lord this past week.","讓他分享他的領受，特別是讀馬可福音的領受。不論他是否已經養成習慣，都要繼續鼓勵他花時間靈修會主。":"Let him share his own, especially from his reading of Mark. Whether or not the habit has taken hold, keep encouraging him to make time to listen to the Lord.","複習 約壹五 11-12、來十 25、約六 63、約十六 24、約壹一 9。若他還沒讀過第六課，先給他時間讀完。":"Review 1 John 5:11-12, Hebrews 10:25, John 6:63, John 16:24 and 1 John 1:9. If he has not yet read Lesson 6, give him time to finish it first.","A 問題的根源":"A. The root of the problem","問：「什麼是罪？」答案應該是：罪是達不到神造人的目的及標準，是當我們自己做生命中的王與主人的狀態。":"Ask, “what is sin?” The answer should be: sin is falling short of the purpose and standard for which God made us — the state of making ourselves king and master of our own life.","問：「你個人對罪有什麼感受？」值得注意的是，這裏指的是罪的根源，而非只針對罪的果子（罪行）。":"Ask, “how do you feel about sin yourself?” Note that this concerns the root of sin, not only its fruit.","B 赦免罪行——一個看得見的操練":"B. Forgiveness of sinful deeds — a visible exercise","求神顯明我們個人所犯的罪。":"Ask God to show each of you the sins you have committed.","把神所顯明的罪寫在一張紙上。":"Write on a sheet of paper what God shows you.","開口向神承認這些罪，並請求神的饒恕與潔淨。":"Confess those sins aloud to God, asking His forgiveness and cleansing.","把紙上的罪劃掉，在其上寫上約壹一 9，然後把紙撕掉。":"Cross out the sins on the paper, write 1 John 1:9 over them, and then tear the paper up.","請他把紙撕得越細越好，並把碎紙丟在一個袋子中搖一搖。然後解釋：「當神赦免我們的罪，祂就潔淨了我們」——就如我們剛剛所行的，把罪行撕碎丟掉，我們永遠無法把它們重新拼起來。這就是神赦免我們的方式，祂從此不再記念。":"Have him tear it as finely as he can, drop the pieces into a bag and shake it. Then explain: when God forgives our sins, He cleanses us — just as we have done here, tearing them up and throwing them away so that they can never be pieced together again. That is how God forgives, and He remembers them no more.","感謝神的赦免及潔淨。":"Thank God for His forgiveness and cleansing.","C 從堅固營壘中得釋放":"C. Freedom from strongholds","讓他明白：我們每個人生命中都有堅固營壘，並且都在不斷戰勝它們的過程中。":"Help him see that every one of us has strongholds in his life, and that all of us are in the process of overcoming them.","與他分享一個":"Share with him one stronghold ","你正在掙扎":"you are still struggling with","的堅固營壘，說明堅固營壘是真實的，而且需要時間來解決。":", to show that strongholds are real and that they take time to deal with.","分享得勝堅固營壘的例子——你的，或是別人的。":"Share an example of a stronghold overcome — yours, or someone else's.","求神顯明他生命中的堅固營壘，問他是否已經開始處理，是否願意讓你與他一同禱告。若你沒有把握，可以請家組長協助。":"Ask God to show the strongholds in his life. Ask whether he has begun dealing with them, and whether he would like you to pray with him. If you are unsure of yourself, ask your home group leader to help.","要點：":"Key point: ","讓他知道神明白我們的掙扎，並無條件地在愛中接納我們。你也要向他表示你對他的接納。":"let him know that God understands our struggles and accepts us in love without condition. Show him your own acceptance of him too.","最後問：他對第六課有什麼回應或疑問？":"Close by asking: what response or questions does he have to Lesson 6?","花一些時間聆聽神的聲音，看有哪些堅固營壘是他所忽略的，並把你的感動向他作出確認。":"Take some time to listen to God for any stronghold he has overlooked, and check with him what you sense.","為他禱告，破除在他生命中已知的堅固營壘。":"Pray for him, that the strongholds already known in his life would be broken.","讀詩一〇三 8-14，在禱告中敬拜神的恩慈與赦免。":"Read Psalm 103:8-14, and in prayer worship God for His kindness and forgiveness.","提醒他預先讀完第七課。":"Remind him to read Lesson 7 in advance.","第六課 · 認罪、離棄、得釋放":"Lesson 6 · Confess, forsake, be set free","」。":".","。":".","：":": ","羅馬書十 9":"Romans 10:9","歌羅西書一 16-18":"Colossians 1:16-18","腓立比書二 9-11":"Philippians 2:9-11","哥林多前書六 20":"1 Corinthians 6:20","耶利米書二十九 11":"Jeremiah 29:11","瑪拉基書三 10":"Malachi 3:10","（太二十八 19）":"(Matthew 28:19)","（太六 21）":"(Matthew 6:21)","（提前六 17）":"(1 Timothy 6:17)","詩 119:18":"Psalm 119:18","路 24:45":"Luke 24:45","詩 119:73":"Psalm 119:73","弗 1:17":"Ephesians 1:17","提後 2:15":"2 Timothy 2:15","詩 119:130":"Psalm 119:130","約 16:13":"John 16:13","羅 15:5-6":"Romans 15:5-6","箴 9:10":"Proverbs 9:10","並且他替眾人死，是叫那些活著的人不再為自己活，乃為替他們死而復活的主活。":"He died for all, that those who live should no longer live to themselves, but to him who for their sakes died and rose again.","你是否發覺生命中有許多事情是你無法自主或選擇的？例如：你不能決定自己的生日、父母親、種族、籍貫、相貌……說真的，我們對自己的生命所能作的決定實在太少了！而對於那一小撮有自由作決定的事情，我們又總是把它搞砸了。我們還有什麼希望嗎？":"Have you noticed how much of your life you never got to choose? You did not decide your birthday, your parents, your race, where you came from, or your looks. In truth, very few decisions about our own lives are ours to make — and the handful we are free to make, we generally make a mess of. Is there any hope for us?","作一位基督徒，就是要完全讓神在你生命中全權作主。這是為了你的好處。":"To be a Christian is to let God have complete authority over your life. This is for your own good.","當你成為基督徒的時候，你把生命交給了耶穌基督，不但讓祂成為你的救主，同時也讓祂成為你生命之主。":"When you became a Christian you handed your life over to Jesus Christ, making Him not only your Saviour but the Lord of your life.","你若口裏認耶穌為主，心裏信神叫他從死裏復活，就必得救。":"If you will confess with your mouth that Jesus is Lord and believe in your heart that God raised him from the dead, you will be saved.","一、讓耶穌作主的兩個原因":"1. Two reasons to let Jesus be Lord","1. 耶穌的身份":"1. Who Jesus is","耶穌有權作你生命之主。祂是萬物之主，祂是最微小的原子之主，也是最龐大的銀河系之主。":"Jesus has the right to be Lord of your life. He is Lord of all things — Lord of the smallest atom and Lord of the vastest galaxy.","因為萬有都是靠他造的，無論是天上的、地上的，能看見的、不能看見的，或是有位的、主治的、執政的、掌權的，一概都是藉著他造的，又是為他造的。他在萬有之先，萬有也靠他而立。他也是教會全體之首，他是元始，是從死裏首先復生的，使他可以在凡事上居首位。":"For by him all things were created in the heavens and on the earth, visible things and invisible things, whether thrones or dominions or principalities or powers. All things have been created through him and for him. He is before all things, and in him all things are held together. He is the head of the body, the assembly, who is the beginning, the firstborn from the dead, that in all things he might have the pre-eminence.","所以神將他升為至高，又賜給他那超乎萬名之上的名，叫一切在天上的、地上的和地底下的，因耶穌的名無不屈膝，無不口稱耶穌基督為主，使榮耀歸與父神。":"Therefore God also highly exalted him and gave to him the name which is above every name, that at the name of Jesus every knee should bow, of those in heaven, those on earth, and those under the earth, and that every tongue should confess that Jesus Christ is Lord, to the glory of God the Father.","無論你是否喜歡，是否能夠接受，是否願意，事實總歸事實——":"Whether you like it, whether you can accept it, whether you are willing — the fact remains a fact:","耶穌依然是主！":"Jesus is Lord all the same!","2. 耶穌為我們成就的事":"2. What Jesus has done for us","耶穌為我們在十字架上受死。我們原本應該是那位在神面前受審判的人，但因耶穌愛我們，祂擔當了我們的罪，為我們承受神的刑罰。我們原本應受懲罰，反而得到了永生。為此我們不該再為自己活著，必須為主而活。":"Jesus died for us on the cross. We were the ones who should have stood under God's judgement, but because He loved us He bore our sin and took God's penalty in our place. We who deserved punishment received eternal life instead. For that reason we should no longer live for ourselves, but must live for the Lord.","因為你們是重價買來的，所以要在你們的身子上榮耀神。":"For you were bought with a price. Therefore glorify God in your body.","二、你對耶穌的主權的回應":"2. Your response to the lordship of Jesus","為主而活":"Living for the Lord","，這就是你對耶穌的主權應有的回應。為主而活的意思就是，按著祂的計劃去過你的生活。祂為你生命所作的計劃包括兩方面：":" — that is the response His lordship calls for. Living for the Lord means living your life according to His plan, and His plan for your life has two sides:","祂會時時刻刻看顧你的需要；你要時時刻刻按著祂的旨意而活。":"He watches over your needs at every moment; you live by His will at every moment.","神對你生命的計劃是什麼呢？神會逐步引導你去發掘和經驗，這是你需要用一生的時間去探索的。然而有一件事是你可以肯定的：":"What is God's plan for your life? He will lead you step by step to discover and experience it, and it will take a lifetime to explore. But one thing you may be sure of:","耶和華說：我知道我向你們所懷的意念是賜平安的意念，不是降災禍的意念，要叫你們末後有指望。":"For I know the thoughts that I think toward you, says Yahweh, thoughts of peace, and not of evil, to give you hope and a future.","神的計劃是最美好的，為什麼？":"God's plan is the best there is. Why?","神是愛":"God is love","——祂只計劃對我們最好的。":" — He plans nothing but the best for us.","神是智慧":"God is wise","——祂有能力計劃對我們最好的。":" — He is able to plan what is best for us.","神是全能":"God is almighty","——祂能移開任何攔阻祂對我們生命計劃的事物。":" — He can remove anything that stands in the way of His plan for our lives.","神是至高無上":"God is sovereign","——沒有什麼能攔阻祂對我們的計劃。":" — nothing can obstruct His plan for us.","主關心你甚於祂自己，祂應許要將生命中最好的事賜給你。單靠祂，必能實現！":"The Lord cares for you more than for Himself, and He has promised to give you the best that life holds. Rely on Him alone, and it will surely come to pass.","你必須將生命的各方面交託給耶穌作主，包括：婚姻、家庭、工作、計劃、目標、時間、思想、錢財和所擁有的一切。":"You must hand every area of life over to Jesus as Lord: your marriage, your family, your work, your plans, your goals, your time, your thoughts, your money and all you own.","A 關於主權的禱告":"A. A prayer about His lordship","主耶穌，我讚美祢，因為祢是我生命的主。祢是萬物之主，天上地下的所有事物都在祢的統管之下。謝謝祢總是把最好的給我；事實上祢已經把最好的給了我，就是把祢自己給了我，在十字架上為我而死。主啊！為此我是屬於祢的，我的生命是祢所賜的。如今我把自己獻上，讓祢作我生命之主。願祢賜我屬靈的智慧，讓我明白祢的旨意，使我所做的都蒙祢喜悅；賜我恩典與力量，好讓我忠心地跟隨祢。主啊！感謝祢，奉主耶穌的名禱告，阿們！":"Lord Jesus, I praise You, for You are the Lord of my life. You are Lord of all things, and everything in heaven and on earth is under Your rule. Thank You that You always give me the best; indeed You have already given me the very best, for You gave me Yourself and died for me on the cross. Lord, because of this I belong to You, and my life is Your gift. Now I offer myself up and let You be the Lord of my life. Give me spiritual wisdom to understand Your will, so that all I do may please You; give me grace and strength to follow You faithfully. Lord, I thank You. In the name of the Lord Jesus I pray. Amen!","B 順服主權的兩項基本表現":"B. Two basic marks of submitting to His lordship","1. 受洗":"1. Baptism","耶穌命令教會：":"Jesus commanded the church:","「所以，你們要去，使萬民作我的門徒，奉父、子、聖靈的名給他們施洗。」":"“Go and make disciples of all nations, baptising them in the name of the Father and of the Son and of the Holy Spirit.”","你決定委身跟隨耶穌，讓祂作你生命之主時，你就是主的門徒。順服耶穌的第一步，就是去實行祂在聖經上的教導——受洗。":"The moment you decided to commit yourself to following Jesus and to let Him be Lord of your life, you became His disciple. The first step of obedience to Him is to do what He taught in Scripture — be baptised.","受洗是人在得到救恩時，其屬靈地位轉變的象徵。它表示你與基督同死同葬（當祂為你的罪而死時），並且與祂一同復活，進入一個全新的生命。受洗是你在眾人面前所作的公開見證，表明自己從此不再過著以自我為中心犯罪的生活，而要完全地順服跟隨主。":"Baptism is the sign of the change in a person's spiritual standing at salvation. It says that you died and were buried with Christ when He died for your sin, and that you rose with Him into a wholly new life. Baptism is your public testimony before others that you will no longer live the self-centred life of sin, but will follow the Lord in full obedience.","2. 奉獻":"2. Giving","耶穌既然成為你生命之主，祂就是你生活中每一件事物的主宰，這包括了錢財。雖然神擁有萬物，祂不需要你的奉獻，但是你依然需要奉獻給神。奉獻錢財給神有三個原因：":"Since Jesus has become the Lord of your life, He is Lord over every part of it — money included. God owns everything and does not need your gift, yet you still need to give to Him. There are three reasons for giving money to God:","第一，":"First, ","奉獻是一種認同，承認神擁有你生命的一切。":"giving is an acknowledgement that God owns everything in your life.","第二，":"Second, ","奉獻表明你對神的委身。":"giving shows where your commitment to God lies.","「因為你的財寶在哪裏，你的心也在那裏。」":"“For where your treasure is, there your heart will be also.”","第三，":"Third, ","奉獻表示你感謝神供應你的一切需要。聖經命令你要將所得到的十分之一奉獻給神，聖經稱它為「十一奉獻」。":"giving expresses your thanks that God supplies all your needs. Scripture commands that a tenth of what you receive be given to God; the Bible calls this the tithe.","萬軍之耶和華說：你們要將當納的十分之一全然送入倉庫，使我家有糧，以此試試我，是否為你們敞開天上的窗戶，傾福與你們，甚至無處可容。":"Bring the whole tithe into the storehouse, that there may be food in my house, and test me now in this, says Yahweh of Armies, if I will not open you the windows of heaven, and pour you out a blessing, that there will not be room enough for.","你是否看見奉獻所帶來的應許？若是，你永不會奉獻過於神所賜給你的。":"Do you see the promise that comes with giving? If you do, you will never out-give what God gives you.","個 人 與 神 立 約 書":"A Personal Covenant With God","我奉主耶穌的名宣告：基督在十字架上贖回了我的生命，我誓約要讓基督作我生命之主；我的生命、財物以及未來，都將聽命於主。":"In the name of the Lord Jesus I declare: Christ redeemed my life at the cross, and I covenant to let Christ be the Lord of my life. My life, my possessions and my future will all be at His command.","我要經常禱告尋求，聆聽神對我說話，去瞭解神在生活中所要教導我的事。我要加入一個家組，讓它成為我的基本基督徒群體；藉著彼此間的服事，我要與他們一起成長；我也要和他們一起，把基督的福音傳給未信的人群。":"I will pray and seek Him regularly, listen to God speak to me, and learn what He would teach me in daily life. I will join a home group and make it my basic Christian community; serving one another, I will grow together with them; and together with them I will carry the gospel of Christ to those who do not yet believe.","我優先要作的，就是按著神的方式去與我的家人建立關係並服事他們。本著這樣的精神，我願意邀請神來掌管我的一生。":"My first priority is to build relationships with my own family in God's way and to serve them. In that spirit I invite God to take charge of my whole life.","立約人：":"Signed: ","見證人：":"Witness: ","日 期：":"Date: ","七週走到這裏，正好走到 321 的":"Seven weeks have brought us to the ","兩個核心":"two cores","讓耶穌作王，讓耶穌得到一切的榮耀":"let Jesus reign, and let Jesus receive all the glory","。第六課我們從寶座上退下來，這一課我們請主坐上去。":". In Lesson 6 we stepped down from the throne; in this lesson we ask the Lord to take the seat.","而受洗與奉獻，是「讓耶穌作王」看得見的第一步。接下來要走的，是":"Baptism and giving are the first visible steps of letting Jesus reign. What lies ahead is the ","一個目的":"one purpose","——建立屬神的體系：從你自己開始，到家庭、家組、職場，讓神的國降臨在你所在的每一塊領土上，直到主禱文成就：":" — building the system that belongs to God. Begin with yourself, then your family, your home group, your workplace, so that God's kingdom comes to every piece of ground you stand on, until the Lord's Prayer is fulfilled:","「願人都尊你的名為聖，願你的國降臨，願你的旨意行在地上如同行在天上。」":"“Hallowed be your name. Your Kingdom come. Your will be done on earth as it is in heaven.”","改變觀念就改變生命，改變生命就改變生活。":"Change the way you see and your life changes; change your life and your living changes.","改變，從我開始。":"And the change begins with me.","背誦哥林多後書五 15。":"Memorise 2 Corinthians 5:15.","向家組長詢問有關教會對於受洗所訂的規則。":"Ask your home group leader about the church's requirements for baptism.","開始將你所得的十分之一奉獻給神。":"Begin giving God a tenth of what you receive.","在「個人與神立約書」上簽名，與神立約。":"Sign the Personal Covenant With God, and make your covenant with Him.","幫助屬靈孩子明白基督主權的重要性，並在實際的方面操練基督的主權，如受洗和十一奉獻。":"Help your spiritual child understand why Christ's lordship matters, and practise it in concrete ways such as baptism and the tithe.","複習 約壹五 11-12、來十 25、約六 63、約十六 24、約壹一 9、林後五 15。若他還沒讀過第七課，先給他時間讀完。":"Review 1 John 5:11-12, Hebrews 10:25, John 6:63, John 16:24, 1 John 1:9 and 2 Corinthians 5:15. If he has not yet read Lesson 7, give him time to finish it first.","A 讓耶穌作主——「十件我喜歡的事」操練":"A. Letting Jesus be Lord — the “ten things I love” exercise","拿一張紙，中間畫一條線。左上方寫「耶穌是主」，右上方寫「十件我喜歡的事」。這十件可以是人、擁有物、興趣、活動、目標等。":"Take a sheet of paper and draw a line down the middle. Write “Jesus is Lord” at the top left and “ten things I love” at the top right. The ten may be people, possessions, interests, activities, goals and so on.","逐項察看，並問：「若要你在耶穌和這樣東西之間作選擇，你會選哪一個？」向他解釋：耶穌不會把這些東西拿去，耶穌是要我們享受一切美好的事物——":"Go through them one by one and ask, “if you had to choose between Jesus and this, which would you choose?” Explain that Jesus will not take these things away; He wants us to enjoy every good thing — ","「厚賜百物給我們享受的神」":"“God, who richly provides us with everything to enjoy”","。即使如此，神必須排在首位。把「十件我喜歡的事」欄中的項目劃掉，重新填寫在「耶穌是主」欄內。":". Even so, God must come first. Cross the items off the “ten things I love” column and write them again in the “Jesus is Lord” column.","接著":"Then ","分享「耶穌是主」對你個人生命的意義":"share what “Jesus is Lord” has meant in your own life","。坦白說，我們很多人無法說自己已經完全把生命的主權降服於主。讓耶穌作主是一生的學習，是在每日生活中培養的，我們必須每天在神面前降服自己。請坦白分享你自己在主權交託上的掙扎。":". Honestly, few of us could say we have surrendered the rule of our lives completely. Letting Jesus be Lord is the learning of a lifetime, cultivated in daily living, and we must surrender ourselves before God each day. Share your own struggles over that surrender openly.","B 你對耶穌主權的回應":"B. Your response to the lordship of Jesus","分享你奉獻給神的經歷，以及神如何賜福於你。鼓勵他開始十一奉獻。":"Share your own experience of giving to God and how He has blessed you. Encourage him to begin tithing.","問他是否已經做決志禱告，並在「個人與神立約書」上簽名。若他還未決志，瞭解原因，察覺他是否有任何恐懼或掙扎，鼓勵他與你一同作決志禱告。":"Ask whether he has prayed the prayer of commitment and signed the Personal Covenant With God. If he has not yet committed, find out why, look for any fear or struggle, and encourage him to pray that prayer with you.","鼓勵他認真計畫儘快受洗。讓他知道受洗前必須參加受洗班及更新營，並告訴他下次洗禮的日期。":"Encourage him to plan seriously for baptism as soon as possible. Tell him about the baptism class and retreat he will need to attend beforehand, and the date of the next baptism.","最後問：他對第七課有什麼回應或疑問？":"Close by asking: what response or questions does he have to Lesson 7?","若他還未決志，帶領他做決志禱告。":"If he has not yet committed, lead him in the prayer of commitment.","若他還未預備將主權交給神，為他所擔憂的任何原因禱告。":"If he is not yet ready to hand the rule over to God, pray about whatever is troubling him.","在禱告中敬拜神的主權。":"In prayer, worship God for His sovereign rule.","恭喜他完成整個課程！":"Congratulate him on finishing the whole course!","向他說明靈命成長不是自然發生的，他必須接著以下事件來培養：":"Explain that spiritual growth does not happen by itself; it must be cultivated by what follows:","繼續操練課程中所學的，特別是靈修會主、參加家組和聚會。":"Keep practising what the course has taught, especially listening to the Lord, and attending the home group and the meetings.","報名參加成長裝備課程，這有助於裝備自己成為耶穌的門徒。":"Enrol in the growth and equipping course, which helps equip him to be a disciple of Jesus.","靈修會主指引":"Listening to the Lord — a guide","用兩個月的時間，逐步讀完馬可福音":"Read through the Gospel of Mark step by step over two months","這份指引將帶領你逐步閱讀馬可福音。目的是引導你藉著聖經去聆聽神對你說話。每天你都要以禱告的心閱讀，並按著主題去瞭解有關經文，聆聽神要對你說的話。":"This guide will take you through Mark step by step. Its purpose is to lead you to hear God speak to you through Scripture. Read prayerfully each day, take in the passage according to its theme, and listen for what God would say to you.","先做讀經祈禱文":"Begin with a prayer before reading","主啊！求祢打開我的眼睛，使我看出祢律法的奇妙。":"Lord, open my eyes, that I may see wonderful things out of Your law.","主啊！求祢開啟我的心竅，使我能明白聖經。":"Lord, open my mind, that I may understand the Scriptures.","主啊！求祢賜給我悟性，使我可以學習祢的命令。":"Lord, give me understanding, that I may learn Your commandments.","主啊！求祢賞給我智慧和啟示的靈，使我真知道祢。":"Lord, give me a spirit of wisdom and revelation, that I may truly know You.","主啊！求祢幫助我按著正意分解真理的道。":"Lord, help me rightly to handle the word of truth.","主啊！求祢解開祢的話語，發出亮光，使我通達。":"Lord, unfold Your words; let them give light and understanding.","主啊！求祢的聖靈引導我進入真理，教導我遵行真理。":"Lord, let Your Holy Spirit guide me into the truth and teach me to walk in it.","主啊！求祢使我一生效法基督，一心榮耀上帝。":"Lord, make my whole life a following of Christ, and my whole heart a glorifying of God.","奉主耶穌的名禱告，阿們":"In the name of the Lord Jesus I pray. Amen","讀三遍經文":"Read the passage three times","第一遍 朗讀":"First reading — aloud","——出聲朗誦經文（用感情逐字慢慢朗讀）":" — read it out (slowly, word by word, with feeling)","第二遍 宣讀":"Second reading — declaring","——大聲宣告經文（每節後面可宣告阿們）":" — declare it aloud (you may say Amen after each verse)","第三遍 禱讀":"Third reading — praying","——輕聲禱告經文（隨從聖靈的引導禱告）":" — pray it softly (following the Holy Spirit's leading)","問兩個問題":"Ask two questions","◎ 這段經文講什麼？":"◎ What does this passage say?","出現什麼人物；發生什麼事情":"Who appears in it; what happens in it","◎ 上帝對我說什麼？":"◎ What is God saying to me?","給我什麼感動，要我怎麼行動":"What He is prompting in me, and how He wants me to act","——有什麼事情我要感謝":" — what is there for me to be thankful for","——有什麼罪惡我要承認":" — what sin is there for me to confess","命令":"Command","應許":"Promise","榜樣":"Example","——有什麼命令我要遵守":" — what command is there for me to keep","——有什麼應許我要領受":" — what promise is there for me to receive","——有什麼榜樣我要學習":" — what example is there for me to follow","背一節金句":"Memorise one verse","用「十全背經法」背一節有感動的經文：把經文拆成幾個段落，圍成一圈，從任何一段都能接下去。":"Use the circle method to memorise a verse that moved you: break it into a few phrases, set them in a ring, and practise until you can carry on from any phrase.","智慧的開端":"The beginning of wisdom","敬畏耶和華":"The fear of Yahweh","是智慧":"is wisdom's","的開端":"beginning","認識至聖者":"the knowledge of the Holy One","便是聰明":"is understanding","其餘三步":"The remaining three steps","讀靈命日糧":"Read a daily devotional","——默想文章內容和我的關係":" — reflect on how the reading bears on my own life","用信心禱告":"Pray in faith","——把今天的靈修所得化作禱告，為今天的生活所需獻上禱告":" — turn today's devotion into prayer, and pray for the day's needs","寫靈修筆記":"Keep a devotional notebook","——把今天的金句和領受寫在筆記上":" — write down today's verse and what you received","馬可福音讀經進度":"Mark reading plan","每天一段，兩個月讀完":"One passage a day, finished in two months","第一個月":"Month one","第二個月":"Month two","日":"Day","閱讀經文":"Passage","主題":"Theme","馬可福音簡介":"Introducing the Gospel of Mark","馬可福音是聖經第四十一卷書，新約第二卷，四福音書的第二本。馬可福音描述耶穌是神的僕人，因此沒有記下祂的家譜，也沒有記祂的出生和童年生活，而是用有力的手筆記述耶穌的事跡，把重心放在祂的工作，而不是祂的言論教訓。":"Mark is the forty-first book of the Bible, the second of the New Testament, and the second of the four Gospels. It presents Jesus as the servant of God, and so records no genealogy and nothing of His birth or childhood. Instead it recounts His deeds in a vigorous hand, placing the weight on His work rather than on His discourses.","祂的工作從受洗開始，受魔鬼試探、呼召門徒、傳道，直到受死釘十字架，最後從死裏復活。雖說耶穌來世上的目的是要服事人類，但馬可也特別強調祂是神的兒子，同時沒有忽略祂人性的一面。":"That work begins at His baptism and runs through the devil's temptation, the calling of the disciples and His preaching, on to the crucifixion, and finally the resurrection. Though Jesus came to serve humanity, Mark also stresses particularly that He is the Son of God, without neglecting His humanity.","馬可福音大綱":"An outline of Mark","耶穌傳道工作的預備 1:1-13":"Preparation for Jesus' ministry 1:1-13","耶穌在加利利的工作 1:14-6:56":"Jesus' work in Galilee 1:14-6:56","耶穌離開加利利地 7:1-9:50":"Jesus leaves Galilee 7:1-9:50","耶穌在比利亞的工作 10:1-52":"Jesus' work in Perea 10:1-52","耶穌在耶路撒冷的工作 11:1-13:37":"Jesus' work in Jerusalem 11:1-13:37","耶穌的受死與復活 14:1-16:20":"The death and resurrection of Jesus 14:1-16:20","重點：":"Emphasis: ","僕人的事奉（1-13 章）→ 僕人的犧牲（14-16 章）。":"the servant's ministry (chs. 1-13) → the servant's sacrifice (chs. 14-16).","主題：":"Subject: ","講道與神蹟（三年半）→ 受死與受難（八天）。":"preaching and miracles (three and a half years) → suffering and death (eight days).","地點：":"Places: ","加利利與比利亞 → 猶大與耶路撒冷。":"Galilee and Perea → Judea and Jerusalem.","時間：":"Dates: ","主後 29 至 33 年。":"AD 29 to 33.","聖經目錄口訣":"The books of the Bible, in order","舊約":"Old Testament","新約":"New Testament","創出利民申":"Genesis · Exodus · Leviticus · Numbers · Deuteronomy","書士得撒撒":"Joshua · Judges · Ruth · 1 & 2 Samuel","王王代代拉尼斯":"1 & 2 Kings · 1 & 2 Chronicles · Ezra · Nehemiah · Esther","伯詩箴傳歌":"Job · Psalms · Proverbs · Ecclesiastes · Song of Songs","賽耶哀結但":"Isaiah · Jeremiah · Lamentations · Ezekiel · Daniel","何珥摩 俄拿彌 鴻哈番 該亞瑪":"Hosea · Joel · Amos · Obadiah · Jonah · Micah · Nahum · Habakkuk · Zephaniah · Haggai · Zechariah · Malachi","口訣：創初利民生／舒適得傻傻／往往呆呆拉你死／博士真傳鴿／撒野愛結蛋／荷爾蒙 餓拿米 轟哈番 蓋啞馬":"Groupings: the Law (5) / History (12) / Poetry and Wisdom (5) / Major Prophets (5) / Minor Prophets (12).","舊約創業之道就是初期要有利民生需要，結果太舒適了，人變得傻傻，往往人呆呆得要拉你去死。博士知道後真的傳了一隻信鴿去救人，但是鴿子卻撒野不愛傳信只愛結蛋，因為發情荷爾蒙分泌過多，並且肚子餓了就偷拿米吃，還用米轟擊哈番，蓋住哈番騎的啞巴馬。":"The Chinese edition uses a sound-alike story to fix the order of the books in memory. English readers may find it easier to learn the five groupings above, and then the books within each.","太可路約徒":"Matthew · Mark · Luke · John · Acts","羅林林加弗":"Romans · 1 & 2 Corinthians · Galatians · Ephesians","腓西帖帖":"Philippians · Colossians · 1 & 2 Thessalonians","提提多門":"1 & 2 Timothy · Titus · Philemon","來雅彼彼":"Hebrews · James · 1 & 2 Peter","約約約猶啟":"1, 2 & 3 John · Jude · Revelation","口訣：待客滷野兔／螺淋淋加氟／肥吸貼貼／踢踢跺門／來呀嗶嗶／約約夜遊去":"Groupings: the Gospels and Acts (5) / Paul's letters (13) / the General Letters (8) / Revelation (1).","新約的待客之道就是滷一隻野兔，用螺汁淋一淋調味，再加點氟防止蛀牙；肥油吸一吸，再把肉貼一貼才不會發胖。吃飯前要踢一踢腳再跺一跺門，吃飯後來呀吹哨子嗶嗶集合，大家約約一起夜遊去。":"As with the Old Testament, the Chinese edition uses a sound-alike story here. English readers may prefer to learn the four groupings above.","預備心迎見神":"Prepare your heart to meet God","靠著聖靈面對惡者":"Face the evil one by the Spirit","跟隨耶穌，作得人的漁夫":"Follow Jesus and fish for people","耶穌是主，勝過撒但與疾病":"Jesus is Lord over Satan and sickness","耶穌也會自己靈修會主":"Jesus too listened to the Father alone","耶穌願意行醫治":"Jesus is willing to heal","眾人的禱告大有能力":"The prayers of many have great power","神的處事方式與人不同":"God does things differently from people","耶穌富憐憫之心，不墨守成規":"Jesus is full of mercy, not bound by convention","耶穌呼召我們跟隨祂":"Jesus calls us to follow Him","耶穌也遭人誤解和拒絕":"Jesus too was misunderstood and rejected","順服耶穌使你更接近祂":"Obeying Jesus draws you closer to Him","你要如何回應神的教導":"How will you respond to God's teaching","靈修會主去瞭解真理":"Listen to the Lord to understand the truth","耶穌是你生活中風浪的主":"Jesus is Lord of the storms in your life","耶穌能釋放牢固的捆綁":"Jesus can break the firmest bondage","耶穌總是及時趕到":"Jesus always arrives in time","當情況越來越糟，神依然有盼望":"When things worsen, God still holds hope","不信會攔阻神在我們生命的運作":"Unbelief blocks God's work in our lives","教導、醫治和釋放的事工":"A ministry of teaching, healing and deliverance","為主而活需要付極大的代價":"Living for the Lord costs a great deal","耶穌餵飽五千人":"Jesus feeds the five thousand","憑信心而活的功課":"Lessons in living by faith","按神的命令行事，而非人的指示":"Act on God's command, not people's instructions","真正的污穢是從心裏發出":"Real defilement comes out of the heart","禱告要恆切":"Be persistent in prayer","神的作為令人稀奇":"God's works are astonishing","耶穌既憐憫又體貼人的需要":"Jesus is both merciful and attentive to need","你還不明白嗎":"Do you still not understand?","神按其時間行事":"God works to His own timing","追求神的心意而不討人的喜悅":"Seek God's will, not people's approval","別指示神行事，要聽祂指示":"Do not instruct God; listen for His instruction","在信的人凡事都能":"All things are possible to him who believes","神的方式：最小的為最大":"God's way: the least is the greatest","服事人，別絆倒他們":"Serve people; do not trip them up","離婚並非神的旨意":"Divorce is not God's will","以單純的信心信靠神":"Trust God with a simple faith","別讓財富阻擋你得到神美好旨意":"Do not let wealth block God's good will for you","服事人的生活方式是門訓的關鍵":"A life of serving is the key to discipleship","別讓任何事影響你的信心":"Let nothing shake your faith","敬拜王者耶穌":"Worship Jesus the King","禱告時要期望得到應允":"Pray expecting an answer","要敬拜神，不是利用祂":"Worship God; do not use Him","主耶穌的權柄是不容置疑的":"The Lord Jesus' authority is beyond question","別拒絕了生命的真正房角石":"Do not reject the true cornerstone of life","對神盡責，也當對人盡責":"Give God His due, and people theirs","誤解導致誤用":"Misunderstanding leads to misuse","基督徒生活就是愛神和愛人":"The Christian life is loving God and loving people","真正的信仰在於態度而非外表":"Real faith is a matter of attitude, not appearance","奉獻即使微不足道，神依然重視":"However small the gift, God values it","別將生命寄託在終將毀滅的事物上":"Do not stake your life on what will perish","為主再來作好準備":"Be ready for the Lord's return","要儆醒，因不知基督何時再來":"Keep watch, for no one knows when Christ returns","耶穌配得珍貴的奉獻":"Jesus is worthy of a costly offering","勿忘耶穌在十字架為你成就的事":"Never forget what Jesus accomplished for you at the cross","別人背叛時，依然忠於神":"Stay faithful to God when others betray","被人誣告時，依然忠於神":"Stay faithful to God when falsely accused","受人奚落時，依然忠於神":"Stay faithful to God when mocked","在神似乎離棄你時仍活在神的旨意中":"Live in God's will even when He seems to have left you","作耶穌忠誠的好友":"Be a loyal friend to Jesus","你信的是一位活著的救主":"The Saviour you believe in is alive","與世人分享復活救主的福音":"Share the risen Saviour's good news with the world","可一 9-13":"Mark 1:9-13","可九 30-37":"Mark 9:30-37","可九 38-50":"Mark 9:38-50","可七 1-13":"Mark 7:1-13","可八 1-10":"Mark 8:1-10","可六 14-29":"Mark 6:14-29","可五 1-20":"Mark 5:1-20","可十二 28-34":"Mark 12:28-34","可五 25-34":"Mark 5:25-34","可六 7-13":"Mark 6:7-13","可五 21-24,35-43":"Mark 5:21-24,35-43","可一 1-8":"Mark 1:1-8","可十二 35-40":"Mark 12:35-40","可十二 13-17":"Mark 12:13-17","可七 24-30":"Mark 7:24-30","可十一 27-33":"Mark 11:27-33","可十一 15-19":"Mark 11:15-19","可三 7-19":"Mark 3:7-19","可十 46-52":"Mark 10:46-52","可七 31-37":"Mark 7:31-37","可六 45-56":"Mark 6:45-56","可十四 10-25":"Mark 14:10-25","可十五 40-47":"Mark 15:40-47","可二 1-12":"Mark 2:1-12","可四 35-41":"Mark 4:35-41","可十一 12-14,20-26":"Mark 11:12-14,20-26","可一 14-20":"Mark 1:14-20","可一 21-34":"Mark 1:21-34","可八 27-38":"Mark 8:27-38","可八 22-26":"Mark 8:22-26","可十二 41-44":"Mark 12:41-44","可六 30-44":"Mark 6:30-44","可十五 33-39":"Mark 15:33-39","可一 40-45":"Mark 1:40-45","可十 32-45":"Mark 10:32-45","可四 21-34":"Mark 4:21-34","可十六 1-13":"Mark 16:1-13","可二 23-三 6":"Mark 2:23-3:6","可十 17-31":"Mark 10:17-31","可十二 18-27":"Mark 12:18-27","可十五 1-32":"Mark 15:1-32","可二 13-22":"Mark 2:13-22","可九 1-13":"Mark 9:1-13","可十 13-16":"Mark 10:13-16","可十三 3-27":"Mark 13:3-27","可十三 1-2":"Mark 13:1-2","可十四 1-9":"Mark 14:1-9","可八 11-21":"Mark 8:11-21","可一 35-39":"Mark 1:35-39","可十 1-12":"Mark 10:1-12","可十一 1-11":"Mark 11:1-11","可六 1-6":"Mark 6:1-6","可十四 26-50":"Mark 14:26-50","可九 14-29":"Mark 9:14-29","可十三 28-37":"Mark 13:28-37","可十六 14-20":"Mark 16:14-20","可十二 1-12":"Mark 12:1-12","可十四 51-72":"Mark 14:51-72","可七 14-23":"Mark 7:14-23","可四 1-20":"Mark 4:1-20","可三 20-30":"Mark 3:20-30","可三 31-35":"Mark 3:31-35","附":"A"}</script>
<script>
/* =========================================================
   321 福音同行　語言引擎
   繁體＝原文；簡體＝即時轉換；英文＝對照字典
   資料一律不動，只轉換畫面上看見的字。
   ========================================================= */
(function () {
'use strict';

const KEY = 'lang', LANGS = ['tc', 'sc', 'en'];
let lang = 'tc';
try { const v = JSON.parse(localStorage.getItem(KEY) || '"tc"'); if (LANGS.indexOf(v) >= 0) lang = v; } catch (e) {}

function readJSON(id) {
  const el = document.getElementById(id);
  if (!el) return null;
  try { return JSON.parse(el.textContent); } catch (e) { return null; }
}

/* ---------------- 繁 → 簡 ---------------- */
let SC = null;
function scTable() {
  if (SC) return SC;
  const t = readJSON('d-sc');
  if (!t) return (SC = { s: {}, p: [] });
  const c = t.c || '', s = {};
  for (let i = 0; i + 1 < c.length; i += 2) s[c[i]] = c[i + 1];
  SC = { s: s, p: t.p || [] };
  return SC;
}
function toSC(str) {
  const t = scTable();
  let out = str;
  for (let i = 0; i < t.p.length; i++) {
    const k = t.p[i][0];
    if (out.indexOf(k) >= 0) out = out.split(k).join(t.p[i][1]);
  }
  let r = '';
  for (let i = 0; i < out.length; i++) { const ch = out.charAt(i); r += (t.s[ch] || ch); }
  return r;
}

/* ---------------- 中 → 英 ---------------- */
let EN = null;
function toEN(str) {
  if (!EN) EN = readJSON('d-en') || {};
  const m = str.match(/^(\s*)([\s\S]*?)(\s*)$/);
  const head = m[1], tail = m[3];
  const key = m[2].replace(/\s+/g, ' ');
  if (!key) return str;
  let v = EN[key];
  if (v === undefined) {
    const nums = [];
    const norm = key.replace(/\d+/g, function (x) { nums.push(x); return '#'; });
    const t = EN[norm];
    if (t !== undefined) { let i = 0; v = t.replace(/#/g, function () { return nums[i++] || '#'; }); }
  }
  if (v === undefined) return str;
  return head + v + tail;
}

const HAS_CJK = /[\u3001-\u303f\u3400-\u9fff]/;
function tr(str) {
  if (!str || !HAS_CJK.test(str)) return str;
  if (lang === 'sc') return toSC(str);
  if (lang === 'en') return toEN(str);
  return str;
}

/* ---------------- 套用到畫面 ---------------- */
const ATTRS = ['placeholder', 'aria-label', 'title', 'alt'];
function doNode(n) {
  if (!n) return;
  if (n.nodeType === 3) {
    if (n.__lz === n.nodeValue) return;
    const v = tr(n.nodeValue);
    if (v !== n.nodeValue) n.nodeValue = v;
    n.__lz = n.nodeValue;
  } else if (n.nodeType === 1) {
    for (let i = 0; i < ATTRS.length; i++) {
      const a = ATTRS[i];
      if (n.hasAttribute && n.hasAttribute(a)) {
        const o = n.getAttribute(a), v = tr(o);
        if (v !== o) n.setAttribute(a, v);
      }
    }
  }
}
const FILTER = { acceptNode: function (n) {
  if (n.nodeType === 1) {
    const t = n.tagName;
    if (t === 'SCRIPT' || t === 'STYLE' || t === 'IFRAME' || t === 'TEXTAREA') return NodeFilter.FILTER_REJECT;
  }
  return NodeFilter.FILTER_ACCEPT;
} };
function walk(root) {
  if (lang === 'tc' || !root) return;
  doNode(root);
  if (root.nodeType !== 1 && root.nodeType !== 9 && root.nodeType !== 11) return;
  if (root.nodeType === 1 && (root.tagName === 'SCRIPT' || root.tagName === 'STYLE')) return;
  let w;
  try { w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, FILTER); }
  catch (e) { return; }
  let n;
  while ((n = w.nextNode())) doNode(n);
}

const mo = new MutationObserver(function (ms) {
  if (lang === 'tc') return;
  for (let i = 0; i < ms.length; i++) {
    const m = ms[i];
    if (m.type === 'characterData') doNode(m.target);
    else if (m.type === 'attributes') doNode(m.target);
    else for (let j = 0; j < m.addedNodes.length; j++) walk(m.addedNodes[j]);
  }
});

function start() {
  document.documentElement.setAttribute('lang',
    lang === 'en' ? 'en' : lang === 'sc' ? 'zh-Hans' : 'zh-Hant');
  if (lang !== 'tc') walk(document.body);
  mo.observe(document.documentElement, {
    childList: true, subtree: true, characterData: true,
    attributes: true, attributeFilter: ATTRS
  });
}
if (document.body) start();
else document.addEventListener('DOMContentLoaded', start);

window.I18N = {
  get lang() { return lang; },
  ttsLang: function () { return lang === 'en' ? 'en-US' : lang === 'sc' ? 'zh-CN' : 'zh-TW'; },
  tr: tr,
  set: function (v) {
    if (LANGS.indexOf(v) < 0 || v === lang) return;
    try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {}
    location.reload();
  }
};

})();
</script>
