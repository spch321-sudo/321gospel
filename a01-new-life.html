<style>
:root{
  --paper:#F6F2EC;
  --paper-2:#FFFDFA;
  --ink:#22201E;
  --ink-soft:#5A544E;
  --line:#E0D8CD;
  --crimson:#A8172B;
  --crimson-deep:#7C1020;
  --crimson-wash:#F5E3E4;
  --teal:#0E7C74;
  --teal-wash:#E2F0EE;
  --fs:19px;
  --serif:"Noto Serif TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
html.fs-1{--fs:17px} html.fs-2{--fs:19px} html.fs-3{--fs:22px} html.fs-4{--fs:25px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:var(--fs);line-height:1.95;
  letter-spacing:.02em;
  padding-bottom:env(safe-area-inset-bottom);
}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:6px}

/* ── 頁首 ───────────────────────── */
.bar{
  position:sticky;top:0;z-index:50;
  background:var(--crimson);color:#fff;
  padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;
  display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 10px rgba(124,16,32,.25);
}
.bar .home{
  font-size:.72em;font-weight:700;letter-spacing:.12em;
  border:1.5px solid rgba(255,255,255,.55);border-radius:999px;
  padding:4px 11px;background:none;color:#fff;cursor:pointer;flex:none;
}
.bar h1{font-family:var(--serif);font-size:.95em;font-weight:700;margin:0;flex:1;letter-spacing:.06em;line-height:1.4}
.bar .tools{display:flex;gap:6px;flex:none}
.tbtn{
  background:rgba(255,255,255,.14);border:none;color:#fff;
  width:38px;height:38px;border-radius:11px;font-size:.8em;font-weight:700;
  cursor:pointer;font-family:var(--sans);
}
.tbtn:active{background:rgba(255,255,255,.3)}
.tbtn.on{background:#fff;color:var(--crimson)}

/* ── 版心 ───────────────────────── */
main{max-width:44rem;margin:0 auto;padding:0 18px 90px}
section[hidden]{display:none}

/* ── 封面／目錄 ─────────────────── */
.cover{padding:34px 0 8px;text-align:center}
.cover .code{
  display:inline-block;background:var(--ink);color:var(--paper);
  font-weight:900;letter-spacing:.18em;font-size:.7em;
  padding:5px 14px;border-radius:999px;
}
.cover h2{
  font-family:var(--serif);font-weight:900;
  font-size:2.5em;line-height:1.25;margin:.4em 0 .1em;letter-spacing:.04em;
}
.cover h2 em{font-style:normal;color:var(--crimson)}
.cover .sub{color:var(--ink-soft);font-size:.85em;margin:0}
.heart{width:92px;height:92px;margin:22px auto 4px;display:block}

.lead{
  background:var(--paper-2);border:1px solid var(--line);border-radius:16px;
  padding:20px 20px 16px;margin:26px 0 8px;
}
.lead p{margin:0 0 .8em}
.lead p:last-child{margin-bottom:0}

/* 七週旅程 */
.journey{list-style:none;margin:30px 0 0;padding:0;position:relative}
.journey::before{
  content:"";position:absolute;left:23px;top:26px;bottom:26px;width:2px;
  background:linear-gradient(var(--crimson-wash),var(--crimson),var(--crimson-wash));
}
.journey li{position:relative;margin:0 0 12px}
.journey button{
  width:100%;text-align:left;background:var(--paper-2);
  border:1px solid var(--line);border-radius:14px;
  padding:14px 16px 14px 62px;cursor:pointer;
  font-family:var(--sans);font-size:1em;color:var(--ink);line-height:1.6;
  transition:border-color .18s,transform .18s;
}
.journey button:active{transform:scale(.985)}
.journey button:hover{border-color:var(--crimson)}
.journey .pip{
  position:absolute;left:9px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:50%;
  background:var(--crimson);color:#fff;
  display:grid;place-items:center;font-weight:900;font-size:.72em;
  box-shadow:0 0 0 5px var(--paper);
}
.journey .wk{display:block;font-size:.68em;letter-spacing:.16em;color:var(--crimson);font-weight:700}
.journey .ttl{display:block;font-family:var(--serif);font-weight:700;font-size:1.05em}
.journey .memo{display:block;font-size:.72em;color:var(--ink-soft);margin-top:2px}
.journey li.appendix .pip{background:var(--teal)}
.journey li.appendix .wk{color:var(--teal)}
.journey li.appendix button:hover{border-color:var(--teal)}

/* ── 課文 ───────────────────────── */
.eyebrow{
  font-size:.7em;letter-spacing:.24em;color:var(--crimson);
  font-weight:700;margin:30px 0 4px;
}
.lsn-title{
  font-family:var(--serif);font-weight:900;font-size:1.85em;
  line-height:1.35;margin:0 0 2px;letter-spacing:.03em;
}
.lsn-sub{color:var(--ink-soft);font-size:.85em;margin:0 0 22px}

.verse{
  position:relative;background:var(--crimson-wash);
  border-radius:16px;padding:22px 20px 18px;margin:0 0 26px;
}
.verse .tag{
  position:absolute;top:-11px;left:18px;background:var(--crimson);color:#fff;
  font-size:.66em;font-weight:700;letter-spacing:.2em;padding:3px 12px;border-radius:999px;
}
.verse p{
  font-family:var(--serif);font-weight:600;font-size:1.12em;
  line-height:1.9;margin:0;color:var(--crimson-deep);
}
.verse .ref{display:block;text-align:right;font-size:.72em;font-family:var(--sans);font-weight:700;margin-top:8px;letter-spacing:.08em}

h3{
  font-family:var(--serif);font-size:1.22em;font-weight:700;
  margin:34px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--line);
  letter-spacing:.04em;
}
h4{font-size:1em;font-weight:700;margin:24px 0 6px;color:var(--crimson-deep)}
p{margin:0 0 1.05em}
q,.q{font-family:var(--serif);color:var(--crimson-deep)}
.ref-in{font-size:.78em;color:var(--ink-soft);white-space:nowrap}
ul,ol{padding-left:1.35em;margin:0 0 1.1em}
li{margin-bottom:.5em}
.plain{list-style:none;padding-left:0}

.quote{
  border-left:4px solid var(--crimson);background:var(--paper-2);
  padding:14px 16px;border-radius:0 12px 12px 0;margin:0 0 1.2em;
  font-family:var(--serif);
}
.quote .ref{display:block;text-align:right;font-family:var(--sans);font-size:.75em;color:var(--ink-soft);margin-top:6px}

/* 321 亮光 */
.light{
  background:var(--teal-wash);border-radius:16px;padding:18px 18px 14px;margin:28px 0;
  border:1px solid rgba(14,124,116,.22);
}
.light h5{
  margin:0 0 8px;font-size:.72em;letter-spacing:.2em;color:var(--teal);font-weight:900;
}
.light p{margin:0 0 .7em;font-size:.94em}
.light p:last-child{margin-bottom:0}

/* 本週實踐 */
.practice{background:var(--paper-2);border:1px dashed var(--crimson);border-radius:16px;padding:20px 18px 12px;margin:30px 0}
.practice h3{border:none;margin:0 0 12px;padding:0;font-size:1.08em;color:var(--crimson-deep)}
.check{list-style:none;padding:0;margin:0}
.check li{display:flex;gap:11px;align-items:flex-start;margin-bottom:.75em}
.check input{
  appearance:none;-webkit-appearance:none;flex:none;
  width:1.35em;height:1.35em;margin-top:.28em;border:2px solid var(--crimson);
  border-radius:6px;cursor:pointer;background:#fff;position:relative;
}
.check input:checked{background:var(--crimson)}
.check input:checked::after{
  content:"✓";position:absolute;inset:0;color:#fff;font-size:.9em;
  display:grid;place-items:center;font-weight:900;
}
.check label{cursor:pointer;flex:1}
.check input:checked + label{color:var(--ink-soft);text-decoration:line-through}

/* 老師本 */
.teach{
  background:#fff;border:2px solid var(--teal);border-radius:16px;
  padding:20px 18px 14px;margin:30px 0;
}
.teach>h3{
  border:none;margin:0 0 4px;padding:0;color:var(--teal);font-size:1.05em;
  display:flex;align-items:center;gap:9px;
}
.teach>h3::before{
  content:"師";background:var(--teal);color:#fff;width:1.7em;height:1.7em;
  border-radius:8px;display:grid;place-items:center;font-size:.8em;flex:none;
}
.teach .aim{background:var(--teal-wash);border-radius:11px;padding:12px 14px;margin:12px 0 16px;font-size:.94em}
.teach h4{color:var(--teal);border-top:1px solid var(--line);padding-top:14px}
.teach h4:first-of-type{border-top:none;padding-top:0}
.teach ul{font-size:.96em}
.teach-off{display:none}

/* 寶座圖 */
.thrones{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}
.throne{
  background:var(--paper-2);border:1px solid var(--line);border-radius:16px;
  padding:16px 12px;text-align:center;
}
.throne .glyph{
  font-family:var(--serif);font-weight:900;font-size:2.6em;line-height:1;
  display:block;margin:6px 0 10px;
}
.throne.self{border-color:var(--ink-soft)}
.throne.self .glyph{color:var(--ink-soft)}
.throne.christ{border-color:var(--crimson);background:var(--crimson-wash)}
.throne.christ .glyph{color:var(--crimson)}
.throne b{display:block;font-size:.88em;margin-bottom:6px}
.throne small{display:block;font-size:.76em;color:var(--ink-soft);line-height:1.7}

/* 十全背經圖 */
.wheel{max-width:330px;margin:16px auto 24px;display:block}

/* 讀經表 */
.plan{width:100%;border-collapse:collapse;font-size:.86em;margin:0 0 22px}
.plan th{background:var(--crimson);color:#fff;padding:8px 6px;font-size:.9em;letter-spacing:.06em}
.plan td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}
.plan td:first-child{width:2.4em;text-align:center;color:var(--crimson);font-weight:700}
.plan td:nth-child(2){width:7.2em;white-space:nowrap;font-weight:500}

/* 五指禱告 */
.finger{display:grid;gap:10px;margin:0 0 24px}
.finger div{
  background:var(--paper-2);border:1px solid var(--line);border-radius:13px;
  padding:12px 14px;display:flex;gap:12px;align-items:baseline;
}
.finger b{font-family:var(--serif);color:var(--crimson);font-size:1.1em;flex:none;width:2.6em}

/* 立約書 */
.covenant{
  background:var(--paper-2);border:2px solid var(--crimson);border-radius:16px;
  padding:22px 18px;margin:26px 0;font-family:var(--serif);
}
.covenant h4{font-family:var(--sans);text-align:center;margin:0 0 14px;letter-spacing:.14em}
.sign{display:flex;gap:10px;align-items:flex-end;margin-top:20px;font-family:var(--sans);font-size:.85em}
.sign span{flex:1;border-bottom:1.5px solid var(--ink)}

/* 經文卡 */
.cards{display:grid;gap:12px;margin:0 0 24px}
.card{
  background:linear-gradient(135deg,var(--crimson) 0%,var(--crimson-deep) 100%);
  color:#fff;border-radius:14px;padding:16px 18px;
}
.card b{display:block;font-size:.72em;letter-spacing:.18em;opacity:.85;margin-bottom:6px}
.card p{font-family:var(--serif);margin:0;font-size:1.02em;line-height:1.85}

/* 導覽 */
.nav{display:flex;gap:10px;margin:40px 0 0}
.nav button{
  flex:1;background:var(--paper-2);border:1.5px solid var(--crimson);color:var(--crimson);
  border-radius:13px;padding:14px 8px;font-family:var(--sans);font-size:.9em;font-weight:700;
  cursor:pointer;
}
.nav button:disabled{opacity:.3;cursor:default}
.nav button.primary{background:var(--crimson);color:#fff}

footer{text-align:center;color:var(--ink-soft);font-size:.72em;padding:34px 0 0;line-height:2}
footer b{color:var(--crimson)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.thrones{grid-template-columns:1fr}}
</style>

const HEART = `<svg class="heart" viewBox="0 0 100 92" aria-hidden="true">
<path d="M50 88C22 68 4 52 4 32 4 18 15 8 28 8c9 0 16 5 22 13 6-8 13-13 22-13 13 0 24 10 24 24 0 20-18 36-46 56z" fill="#A8172B"/>

const LESSONS = [
{
  wk:"第一課", ttl:"開始你的新生命", memo:"七件重要的事", verse:null,
  body:`
<p>當你接受耶穌基督進入你的生命作你的主和救主的那一刻，你就開始你的新生命。</p>
<div class="quote">若有人在基督裏，他就是新造的人，舊事已過，都變成新的了。<span class="ref">哥林多後書五 17</span></div>
<p>這本《開始你的新生命》正是為了幫助你開始去過基督裏的新生命而編寫的。在你開始經歷基督裏的新生命時，你需要做七件重要的事。</p>

<h3>一、開始參加教會</h3>
<p>神的心意是要祂的信徒聚集。基督徒應該每週參加教會的聚會，好讓屬靈生命健康成長。</p>

<h3>二、買一本聖經</h3>
<p>聖經是你生命中最重要的書，因為它是神的話語。買一本聖經，認真研讀它。你可以請你的屬靈父母給你意見，買一本合適的聖經。</p>

<h3>三、加入一個家組</h3>
<p>身為一個初信的基督徒，最重要的事就是參加一個家組。這是一個基本的基督徒社群。你可以在家組中認識其他信徒，他們能幫助你更明白作基督徒的意義。家組為你提供成長的環境。</p>

<h3>四、閱讀本書</h3>
<p>本書共有七課，需要七個星期完成。每課分成兩部分：一部分供閱讀，另一部分為應用。建議你用兩天的時間來做，每天做一部分，這樣你便有時間慢慢領會其中的真理，而不是趕快讀完。</p>
<h4>請使用以下的閱讀方針</h4>
<ol>
<li><b>求神向你說話</b>：你將得到你所期望的。</li>
<li><b>背誦每週金句</b>。<span class="q">「我將你的話藏在心裏，免得我得罪你。」</span><span class="ref-in">（詩一一九 11）</span>熟記經文是把神的話藏在心裏的方法之一。它最大的好處，就是讓你在需要某段經文的時候，即使手上沒有聖經，也垂手可得。請使用書中的「十全背經圖」來背誦和複習。</li>
<li><b>仔細讀過各課內容</b>，以禱告的心思想其中的真理，把它應用在生活裏。</li>
<li><b>在本週經歷你的新生命</b>。應用真理是最重要的。我們都需要水才能生存，但擁有水還不夠，還得喝下去才行！</li>
<li><b>和人分享</b>你所學習的。</li>
</ol>

<h3>五、聆聽神的聲音</h3>
<p>聆聽神的聲音就是被聖靈感動，在心裏領受從神而來的意念，這是基督徒生活中的重要部分。第四課將幫助你學會如何聆聽神的話語。從現在開始，你要每天撥出時間與神獨處，聆聽祂的聲音，並把領受寫在靈修筆記上。</p>
<p>請使用附錄的「靈修會主指引」來閱讀馬可福音。藉著這份指引，你將用兩個月的時間讀完整卷馬可福音。</p>

<h3>六、與你的屬靈父母約見</h3>
<p>在這新生命的起點上，需要有人指導你，幫助你在屬靈上成長。你的家組長會安排一位家人作你的屬靈父母。他會每星期與你約見，討論你這星期所得的心得和啟示，並與你一起禱告。</p>

<h3>七、向周圍的人傳揚耶穌</h3>
<p>當我們聽到好消息，總是渴望和四周的人、尤其是我們所愛的人分享。這個能確定我們永恆未來和命運的好消息，更要努力向他們傳揚。我們可以和他們分享如何認識耶穌，以及祂在你身上所作的工作。</p>
`,
  light:`<p><b>三個基礎，從第一天就開始。</b>買聖經，是因為<b>聖經是我的準則</b>；讀馬可福音認識耶穌，是因為<b>耶穌是我的榜樣</b>；學習聆聽神的聲音，是因為<b>聖靈是我的引導</b>。這七件事不是七項功課，是三個基礎落在生活裏的樣子。</p>
<p>次序也要對：<b>先生命、再關係、後事工</b>。所以先有新生命，再進家組建立關係，最後才是向人傳揚。不要把次序顛倒了。</p>`,
  practice:[

    "預先讀完第二課。"
  ],
  teach:{
    aim:"這是第一次會面。目的是彼此認識、確定對方明白福音、介紹整個課程的走法。本課約 45 分鐘。",
    blocks:[
      ["I、彼此認識（15 分鐘）",`<ul>
<li><b>敞開分享自己</b>，這會幫助對方更有勇氣敞開。可以問：你有幾個兄弟姐妹？你最親的人是誰？你家人的宗教信仰為何？你會如何形容你 7～12 歲之間的生活？</li>
<li><b>自我介紹為他的屬靈父母</b>：讓對方知道你願意委身陪伴他生命的成長，特別是開始的階段，所以希望接下來六週固定見面。</li>
<li><b>定下固定的見面時間與地點</b>。若可行，定在屬靈孩子的家，這也能幫助你更認識他的家庭。</li></ul>`],
      ["II、複習 約三 16（15 分鐘）",`<p>確保他明白福音，並知道自己為何成為基督徒。複習之後問：<span class="q">「為什麼你會成為基督徒？」</span>答案應包含：</p>

  wk:"第二課", ttl:"你與神的新關係", memo:"開始你的新關係（一）",
  verse:{t:"這見證就是神賜給我們永生；這永生也是在他兒子裏面。人有了神的兒子就有生命，沒有神的兒子就沒有生命。",r:"約翰壹書五 11-12"},
  body:`
<p>當你成為一位基督徒時，你也同時開啟了兩道新的關係：<b>你與神的新關係</b>，和<b>你與神的家的新關係</b>。這兩者必須相輔相成，缺一不可，你必須兩者兼備，才能完全地體驗到神為你預備的一切。</p>

<h3>一、你與神的新關係的開端</h3>
<p>你與神的新關係是如何開始的？是在你憑信心接受耶穌進入你的生命時開始的。本週金句提到兩種人：第一種人有耶穌住在他們生命中，他們也因此有了永生；另一種沒有耶穌住在生命中，因此沒有永生。</p>
<p>基督徒有耶穌住在生命中，因為他們相信祂，並接受祂進入生命裏。因此當你決定相信耶穌並邀請祂進入生命時，祂就接受邀請而進入，祂的靈也從此進入你的生命裏。</p>
<div class="quote">神的靈既然住在你們裏面，你們就不是屬於肉體，而是屬於聖靈的了。<span class="ref">羅馬書八 9</span></div>

<h3>二、你與神的新關係的意義</h3>
<h4>A　它是一個認識神的關係</h4>
<p>當你相信並接受耶穌基督作你的主和救主時，你也得著了永生。然而這永生到底是什麼？</p>
<div class="quote">認識你——獨一的真神，並且認識你所差來的耶穌基督，這就是永生。<span class="ref">約翰福音十七 3</span></div>
<p>有了永生，你死後就會到天堂永遠與神同在。雖然如此，你卻不必等到死後才能經歷這永恆的生命。永生在你相信基督作生命之主和救主的那一刻已經開始了，它是真實的，你現在就可以經驗到。</p>
<p>永生不單只是知道有關神的事實，而是藉著與神建立個人的關係去認識祂。基督教信仰並非一種宗教，而是一種個人關係——與那一位獨一的、永活的真神建立個人的關係。因此你已經踏上這段漫長的人生旅程，你將在一生中不斷體會經歷，愈來愈認識神。</p>

<h4>B　它是一個父與子的關係</h4>
<div class="quote">凡接受祂的，就是信祂名的人，祂就賜給他們權利，成為神的兒女。<span class="ref">約翰福音一 12</span></div>
<p>當你相信並接受耶穌基督進入生命中，你也同時成了神的兒女。意即：神是你的父，你與神的關係是一種父子關係。因為你已成為神的兒女，神已賜下祂的聖靈來引導你——<span class="q">「因為蒙神的靈引導的，都是神的兒子。」</span><span class="ref-in">（羅八 14）</span></p>
<p>還記得嗎？當你接受耶穌時，祂就接受邀請進入你的生命中，祂的靈從此就住在你心裏。日後當你學會聆聽神的聲音時，你就會更深體驗到如何跟隨神的靈的引導了。你將在第四課學習這方面的功課。</p>
<p><b>想一想：</b>你的父母如何向你表達愛與關懷？寫下其中兩種方式。</p>
<p>你是否知道，神——你在天上的父，比你的父母還愛你、還關心你？神愛你，關心你，甚至賜下祂的獨生子耶穌基督，讓祂為你而死。</p>
<div class="quote">惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們顯明了。<span class="ref">羅馬書五 8</span></div>

  wk:"第三課", ttl:"你與神的家的新關係", memo:"開始你的新關係（二）",
  verse:{t:"你們不可停止聚會，好像那些停止慣了的人，倒要彼此勸勉。",r:"希伯來書十 25"},
  body:`
<p>你已經成為「神的家」的一部分，這個家就是教會。教會並不是一棟建築物，也不單是星期天的崇拜聚會。教會是一個由基督徒組成的團體，而「家組」就像一個小型的家，他們委身於彼此造就，並去得著那些不認識耶穌基督的人。他們每週定時聚集，也在聚會時間以外經常聯繫。</p>
<p><b>家組所以存在，有兩個目的：</b></p>

<h3>一、在家組中彼此造就</h3>
<p>神從未計劃讓你成為一位孤立的基督徒。再說，作一位離群獨立的基督徒並非易事；神的計劃是要你與其他基督徒在同一個身體內一起成長。</p>
<div class="quote">全身都靠祂聯絡得合式，百節各按各職，照著各體的功用彼此相助，便叫身體漸漸增長，在愛中建立自己。<span class="ref">以弗所書四 16</span></div>
<p>這裏的意思是說，神使你成為支撐聯繫整個身體各部分的其中一條韌帶。也是說，你必須在神的家（也就是在家組）中，藉著信徒間的彼此造就，才能得到成長。彼此造就即彼此建立、彼此扶持的意思。</p>

<h4>A　你的委身</h4>
<p>要在家組中得到成長，你就要對家組委身，要把家組列為你生活中的優先。若你已成家，就要全家一起委身。</p>
<div class="quote">又要彼此相顧，激發愛心，勉勵行善。你們不可停止聚會，好像那些停止慣了的人，倒要彼此勸勉；既知道那日子臨近，就更當如此。<span class="ref">希伯來書十 24-25</span></div>
<p>以出席家組聚會表示你的委身。你的出席對於其他家人而言，是很可貴的。你也要參與家組的活動，因為你的參與能造就其他家人。生活中總會有許多其他事故使你分心，必須下定決心，不讓它們阻撓你委身。</p>

<h4>B　你的貢獻</h4>
<p>神計劃使你成為家組中一位重要的家人。祂期望你成為其中活躍的一份子，對其他家人的成長作出貢獻。祂並不要你單從他人那裏領受恩典，祂也要你成為一條恩典的管道，使他人蒙福。</p>
<p>聖靈會賜下屬靈的恩賜，讓你可以運用恩賜去造就家組。聖靈的恩賜也許是神所啟示的一句話，為了造就和激勵家組；也許是針對某人的生活情況（身體、情感或屬靈狀況）而賜下的一句話；或者是來自聖靈的感動，要你去為某人的病得醫治禱告。</p>
<p>對家組作出貢獻的其中一個方式，是實際地去幫助家組中家人的需要。你可以牧養一位新信徒，就如你本身得到別人的牧養一樣。若你繼續委身追求成長，你很快就能成為別人的屬靈父母了。這其實應當是你的其中一個目標——最快的學習方法，就是去幫助其他人學習。</p>

<h3>二、透過家組傳福音</h3>
<p><span class="q">「祂願意萬人得救，並且完全認識真理。」</span><span class="ref-in">（提前二 4）</span>因此，神不但期望家組能藉著信徒之間的造就，在屬靈生命上得著成長，祂也期望家組透過傳福音，在人數上得到增長。傳福音就是把關於神的救恩的好消息告訴未信者。</p>
<p>你和你的家組可以成為神恩典的管道，把神的恩典傳送給你未信的家人、親人和朋友。你可以讓家組為你生活關係網中常接觸的人禱告，為他們能得到救恩而祈求；也可以邀請他們來到家組，或邀請家組一起去探望他們，彼此認識。</p>
`,
  light:`<p>家組不是活動，是<b>屬神體系</b>最小的樣子。321 講的 <b>235</b> 就在這裏開始：先與沒有問題、無己的人成為 <b>2</b> ——屬靈同伴；再建立 <b>3</b> ——屬靈父母與兒女的關係；最後成為 <b>5</b> ——五重職份的屬靈戰友團隊。</p>

<h4>B　透過家組傳福音</h4>

{
  wk:"第四課", ttl:"聆聽神說話", memo:"建立你與神的新關係（一）",
  verse:{t:"叫人活著的乃是靈，肉體是無益的。我對你們所說的話就是靈，就是生命。",r:"約翰福音六 63"},
  body:`
<p>你已經踏上了這段旅程，漸漸地在與神的新關係上成長。要培養任何一段關係，有兩項基本要素不可或缺：<b>時間</b>與<b>溝通</b>。基於同一個道理，你必須抽出時間去與神溝通，才能建立起你與神之間的關係。我們稱這段與神獨處的時間為「靈修會主時間」。</p>
<p>有意義的溝通，必須是一種雙向的交談與聆聽。在這一課裏，我們要談「聆聽神說話」。你必須學會聆聽神說話，因為祂要親自對你說話，就好像父親對孩子說話一樣。</p>

<h3>一、神透過聖經對你說話</h3>
<p>聖經是神藉著文字的記載對我們說話。聖經共有六十六卷書，其中舊約三十九卷，新約二十七卷。神在一千五百年間（約由主前 1400 年至主後 90 年）的不同時期，藉著不同的人寫下了聖經。</p>
<div class="quote">因為預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來。<span class="ref">彼得後書一 21</span></div>
<p>就這樣，聖經就是神的話語。神在聖經中透露了自己，並說明我們與祂之間的關係。</p>
<p>每天固定花一段時間親近神，使用靈修會主指引閱讀聖經，聆聽神對你所說的話，並將領受寫在靈修筆記上。</p>

<h3>二、神在你內心對你說話</h3>
<p>或許你正在猶疑：我怎麼知道神對我說話？</p>
<p>神通常都不會以肉耳聽得見的聲音說話。當神說話時，祂通常會在你內心對你說話，因為祂就住在那裏，以聖靈的位格內住。<span class="q">「神將祂的靈賜給我們，從此就知道我們是住在祂裏面，祂也住在我們裏面。」</span><span class="ref-in">（約壹四 13）</span></p>
<p>神所說的話，常常是你所意料不到的。祂總是提議美善的事物，祂絕不會叫你去作壞事，也不會說一些違反聖經教導的話。</p>
<p>神在你內心說話的聲音是自然流露的，既輕聲又溫和，也許是一句話、一陣思潮、一個想法、一種感覺、一幅畫面，或一個異象。祂會對你說關於祂自己、你個人，或關於別人的事。你也許會聽見祂說：「我愛你！」繼而感覺祂的愛洋溢在你心中；或者聽見祂說：「你心裏不要憂愁，信靠我吧！」然後你感受到祂所賜的平安；又或者祂會對你說：「去向某人談起我的事。」祂也會把一節經文帶到你心裏，說明你生活中的某種情況。</p>
<p>誠然，聖經是神對我們說話的主要途徑，然而祂也藉著我們周圍的環境，甚至夢境來對我們說話。</p>

<h3>聆聽神聲音的三個基本步驟</h3>
<h4>1. 安靜聆聽</h4>
<p>學習聆聽神說話的一個好方法，就是安靜聆聽。閉上眼睛，在神面前安靜等候，集中心思去聆聽祂在你內心說話的聲音。</p>
<h4>2. 確定神的聲音</h4>
<p>初學者最好能夠把所聽到的啟示與一位靈命較成熟、有經驗的信徒分享，以鑒別所聽見的是否來自神。你也可以和家組長或屬靈父母分享。</p>
<h4>3. 別氣餒</h4>
<p>你最初也許聽不見神對你說話，但不要放棄，要不斷嘗試，努力學習。當你經驗越豐富，就會越容易、越快分辨出神的聲音了。</p>
`,

<p>所以要學會<b>用心靠聖靈，不要用腦靠自己</b>。用腦就煩惱，用心就開心。<span class="q">「你要保守你心，勝過保守一切，因為一生的果效是由心發出。」</span><span class="ref-in">（箴四 23）</span>聖靈住在心中，不是住在腦中。安靜下來，是把自己的聲音關小，好讓神的聲音顯出來——這就是<b>無己</b>的操練。</p>`,

{
  wk:"第五課", ttl:"向神禱告", memo:"建立你與神的新關係（二）",
  verse:{t:"向來你們沒有奉我的名求甚麼，如今你們求，就必得著，叫你們的喜樂可以滿足。",r:"約翰福音十六 24"},
  body:`
<p>上一課提到：在與神建立關係的過程中，你需要學習聆聽神說話。然而這只是雙軌溝通的其中一個方向，還有另一個方向，就是<b>與神談話</b>。神很樂意聽你對祂說話。與神談話就是聖經所謂的「禱告」。</p>

<h3>一、如何向神禱告</h3>
<p>「我不知如何禱告，也不知道要在禱告中說些什麼！」這是你的顧慮嗎？別忘了，神是你的天父，你是祂的兒女，你只需要像和一位好朋友談話一般地與祂交談就行了！如果你有個好消息或有個難題，你只要原原本本地對祂說。你可以在一天之中的任何時間與祂交談，你可以跟祂無所不談。</p>

<h4>A　你可以按「五指禱告」的形式來禱告</h4>
<div class="finger">
<div><b>感謝</b><span>凡事謝恩。<span class="q">「凡事要奉我們主耶穌基督的名常常感謝父神。」</span><span class="ref-in">（弗五 20）</span>不論是喜是憂，是好是壞，在逆境中、在順境裏，都要感謝神。</span></div>
<div><b>讚美</b><span>隨時隨地讚美神。<span class="q">「我要時時稱頌耶和華，讚美他的話必常在我口中。」</span><span class="ref-in">（詩三十四 1）</span>讚美祂的本性，讚美祂所成就的一切事。養成以讚美敬拜作為一日之始的習慣。</span></div>
<div><b>認罪</b><span>向神承認你的罪。<span class="q">「我若心裏注重罪孽，主必不聽。」</span><span class="ref-in">（詩六十六 18）</span>誠懇地為自己的罪向神懺悔，神必要赦免你。認罪能確保你與神之間的溝通不會被切斷。</span></div>
<div><b>祈求</b><span>為你的需要祈求。<span class="q">「因為你們沒有祈求以先，你們所需用的，你們的父早已知道了。」</span><span class="ref-in">（太六 8）</span>這並不意味著你就不必禱告了，而是你可以更有信心。也要每日為自己屬靈生命的成長祈求。</span></div>
<div><b>代禱</b><span>為別人的需要代禱：家中的家人、家組的家人、牧師、朋友。對於那些還未認識耶穌基督的人而言，最重要的就是能夠歸向神。</span></div>
</div>
<div class="quote">你們要將一切的憂慮卸給神，因為他顧念你們。<span class="ref">彼得前書五 7</span></div>

<h4>B　你可以用聖靈所賜的禱告言語禱告</h4>
<p>我們向神禱告時，常常不知道要說些什麼，因此神賜下一種特別的禱告言語，彌補我們在這方面的不足。聖經稱這種言語為「說方言」或「用方言禱告」。我們用方言禱告時，雖然自己並不知道在說些什麼，但那位賜我們方言的神卻能明白。<span class="q">「說方言的，是造就自己。」</span><span class="ref-in">（林前十四 4）</span></p>
<p>你可以向你的屬靈父母或家組長表示你願意得著禱告的言語，他們會為你禱告。要如何得著在靈裏禱告的言語？</p>
<h4>1. 渴慕——渴慕禱告的言語</h4>
<p>神從不強迫我們接受我們所不願意的。祂尊重我們的選擇，不抹煞我們的自由意志。所以我們要渴慕。<span class="q">「你們要切切地求那更大的恩賜。」</span><span class="ref-in">（林前十二 31）</span></p>
<h4>2. 祈求——求神賜給</h4>
<p>渴慕必須要有祈求作為行動的表現。<span class="q">「你們雖然不好，尚且知道拿好東西給兒女；何況天父，豈不更將聖靈給求他的人嗎？」</span><span class="ref-in">（路十一 13）</span></p>
<h4>3. 信心——憑信心說出</h4>
<p>我們祈求之後必須操練憑信心說出。神會賜我們言語，祂不會代替我們，也不會強迫我們說出。正如你想說話時，你的頭腦會告訴你該說什麼；聖靈也同樣給你話語，但你必須自己說出。<span class="q">「信的人必有神蹟隨著他們，就是奉我的名趕鬼，說新方言。」</span><span class="ref-in">（可十六 17）</span></p>
<p>用心靈憑信心靠聖靈，把神賜給你內心的感動用各種不同的聲音開口說出來，繼續不斷地用心靈說出內心的感動。縱使自己的頭腦聽不懂，只要神聽得懂就好了。</p>

<h3>二、神如何應允你的禱告</h3>
<p>雖然神會聽取你的每一項禱告，但祂不一定會照你所求的應允。神不是魔術師，也不是聖誕老人，祂不會把你所想要的一切都給你。就如所有負責任的父母親一樣，天父只把對你有益的東西賜給你，而只有祂才知道什麼是對你最好的。</p>
<p><b>神應允禱告的方式至少有四種：</b></p>
<ol>
<li><b>「好的」</b>，我會照著你所求的賜給你。</li>
<li><b>「不」</b>，這對你不好。</li>
<li><b>「等著」</b>，我會在適當的時候應允你。</li>
<li><b>「我有一個更好的主意。」</b></li>
</ol>
`,
  light:`<p>禱告最深的意義，是<b>回到本位</b>。驕傲是離開人的本位、抓住神的權力，想要代替神；謙卑是放下權力、回到本位，<b>讓人作人，讓神作神</b>。當我們開口禱告，就是承認：這件事我作不了主，主啊，祢來作王。</p>
<p>所以神說「不」和說「好」，同樣是恩典。<b>凡事謝恩，把榮耀歸給耶穌</b>——這正是 321 的第二個核心：<b>讓耶穌得到一切的榮耀</b>。</p>`,

{
  wk:"第六課", ttl:"處理你的罪", memo:"認罪、離棄、得釋放",
  verse:{t:"我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。",r:"約翰壹書一 9"},
  body:`
<p>罪是我們生命中的一大問題，會帶來內疚和挫敗的感覺。然而神差耶穌基督來，在十字架上解決了我們罪的問題。這意味著我們能從罪所引起的內疚和挫敗感中得釋放。</p>

<h3>一、問題的根源</h3>
<p>何謂罪？聖經上有兩個關於罪的意義，那就是「<b>罪性</b>」和「<b>罪行</b>」。</p>
<p>「罪性」是根源，是人犯罪的本性；「罪行」則是所結出的果子，是人犯罪的行為。</p>
<p>就像蘋果樹會結出蘋果（果子），因為它原本（根源）就是一棵蘋果樹；蘋果樹不會長出梨子。我們生命中罪的問題也是如此：我們犯下罪行（果子），是因為我們的本性（根源）是罪惡的。<b>罪性產生罪行。</b></p>
<div class="quote">得赦免其過、遮蓋其罪的，這人是有福的。<span class="ref">羅馬書四 7　——這裏的罪，指的是「罪行」</span></div>
<div class="quote">所以，不要容罪在你們必死的身上作王，使你們順從身子的私慾。<span class="ref">羅馬書六 12　——這裏的罪，指的是「罪性」</span></div>
<p>人的問題與他生活中的「果子」並沒有主要的關聯，問題在於他生命中的根源。人的問題在於其罪性。要處理罪行的問題，就必須先解決罪性的問題。</p>
<p>「罪」在原文的意思是指「人射箭時射不中靶心」，所以罪也就是達不到神造人的目的及標準，虧缺了神的榮耀。</p>
<p><b>因此，罪是一種錯誤的狀況：是人自立為王，自命為生命之主。</b>當我們這樣做，我們的「自我」便取代了神的地位，佔據了我們生命的寶座。要解決罪性與罪行的問題，我們一定要退下生命的寶座，讓神作我們生命的王和生命之主。</p>

<div class="thrones">
  <div class="throne self"><b>自我管理的生命</b><span class="glyph">我</span><small>自我在生命的寶座上<br>基督在生命之外</small></div>
  <div class="throne christ"><b>基督管理的生命</b><span class="glyph">✝</span><small>基督在生命的寶座上<br>自我退下寶座</small></div>
</div>

<div class="quote">感謝神！因為你們從前雖然作罪的奴僕，現今卻從心裏順服了所傳給你們道理的模範。你們既從罪裏得了釋放，就作了義的奴僕。<span class="ref">羅馬書六 17-18</span></div>

<h3>二、除去問題</h3>
<p>基督已經為我們的罪被釘死在十字架上，解決了罪的刑罰問題，所以我們已經不再被定罪；但是我們卻必須等到基督第二次再來時，才能完全從罪中得以釋放。</p>
<p>當我們接受耶穌作救主時，已經解決了罪性的問題。</p>
<div class="quote">我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裏面活著；並且我如今在肉身活著，是因信神的兒子而活；他是愛我，為我捨己。<span class="ref">加拉太書二 20</span></div>
<p>我們可以選擇不再用有罪性的舊人活著，而選擇用在基督裏沒有罪性的新人活著。我們必須不斷地操練作正確的選擇。因著在主裏新人的新生命，我們若忠心順服神的引導，就能活出一個正直的生命，並在每日生活中戰勝罪的捆綁。</p>

<h3>在主裏經歷自由的兩大要點</h3>
<h4>A　赦免罪行</h4>
<p>基督徒依然會犯罪，你或許會問：「我若犯了罪該怎麼辦？」</p>
<p><b>1. 向神認罪。</b>認罪就是根據神的標準去看待罪的問題，就是同意神對罪的看法。<span class="q">「我向你犯罪，惟獨得罪了你，在你眼前行了這惡。」</span><span class="ref-in">（詩五十一 4）</span>認罪就是承認罪是一項罪，而不是一個錯誤、一項弱點或一項決定。人必須為自己的罪行負全責，決不找藉口或歸咎他人。</p>
<p><b>2. 離棄罪行。</b>我們要下定決心，不再得罪神。求神幫助你克服試探，不再失足。<span class="q">「他自己既然被試探而受苦，就能搭救被試探的人。」</span><span class="ref-in">（來二 18）</span>你或許會問：要是我再一次犯罪，神依然會赦免我嗎？會的，祂會不斷地赦免你，只要你不是抱著「既然神應許要赦免我，我犯罪又何妨」的態度。</p>
<p><b>3. 接受神的赦免和潔淨。</b>沒有什麼罪會嚴重到神無法赦免或不肯赦免。只要我們真心誠意地向神認罪，祂就必定會赦免。神既然應許要赦免你的罪，就必然會實現祂的應許，這點你可以肯定。</p>
<p><b>4. 感謝神的赦免。</b>每一次你祈求神的赦免，都要為此感謝祂。這麼做能幫助你更肯定神的赦免，而不會理所當然地以為這是你應當得到的。</p>

<h4>B　從堅固營壘中得釋放</h4>
<p>有時候我們發覺自己被生命中長久已經成型的某種罪行或壞習慣纏繞著，苦苦掙扎卻仍然無法得勝。這種情形可能是以下因素所造成的：</p>
<ul>
<li>苦毒、憤恨，無法饒恕一位曾經傷害你的人，也許是家人、親戚或朋友。</li>
<li>損害健康的不良習慣。</li>
<li>祭拜偶像，使用符咒，迷信占星術。</li>
<li>對過去的行為感覺羞恥，無法原諒自己。</li>
<li>閱讀色情書刊，手淫，其他放縱情慾的習慣等。</li>
</ul>
<p>以上種種都是生命中的堅固營壘，撒但就是利用這些堅固營壘捆綁我們。然而神要我們從中得釋放。</p>
<p><b>1. 透過禱告，宣告剷除有關的堅固營壘。</b>你可以這樣禱告：</p>
<div class="quote">主啊，感謝祢在十字架上擊毀了撒但和罪的權勢。我如今奉祢的名剷除○○堅固營壘，從今以後不再與○○堅固營壘有任何關係。求祢以祢的寶血潔淨我，並以祢在十字架上得勝的大能攻破我生命中堅固的營壘，使我得到釋放。我將我的意願獻上交託給祢，願祢來掌管我的生命。願祢賜我聖靈的能力，使我能夠順服祢，勝過撒但的攻擊和試探。主啊，我感謝祢，奉主耶穌的名禱告，阿們！</div>
<p><b>2. 決定與神同行。</b>得勝的基督徒生活是一生的過程，必須在每日生活中去體驗和追求。藉著依靠聖靈的能力，學習恆常地與神同行——聆聽神說話，向祂禱告，順服祂的引導。當你落入試探和罪惡中時，總要轉向祂，讓祂幫助你，引導你走義路。<span class="ref-in">（詩二十三 3）</span></p>
<p><b>3. 拒絕撒但的謊言。</b>撒但會經常在你的思想中散播謊言，企圖欺騙你。<span class="q">「他本來是說謊的，也是說謊之人的父。」</span><span class="ref-in">（約八 44）</span>牠常對我們說：</p>
<ul>
<li>「你不夠好，不配得到神的愛。」</li>
<li>「神並不真正關心你。」</li>
<li>「你可以獨自應付生活中一切事。」</li>
<li>「你太忙了，沒有時間和神交談。」</li>
<li>「沒關係的，沒有人會知道。」</li>
<li>「每個人都這麼做，只有你說不。」</li>
</ul>
<p>你必須抗拒撒但的謊言，站立在神的真理上。你可以這樣禱告：</p>
<div class="quote">主啊！我向祢承認我接受了撒但的謊言「＿＿＿＿＿」，現在，我奉主的名棄絕這個謊言，砍斷這個謊言在我生命中的影響。奉主耶穌的名禱告，阿們。</div>
<div class="quote">你們要靠著主，倚賴他的大能大力作剛強的人。要穿戴神所賜的全副軍裝，就能抵擋魔鬼的詭計。<span class="ref">以弗所書六 10-11</span></div>
<p><b>4. 接受肢體的服事。</b>若你生命中有堅固營壘，需要別人的幫助，可以讓你的家組長知道。他會很樂意幫助你，或為你安排一位受過事工訓練的家人來幫助你。</p>

  verse:{t:"並且他替眾人死，是叫那些活著的人不再為自己活，乃為替他們死而復活的主活。",r:"哥林多後書五 15"},
  body:`
<p>你是否發覺生命中有許多事情是你無法自主或選擇的？例如：你不能決定自己的生日、父母親、種族、籍貫、相貌……說真的，我們對自己的生命所能作的決定實在太少了！而對於那一小撮有自由作決定的事情，我們又總是把它搞砸了。我們還有什麼希望嗎？</p>
<p><b>作一位基督徒，就是要完全讓神在你生命中全權作主。這是為了你的好處。</b></p>
<p>當你成為基督徒的時候，你把生命交給了耶穌基督，不但讓祂成為你的救主，同時也讓祂成為你生命之主。</p>
<div class="quote">你若口裏認耶穌為主，心裏信神叫他從死裏復活，就必得救。<span class="ref">羅馬書十 9</span></div>

<h3>一、讓耶穌作主的兩個原因</h3>
<h4>1. 耶穌的身份</h4>
<p>耶穌有權作你生命之主。祂是萬物之主，祂是最微小的原子之主，也是最龐大的銀河系之主。</p>
<div class="quote">因為萬有都是靠他造的，無論是天上的、地上的，能看見的、不能看見的，或是有位的、主治的、執政的、掌權的，一概都是藉著他造的，又是為他造的。他在萬有之先，萬有也靠他而立。他也是教會全體之首，他是元始，是從死裏首先復生的，使他可以在凡事上居首位。<span class="ref">歌羅西書一 16-18</span></div>
<div class="quote">所以神將他升為至高，又賜給他那超乎萬名之上的名，叫一切在天上的、地上的和地底下的，因耶穌的名無不屈膝，無不口稱耶穌基督為主，使榮耀歸與父神。<span class="ref">腓立比書二 9-11</span></div>
<p>無論你是否喜歡，是否能夠接受，是否願意，事實總歸事實——<b>耶穌依然是主！</b></p>

<h4>2. 耶穌為我們成就的事</h4>
<p>耶穌為我們在十字架上受死。我們原本應該是那位在神面前受審判的人，但因耶穌愛我們，祂擔當了我們的罪，為我們承受神的刑罰。我們原本應受懲罰，反而得到了永生。為此我們不該再為自己活著，必須為主而活。</p>
<div class="quote">因為你們是重價買來的，所以要在你們的身子上榮耀神。<span class="ref">哥林多前書六 20</span></div>

<h3>二、你對耶穌的主權的回應</h3>
<p><b>為主而活</b>，這就是你對耶穌的主權應有的回應。為主而活的意思就是，按著祂的計劃去過你的生活。祂為你生命所作的計劃包括兩方面：<b>祂會時時刻刻看顧你的需要；你要時時刻刻按著祂的旨意而活。</b></p>
<p>神對你生命的計劃是什麼呢？神會逐步引導你去發掘和經驗，這是你需要用一生的時間去探索的。然而有一件事是你可以肯定的：</p>
<div class="quote">耶和華說：我知道我向你們所懷的意念是賜平安的意念，不是降災禍的意念，要叫你們末後有指望。<span class="ref">耶利米書二十九 11</span></div>
<p><b>神的計劃是最美好的，為什麼？</b></p>

<li><b>神是智慧</b>——祂有能力計劃對我們最好的。</li>
<li><b>神是全能</b>——祂能移開任何攔阻祂對我們生命計劃的事物。</li>
<li><b>神是至高無上</b>——沒有什麼能攔阻祂對我們的計劃。</li>
</ol>
<p>主關心你甚於祂自己，祂應許要將生命中最好的事賜給你。單靠祂，必能實現！</p>
<p>你必須將生命的各方面交託給耶穌作主，包括：婚姻、家庭、工作、計劃、目標、時間、思想、錢財和所擁有的一切。</p>

<h4>A　關於主權的禱告</h4>
<div class="quote">主耶穌，我讚美祢，因為祢是我生命的主。祢是萬物之主，天上地下的所有事物都在祢的統管之下。謝謝祢總是把最好的給我；事實上祢已經把最好的給了我，就是把祢自己給了我，在十字架上為我而死。主啊！為此我是屬於祢的，我的生命是祢所賜的。如今我把自己獻上，讓祢作我生命之主。願祢賜我屬靈的智慧，讓我明白祢的旨意，使我所做的都蒙祢喜悅；賜我恩典與力量，好讓我忠心地跟隨祢。主啊！感謝祢，奉主耶穌的名禱告，阿們！</div>

<h2 class="lsn-title" style="margin-top:46px">馬可福音簡介</h2>
<p>馬可福音是聖經第四十一卷書，新約第二卷，四福音書的第二本。馬可福音描述耶穌是神的僕人，因此沒有記下祂的家譜，也沒有記祂的出生和童年生活，而是用有力的手筆記述耶穌的事跡，把重心放在祂的工作，而不是祂的言論教訓。</p>
<p>祂的工作從受洗開始，受魔鬼試探、呼召門徒、傳道，直到受死釘十字架，最後從死裏復活。雖說耶穌來世上的目的是要服事人類，但馬可也特別強調祂是神的兒子，同時沒有忽略祂人性的一面。</p>
<h4>馬可福音大綱</h4>
<ol>
<li>耶穌傳道工作的預備　1:1-13</li>
<li>耶穌在加利利的工作　1:14-6:56</li>
<li>耶穌離開加利利地　7:1-9:50</li>
<li>耶穌在比利亞的工作　10:1-52</li>
<li>耶穌在耶路撒冷的工作　11:1-13:37</li>
<li>耶穌的受死與復活　14:1-16:20</li>
</ol>
<p><b>重點：</b>僕人的事奉（1-13 章）→ 僕人的犧牲（14-16 章）。<br>
<b>主題：</b>講道與神蹟（三年半）→ 受死與受難（八天）。<br>
<b>地點：</b>加利利與比利亞 → 猶大與耶路撒冷。<b>時間：</b>主後 29 至 33 年。</p>

<h2 class="lsn-title" style="margin-top:46px">聖經目錄口訣</h2>
<h4>舊約</h4>
<p><b>創出利民申</b>／<b>書士得撒撒</b>／<b>王王代代拉尼斯</b>／<b>伯詩箴傳歌</b>／<b>賽耶哀結但</b>／<b>何珥摩　俄拿彌　鴻哈番　該亞瑪</b></p>
<p class="ref-in">口訣：創初利民生／舒適得傻傻／往往呆呆拉你死／博士真傳鴿／撒野愛結蛋／荷爾蒙　餓拿米　轟哈番　蓋啞馬</p>
<div class="quote">舊約創業之道就是初期要有利民生需要，結果太舒適了，人變得傻傻，往往人呆呆得要拉你去死。博士知道後真的傳了一隻信鴿去救人，但是鴿子卻撒野不愛傳信只愛結蛋，因為發情荷爾蒙分泌過多，並且肚子餓了就偷拿米吃，還用米轟擊哈番，蓋住哈番騎的啞巴馬。</div>
<h4>新約</h4>
<p><b>太可路約徒</b>／<b>羅林林加弗</b>／<b>腓西帖帖</b>／<b>提提多門</b>／<b>來雅彼彼</b>／<b>約約約猶啟</b></p>
<p class="ref-in">口訣：待客滷野兔／螺淋淋加氟／肥吸貼貼／踢踢跺門／來呀嗶嗶／約約夜遊去</p>
<div class="quote">新約的待客之道就是滷一隻野兔，用螺汁淋一淋調味，再加點氟防止蛀牙；肥油吸一吸，再把肉貼一貼才不會發胖。吃飯前要踢一踢腳再跺一跺門，吃飯後來呀吹哨子嗶嗶集合，大家約約一起夜遊去。</div>

function renderLesson(i){
  const l = LESSONS[i];
  barTitle.textContent = l.wk + "　" + l.ttl;
  let h = `<p class="eyebrow">${l.wk}　·　${l.memo}</p>
  <h2 class="lsn-title">${l.ttl}</h2>
  <p class="lsn-sub">第 ${i+1} 週　／　共 7 週</p>`;
  if(l.verse){
    h += `<div class="verse"><span class="tag">本週金句</span>
      <p>${l.verse.t}<span class="ref">${l.verse.r}</span></p></div>`;
  }
  h += l.body;
  h += `<div class="light"><h5>321 亮光</h5>${l.light}</div>`;
  h += `<div class="practice"><h3>在本週經歷你的新生命</h3><ul class="check">`;
  l.practice.forEach((p,n)=>{
    h += `<li><input type="checkbox" id="p${i}_${n}"><label for="p${i}_${n}">${p}</label></li>`;
  });
  h += `</ul></div>`;

  h += `<div class="teach"><h3>老師本．督導指引</h3><div class="aim">${l.teach.aim}</div>`;
  l.teach.blocks.forEach(b=>{ h += `<h4>${b[0]}</h4>${b[1]}`; });
  h += `</div>`;

  h += `<div class="nav">
    <button data-go="${i-1}" ${i===0?"disabled":""}>← 上一課</button>
    <button data-go="index">課程目錄</button>
    <button class="primary" data-go="${i===6?"ap":i+1}">${i===6?"附　錄 →":"下一課 →"}</button>
  </div>`;
  app.innerHTML = h;
  applyTeachMode();
  window.scrollTo(0,0);
}

function renderAppendix(){
  barTitle.textContent = "附錄．靈修會主指引";
  app.innerHTML = APPENDIX + `<div class="nav">
    <button data-go="6">← 第七課</button>
    <button class="primary" data-go="index">回課程目錄</button></div>`;
  const t1 = document.getElementById("plan1"), t2 = document.getElementById("plan2");
  PLAN1.forEach((r,i)=> t1.insertAdjacentHTML("beforeend",`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td></tr>`));
  PLAN2.forEach((r,i)=> t2.insertAdjacentHTML("beforeend",`<tr><td>${i+1}</td><td>${r[0]}</td><td>${r[1]}</td></tr>`));
  const c = document.getElementById("cards");
  CARDS.forEach(x=> c.insertAdjacentHTML("beforeend",`<div class="card"><b>${x[0]}</b><p>${x[1]}</p></div>`));
  window.scrollTo(0,0);
}

function go(target){
  if(target === "index"){ view="index"; renderIndex(); }
  else if(target === "ap"){ view="ap"; renderAppendix(); }
  else { view = Number(target); renderLesson(view); }
}

app.addEventListener("click", e=>{
  const b = e.target.closest("[data-go]");
  if(b && !b.disabled) go(b.dataset.go);
});
document.getElementById("btnHome").addEventListener("click", ()=>go("index"));

document.getElementById("btnFsUp").addEventListener("click", ()=>{ if(fs<4){fs++;applyFs();} });
document.getElementById("btnFsDown").addEventListener("click", ()=>{ if(fs>1){fs--;applyFs();} });
applyFs();

/* 老師本 */
let teachOn = false;
const btnTeach = document.getElementById("btnTeach");
function applyTeachMode(){
  document.querySelectorAll(".teach").forEach(el=>{
    el.style.display = teachOn ? "" : "none";
  });
  btnTeach.classList.toggle("on", teachOn);
}
btnTeach.addEventListener("click", ()=>{ teachOn = !teachOn; applyTeachMode(); });

耶穌作主．受洗與奉獻":"Letting Jesus be Lord · baptism and giving","著重建立與神的關係":"Focus on building the relationship with God","著重建立與神的家的關係":"Focus on building the relationship with God's family","新造的人｜林後五 17":"A new creation | 2 Corinthians 5:17","若有人在基督裏，他就是新造的人，舊事已過，都變成新的了。":"If anyone is in Christ, he is a new creation. The old things have passed away. Behold, all things have become new.","得到永生｜約三 16":"Eternal life | John 3:16","神愛世人，甚至將他的獨生子賜給他們，叫一切信他的，不至滅亡，反得永生。":"For God so loved the world, that he gave his only born Son, that whoever believes in him should not perish, but have eternal life.","有生命｜約壹五 12":"Having life | 1 John 5:12","人有了神的兒子就有生命，沒有神的兒子就沒有生命。":"He who has the Son has the life. He who doesn't have God's Son doesn't have the life.","不可停止聚會｜來十 25":"Do not stop meeting | Hebrews 10:25","主說的話｜約六 63":"The words He spoke | John 6:63","叫人活著的乃是靈，肉體是無益的。我對你們所說的話就是靈，就是生命。":"It is the spirit who gives life. The flesh profits nothing. The words that I speak to you are spirit, and are life.","求就得著｜約十六 24":"Ask and receive | John 16:24","向來你們沒有奉我的名求甚麼，如今你們求，就必得著，叫你們的喜樂可以滿足。":"Until now, you have asked nothing in my name. Ask, and you will receive, that your joy may be made full.","承認己罪｜約壹一 9":"Confessing sin | 1 John 1:9","我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。":"If we confess our sins, he is faithful and righteous to forgive us the sins and to cleanse us from all unrighteousness.","為主而活｜林後五 15":"Living for the Lord | 2 Corinthians 5:15","他替眾人死，是叫那些活著的人不再為自己活，乃為替他們死而復活的主活。":"He died for all, that those who live should no longer live to themselves, but to him who for their sakes died and rose again.","哥林多後書五 17":"2 Corinthians 5:17","哥林多後書五 15":"2 Corinthians 5:15","約翰壹書五 11-12":"1 John 5:11-12","約翰壹書一 9":"1 John 1:9","約翰福音一 12":"John 1:12","約翰福音六 63":"John 6:63","約翰福音十七 3":"John 17:3","約翰福音十六 24":"John 16:24","羅馬書五 8":"Romans 5:8","羅馬書八 9":"Romans 8:9","希伯來書十 25":"Hebrews 10:25","（詩一一九 11）":"(Psalm 119:11)","（羅八 14）":"(Romans 8:14)","當你接受耶穌基督進入你的生命作你的主和救主的那一刻，你就開始你的新生命。":"The moment you received Jesus Christ into your life as your Lord and Saviour, your new life began.","這本《開始你的新生命》正是為了幫助你開始去過基督裏的新生命而編寫的。在你開始經歷基督裏的新生命時，你需要做七件重要的事。":"This book, Beginning Your New Life, was written to help you start living the new life in Christ. As you begin to experience that new life, there are seven important things you need to do.","一、開始參加教會":"1. Begin attending church","神的心意是要祂的信徒聚集。基督徒應該每週參加教會的聚會，好讓屬靈生命健康成長。":"It is God's will that His believers gather. A Christian should attend the church's meetings every week, so that his spiritual life grows in health.","二、買一本聖經":"2. Buy a Bible","聖經是你生命中最重要的書，因為它是神的話語。買一本聖經，認真研讀它。你可以請你的屬靈父母給你意見，買一本合適的聖經。":"The Bible is the most important book in your life, because it is the word of God. Buy one, and study it seriously. Ask your spiritual parent's advice on choosing an edition that suits you.","三、加入一個家組":"3. Join a home group","身為一個初信的基督徒，最重要的事就是參加一個家組。這是一個基本的基督徒社群。你可以在家組中認識其他信徒，他們能幫助你更明白作基督徒的意義。家組為你提供成長的環境。":"For a new believer, the most important thing is to join a home group. This is the basic Christian community. There you will meet other believers who can help you understand better what it means to be a Christian. The home group gives you an environment in which to grow.","四、閱讀本書":"4. Read this book","本書共有七課，需要七個星期完成。每課分成兩部分：一部分供閱讀，另一部分為應用。建議你用兩天的時間來做，每天做一部分，這樣你便有時間慢慢領會其中的真理，而不是趕快讀完。":"This book has seven lessons and takes seven weeks to complete. Each lesson has two parts: one for reading and one for applying. It is best to spread it over two days, one part each day, so that you have time to take the truth in slowly rather than rushing to finish.","請使用以下的閱讀方針":"Please use the following reading guidelines","求神向你說話":"Ask God to speak to you","：你將得到你所期望的。":": you will receive what you expect.","背誦每週金句":"Memorise the weekly verse","「我將你的話藏在心裏，免得我得罪你。」":"“I have hidden your word in my heart, that I might not sin against you.”","熟記經文是把神的話藏在心裏的方法之一。它最大的好處，就是讓你在需要某段經文的時候，即使手上沒有聖經，也垂手可得。請使用書中的「十全背經圖」來背誦和複習。":"Memorising Scripture is one way of hiding God's word in your heart. Its greatest benefit is that when you need a passage, it is right there even with no Bible in your hand. Use the memory chart in this book to learn and review.","仔細讀過各課內容":"Read each lesson carefully","，以禱告的心思想其中的真理，把它應用在生活裏。":", think over its truth prayerfully, and apply it to your life.","在本週經歷你的新生命":"Live out your new life this week","。應用真理是最重要的。我們都需要水才能生存，但擁有水還不夠，還得喝下去才行！":". Applying the truth matters most. We all need water to live — but having water is not enough; you have to drink it!","和人分享":"Share with others","你所學習的。":" what you are learning.","五、聆聽神的聲音":"5. Listen to God's voice","聆聽神的聲音就是被聖靈感動，在心裏領受從神而來的意念，這是基督徒生活中的重要部分。第四課將幫助你學會如何聆聽神的話語。從現在開始，你要每天撥出時間與神獨處，聆聽祂的聲音，並把領受寫在靈修筆記上。":"Listening to God's voice means being moved by the Holy Spirit and receiving in your heart a thought that comes from God. It is an important part of Christian living. Lesson 4 will help you learn how to listen to His word. From now on, set aside time each day to be alone with God, listen to His voice, and write down what you receive in a devotional notebook.","請使用附錄的「靈修會主指引」來閱讀馬可福音。藉著這份指引，你將用兩個月的時間讀完整卷馬可福音。":"Use the Listening to the Lord guide in the appendix as you read the Gospel of Mark. With it you will read the whole of Mark over two months.","六、與你的屬靈父母約見":"6. Meet with your spiritual parent","在這新生命的起點上，需要有人指導你，幫助你在屬靈上成長。你的家組長會安排一位家人作你的屬靈父母。他會每星期與你約見，討論你這星期所得的心得和啟示，並與你一起禱告。":"At the start of this new life you need someone to guide you and help you grow spiritually. Your home group leader will arrange for one of the members to be your spiritual parent. He will meet with you each week to talk over what you have learned and seen that week, and to pray with you.","七、向周圍的人傳揚耶穌":"7. Tell the people around you about Jesus","當我們聽到好消息，總是渴望和四周的人、尤其是我們所愛的人分享。這個能確定我們永恆未來和命運的好消息，更要努力向他們傳揚。我們可以和他們分享如何認識耶穌，以及祂在你身上所作的工作。":"When we hear good news, we long to share it with those around us, especially the people we love. This news, which settles our eternal future and destiny, deserves that effort all the more. We can tell them how to come to know Jesus, and what He has done in us.","三個基礎，從第一天就開始。":"The three foundations, from day one.","買聖經，是因為":"Buy a Bible, because ","聖經是我的準則":"Scripture is my standard","；讀馬可福音認識耶穌，是因為":". Read Mark to come to know Jesus, because ","耶穌是我的榜樣":"Jesus is my model","；學習聆聽神的聲音，是因為":". Learn to listen to God's voice, because ","聖靈是我的引導":"The Holy Spirit is my guide","。這七件事不是七項功課，是三個基礎落在生活裏的樣子。":". These seven things are not seven assignments; they are what the three foundations look like when they land in daily life.","次序也要對：":"The order matters too: ","先生命、再關係、後事工":"life first, then relationships, then ministry","。所以先有新生命，再進家組建立關係，最後才是向人傳揚。不要把次序顛倒了。":". So there is new life first, then a home group where relationships are built, and only then telling others. Do not reverse the order.","這見證就是神賜給我們永生；這永生也是在他兒子裏面。人有了神的兒子就有生命，沒有神的兒子就沒有生命。":"The testimony is this, that God gave to us eternal life, and this life is in his Son. He who has the Son has the life. He who doesn't have God's Son doesn't have the life.","當你成為一位基督徒時，你也同時開啟了兩道新的關係：":"When you became a Christian, two new relationships opened at once: ","，和":" and ","。這兩者必須相輔相成，缺一不可，你必須兩者兼備，才能完全地體驗到神為你預備的一切。":". The two must go together; neither can be missing. Only with both will you fully experience all that God has prepared for you.","一、你與神的新關係的開端":"1. How your new relationship with God began","你與神的新關係是如何開始的？是在你憑信心接受耶穌進入你的生命時開始的。本週金句提到兩種人：第一種人有耶穌住在他們生命中，他們也因此有了永生；另一種沒有耶穌住在生命中，因此沒有永生。":"How did your new relationship with God begin? It began the moment you received Jesus into your life by faith. This week's verse speaks of two kinds of people: those who have Jesus living in them and therefore have eternal life, and those who do not have Jesus living in them and therefore do not have it.","基督徒有耶穌住在生命中，因為他們相信祂，並接受祂進入生命裏。因此當你決定相信耶穌並邀請祂進入生命時，祂就接受邀請而進入，祂的靈也從此進入你的生命裏。":"Christians have Jesus living in them because they believed in Him and received Him into their lives. So when you decided to believe in Jesus and invited Him in, He accepted the invitation and came in, and from that moment His Spirit entered your life.","神的靈既然住在你們裏面，你們就不是屬於肉體，而是屬於聖靈的了。":"You are not in the flesh but in the Spirit, if it is so that the Spirit of God dwells in you.","二、你與神的新關係的意義":"2. What your new relationship with God means","A 它是一個認識神的關係":"A. It is a relationship in which you come to know God","當你相信並接受耶穌基督作你的主和救主時，你也得著了永生。然而這永生到底是什麼？":"When you believed and received Jesus Christ as your Lord and Saviour, you also received eternal life. But what exactly is eternal life?","認識你——獨一的真神，並且認識你所差來的耶穌基督，這就是永生。":"This is eternal life, that they should know you, the only true God, and him whom you sent, Jesus Christ.","有了永生，你死後就會到天堂永遠與神同在。雖然如此，你卻不必等到死後才能經歷這永恆的生命。永生在你相信基督作生命之主和救主的那一刻已經開始了，它是真實的，你現在就可以經驗到。":"With eternal life, you will go to heaven after death and be with God forever. Even so, you do not have to wait until death to experience it. Eternal life began the moment you believed in Christ as Lord and Saviour of your life. It is real, and you can experience it now.","永生不單只是知道有關神的事實，而是藉著與神建立個人的關係去認識祂。基督教信仰並非一種宗教，而是一種個人關係——與那一位獨一的、永活的真神建立個人的關係。因此你已經踏上這段漫長的人生旅程，你將在一生中不斷體會經歷，愈來愈認識神。":"Eternal life is not merely knowing facts about God; it is knowing Him through a personal relationship. The Christian faith is not a religion but a personal relationship — with the one living and true God. You have set out on a long journey, and all your life you will go on experiencing Him and knowing Him more.","B 它是一個父與子的關係":"B. It is a relationship between a father and a child","凡接受祂的，就是信祂名的人，祂就賜給他們權利，成為神的兒女。":"As many as received him, to those who believed in his name, he gave the right to become God's children.","當你相信並接受耶穌基督進入生命中，你也同時成了神的兒女。意即：神是你的父，你與神的關係是一種父子關係。因為你已成為神的兒女，神已賜下祂的聖靈來引導你——":"When you believed and received Jesus Christ into your life, you also became a child of God. That is to say: God is your Father, and your relationship with Him is that of a father and a child. Because you have become His child, God has given His Holy Spirit to lead you —","「因為蒙神的靈引導的，都是神的兒子。」":"“For as many as are led by the Spirit of God, these are children of God.”","還記得嗎？當你接受耶穌時，祂就接受邀請進入你的生命中，祂的靈從此就住在你心裏。日後當你學會聆聽神的聲音時，你就會更深體驗到如何跟隨神的靈的引導了。你將在第四課學習這方面的功課。":"Remember? When you received Jesus, He accepted the invitation and came into your life, and from then on His Spirit has lived in your heart. Later, as you learn to listen to God's voice, you will experience more deeply what it is to follow the Spirit's leading. You will study that in Lesson 4.","想一想：":"Think it over:","你的父母如何向你表達愛與關懷？寫下其中兩種方式。":"How did your parents show you love and care? Write down two of the ways.","你是否知道，神——你在天上的父，比你的父母還愛你、還關心你？神愛你，關心你，甚至賜下祂的獨生子耶穌基督，讓祂為你而死。":"Did you know that God, your Father in heaven, loves you and cares for you more than your parents do? He loved you and cared for you so much that He gave His only Son, Jesus Christ, to die for you.","惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們顯明了。":"But God commends his own love toward us, in that while we were yet sinners, Christ died for us.","基督信仰的核心不是宗教規條，是關係。而":"The heart of the Christian faith is not religious rules but relationship. And ","關係的次序":"the order of relationships","是：先建立與神的關係，再與自己、與人、與事的關係。這一課就是第一步。":" is this: build the relationship with God first, then with yourself, then with others, then with things. This lesson is the first step.","當我們認識神是父，我們才敢放下手中的權力——這正是":"Only when we know God as Father do we dare lay down the power in our hands — and that is ","謙卑":"humility","：回到人的本位，讓人作人，讓神作神。舊人總想自己作主作王代替神，新人卻在父的懷裏安息。":": returning to the place of a man, letting man be man and God be God. The old self always wants to be master and king in God's place; the new self rests in the Father's arms.","焦點在耶穌":"The focus is on Jesus","，不在自己、不在別人、不在環境。":", not on ourselves, not on others, not on circumstances.","開始你的":"Beginning Your ","新生命":"New Life","「若有人在基督裏，他就是新造的人，舊事已過，都變成新的了。」":"“If anyone is in Christ, he is a new creation. The old things have passed away. Behold, all things have become new.”","（林後五 17）":"(2 Corinthians 5:17)","A01 開始你的新生命：七週初信造就課程，學生本內容與老師本督導指引合一，大字版，適合手機閱讀。":"A01 Beginning Your New Life: a seven-week new believer course with the student book and teacher's guide in one, in large print, made for reading on a phone.","I、彼此認識（15 分鐘）":"I. Getting to know each other (15 min)","I、分享交談（10 分鐘）":"I. Sharing and conversation (10 min)","II、複習 約三 16（15 分鐘）":"II. Reviewing John 3:16 (15 min)","II、複習經文（10 分鐘）":"II. Reviewing the verse (10 min)","III、課程介紹（15 分鐘）":"III. Introducing the course (15 min)","III、應用真理（30 分鐘）":"III. Applying the truth (30 min)","IV、禱告服事（10 分鐘）":"IV. Prayer ministry (10 min)","V、前瞻下週（5 分鐘）":"V. Looking ahead to next week (5 min)","安排下次的會面。":"Arrange the next meeting.","提醒他預先讀完第二課。":"Remind him to read Lesson 2 in advance.","提醒他預先讀完第三課。":"Remind him to read Lesson 3 in advance.","為彼此的代禱事項禱告。":"Pray for each other's prayer requests.","彼此分享過去一週的生活，留意對方是否有需要或掙扎。":"Share how the past week has gone for each of you, watching for any need or struggle.","把七件事讀過一遍，圈出你這週要先做的一件。":"Read through the seven things and circle the one you will do first this week.","確定自己有一本聖經。":"Make sure you have a Bible of your own.","與屬靈父母約定固定的見面時間與地點。":"Agree a regular time and place to meet with your spiritual parent.","預先讀完第二課。":"Read Lesson 2 in advance.","這是第一次會面。目的是彼此認識、確定對方明白福音、介紹整個課程的走法。本課約 45 分鐘。":"This is the first meeting. The aim is to get to know each other, make sure he understands the gospel, and introduce how the course works. Allow about 45 minutes.","敞開分享自己":"Share openly about yourself","，這會幫助對方更有勇氣敞開。可以問：你有幾個兄弟姐妹？你最親的人是誰？你家人的宗教信仰為何？你會如何形容你 7～12 歲之間的生活？":". This gives him courage to open up too. You might ask: how many brothers and sisters do you have? Who are you closest to? What faith does your family hold? How would you describe your life between the ages of seven and twelve?","自我介紹為他的屬靈父母":"Introduce yourself as his spiritual parent","：讓對方知道你願意委身陪伴他生命的成長，特別是開始的階段，所以希望接下來六週固定見面。":": let him know you are willing to commit to walking with him as his life grows, especially at the beginning, and that you would like to meet regularly for the next six weeks.","定下固定的見面時間與地點":"Fix a regular time and place to meet","。若可行，定在屬靈孩子的家，這也能幫助你更認識他的家庭。":". If it can be done, meet at your spiritual child's home; this also helps you come to know his family.","確保他明白福音，並知道自己為何成為基督徒。複習之後問：":"Make sure he understands the gospel and knows why he became a Christian. After reviewing, ask: ","「為什麼你會成為基督徒？」":"“Why did you become a Christian?”","答案應包含：":"The answer should include: ","因為罪使我們與神分開，我們的靈就死了。":"Sin separated us from God, and our spirit was dead.","人靠自己的努力（去教會、行善、參加其他宗教）決不能達到神的標準。":"No human effort — church attendance, good deeds, other religions — can ever reach God's standard.","因著愛，神差祂的愛子耶穌為我們的罪死，使我們藉著信得救，與神的關係得以恢復。":"In love, God sent His beloved Son Jesus to die for our sin, so that through faith we are saved and our relationship with God is restored.","他也許會給別的答案——神醫治了他、朋友的見證、危機中的幫助。這不代表他錯了。但若答案中沒有以上重點，就帶他再看一次約三 16，說明其中的重點。":"He may give other answers — God healed him, a friend's testimony, help in a crisis. That does not make him wrong. But if the points above are missing, take him through John 3:16 again and explain them.","解答問題：":"Answering questions: ","盡量回答他的疑問。若他的問題在後面課程會解答，就告訴他我們會在課程中再說明，並把問題記在你課本的相關單元，向他保證你會在適當的時間回答。":"Answer his questions as best you can. If a question is covered later, tell him it will be dealt with in a coming lesson, note it in the relevant section of your own book, and assure him you will answer it at the right time.","為他預備一本《開始你的新生命》，一同瀏覽序言。":"Have a copy of Beginning Your New Life ready for him, and look through the preface together.","課程結束時":"By the end of the course","，你們會建立較深的關係，他也有一位屬靈父母看顧。他將固定參與家組與聚會、固定靈修會主、按進度讀經、做簡單的禱告、學習等候神的聲音、被聖靈充滿、背誦至少六節經文、處理每日的罪、操練信仰的基本生活模式。":", the two of you will have a deeper relationship and he will have a spiritual parent watching over him. He will be attending his home group and the meetings regularly, keeping a regular time of listening to the Lord, reading according to the plan, praying simply, learning to wait on God's voice, filled with the Holy Spirit, having memorised at least six verses, dealing with daily sin, and practising the basic patterns of a life of faith.","略覽七大項目":"Skim the seven items","，特別強調第四、五項。買聖經（確認他有）、加入家組（說明家組在做什麼、為何不能獨自生活、家組對你個人的意義）、閱讀本書（鼓勵每週撥一至兩天讀，細讀、背誦、回答問題、完成作業、與人分享）、聆聽神的聲音（分享這在你生命中極重要，並示範如何用靈修會主讀馬可福音）。":", giving special weight to the fourth and fifth. Buying a Bible (check that he has one); joining a home group (explain what the group does, why no one can live the Christian life alone, and what the group means to you personally); reading this book (encourage him to set aside one or two days a week to read closely, memorise, answer the questions, do the assignments, and share with others); listening to God's voice (tell him how vital this has been in your own life, and show him how to read Mark using the Listening to the Lord guide).","說明每次會面的結構":"Explain the shape of each meeting","：分享交談 10 分／複習經文 10 分／應用真理 30 分／禱告服事 10 分／前瞻下週 5 分。":": sharing 10 min / reviewing the verse 10 min / applying the truth 30 min / prayer ministry 10 min / looking ahead 5 min.","問他是否有代禱事項。":"Ask whether he has anything he would like prayer for.","讓你的禱告成為他可以學習的模式：精簡、口語化。":"Let your prayer be a pattern he can learn from: short, and in everyday language.","感謝神在基督裏所賜的救恩。":"Give thanks for the salvation God has given in Christ.","祈求神的保守與祝福。":"Ask for God's keeping and blessing.","讓他知道在下次會面前，若有任何代禱需要可以隨時聯絡你。":"Let him know he can contact you at any time before the next meeting if he needs prayer.","背誦約翰壹書五 11-12，並每日複習。":"Memorise 1 John 5:11-12, and review it daily.","開始每日閱讀馬可福音，按靈修會主指引讀，並把領受寫在靈修筆記上。":"Begin reading Mark daily, following the Listening to the Lord guide, and write what you receive in your devotional notebook.","與一位家人和一位朋友，分享你與神的新關係。只要告訴他們你已經是基督徒、這對你的意義，不必講道理，只要分享。":"Tell one family member and one friend about your new relationship with God. Simply say that you are now a Christian and what that means to you. No need to argue a case — just share.","幫助屬靈孩子確定救恩，並認識與神之間父子關係的意義。":"Help your spiritual child be sure of his salvation, and understand what a father-child relationship with God means.","：這是基督教與其他宗教的不同點。它不只是宗教（教導我們分辨好壞），而是關係（父與子的關係）。":": this is where Christianity differs from other religions. It is not merely a religion teaching us to tell good from bad; it is a relationship — that of a father and a child.","讓他明白新關係的意義":"Help him grasp what the new relationship means","：我們需要認識神，不只是知識上，而是關係上的認識。有些屬靈孩子沒有一個好父親，並不期待與神的父子關係，要向他們保證神是世上最好的父親。":": we need to know God, not only in knowledge but in relationship. Some spiritual children never had a good father and do not look forward to a father-child relationship with God; assure them that God is the best Father in the world.","複習 約壹五 11-12。若他還沒讀過第二課，先給他一些時間讀完，再進入應用真理。":"Review 1 John 5:11-12. If he has not yet read Lesson 2, give him some time to finish it before moving on to applying the truth.","A 確定救恩":"A. Assurance of salvation","用一個看得見的比喻：":"Use a visible illustration: ","用一支筆代表永生，用聖經代表耶穌基督。讀約壹五 11：":"Let a pen stand for eternal life and a Bible stand for Jesus Christ. Read 1 John 5:11: ","「這見證就是神賜給我們永生，這永生也是在他兒子裏面。」":"“The testimony is this, that God gave to us eternal life, and this life is in his Son.”","把筆（永生）放在聖經（耶穌）中。再讀五 12：":"Place the pen (eternal life) inside the Bible (Jesus). Then read verse 12: ","「人有了神的兒子就有生命；沒有神的兒子就沒有生命。」":"“He who has the Son has the life. He who doesn't have God's Son doesn't have the life.”","若他得到這本聖經（基督），他也就得到了筆（永生）。":"If he receives the Bible (Christ), he receives the pen (eternal life) with it.","用三個問題確認他的把握：":"Confirm his assurance with three questions: ","「你是否有耶穌在你生命中？」若答「有」，再問「你怎麼知道？」——他應該說：因為我相信祂，並且已經邀請祂進入我的生命，作我生命的主和救主。":"“Is Jesus in your life?” If he says yes, ask “how do you know?” He should answer: because I believed in Him and invited Him into my life as my Lord and Saviour.","「耶穌在你生命中，你就有了什麼？」——我有永生。":"“Since Jesus is in your life, what do you have?” — I have eternal life.","「你怎麼知道有了耶穌你就有永生？」——因為這是神在祂話語中給我的應許。":"“How do you know that having Jesus means having eternal life?” — because this is God's promise to me in His word.","再問他：如果有人問他什麼是基督徒，他會怎麼回答？（基督徒是相信耶穌基督、並邀請耶穌進入生命作主和救主的人，因而得著永生。）":"Then ask: if someone asked him what a Christian is, how would he answer? (A Christian is someone who believes in Jesus Christ and has invited Him into his life as Lord and Saviour, and so has received eternal life.)","最後":"Finally, ","分享你的個人見證":"share your personal testimony","，以「神對你個人的意義」作總結。":", closing with what God means to you personally.","B 父子之間的關係":"B. The relationship between a father and a child","花幾分鐘一起觀察窗外的飛鳥（例如麻雀），再花一些時間數算彼此的頭髮。問他有什麼發現、有什麼心得。":"Spend a few minutes watching the birds outside the window — sparrows, say — and then spend a while trying to count each other's hairs. Ask him what he noticed and what he made of it.","接著讀太十 29-31，說明他剛才看到的不單是飛鳥，其中更是神對這些飛鳥的看顧！若神供應飛鳥的需要，我們這些神的孩子，神豈不更加照顧？讓他知道神在乎他到一個程度，甚至連他的頭髮也都數過了。":"Then read Matthew 10:29-31 and explain that what he saw was not merely birds but God's care over those birds. If God provides for the birds, how much more will He care for us, His children? Let him see that God cares about him so much that even the hairs of his head are numbered.","最後問：他對第二課有什麼回應或疑問？":"Close by asking: what response or questions does he have to Lesson 2?","在禱告中敬拜神為父的屬性。":"In prayer, worship God for His fatherly nature.","為屬靈孩子與神的關係得建立禱告。":"Pray that your spiritual child's relationship with God would be established.","希伯來書十 24-25":"Hebrews 10:24-25","以弗所書四 16":"Ephesians 4:16","彼得後書一 21":"2 Peter 1:21","（提前二 4）":"(1 Timothy 2:4)","（約壹四 13）":"(1 John 4:13)","（箴四 23）":"(Proverbs 4:23)","你們不可停止聚會，好像那些停止慣了的人，倒要彼此勸勉。":"Not forsaking our own assembling together, as the custom of some is, but exhorting one another.","你已經成為「神的家」的一部分，這個家就是教會。教會並不是一棟建築物，也不單是星期天的崇拜聚會。教會是一個由基督徒組成的團體，而「家組」就像一個小型的家，他們委身於彼此造就，並去得著那些不認識耶穌基督的人。他們每週定時聚集，也在聚會時間以外經常聯繫。":"You have become part of God's family, and that family is the church. The church is not a building, nor merely the Sunday service. The church is a community made up of Christians, and a home group is like a small household within it — a group committed to building one another up and to reaching those who do not yet know Jesus Christ. They meet at a set time each week, and keep in touch between meetings as well.","家組所以存在，有兩個目的：":"A home group exists for two purposes:","一、在家組中彼此造就":"1. Building one another up in the home group","神從未計劃讓你成為一位孤立的基督徒。再說，作一位離群獨立的基督徒並非易事；神的計劃是要你與其他基督徒在同一個身體內一起成長。":"God never planned for you to be an isolated Christian. Besides, living the Christian life apart from others is no easy thing. God's plan is for you to grow together with other Christians within one body.","全身都靠祂聯絡得合式，百節各按各職，照著各體的功用彼此相助，便叫身體漸漸增長，在愛中建立自己。":"From him the whole body, being fitted and knit together through that which every joint supplies, according to the working in measure of each individual part, makes the body increase to the building up of itself in love.","這裏的意思是說，神使你成為支撐聯繫整個身體各部分的其中一條韌帶。也是說，你必須在神的家（也就是在家組）中，藉著信徒間的彼此造就，才能得到成長。彼此造就即彼此建立、彼此扶持的意思。":"This means God has made you one of the ligaments that hold the parts of the body together. It also means that you can only grow within God's family — that is, within a home group — as believers build one another up. Building one another up means strengthening and supporting each other.","A 你的委身":"A. Your commitment","要在家組中得到成長，你就要對家組委身，要把家組列為你生活中的優先。若你已成家，就要全家一起委身。":"To grow in a home group you must be committed to it, and give it a place of priority in your life. If you have a family of your own, let the whole household be committed together.","又要彼此相顧，激發愛心，勉勵行善。你們不可停止聚會，好像那些停止慣了的人，倒要彼此勸勉；既知道那日子臨近，就更當如此。":"Let's consider how to provoke one another to love and good works, not forsaking our own assembling together, as the custom of some is, but exhorting one another, and so much the more as you see the Day approaching.","以出席家組聚會表示你的委身。你的出席對於其他家人而言，是很可貴的。你也要參與家組的活動，因為你的參與能造就其他家人。生活中總會有許多其他事故使你分心，必須下定決心，不讓它們阻撓你委身。":"Show your commitment by being at the home group meetings. Your presence is precious to the others. Take part in the group's activities too, because your taking part builds up the rest. Life will always throw up other things to distract you; make up your mind not to let them stand in the way of your commitment.","B 你的貢獻":"B. Your contribution","神計劃使你成為家組中一位重要的家人。祂期望你成為其中活躍的一份子，對其他家人的成長作出貢獻。祂並不要你單從他人那裏領受恩典，祂也要你成為一條恩典的管道，使他人蒙福。":"God plans for you to be an important member of the home group. He wants you to be an active part of it, contributing to the growth of the others. He does not intend you only to receive grace from others; He also means you to be a channel of grace by which others are blessed.","聖靈會賜下屬靈的恩賜，讓你可以運用恩賜去造就家組。聖靈的恩賜也許是神所啟示的一句話，為了造就和激勵家組；也許是針對某人的生活情況（身體、情感或屬靈狀況）而賜下的一句話；或者是來自聖靈的感動，要你去為某人的病得醫治禱告。":"The Holy Spirit gives spiritual gifts so that you can use them to build up the group. A gift of the Spirit might be a word God reveals to encourage and strengthen the group; or a word given for someone's particular situation, whether physical, emotional or spiritual; or a prompting of the Spirit to pray for someone's healing.","對家組作出貢獻的其中一個方式，是實際地去幫助家組中家人的需要。你可以牧養一位新信徒，就如你本身得到別人的牧養一樣。若你繼續委身追求成長，你很快就能成為別人的屬靈父母了。這其實應當是你的其中一個目標——最快的學習方法，就是去幫助其他人學習。":"One way to contribute is to meet the practical needs of the members. You can shepherd a new believer, just as someone is shepherding you. If you stay committed to growing, before long you will be able to be someone's spiritual parent. That should in fact be one of your goals — the fastest way to learn is to help someone else learn.","二、透過家組傳福音":"2. Sharing the gospel through the home group","「祂願意萬人得救，並且完全認識真理。」":"“He desires all people to be saved and come to full knowledge of the truth.”","因此，神不但期望家組能藉著信徒之間的造就，在屬靈生命上得著成長，祂也期望家組透過傳福音，在人數上得到增長。傳福音就是把關於神的救恩的好消息告訴未信者。":"So God wants the home group not only to grow spiritually as believers build one another up, but also to grow in number through evangelism. Evangelism is telling those who do not yet believe the good news of God's salvation.","你和你的家組可以成為神恩典的管道，把神的恩典傳送給你未信的家人、親人和朋友。你可以讓家組為你生活關係網中常接觸的人禱告，為他們能得到救恩而祈求；也可以邀請他們來到家組，或邀請家組一起去探望他們，彼此認識。":"You and your home group can be a channel of God's grace to the family, relatives and friends who do not yet believe. Have the group pray for the people you meet regularly, asking that they would receive salvation. You can also invite them to the group, or invite the group to visit them so that they get to know one another.","家組不是活動，是":"The home group is not an activity; it is ","屬神體系":"the system that belongs to God","最小的樣子。321 講的":" at its smallest. What 321 calls ","就在這裏開始：先與沒有問題、無己的人成為":" begins right here. First become ","——屬靈同伴；再建立":" — spiritual companions — with people who are selfless and without an agenda. Then build ","——屬靈父母與兒女的關係；最後成為":" — the relationship of spiritual parents and children. Finally become ","——五重職份的屬靈戰友團隊。":" — a team of spiritual comrades in the fivefold ministry.","而家組能不能合一，關鍵不在技巧，在":"Whether a home group can be one does not turn on technique. It turns on ","無己":"selflessness","。有己的人在群體裏會爭大、會計較、會受傷；":". A self-centred person in a group will contend for position, keep score, and get wounded. ","無己才能合一，無己才能得勝":"Only the selfless can be one; only the selfless can overcome","。記住：":". Remember: ","人比事重要，關係比東西重要":"people matter more than tasks, relationships more than things","，不要為了事而傷害人。":" — do not wound a person for the sake of a task.","背誦希伯來書十 25，每日複習。":"Memorise Hebrews 10:25, and review it daily.","每日複習你背過的所有經文.":"Review daily every verse you have memorised.","每日複習你背過的所有經文。":"Review daily every verse you have memorised.","繼續按照靈修會主指引，每日閱讀馬可福音，並寫靈修筆記。":"Keep reading Mark daily by the Listening to the Lord guide, and write in your devotional notebook.","與你的家組長和一位家人交談，瞭解家組對他們有何意義。":"Talk with your home group leader and one member, and find out what the group means to them.","求神指示如何在本週內服事或造就其中一位家組的家人。":"Ask God to show you how to serve or build up one member of the group this week.","邀請幾位家組的家人到你家探訪，介紹給你的家人認識。":"Invite a few members of the group to your home, and introduce them to your family.","幫助屬靈孩子委身家組，並開始學習透過家組傳福音。":"Help your spiritual child commit to the home group, and begin learning to share the gospel through it.","分享你在過去一週靈修會主中的領受。":"Share what you received in your times of listening to the Lord this past week.","：教會不是一個建築，而是信徒的組合。在家中，我們找到信仰的榜樣，被教導，並得著鼓勵。若不藉著家組，我們無法得到這些幫助。":": the church is not a building but a gathering of believers. In this family we find models of faith, we are taught, and we are encouraged. Without a home group we cannot receive any of that.","讓他明白家組的兩個功能":"Help him see the group's two functions","：造就（要得造就，需要委身及付出，強調付出的重要性）與傳福音（二人總比一人好，家組是我們向朋友傳福音的一大幫助）。":": building up (which requires commitment and giving — stress how much the giving matters) and evangelism (two are better than one, and the group is a great help in reaching our friends).","問問他，這週對耶穌有什麼新發現：祂是誰／祂做過什麼／祂的教導是什麼。若他還沒讀聖經，鼓勵他開始，並瞭解他讀經中的困難。":"Ask what he has newly discovered about Jesus this week: who He is, what He did, what He taught. If he has not started reading, encourage him to begin and find out what is making it difficult.","複習 約壹五 11-12、來十 25。若他還沒讀過第三課，先給他時間讀完。":"Review 1 John 5:11-12 and Hebrews 10:25. If he has not yet read Lesson 3, give him time to finish it first.","A 在家組中彼此造就":"A. Building one another up in the home group","問：「你覺得家組有什麼意義？」瞭解他對家組的認識，及他與家組之間的關係。":"Ask, “what do you think the home group is for?” Find out how he understands it and where he stands with the group.","瞭解他在家組中的感受，談談他能做些什麼來幫助家組達到目的。這是很好的機會，提醒他委身並付出——這是家組變得更好的方式。留意他是否能適應家組的生活。":"Find out how he feels in the group, and talk about what he could do to help it fulfil its purpose. This is a good moment to remind him of commitment and giving — that is how a group gets better. Watch whether he is settling into the life of the group.","討論是否能邀請家組中另外兩三個家人一起出外活動：用餐、開放他的家、郊遊或玩遊戲。鼓勵他探訪家組的家人，也許這週就安排探訪一個人。幫助他做安排並持續跟進，確保在七週結束以前達成。":"Discuss whether he could invite two or three others from the group to do something together: a meal, opening his home, an outing, a game. Encourage him to visit members of the group — perhaps arrange one visit this week. Help him plan it and keep following up, so that it happens before the seven weeks are out.","分享家組中另外兩個人的需要，建議在待會禱告中為他們代禱。你也可以分享自己的需要。":"Share the needs of two other people in the group and suggest praying for them shortly. You may share your own needs too.","B 透過家組傳福音":"B. Sharing the gospel through the home group","分享你如何傳福音給你圈內的人（家人、親戚、同事和朋友）。瞭解他目前傳福音的狀況，他有什麼「福音對象」嗎？":"Share how you reach the people in your own circle — family, relatives, colleagues, friends. Find out where he stands: does he have anyone in mind to reach?","「若不計畫，就等於在計畫失敗。」":"“Failing to plan is planning to fail.”","那些對象有什麼需要是我們可以為他禱告的？":"What needs do those people have that we could pray for?","最後問：他對第三課有什麼回應或疑問？":"Close by asking: what response or questions does he have to Lesson 3?","為著神給我們家組使我們成長感恩。":"Give thanks that God has given us a home group in which to grow.","為彼此的需要禱告，包括剛提到其他家組家人的需要。請他為其中一位組員禱告，你則為他和另一位家人禱告。":"Pray for each other's needs, including those of the group members just mentioned. Ask him to pray for one member, while you pray for him and for another.","為著要傳福音的對象禱告。":"Pray for the people you each hope to reach.","提醒他預先讀完第四課。":"Remind him to read Lesson 4 in advance.","你已經踏上了這段旅程，漸漸地在與神的新關係上成長。要培養任何一段關係，有兩項基本要素不可或缺：":"You have set out on the journey, and your new relationship with God is slowly growing. Any relationship needs two essentials if it is to develop: ","時間":"time","與":" and ","溝通":"communication","。基於同一個道理，你必須抽出時間去與神溝通，才能建立起你與神之間的關係。我們稱這段與神獨處的時間為「靈修會主時間」。":". For the same reason, you must set aside time to communicate with God if your relationship with Him is to be built. We call this time alone with God “listening to the Lord.”","有意義的溝通，必須是一種雙向的交談與聆聽。在這一課裏，我們要談「聆聽神說話」。你必須學會聆聽神說話，因為祂要親自對你說話，就好像父親對孩子說話一樣。":"Meaningful communication must run both ways — speaking and listening. In this lesson we look at listening to God. You must learn to hear Him, because He intends to speak to you Himself, as a father speaks to his child.","一、神透過聖經對你說話":"1. God speaks to you through the Bible","聖經是神藉著文字的記載對我們說話。聖經共有六十六卷書，其中舊約三十九卷，新約二十七卷。神在一千五百年間（約由主前 1400 年至主後 90 年）的不同時期，藉著不同的人寫下了聖經。":"The Bible is God speaking to us in written form. It contains sixty-six books — thirty-nine in the Old Testament and twenty-seven in the New. God had it written through different people at different times across some fifteen hundred years, from roughly 1400 BC to AD 90.","因為預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來。":"For no prophecy ever came by the will of man, but holy men of God spoke, being moved by the Holy Spirit.","就這樣，聖經就是神的話語。神在聖經中透露了自己，並說明我們與祂之間的關係。":"And so the Bible is the word of God. In it God discloses Himself and sets out the relationship between us and Him.","每天固定花一段時間親近神，使用靈修會主指引閱讀聖經，聆聽神對你所說的話，並將領受寫在靈修筆記上。":"Set aside a regular time each day to draw near to God. Read the Bible with the Listening to the Lord guide, hear what He says to you, and write what you receive in your devotional notebook.","二、神在你內心對你說話":"2. God speaks to you within your heart","或許你正在猶疑：我怎麼知道神對我說話？":"You may be wondering: how would I know that God is speaking to me?","神通常都不會以肉耳聽得見的聲音說話。當神說話時，祂通常會在你內心對你說話，因為祂就住在那裏，以聖靈的位格內住。":"God does not usually speak in a voice the ear can hear. When He speaks, He generally speaks within your heart, because that is where He lives, indwelling you in the person of the Holy Spirit.","「神將祂的靈賜給我們，從此就知道我們是住在祂裏面，祂也住在我們裏面。」":"“By this we know that we remain in him and he in us, because he has given us of his Spirit.”","神所說的話，常常是你所意料不到的。祂總是提議美善的事物，祂絕不會叫你去作壞事，也不會說一些違反聖經教導的話。":"What God says is often what you would not have expected. He always proposes what is good. He will never tell you to do wrong, nor say anything that goes against the teaching of Scripture.","神在你內心說話的聲音是自然流露的，既輕聲又溫和，也許是一句話、一陣思潮、一個想法、一種感覺、一幅畫面，或一個異象。祂會對你說關於祂自己、你個人，或關於別人的事。你也許會聽見祂說：「我愛你！」繼而感覺祂的愛洋溢在你心中；或者聽見祂說：「你心裏不要憂愁，信靠我吧！」然後你感受到祂所賜的平安；又或者祂會對你說：「去向某人談起我的事。」祂也會把一節經文帶到你心裏，說明你生活中的某種情況。":"God's voice within your heart comes naturally, quietly and gently. It may be a sentence, a train of thought, an idea, a feeling, a picture or a vision. He may speak about Himself, about you, or about someone else. You might hear Him say, “I love you,” and then feel His love welling up within you; or, “do not let your heart be troubled — trust me,” and then sense the peace He gives; or, “go and speak to that person about me.” He may also bring a verse to mind that speaks into a particular situation in your life.","誠然，聖經是神對我們說話的主要途徑，然而祂也藉著我們周圍的環境，甚至夢境來對我們說話。":"Scripture is certainly the primary way God speaks to us, but He also speaks through the circumstances around us, and even through dreams.","聆聽神聲音的三個基本步驟":"Three basic steps in listening to God's voice","1. 安靜聆聽":"1. Be still and listen","學習聆聽神說話的一個好方法，就是安靜聆聽。閉上眼睛，在神面前安靜等候，集中心思去聆聽祂在你內心說話的聲音。":"A good way to learn to hear God is simply to be still and listen. Close your eyes, wait quietly before Him, and set your mind on hearing His voice within your heart.","2. 確定神的聲音":"2. Confirm that it is God's voice","初學者最好能夠把所聽到的啟示與一位靈命較成熟、有經驗的信徒分享，以鑒別所聽見的是否來自神。你也可以和家組長或屬靈父母分享。":"At the beginning it is best to share what you receive with a more mature and experienced believer, so as to test whether it came from God. You can share it with your home group leader or your spiritual parent.","3. 別氣餒":"3. Do not lose heart","你最初也許聽不見神對你說話，但不要放棄，要不斷嘗試，努力學習。當你經驗越豐富，就會越容易、越快分辨出神的聲音了。":"At first you may hear nothing. Do not give up; keep trying and keep learning. The more experience you gain, the more easily and quickly you will recognise God's voice.","這一課是三個基礎中的兩個同時運作：":"In this lesson two of the three foundations are working at once. ","——凡是聽見的都要回到聖經檢驗；":" — everything you hear must be taken back to Scripture and tested. ","——神的聲音落在心裏，不落在頭腦。":" — God's voice lands in the heart, not in the head.","所以要學會":"So learn to ","用心靠聖靈，不要用腦靠自己":"use the heart and rely on the Spirit, not the head and yourself","。用腦就煩惱，用心就開心。":". The head brings worry; the heart brings gladness.","「你要保守你心，勝過保守一切，因為一生的果效是由心發出。」":"“Keep your heart with all diligence, for out of it is the wellspring of life.”","聖靈住在心中，不是住在腦中。安靜下來，是把自己的聲音關小，好讓神的聲音顯出來——這就是":"The Holy Spirit lives in the heart, not in the head. Being still means turning your own voice down so that God's voice can be heard — and that is the practice of ","的操練。":".","背誦約翰福音六 63。":"Memorise John 6:63.","每日複習你曾背過的所有經文。":"Review daily every verse you have memorised.","安排固定的時間與地點，每日靈修會主。":"Set a fixed time and place to listen to the Lord each day.","本週運用靈修會主指引聆聽神說話，問兩個問題：這段經文講甚麼？上帝對我說甚麼話？":"Use the Listening to the Lord guide this week and ask two questions: what does this passage say? What is God saying to me?","幫助屬靈孩子開始固定靈修會主，並實際經歷神在他內心說話。":"Help your spiritual child begin a regular time of listening to the Lord, and actually experience God speaking within his heart.","強調藉著聆聽神說話來建立與神的關係：神透過聖經對我們說話，神也在我們內心說話。":"Stress that the relationship with God is built by listening to Him: God speaks to us through Scripture, and God speaks within our hearts.","溝通是建立任何關係的重要條件。強調溝通是「雙向的」，不是我們慣用的「單向」式。這一課我們著重「聆聽」。":"Communication is essential to any relationship. Stress that it runs both ways, not the one way we are used to. This lesson concentrates on listening.","複習 約壹五 11-12、來十 25、約六 63。若他還沒讀過第四課，先給他時間讀完。":"Review 1 John 5:11-12, Hebrews 10:25 and John 6:63. If he has not yet read Lesson 4, give him time to finish it first.","A 神透過聖經對你說話":"A. God speaks to you through the Bible","瞭解他如何讀聖經（靈修會主指引見附錄）。":"Find out how he reads the Bible (the Listening to the Lord guide is in the appendix).","瞭解他是否有分別出固定的時間與地點。固定的時間和地點有助於培養習慣。可以問：「你通常在什麼時間、什麼地方靈修呢？」從回答中你會知道他是否已經養成習慣。":"Find out whether he has set apart a fixed time and place; both help a habit form. You might ask, “when and where do you usually have your devotions?” His answer will tell you whether the habit has taken hold.","瞭解過去一週他讀馬可福音的狀況。":"Find out how his reading of Mark went this past week.","分享神在過去一週中教導你或對你所說的話。":"Share what God taught you or said to you this past week.","請他分享過去一週他聆聽神的記錄。":"Ask him to share his record of listening to God this past week.","B 神在你內心對你說話":"B. God speaks within your heart","這是很興奮的時段，特別是對於未曾經歷過的人。":"This is an exciting part, especially for someone who has never experienced it.","請他分享最近聽到神聲音的經歷，留意他是否面對困難或挫敗，並鼓勵他。":"Ask him to share any recent experience of hearing God's voice. Watch for difficulty or discouragement, and encourage him.","分享你自己聆聽神聲音的歷程。":"Share your own journey of learning to hear God's voice.","實際操練：":"A practical exercise: ","花 10 分鐘安靜在神面前聆聽，之後彼此分享神對你們說的話。可以用 5 分鐘彼此為對方禱告，求神給一句鼓勵對方的話，另 5 分鐘彼此分享。":"Spend 10 minutes still before God, listening, and then share with each other what He said. You might use 5 minutes praying for one another, asking God for a word of encouragement for the other, and 5 minutes sharing it.","最後問：他對第四課有什麼回應或疑問？":"Close by asking: what response or questions does he have to Lesson 4?","分享彼此的代禱事項。":"Share your prayer requests with each other.","為著可以聆聽神聲音的特權感恩。":"Give thanks for the privilege of being able to hear God's voice.","為彼此的需要禱告——請你的屬靈孩子也為你禱告。":"Pray for each other's needs — ask your spiritual child to pray for you too.","為他禱告，好叫他能更清楚聽見神說話。":"Pray for him, that he would hear God speak more clearly.","提醒他在這週聆聽神，並作記錄。":"Remind him to listen to God this week and write it down.","提醒他預先讀完第五課。":"Remind him to read Lesson 5 in advance.","分享彼此在過去一週的生活，留意對方是否有需要或掙扎。":"Share how the past week has gone for each of you, watching for any need or struggle.","第一課 · 七件重要的事":"Lesson 1 · Seven important things","第二課 · 開始你的新關係（一）":"Lesson 2 · Beginning your new relationship (1)","第三課 · 開始你的新關係（二）":"Lesson 3 · Beginning your new relationship (2)","第四課 · 建立你與神的新關係（一）":"Lesson 4 · Building your new relationship with God (1)","第五課 · 建立你與神的新關係（二）":"Lesson 5 · Building your new relationship with God (2)","第七課 · 讓耶穌作主．受洗與奉獻":"Lesson 7 · Letting Jesus be Lord · baptism and giving","第 # 週 ／ 共 # 週":"Week # of #","附　錄 →":"Appendix →","彼得前書五 7":"1 Peter 5:7","羅馬書四 7 ——這裏的罪，指的是「罪行」":"Romans 4:7 — here “sins” means sinful deeds","羅馬書六 12 ——這裏的罪，指的是「罪性」":"Romans 6:12 — here “sin” means the sinful nature","羅馬書六 17-18":"Romans 6:17-18","加拉太書二 20":"Galatians 2:20","以弗所書六 10-11":"Ephesians 6:10-11","（弗五 20）":"(Ephesians 5:20)","（詩三十四 1）":"(Psalm 34:1)","（詩六十六 18）":"(Psalm 66:18)","（太六 8）":"(Matthew 6:8)","（林前十四 4）":"(1 Corinthians 14:4)","（林前十二 31）":"(1 Corinthians 12:31)","（路十一 13）":"(Luke 11:13)","（可十六 17）":"(Mark 16:17)","（詩五十一 4）":"(Psalm 51:4)","（來二 18）":"(Hebrews 2:18)","（詩二十三 3）":"(Psalm 23:3)","（約八 44）":"(John 8:44)","上一課提到：在與神建立關係的過程中，你需要學習聆聽神說話。然而這只是雙軌溝通的其中一個方向，還有另一個方向，就是":"The last lesson said that as your relationship with God is built you must learn to hear Him speak. But that is only one direction of a two-way exchange. The other direction is ","與神談話":"talking with God","。神很樂意聽你對祂說話。與神談話就是聖經所謂的「禱告」。":". God is glad to hear you speak to Him. Talking with God is what the Bible calls prayer.","一、如何向神禱告":"1. How to pray to God","「我不知如何禱告，也不知道要在禱告中說些什麼！」這是你的顧慮嗎？別忘了，神是你的天父，你是祂的兒女，你只需要像和一位好朋友談話一般地與祂交談就行了！如果你有個好消息或有個難題，你只要原原本本地對祂說。你可以在一天之中的任何時間與祂交談，你可以跟祂無所不談。":"“I do not know how to pray, or what to say when I do!” Is that your worry? Remember that God is your Father in heaven and you are His child. You need only talk with Him as you would with a good friend. If you have good news or a difficulty, simply tell Him just as it is. You may talk with Him at any hour of the day, and there is nothing you cannot talk to Him about.","A 你可以按「五指禱告」的形式來禱告":"A. You can pray using the five-finger pattern","感謝":"Thanksgiving","凡事謝恩。":"Give thanks in everything.","「凡事要奉我們主耶穌基督的名常常感謝父神。」":"“Giving thanks always concerning all things in the name of our Lord Jesus Christ to God the Father.”","不論是喜是憂，是好是壞，在逆境中、在順境裏，都要感謝神。":"In joy or sorrow, in good or bad, in adversity or ease — give thanks to God.","讚美":"Praise","隨時隨地讚美神。":"Praise God at all times and in all places.","「我要時時稱頌耶和華，讚美他的話必常在我口中。」":"“I will bless Yahweh at all times. His praise will always be in my mouth.”","讚美祂的本性，讚美祂所成就的一切事。養成以讚美敬拜作為一日之始的習慣。":"Praise Him for who He is, and for all He has done. Make it your habit to begin the day in praise and worship.","認罪":"Confession","向神承認你的罪。":"Confess your sins to God.","「我若心裏注重罪孽，主必不聽。」":"“If I cherished sin in my heart, the Lord wouldn't have listened.”","誠懇地為自己的罪向神懺悔，神必要赦免你。認罪能確保你與神之間的溝通不會被切斷。":"Repent sincerely before God for your sin and He will forgive you. Confession keeps the line of communication between you and God from being cut.","祈求":"Petition","為你的需要祈求。":"Ask for what you need.","「因為你們沒有祈求以先，你們所需用的，你們的父早已知道了。」":"“For your Father knows what things you need before you ask him.”","這並不意味著你就不必禱告了，而是你可以更有信心。也要每日為自己屬靈生命的成長祈求。":"This does not mean you need not pray; it means you may pray with more confidence. Ask daily too for the growth of your own spiritual life.","代禱":"Intercession","為別人的需要代禱：家中的家人、家組的家人、牧師、朋友。對於那些還未認識耶穌基督的人而言，最重要的就是能夠歸向神。":"Intercede for the needs of others: your own household, the members of your home group, your pastor, your friends. For those who do not yet know Jesus Christ, the greatest need of all is to turn to God.","你們要將一切的憂慮卸給神，因為他顧念你們。":"Cast all your worries on him, because he cares for you.","B 你可以用聖靈所賜的禱告言語禱告":"B. You can pray in the prayer language the Holy Spirit gives","我們向神禱告時，常常不知道要說些什麼，因此神賜下一種特別的禱告言語，彌補我們在這方面的不足。聖經稱這種言語為「說方言」或「用方言禱告」。我們用方言禱告時，雖然自己並不知道在說些什麼，但那位賜我們方言的神卻能明白。":"Often when we pray we do not know what to say, and so God has given a special prayer language to make up for what we lack. Scripture calls it speaking in tongues, or praying in tongues. When we pray this way we do not ourselves know what we are saying, but the God who gave the tongue understands it.","「說方言的，是造就自己。」":"“He who speaks in another language edifies himself.”","你可以向你的屬靈父母或家組長表示你願意得著禱告的言語，他們會為你禱告。要如何得著在靈裏禱告的言語？":"You can tell your spiritual parent or home group leader that you would like to receive a prayer language, and they will pray for you. How is this prayer in the spirit received?","1. 渴慕——渴慕禱告的言語":"1. Desire — long for the prayer language","神從不強迫我們接受我們所不願意的。祂尊重我們的選擇，不抹煞我們的自由意志。所以我們要渴慕。":"God never forces on us what we do not want. He respects our choice and does not override our free will. So we must desire it.","「你們要切切地求那更大的恩賜。」":"“But earnestly desire the best gifts.”","2. 祈求——求神賜給":"2. Ask — ask God to give it","渴慕必須要有祈求作為行動的表現。":"Desire must be put into action by asking.","「你們雖然不好，尚且知道拿好東西給兒女；何況天父，豈不更將聖靈給求他的人嗎？」":"“If you then, being evil, know how to give good gifts to your children, how much more will your heavenly Father give the Holy Spirit to those who ask him?”","3. 信心——憑信心說出":"3. Faith — speak it out in faith","我們祈求之後必須操練憑信心說出。神會賜我們言語，祂不會代替我們，也不會強迫我們說出。正如你想說話時，你的頭腦會告訴你該說什麼；聖靈也同樣給你話語，但你必須自己說出。":"After asking, we must practise speaking out in faith. God gives the words, but He will not speak for us and will not force us to speak. Just as your mind tells you what to say when you want to speak, so the Holy Spirit gives you the words — but you must say them yourself.","「信的人必有神蹟隨著他們，就是奉我的名趕鬼，說新方言。」":"“These signs will accompany those who believe: in my name they will cast out demons; they will speak with new languages.”","用心靈憑信心靠聖靈，把神賜給你內心的感動用各種不同的聲音開口說出來，繼續不斷地用心靈說出內心的感動。縱使自己的頭腦聽不懂，只要神聽得懂就好了。":"With your heart, in faith, relying on the Holy Spirit, open your mouth and give sound to the prompting God has put within you, and keep on speaking it out from the heart. Even if your own mind cannot follow it, it is enough that God understands.","二、神如何應允你的禱告":"2. How God answers your prayer","雖然神會聽取你的每一項禱告，但祂不一定會照你所求的應允。神不是魔術師，也不是聖誕老人，祂不會把你所想要的一切都給你。就如所有負責任的父母親一樣，天父只把對你有益的東西賜給你，而只有祂才知道什麼是對你最好的。":"God hears every prayer you pray, but He does not always answer in the way you asked. God is not a magician, nor Father Christmas; He will not give you everything you want. Like any responsible parent, your Father in heaven gives you only what is good for you — and only He knows what is best for you.","神應允禱告的方式至少有四種：":"God answers prayer in at least four ways:","「好的」":"“Yes”","，我會照著你所求的賜給你。":" — I will give you what you asked.","「不」":"“No”","，這對你不好。":" — this would not be good for you.","「等著」":"“Wait”","，我會在適當的時候應允你。":" — I will answer you at the right time.","「我有一個更好的主意。」":"“I have a better idea.”","禱告最深的意義，是":"The deepest meaning of prayer is ","回到本位":"returning to your place","。驕傲是離開人的本位、抓住神的權力，想要代替神；謙卑是放下權力、回到本位，":". Pride leaves the place of a man and seizes the authority of God, wanting to take God's place. Humility lays that power down and returns — ","讓人作人，讓神作神":"letting man be man and God be God","。當我們開口禱告，就是承認：這件事我作不了主，主啊，祢來作王。":". When we open our mouths to pray, we are admitting: this is not mine to rule. Lord, You reign over it.","所以神說「不」和說「好」，同樣是恩典。":"So God's “no” is as much grace as His “yes.”","凡事謝恩，把榮耀歸給耶穌":"Give thanks in everything, and give the glory to Jesus","——這正是 321 的第二個核心：":" — this is the second of the two cores of 321: ","讓耶穌得到一切的榮耀":"let Jesus receive all the glory","背誦約翰福音十六 24。":"Memorise John 16:24.","本週運用靈修會主指引聆聽神說話。":"Use the Listening to the Lord guide this week to hear God speak.","按照「五指禱告」的五大要點來向神禱告。":"Pray to God following the five points of the five-finger pattern.","求神把禱告的言語賜給你，也可以請屬靈父母或家組長為你禱告。":"Ask God to give you a prayer language; you may also ask your spiritual parent or home group leader to pray for you.","幫助屬靈孩子操練與神溝通中「說話」的部分：五指禱告、禱告的言語，以及認識神回應禱告的四種方式。":"Help your spiritual child practise the speaking side of communication with God: the five-finger pattern, the prayer language, and the four ways God answers prayer.","瞭解他過去一週聆聽神聲音的情況，特別是讀馬可福音的情況。即使他沒有花時間或沒聽見神的聲音，仍要鼓勵他繼續如此行。":"Find out how listening to God went for him this past week, especially his reading of Mark. Even if he made no time for it or heard nothing, encourage him to keep at it.","複習 約壹五 11-12、來十 25、約六 63、約十六 24。若他還沒讀過第五課，先給他時間讀完。":"Review 1 John 5:11-12, Hebrews 10:25, John 6:63 and John 16:24. If he has not yet read Lesson 5, give him time to finish it first.","屬靈孩子從我們的榜樣中學得最有效。其中一個方式就是示範如何禱告，並用自己過去的經驗為例。我們的成功與失敗都能成為他們與神同行的鼓勵。":"A spiritual child learns best from our example. One way is to show him how to pray, using your own past experience. Both our successes and our failures can encourage him in his walk with God.","A 如何向神禱告":"A. How to pray to God","瞭解他過去一週使用「五指禱告」的經歷。若不問，你就不會知道；不知道，就無法幫助他。問問：是太簡單，還是太複雜？":"Find out how he got on with the five-finger pattern this past week. If you do not ask you will not know, and if you do not know you cannot help. Ask: was it too simple, or too complicated?","切記：格式是為了我們而造的，並非我們為格式而造。":"Remember: the pattern was made for us; we were not made for the pattern.","禱告格式的功能是協助我們禱告，不應成為捆綁。若他比較習慣其他方式，不要逼他改變，只要提醒他禱告中要包含感謝、讚美、認罪、祈求與代禱這五方面。":"A pattern is there to help us pray and should never become a binding. If another way suits him better, do not force a change; simply remind him that his prayer should include all five — thanksgiving, praise, confession, petition and intercession.","關於禱告的言語：":"On the prayer language: ","方言禱告是從神來的禮物，我們每個人都能得著。若他沒有用方言禱告，並不表示他是次等信徒；得著方言也不會使他變得比較屬靈。若他有誤解，用你個人的經歷來說明。":"praying in tongues is a gift from God, and any of us may receive it. If he does not pray in tongues, that does not make him a lesser believer; and receiving it does not make anyone more spiritual. If he has misunderstood, explain from your own experience.","問他是否願意領受禱告的言語。若願意，為他禱告；若不願意，不用勉強他而使他不舒服。要常保積極態度，鼓勵他領受這份禮物，並且有耐心。若你沒有把握，可以請家組長協助。":"Ask whether he would like to receive a prayer language. If he would, pray for him; if not, do not press him into discomfort. Stay positive, encourage him to receive this gift, and be patient. If you are unsure of yourself, ask your home group leader to help.","B 神如何應允你的禱告":"B. How God answers your prayer","分享一些神回應你禱告的經歷。若可行，四種回應方式各
